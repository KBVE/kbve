syntax = "proto3";

package kbve.map.v1;

import "kbve/common/v1/math.proto";
import "kbve/map/v1/hex.proto";
import "kbve/map/v1/terrain.proto";

// One render layer of an orthogonal grid: row-major tile ids (Tiled-style
// gids; 0 = empty), width*height long.
message GridTileLayer {
  string name = 1;
  repeated uint32 data = 2;
}

// A named rectangular region inside a grid (plaza / camp / cavern …).
message NamedRegion {
  string name = 1;
  int32 x = 2;
  int32 y = 3;
  int32 w = 4;
  int32 h = 5;
}

// Orthogonal grid tilemap — cryptothrone-style towns/dungeons.
message GridTilemap {
  string id = 1;
  string ref = 2;
  string name = 3;
  optional string description = 4;
  int32 width = 5; // tiles
  int32 height = 6; // tiles
  int32 tile_size = 7; // px per tile (render hint)
  kbve.common.v1.Vec2I spawn = 8; // default player spawn
  repeated bool blocked = 9; // row-major collision, width*height
  repeated GridTileLayer layers = 10;
  repeated NamedRegion regions = 11;
  GenerationMode generation = 12;
  uint64 seed = 13;
  string tileset_image = 14; // render: tileset atlas path
  int32 tileset_columns = 15;
  bool drafted = 16;
}

// Semantic tile classification — separates WHAT a tile is (its role) from
// WHICH gid renders it. Procedural generators emit a row-major role grid
// (deterministic per seed); collision derives from the role; a per-biome
// TilePalette resolves role -> gid for presentation.
enum TileRole {
  TILE_ROLE_UNSPECIFIED = 0;
  TILE_ROLE_GROUND = 1; // generic walkable terrain
  TILE_ROLE_PLAZA = 2; // open civic space (walkable)
  TILE_ROLE_ROAD = 3; // street / path (walkable)
  TILE_ROLE_GRASS = 4; // vegetation ground (walkable)
  TILE_ROLE_WALL = 5; // building wall / solid (blocks)
  TILE_ROLE_ROOF = 6; // building roof (blocks)
  TILE_ROLE_DOOR = 7; // building entrance (walkable)
  TILE_ROLE_WATER = 8; // water (blocks)
  TILE_ROLE_PROP = 9; // decorative, walkable (rug, lamp base)
  TILE_ROLE_PROP_SOLID = 10; // decorative obstacle (tree, statue, barrel)
  TILE_ROLE_VOID = 11; // empty / out of bounds (blocks)
}

// One role's render options: gid variants picked deterministically by seed so
// repeated roles don't tile flatly. gids[0] is the canonical/single tile.
message TilePaletteEntry {
  TileRole role = 1;
  repeated uint32 gids = 2;
}

// Maps semantic TileRoles to render gids for one biome/style. Presentation
// only — never affects collision (that comes from the role grid). Swap the
// palette to restyle the same generated layout for a different location.
// Standalone artifact, like GridTilemap — not embedded in MapRegistry.
message TilePalette {
  string id = 1;
  string ref = 2;
  string name = 3;
  Biome biome = 4;
  string tileset_image = 5;
  int32 tileset_columns = 6;
  int32 tile_size = 7;
  repeated TilePaletteEntry entries = 8;
}

// A single catalogued tile — one sliced sprite with its semantic role,
// collision, animation, and biome tags. Source of truth is the tiledb astro
// collection (one MDX per tile); the palette packer sources tiles by ref.
// Animation framing + render hints are layered in the Astro schema (like
// WorldObjectDef), so this proto holds the cross-consumer core.
message TileAsset {
  string id = 1;
  string ref = 2;
  string name = 3;
  TileRole role = 4;
  string image = 5; // per-tile sprite path (relative to assets)
  int32 tile_size = 6; // px per frame (square)
  int32 frame_count = 7; // 1 = static; >1 = animated strip
  optional bool collides = 8; // per-tile override of the role default
  repeated Biome biomes = 9; // palettes this tile may appear in
  repeated string tags = 10;
}
