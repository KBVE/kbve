# The single source of truth for every wire type in the workspace. Consumers
# depend on this project, so touching a .proto invalidates their builds too.
layer: 'library'
language: 'unknown'
stack: 'systems'
tags: ['proto']

owners:
  defaultOwner: '@h0lybyte'
  # Schema changes fan out to every consumer and are breaking by default.
  paths:
    # The shared layers are imported by every domain: a change here is a
    # change to all of them.
    'kbve/type/': ['@h0lybyte']
    'kbve/common/': ['@h0lybyte']
    'buf.yaml': ['@h0lybyte']
    'buf.gen.yaml': ['@h0lybyte']

tasks:
  # Named build so '^:build' from a consumer pulls generation in.
  #
  # --clean, because generation only ever writes. Deleting a .proto leaves its
  # generated code behind, and stale output does not announce itself: it
  # compiles, it imports, and it offers a type the schema no longer defines
  # until something downstream fails on a name nobody can find in the module.
  build:
    command: 'buf generate --clean'
    toolchains: ['node']
    inputs:
      - 'kbve/**/*.proto'
      - 'buf.gen.yaml'
      - 'buf.yaml'
    outputs:
      - 'gen/**/*'

  # Runs in the moon graph rather than in a workflow: it needs no secrets and
  # no toolchain buf does not already bring, so a path filter in YAML would
  # only be restating the inputs below.
  verify-gen:
    command: 'bash tools/verify-gen.sh'
    toolchains: ['node']
    deps: ['~:build']
    inputs:
      - 'kbve/**/*.proto'
      - 'buf.gen.yaml'
      - 'tools/verify-gen.sh'

  lint:
    command: 'buf lint'
    toolchains: ['node']
    inputs: ['kbve/**/*.proto', 'buf.yaml']

  format:
    command: 'buf format --diff --exit-code'
    toolchains: ['node']
    inputs: ['kbve/**/*.proto']

  # Every published schema is a promise. This rejects a change that would
  # break a consumer already pinned to the module: a deleted field, a retyped
  # field, a renumbered one.
  #
  # Migrating a new domain in does not trip it. The comparison is against this
  # module's own history, so bringing osrs or the infra protos across adds
  # files and adds messages -- the reshaping happens on the way in, against a
  # source this module has never contained. What it does catch is reshaping a
  # domain already landed here, which is exactly the change that should cost a
  # deliberate decision.
  #
  # The ref resolves from the repository root with the module as a subdir; the
  # bare '.git' form works only when the module is its own repository, which it
  # stopped being when it moved into the monorepo. It needs the full clone that
  # protobuf-ci.yml already checks out with fetch-depth: 0.
  breaking:
    command: 'buf breaking --against ../../.git#branch=origin/dev,subdir=packages/proto'
    toolchains: ['node']
    inputs: ['kbve/**/*.proto', 'buf.yaml']
