$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'
tags: ['docker']

tasks:
    container-publish:
        script: 'docker buildx build --push --platform linux/amd64 --cache-from=type=registry,ref=ghcr.io/kbve/steamcmd-ubuntu:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/steamcmd-ubuntu:buildcache,mode=max -f packages/docker/steamcmd-ubuntu/Dockerfile -t ghcr.io/kbve/steamcmd-ubuntu:24.04 -t ghcr.io/kbve/steamcmd-ubuntu:latest packages/docker/steamcmd-ubuntu'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
    test:
        script: "echo '=== steamcmd-ubuntu image tests ===' && docker run --rm --platform linux/amd64 ghcr.io/kbve/steamcmd-ubuntu:24.04 steamcmd +quit | grep -q 'Steam Console Client' && echo 'PASS: steamcmd boots' && docker run --rm --platform linux/amd64 ghcr.io/kbve/steamcmd-ubuntu:24.04 bash -lc 'locale | grep -q en_US.UTF-8' && echo 'PASS: en_US.UTF-8 locale active' && docker run --rm --platform linux/amd64 ghcr.io/kbve/steamcmd-ubuntu:24.04 bash -lc 'which steamcmd' | grep -q /usr/local/bin/steamcmd && echo 'PASS: steamcmd on PATH' && echo '=== steamcmd-ubuntu image OK ===' && docker rmi -f ghcr.io/kbve/steamcmd-ubuntu:24.04 || true"
        deps: ['~:container']
        options:
            runFromWorkspaceRoot: true
