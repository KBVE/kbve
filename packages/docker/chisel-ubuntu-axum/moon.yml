$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'
tags: ['docker']

tasks:
    container:
        script: "VERSION=$(grep -m1 'version' packages/docker/chisel-ubuntu-axum/version.toml | sed 's/.*\"\\(.*\\)\"/\\1/') && docker tag ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder ghcr.io/kbve/chisel-ubuntu-axum:${VERSION}-builder && echo \"Tagged builder as ${VERSION}-builder\""
        deps: ['~:containerx-runtime', '~:containerx-builder']
        options:
            runFromWorkspaceRoot: true
    containerx-runtime:
        script: 'docker buildx build --load --target runtime --platform linux/amd64 -f packages/docker/chisel-ubuntu-axum/Dockerfile -t ghcr.io/kbve/chisel-ubuntu-axum:24.04 packages/docker/chisel-ubuntu-axum'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-builder:
        script: 'docker buildx build --load --target builder --platform linux/amd64 -f packages/docker/chisel-ubuntu-axum/Dockerfile -t ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder packages/docker/chisel-ubuntu-axum'
        options:
            runFromWorkspaceRoot: true
            cache: false
    test:
        script: 'echo ''=== Runtime image — config tests ==='' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04 --format ''{{.Config.User}}'' | grep -q ''^10001:10001$'' && echo ''PASS: non-root user 10001:10001'' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04 --format ''{{.Config.WorkingDir}}'' | grep -q ''^/app$'' && echo ''PASS: workdir /app'' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04 --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -q ''^LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2$'' && echo ''PASS: jemalloc LD_PRELOAD set'' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04 --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -q ''^MALLOC_CONF='' && echo ''PASS: jemalloc MALLOC_CONF set'' && echo ''=== Runtime image — content tests ==='' && docker create --name chisel-runtime-test ghcr.io/kbve/chisel-ubuntu-axum:24.04 true > /dev/null 2>&1 && docker export chisel-runtime-test > /tmp/chisel-runtime.tar && docker rm chisel-runtime-test > /dev/null 2>&1 && tar -tf /tmp/chisel-runtime.tar | grep -q ''usr/lib/x86_64-linux-gnu/libjemalloc.so.2'' && echo ''PASS: libjemalloc.so.2 present'' && tar -tf /tmp/chisel-runtime.tar | grep -q ''usr/lib/x86_64-linux-gnu/libpq.so.5'' && echo ''PASS: libpq.so.5 present'' && tar -tf /tmp/chisel-runtime.tar | grep -q ''etc/ssl/certs/ca-certificates.crt'' && echo ''PASS: CA bundle present'' && tar -tf /tmp/chisel-runtime.tar | grep -q ''lib/x86_64-linux-gnu/libc.so'' && echo ''PASS: libc present'' && ! tar -tf /tmp/chisel-runtime.tar | grep -qE ''^bin/(sh|bash|dash)$'' && echo ''PASS: no shell in runtime (chiseled)'' && ! tar -tf /tmp/chisel-runtime.tar | grep -qE ''^usr/bin/(apt|dpkg)$'' && echo ''PASS: no package manager in runtime'' && ! tar -tf /tmp/chisel-runtime.tar | grep -q ''^etc/shadow$'' && echo ''PASS: no /etc/shadow leaked'' && echo ''=== Runtime image — size guard ==='' && RUNTIME_BYTES=$(docker image inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04 --format ''{{.Size}}'') && echo "Runtime size: $((RUNTIME_BYTES / 1024 / 1024)) MiB" && [ $RUNTIME_BYTES -lt 41943040 ] && echo ''PASS: runtime under 40 MiB'' && rm -f /tmp/chisel-runtime.tar && echo ''=== Builder image — toolchain tests ==='' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''rustc --version | grep -q "rustc 1.96"'' && echo ''PASS: rustc 1.96 pinned'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''cargo --version'' && echo ''PASS: cargo present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''cargo chef --version'' && echo ''PASS: cargo-chef present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''sccache --version'' && echo ''PASS: sccache present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''mold --version'' && echo ''PASS: mold linker present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''rustup target list --installed | grep -q x86_64-unknown-linux-gnu'' && echo ''PASS: x86_64-unknown-linux-gnu target installed'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''protoc --version | grep -q libprotoc'' && echo ''PASS: protoc present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''brotli --version'' && echo ''PASS: brotli present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''gzip --version | head -1'' && echo ''PASS: gzip present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''pkg-config --libs libpq | grep -q lpq'' && echo ''PASS: libpq-dev linkable via pkg-config'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''pkg-config --libs openssl | grep -q lssl'' && echo ''PASS: libssl-dev linkable via pkg-config'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''node --version | grep -q ^v24'' && echo ''PASS: node v24 active'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''pnpm --version'' && echo ''PASS: pnpm present'' && docker run --rm --platform linux/amd64 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder bash -c ''echo | openssl s_client -servername github.com -connect github.com:443 -verify_return_error -brief 2>&1 | grep -q "Verification: OK"'' && echo ''PASS: builder CA bundle validates real TLS'' && echo ''=== Builder image — env hygiene ==='' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -q ''^RUSTC_WRAPPER=/usr/local/cargo/bin/sccache$'' && echo ''PASS: RUSTC_WRAPPER=sccache'' && docker inspect ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -q ''^PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1$'' && echo ''PASS: Playwright browser download disabled'' && echo ''=== All chisel base image tests passed ==='' && echo ''Runtime: user, workdir, jemalloc, libpq, CA bundle, no-shell, size<40MiB'' && echo ''Builder: rustc 1.96, cargo-chef, sccache, mold, protoc, brotli, gzip, libpq-dev, libssl-dev, node 24, pnpm, real-TLS, env hygiene'' && docker rmi -f ghcr.io/kbve/chisel-ubuntu-axum:24.04 ghcr.io/kbve/chisel-ubuntu-axum:24.04-builder || true'
        deps: ['~:container']
        options:
            runFromWorkspaceRoot: true
