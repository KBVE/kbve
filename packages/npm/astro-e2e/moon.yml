$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'automation'
language: 'typescript'

# Both: it is an Astro site whose only purpose is to be driven by a Playwright
# suite against the @kbve/astro package.
tags: ['astro', 'playwright']

# @kbve/astro is not in moon's graph yet; the edge is added when the npm
# packages are ported.
tasks:
    # Unlike the sites under apps/, this one lives in packages/ and its
    # astro.config points outDir at dist/packages/ to match. The inherited
    # /dist/apps/$project would name a directory Astro never writes, and the
    # task would cache an empty tree.
    build:
        # mergeOutputs, because an inherited task's outputs are appended to, not
        # replaced by, the ones declared here -- the same rule that makes two
        # files defining one task merge their args. Without it this task also
        # demands dist/apps/astro-e2e from the astro preset, which nothing
        # writes, and the run fails on a missing output after a clean build.
        options:
            mergeOutputs: 'replace'
        outputs: ['/dist/packages/npm/astro-e2e']

    dev:
        args: ['--port', '4302']

    preview:
        args: ['--port', '4303']

    e2e:
        deps: ['~:build']
        env:
            E2E_PREVIEW: 'true'

    e2e-static:
        command: 'playwright test --config=$projectSource/playwright.config.ts'
        toolchains: ['node']
        deps: ['~:build']
        env:
            E2E_STATIC: 'true'
        options:
            runFromWorkspaceRoot: true
            cache: false

    # The same suite against the built site rather than the dev server. It is
    # the one that catches a broken build rather than a broken page.
    e2e-preview:
        script: 'E2E_PREVIEW=true pnpm exec playwright test --config=$projectSource/playwright.config.ts'
        deps: ['~:build']
        env:
            E2E_PREVIEW: 'true'
        options:
            runFromWorkspaceRoot: true
            cache: false
