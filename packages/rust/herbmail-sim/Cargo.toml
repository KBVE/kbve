[package]
name = "herbmail-sim"
authors = ["kbve", "h0lybyte"]
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Herbmail world collision and character movement — one rapier3d implementation shared by the client worker and the authoritative server."

[lib]
name = "herbmail_sim"
path = "src/lib.rs"

[dependencies]
rapier3d = "0.30.1"

[features]
default = []
# Cross-platform determinism at the cost of SIMD. Only meaningful once the
# client stops using the prebuilt @dimforge npm wasm (which is built without
# it) and consumes a wasm build of this crate instead — enabling it on one
# side only would make the two diverge rather than agree.
enhanced-determinism = ["rapier3d/enhanced-determinism"]
