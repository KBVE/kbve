[package]
name = "erust"
authors = ["kbve", "h0lybyte"]
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "ERust is an additional package for egui and eframe that provides extendable components."
homepage = "https://kbve.com/"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/erust"
readme = "README.md"
rust-version.workspace = true


[features]
default = ["egui"]
egui = ["dep:egui", "dep:eframe", "dep:image"]
tauri = []

[dependencies]
base64 = { workspace = true }
egui = { version = "0.35.0", optional = true }
eframe = { version = "0.34.1", default-features = false, optional = true, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # Wayland support on Linux.
    "x11",           # X11 support on Linux.
] }
log = { workspace = true }
ehttp = "0.6.0"
image = { version = "0.25.9", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
holy = { path = "../holy" }

chrono = { workspace = true, features = ["default", "serde"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
