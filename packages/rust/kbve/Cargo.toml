[package]
name = "kbve"
authors = ["kbve", "h0lybyte"]
version = "0.1.26"
edition = "2021"
license = "MIT"
description = "KBVE is an Axum and Diesel Boilerplate that helps produce backend APIs for micro services."
homepage = "https://kbve.com/"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/kbve"
readme = "README.md"
rust-version.workspace = true

[features]
default = []
supabase = ["dep:lru", "dep:uuid"]
kv = ["supabase", "jedi/valkey"]
image-gen = ["dep:resvg"]
wallet = ["dep:uuid"]
legacy-sync-db = ["diesel/postgres", "diesel/r2d2", "dep:r2d2"]
gate-auth = ["dep:lru"]
gate = ["gate-auth", "axum/ws", "reqwest/stream", "dep:tokio-tungstenite", "dep:metrics", "jedi/prometheus"]

[dependencies]
anyhow = { workspace = true }
ammonia = { workspace = true }
argon2 = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
url = { workspace = true }
askama = "0.15.6"
async-trait = { workspace = true }
chrono = { workspace = true, features = ["default", "serde"] }
diesel = { version = "2.3.7", default-features = false, features = [
    "chrono",
    "serde_json",
    "uuid",
] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
bb8 = { workspace = true }
futures-util = { workspace = true, features = ["default"] }
dotenvy = { workspace = true }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { workspace = true, features = ["cookie"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = { workspace = true, features = ["serde"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["std"] }
tokio = { workspace = true, features = ["default", "full"] }
thiserror = "2"
time = "0.3.47"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tower = { workspace = true, features = ["timeout", "util"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
r2d2 = { version = "0.8.9", optional = true }
regex = { workspace = true }
ulid = { workspace = true }
num-bigint = "0.4"
lru = { version = "0.16", optional = true }
resvg = { version = "0.47.0", optional = true }
uuid = { workspace = true, optional = true, features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
metrics = { workspace = true, optional = true }
jedi = { path = "../jedi" }
holy = { version = "0.2.1", path = "../holy" }

[dev-dependencies]
serial_test = { workspace = true }

[package.metadata.askama]
dirs = ["templates"]
