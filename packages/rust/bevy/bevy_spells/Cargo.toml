[package]
name = "bevy_spells"
authors = ["kbve", "h0lybyte"]
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Proto-driven spell definitions for Bevy games — compiles spelldb.proto into typed Rust structs with a searchable registry."
homepage = "https://kbve.com/"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/bevy/bevy_spells"
keywords = ["bevy", "spells", "gamedev", "protobuf", "plugin"]
categories = ["game-development", "game-engines"]
readme = "README.md"

[dependencies]
bevy = { workspace = true, features = ["bevy_state"] }
prost = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
