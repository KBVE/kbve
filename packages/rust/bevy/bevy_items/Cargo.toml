[package]
name = "bevy_items"
authors = ["kbve", "h0lybyte"]
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Proto-driven item definitions for Bevy games — compiles itemdb.proto into typed Rust structs with a searchable registry."
homepage = "https://kbve.com/"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/bevy/bevy_items"
keywords = ["bevy", "items", "gamedev", "protobuf", "plugin"]
categories = ["game-development", "game-engines"]
readme = "README.md"

[features]
default = []
inventory = ["dep:bevy_inventory"]

[dependencies]
bevy = { workspace = true, features = ["bevy_state"] }
prost = { workspace = true, features = ["derive"] }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bevy_inventory = { version = "0.1", path = "../bevy_inventory", optional = true, default-features = false }

[build-dependencies]
prost-build = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
