[package]
name = "q"
authors = ["kbve", "h0lybyte"]
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Q is a Rust crate powering KBVE games. Default build is a Godot GDExtension (cdylib) with a tokio-backed game manager. Feature flags expose a parallel server flavor (bevy + axum + rapier2d)."
homepage = "https://kbve.com/application/rust/"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/q"
readme = "README.md"
rust-version.workspace = true
exclude = [
    "release/*",
    "docs/*",
]

[lib]
# cdylib for the Godot GDExtension flavor; rlib so server crates can pull q in as a library.
crate-type = ["cdylib", "rlib"]

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
# Keep existing q consumers (Rareicon etc.) compiling unchanged.
default = ["client"]

# Side selection — `client` and `server` are mutually exclusive (enforced by compile_error! in lib.rs).
client = ["dep:godot", "dep:dashmap", "dep:crossbeam-channel", "dep:bitflags", "dep:tokio", "dep:objc2", "dep:windows"]
server = ["dep:tokio"]

# In-game webview (GodotBrowser / BrowserManager). Opt-in: wry needs
# libwebkit2gtk-4.1 on linux and the WebView2 runtime on windows.
webview = ["client", "dep:wry", "dep:raw-window-handle", "dep:http", "dep:infer"]

# Protocol (postcard wire format + bincode for snapshot framing).
proto-shared = ["dep:postcard", "dep:bincode"]
proto-client = ["client", "proto-shared"]
proto-server = ["server", "proto-shared"]

# Physics — rapier2d for spatial queries (client) and authoritative sim step (server).
rapier2d-client = ["client", "dep:rapier2d"]
rapier2d-server = ["server", "dep:rapier2d"]

# Physics 3d — the off-thread fixed-tick sim behind friendslop.
# `sim3d` is the engine-agnostic core: pure rapier3d, no Godot, no Bevy, so the
# identical step code compiles headless for the authoritative server. The
# `-client` flavor adds the Godot bridge node on top of it.
# tokio is a direct requirement, not inherited from a side: the sim thread uses
# `tokio::sync` for its command queue and snapshot channel, so `rapier3d-sim`
# must build standalone without `client` or `server`.
rapier3d-sim = ["dep:rapier3d", "dep:tokio"]
rapier3d-client = ["client", "rapier3d-sim"]
rapier3d-server = ["server", "rapier3d-sim"]

# Networking — WS client for the Godot extension, axum for the server.
# Both sides require proto-* for wire framing.
#
# `net-transport` is the vendor-agnostic seam only: no tokio-tungstenite, no
# axum, no Steam. It carries the in-process Loopback impl so session logic is
# testable in CI, where a real Steam client can never run.
net-transport = ["proto-shared"]
# Listen-server host/client roles driving the sim over a Transport. Needs the
# sim itself, so it is separate from the bare transport seam.
net-session = ["net-transport", "rapier3d-sim"]
# WebSocket `Transport` impl — host (axum) and client (tungstenite) in one
# sideless module, so the dedicated Agones server and the Godot client share it.
net-ws = ["net-transport", "dep:tokio", "dep:axum", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls"]
# Everything the dedicated server needs: authoritative sim + session + wire.
# Unreliable datagram lane, paired with net-ws as the reliable side.
net-udp = ["net-ws", "dep:getrandom"]
net-dedicated = ["net-session", "net-ws", "net-udp"]
# Godot node that renders a remote session — the client half of the dedicated flow.
net-godot = ["rapier3d-client", "net-session", "net-udp"]
net-client = ["client", "proto-client", "net-transport", "dep:tokio-tungstenite", "dep:futures-util"]
net-server = ["server", "proto-server", "net-transport", "dep:axum", "dep:tokio-tungstenite", "dep:futures-util"]

# Bevy ECS app for server flavors. Server-only — clients use their host engine.
bevy-server = ["server", "dep:bevy"]

# Supabase JWT verification — used by the server flavor to admit players.
supabase-auth = ["server", "dep:jsonwebtoken"]

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Client / shared infra (gated by features)
godot = { version = "0.5.5", optional = true, features = ["experimental-wasm", "experimental-threads"] }
dashmap = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true, features = ["serde"] }
tokio = { workspace = true, optional = true, features = ["default", "rt-multi-thread", "macros", "sync", "time", "net"] }

# Protocol
postcard = { workspace = true, optional = true, features = ["use-std"] }
bincode = { workspace = true, optional = true, features = ["serde"] }

libm = { workspace = true }

# Physics
rapier2d = { version = "0.22", optional = true }
rapier3d = { version = "0.35", optional = true }

# Bevy ECS — headless server. No render, no winit; we drive App::update from a tokio task.
bevy = { workspace = true, optional = true, features = ["bevy_state"] }

# Networking
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots", "connect"] }
# `rustls-tls-webpki-roots` brings rustls in without choosing a crypto backend,
# and rustls 0.23 panics at first use when it cannot pick one itself. Naming
# `ring` here is what makes that choice; `WsClient::connect` installs it.
rustls = { workspace = true, optional = true, features = ["ring"] }
axum = { workspace = true, optional = true, features = ["ws", "json", "http1", "tokio"] }
futures-util = { workspace = true, optional = true, features = ["sink", "std"] }

# Supabase JWT verification (HS256 against SUPABASE_JWT_SECRET).
jsonwebtoken = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }
fastnoise-lite = "1.1.1"

# -----------------------------------------------------------------------------
# Desktop platform deps — used only by the `client` flavor's `platform` module,
# so they are optional. objc2 / `windows` come in with `client`; the wry stack
# waits for `webview`.
# -----------------------------------------------------------------------------
[target."cfg(all(target_os = \"macos\", not(target_family = \"wasm\")))".dependencies]
objc2 = { workspace = true, optional = true }
wry = { version = "0.55.1", optional = true, features = ["transparent", "devtools"] }
raw-window-handle = { workspace = true, optional = true }
http = { workspace = true, optional = true }
infer = { version = "0.19.0", optional = true }

[target."cfg(all(target_os = \"windows\", not(target_family = \"wasm\")))".dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.55.1", optional = true, features = ["transparent", "devtools"] }
raw-window-handle = { workspace = true, optional = true }
http = { workspace = true, optional = true }
infer = { version = "0.19.0", optional = true }

[target."cfg(all(target_os = \"linux\", not(target_family = \"wasm\")))".dependencies]
wry = { version = "0.55.1", optional = true, features = ["transparent", "devtools"] }
raw-window-handle = { workspace = true, optional = true }
http = { workspace = true, optional = true }
infer = { version = "0.19.0", optional = true }
