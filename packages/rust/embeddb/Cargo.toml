[package]
name = "embeddb"
version = "0.1.0"
edition = "2021"
description = "Single-file embedded DB: Turso write path + DuckDB analytics read path"
license = "MIT"
homepage = "https://kbve.com/application/rust/#embeddb"
repository = "https://github.com/KBVE/kbve/tree/main/packages/rust/embeddb"

[dependencies]
turso = "0.7"
duckdb = { version = "1", features = ["bundled"] }
tokio = { workspace = true, features = ["default", "rt", "rt-multi-thread", "macros"] }
thiserror = { workspace = true }
embeddb-derive = { version = "0.1.0", path = "../embeddb-derive", optional = true }

[features]
default = ["derive"]
derive = ["dep:embeddb-derive"]
vector = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["default", "rt", "rt-multi-thread", "macros"] }
criterion = { workspace = true, features = ["default"] }

[[bench]]
name = "embeddb_bench"
harness = false

[[test]]
name = "e2e_core"
required-features = ["derive"]

[[test]]
name = "e2e_vector"
required-features = ["vector"]
