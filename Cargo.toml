
[workspace]
resolver = '2'
members = [
	'crates/*',
	'apps/kbve/kilobase',
'apps/herbmail/api',
	'apps/memes/axum-memes',
	'apps/irc/api',
	'apps/agones/shim',
	'apps/discordsh/api',
	'apps/discordsh/bot',
	'apps/kbve/axum-kbve',
	'apps/kbve/kbve-gate',
	'apps/chuckrpg/api',
	'apps/rentearth/axum-rentearth',
	'apps/rareicon/api',
	'apps/cryptothrone/api',
	'apps/rows',
	'apps/jobboard',
	'services/mail',
	'services/metrics',
	'apps/arcade/isometric/src-tauri',
	'apps/vm/firecracker-ctl',
	'apps/vm/factorio-ctl',
	'apps/vm/kubectl',
	'apps/mc/behavior_statetree',
	'apps/mc/mc_auth',
	'apps/agones/factorio/relay',
	'apps/agones/palworld/relay',
	'apps/cryptothrone/gameserver',
	'apps/agones/arpg/server',
	'apps/agones/herbmail/server',
	'apps/agones/friendslop/server',
	'apps/agones/kbve-mmorpg/server',
	'apps/media/reel',
	'apps/arcade/colony',
	'apps/arcade/kbve-mmorpg',
]

exclude = [
	'crates/uniti/fuzz',
	'apps/kbve/desktop-kbve/src-tauri',
]

[workspace.package]
# edition, license and repository are inherited by the crates that came
# from KBVE/workspace -- they declare `edition.workspace = true` and cargo
# refuses to load a member whose inherited key the root does not define.
edition = "2024"
# Raised from 1.96 with those crates: they were developed against 1.98.
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/KBVE/kbve"

[workspace.dependencies]
# embeddb's analytics feature; both arrive with the crates from KBVE/workspace.
duckdb = { version = "1", features = ["bundled"] }
turso = "0.7.2"
agones = "1.57"
ammonia = "4.1.2"
anyhow = "1.0"
argon2 = "0.5.0"
askama = "0.16.0"
async-nats = { version = "0.50", default-features = false }
async-trait = "0.1.88"
avian3d = { version = "0.7", default-features = false }
# Bridges egui into bevy's render world. 0.42 is the line that tracks bevy 0.19,
# and it wants egui ^0.36 -- the same egui `erust` pins, so widgets written
# against `egui::Ui` there compile here without a version fight.
bevy_egui = { version = "0.42", default-features = false }
axum = { version = "0.8.9", default-features = false }
axum-extra = "0.12.6"
base64 = "0.22.1"
bb8 = "0.9"
bevy = { version = "0.19", default-features = false }
# Depended on directly only to turn on its `bevy_animation` feature: the
# `bevy/bevy_animation` feature adds the plugin but does NOT forward to
# bevy_gltf, so the loader compiles without animation and a glb yields zero
# Animation labels. Feature unification does the rest.
bevy_gltf = { version = "0.19", default-features = false, features = ["bevy_animation"] }
bincode = "2.0"
bitflags = "2.9.0"
bytes = "1"
cbindgen = "0.29.4"
chrono = { version = "0.4.44", default-features = false }
criterion = { version = "0.5", default-features = false }
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
http = "1.4.0"
http-body-util = "0.1"
jni = "0.21"
js-sys = { version = "0.3", default-features = false }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
k8s-openapi = "0.28"
kube = { version = "4", default-features = false }
# Pinned to bevy 0.19's glam so a kinetree linked alongside bevy resolves one
# copy and `bevy::math::Vec3` and `glam::Vec3` are the same type.
glam = { version = "0.32", default-features = false }
libm = "0.2"
lightyear = { version = "0.29", default-features = false }
log = "0.4"
lru = "0.18"
mail-builder = { version = "0.5.0", default-features = false }
mail-parser = { version = "0.11.9", default-features = false, features = ["full_encoding"] }
mail-send = { version = "0.6.2", default-features = false, features = ["mail-builder"] }
metrics = "0.24"
num_cpus = "1.17.0"
objc2 = "0.6.3"
pollster = "0.4"
postcard = { version = "1.0", default-features = false }
proc-macro2 = "1"
prost = "0.14.1"
prost-build = "0.14"
prost-types = "0.14"
quote = "1.0.44"
rand = "0.10"
raw-window-handle = "0.6.2"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2"
serde = "1.0"
ron = "0.12"
serde_json = "1.0"
serial_test = "3"
sha2 = "0.11"
socket2 = "0.6.1"
syn = "3"
sysinfo = "0.38.2"
tempfile = "3"
thiserror = "2.0.12"
tikv-jemallocator = "0.7"
tokio = { version = "1.49", default-features = false }
tokio-postgres = "0.7.2"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
ulid = { version = "1.2.1", default-features = false }
url = "2.5"
utoipa = "5"
uuid = "1"
wasm-bindgen = { version = "=0.2.126", default-features = false }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
webpki-roots = "1.0"
wgpu = "29"
zip = { version = "6", default-features = false }

[profile.dev]
opt-level = 1

# Iteration profile for the game clients: `cargo run -p kbve-mmorpg --profile fast`.
#
# A separate profile rather than a change to `dev`, because `dev` is shared with
# 35 other crates and CI, and building all of their dependencies at opt-level 3
# would be paid for on every cold cache in exchange for nothing.
#
# The split is the point: dependencies are optimised once and then cached
# forever, so the frame rate is playable, while the crate actually being edited
# stays cheap to rebuild. Release is what the LTO and codegen-units=1 settings
# below are for, and neither belongs in a loop measured in seconds.
[profile.fast]
inherits = 'dev'
opt-level = 1

[profile.fast.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = 'abort'

# egui, with one upstream regression reverted.
#
# emilk/egui#8354 began storing a `web_sys::File` inside `DroppedFile` and, that
# handle not being thread-safe, dropped the `Send + Sync` bound from
# `DroppedFileHandle` on `wasm32 + atomics`. `egui::Context` holds one
# transitively, so it stopped being `Send`, and a non-`Send` `Context` cannot be
# a bevy `Component` -- bevy_egui then fails to compile for any wasm build with
# shared memory, which is every SharedArrayBuffer build. That is 326 errors
# between kbve-mmorpg and a browser bundle that can share memory with a worker.
#
# The fork is branched from the 0.36.2 tag and carries one commit restoring the
# bound. bevy_egui's `BevyDroppedFile` holds a `PathBuf` and its wasm
# `bytes_async` returns an error, so it never stored a `web_sys::File` and never
# needed the relaxation -- and an integration that does store one fails to
# compile against the fork rather than being handed an unsound `Send`.
#
# Upstream: emilk/egui#8401 (open since 2026-08-08, no fix in flight) and
# vladbat00/bevy_egui#498. Delete this patch and the fork when #8401 lands.
[patch.crates-io]
egui = { git = "https://github.com/KBVE/egui", branch = "kbve-base" }
