[package]
name = "bevy_supa"
authors = ["kbve", "h0lybyte"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agnostic Supabase client with optional Bevy integration — PostgREST over reqwest, GoTrue auth over ehttp on native and wasm"
homepage = "https://kbve.com/"
repository.workspace = true
keywords = ["bevy", "supabase", "postgrest", "gamedev"]
categories = ["game-development", "web-programming::http-client"]
readme = "README.md"

[features]
# Most consumers want the native PostgREST client and nothing else.
default = ["native"]

# Enable the native (non-WASM) PostgREST transport backed by reqwest+rustls.
# This is what the JNI mc_auth plugin uses. It is service-role shaped: async,
# one call per await, no session state.
native = ["dep:reqwest"]

# GoTrue auth + edge functions over `ehttp`, which resolves to ureq natively
# and to browser `fetch` on wasm32. This is the transport browser games need:
# it is callback-driven, so it needs no async runtime and works on wasm's
# single thread. Independent of `native` -- a game can enable both.
auth = ["dep:ehttp"]

# Kept as the name browser consumers already reach for. Formerly a
# `compile_error!` stub; it now just selects the transport that compiles for
# wasm32.
wasm = ["auth"]

# Optional Bevy ECS integration — exposes `BevySupaPlugin` and inserts
# `SupaClient` as a Bevy `Resource`. Without this feature `bevy_supa`
# is a plain Rust crate with zero Bevy dependency, which keeps lean
# consumers like JNI cdylibs small. Turn this on for Bevy games.
bevy = ["dep:bevy"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Native PostgREST stack — only pulled in under the `native` feature.
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }
# Auth transport — only pulled in under the `auth` feature.
ehttp = { version = "0.6.0", optional = true }
# Bevy — only pulled in under the `bevy` feature. Game consumers that
# want the plugin opt in; JNI consumers stay skinny.
bevy = { workspace = true, optional = true, features = ["bevy_state"] }

# The browser has no `SystemTime`, so session expiry reads `Date.now`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

# `native` does not build for wasm32; `auth` builds everywhere. Document the
# full surface.
[package.metadata.docs.rs]
features = ["native", "auth", "bevy"]
rustdoc-args = ["--cfg", "docsrs"]
