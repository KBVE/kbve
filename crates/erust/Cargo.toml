[package]
name = "erust"
description = "Extendable egui and eframe components."
version = "0.2.0"
authors = ["kbve", "h0lybyte"]
homepage = "https://kbve.com/"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["dep:egui", "dep:eframe", "dep:ehttp", "dep:image"]
tauri = []

[dependencies]
base64 = { workspace = true }
# The Supabase client this crate used to own. `auth` is the ehttp transport,
# which is the same code that shipped here; `native` stays off so the reqwest
# PostgREST half is not dragged into a GUI or Tauri binary.
bevy_supa = { version = "0.2.0", path = "../bevy_supa", default-features = false, features = [
    "auth",
] }
chrono = { workspace = true, features = ["default", "serde"] }
holy = { version = "0.2.2", path = "../holy" }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# The GUI stack, behind the `egui` feature. Pinned here rather than in the
# workspace table: nothing else in this repository draws an egui frame, and the
# renderer crates move as a set with eframe.
egui = { version = "0.36.2", optional = true }
eframe = { version = "0.36.2", default-features = false, optional = true, features = [
    "accesskit",     # Screen reader support. Pulls in a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Rendering backend. The alternative is "wgpu".
    "persistence",   # Restore app state on restart.
    "wayland",       # Linux.
    "x11",           # Linux.
] }
# Only the image widgets fetch directly now; the Supabase calls go through
# bevy_supa, which carries its own copy.
ehttp = { version = "0.6.0", optional = true }
image = { version = "0.25.9", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
