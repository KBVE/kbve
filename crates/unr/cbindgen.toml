language = "C"
header = "/* Generated by cbindgen from crates/unr. Do not edit by hand. */"
include_guard = "UNR_H"
autogen_warning = "/* This file is generated. Regenerate with `moon run unr:bindgen`. */"
documentation = true
documentation_style = "doxy"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = ""

[parse]
parse_deps = false
