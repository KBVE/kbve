[package]
name = "bevy_db"
authors = ["kbve", "h0lybyte"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform async key-value persistence for Bevy — redb on desktop, IndexedDB on WASM"
homepage = "https://kbve.com/"
repository.workspace = true
keywords = ["bevy", "persistence", "wasm", "database", "gamedev"]
categories = ["game-development", "database"]
readme = "README.md"

[features]
default = ["bevy-plugin"]

# Bevy ECS plugin layer — `Db` resource, `DbRequest<T>` poller, `WriteBatch`
# builder. Without this feature the crate exposes only the platform-native
# async store directly (suitable for tokio-based services like
# discordsh-bot that don't run a Bevy `App`).
bevy-plugin = ["dep:bevy", "dep:bevy_tasker", "dep:crossbeam-channel"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true, features = ["serde"] }

# Bevy plumbing — only when the `bevy-plugin` feature is on.
bevy = { workspace = true, optional = true, features = ["bevy_state"] }
bevy_tasker = { version = "0.1", path = "../bevy_tasker", optional = true }
crossbeam-channel = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = "4"
dirs = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rexie = "0.6"
wasm-bindgen = { workspace = true, features = ["default"] }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true, features = ["default"] }
once_cell = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["default", "macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
