[package]
name = "bevy_npc"
authors = ["kbve", "h0lybyte"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Proto-driven NPC definitions for Bevy games — compiles npcdb.proto into typed Rust structs with a searchable registry."
homepage = "https://kbve.com/"
repository.workspace = true
keywords = ["bevy", "npc", "gamedev", "protobuf", "plugin"]
categories = ["game-development", "game-engines"]
readme = "README.md"

[features]
default = ["bevy"]

# Bevy ECS integration — adds the `Resource` derive and `BevyNpcPlugin`.
# Without this feature the crate is plain Rust with zero Bevy dependency: the
# proto types and `NpcDb` lookups still work, which is what lets FFI cdylibs
# (Godot GDExtension) and non-Bevy consumers read the same npcdb registry.
bevy = ["dep:bevy"]

## Game-agnostic ECS components for creature pooling, capture, and interaction.
## Enables `bevy_npc::creature` module with `CreaturePoolIndex`, `CreatureState`,
## `CapturedCreatures`, `CreatureCaptureEvent`, and `CreaturePlugin`.
creature = ["bevy"]

[dependencies]
kbve-proto = { path = "../kbve-proto" }
bevy = { workspace = true, features = ["bevy_state"], optional = true }
prost = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
ulid = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
