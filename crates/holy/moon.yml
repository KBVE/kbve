# Struct-level text cleaning, migrated from the legacy Nx workspace at
# KBVE/kbve packages/rust/holy and since split into a facade over holy-derive.
#
# This is the crate to depend on. holy-derive carries the macros alone, because
# a proc-macro crate cannot export anything else.
layer: 'library'
stack: 'systems'
toolchains:
    default: 'rust'

dependsOn:
    - 'holy-derive'

owners:
    defaultOwner: '@h0lybyte'

# `crates` is the release lane: this crate publishes to crates.io. It is
# separate from the rust toolchain, which says what the project is built with
# rather than what publishing it means -- 26 applications here are also rust
# and must never be pushed to a registry.

tags: ['crates']
