[package]
name = "mmorpg_net"
authors = ["kbve", "h0lybyte"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared lightyear protocol for the KBVE mmorpg — replicated components, inputs, channels."
homepage = "https://kbve.com/"
repository.workspace = true
keywords = ["bevy", "lightyear", "multiplayer", "networking", "gamedev"]
categories = ["game-development", "network-programming"]
readme = "README.md"

[dependencies]
# No renderer. This crate is linked by a headless server and by a wasm client,
# and every feature here is paid for twice.
bevy = { workspace = true, default-features = false, features = ["std", "bevy_state"] }
lightyear = { workspace = true, features = [
	"replication",
	"prediction",
	"interpolation",
	"input_native",
	"netcode",
] }
avian3d = { workspace = true, default-features = false, features = [
	"3d",
	"f32",
	"parry-f32",
	"serialize",
] }
serde = { workspace = true, features = ["derive"] }
