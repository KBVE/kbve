[package]
name = "bevy_items"
authors = ["kbve", "h0lybyte"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Proto-driven item definitions for Bevy games — compiles itemdb.proto into typed Rust structs with a searchable registry."
homepage = "https://kbve.com/"
repository.workspace = true
keywords = ["bevy", "items", "gamedev", "protobuf", "plugin"]
categories = ["game-development", "game-engines"]
readme = "README.md"

[features]
default = ["bevy"]

# Bevy ECS integration — adds the `Resource` derive and `BevyItemsPlugin`.
# Without this feature the crate is plain Rust with zero Bevy dependency: the
# proto types, `ItemDb`, and `profession` still work, which is what lets FFI
# cdylibs (Godot GDExtension) and non-Bevy consumers read the same itemdb.
bevy = ["dep:bevy"]

inventory = ["dep:bevy_inventory"]

[dependencies]
bevy = { workspace = true, features = ["bevy_state"], optional = true }
prost = { workspace = true, features = ["derive"] }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bevy_inventory = { version = "0.1", path = "../bevy_inventory", optional = true, default-features = false }

[build-dependencies]
prost-build = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
