# The data exchange layer, migrated from the legacy Nx workspace at
# KBVE/kbve packages/rust/jedi.
#
# No dependsOn for the schemas, unlike kbve-proto: jedi's generated code is
# committed under src/proto and its build script only regenerates when
# BUILD_PROTO is set. The schemas themselves are still in the old repository,
# so there is nothing here to depend on yet.
layer: 'library'
stack: 'systems'
toolchains:
    default: 'rust'

owners:
    defaultOwner: '@h0lybyte'

# `crates` is the release lane: this crate publishes to crates.io. It is
# separate from the rust toolchain, which says what the project is built with
# rather than what publishing it means -- 26 applications here are also rust
# and must never be pushed to a registry.

tags: ['crates']
