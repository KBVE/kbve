name: 'KBVE - Setup moon'
description: 'Installs the moon CLI at the version pinned in .prototools and caches its store'
branding:
    color: 'blue'
    icon: 'moon'

runs:
    using: 'composite'
    steps:
        # The version lives in .prototools and nowhere else. Passing it as an
        # input would let a workflow drift from the version everyone runs
        # locally, and the failure would look like a task bug rather than a
        # version skew.
        - name: Read pinned version
          id: version
          shell: bash
          run: |
              VERSION="$(sed -n 's/^moon *= *"\(.*\)"$/\1/p' .prototools)"
              if [ -z "$VERSION" ]; then
                echo "::error::No moon version pinned in .prototools"
                exit 1
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "moon $VERSION"

          # The content-addressable store only -- blobs and the manifests that
          # index them. NOT .moon/cache/states.
          #
          # states/ records "this task hash already ran in this workspace", and
          # moon trusts it over the filesystem: on a state hit it skips the task
          # and never hydrates the declared outputs. That invariant holds on a
          # developer machine, where the state and the outputs were written
          # together. It is false on a runner, where the state arrives from this
          # cache and the checkout is brand new, so every output is missing. The
          # task then reports `(cached)`, replays the archived stdout, and leaves
          # nothing on disk -- a green build whose artifacts were never written.
          #
          # Restoring the CAS alone keeps the speed and drops the lie: with no
          # state to short-circuit on, moon resolves the hash against the
          # manifest and hydrates the blobs (measured at ~125ms for an astro
          # embed bundle, versus ~1.8s to rebuild it).
        - name: Restore moon cache
          uses: actions/cache@v4
          with:
              path: |
                  .moon/cache/blobs
                  .moon/cache/manifests
              #
              # v2: the pre-fix cache holds archives produced while the states
              # bug was live, so a task that ran with its inputs missing was
              # archived under the hash it should have had. Those entries stay
              # valid-looking forever -- the key is derived from lockfiles and
              # moon config, none of which this fix touches -- so the prefix is
              # bumped to abandon them rather than keep restoring a bad build.
              key: moon-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', '.moon/**/*.yml') }}
              restore-keys: |
                  moon-v2-${{ runner.os }}-

        - name: Install moon
          shell: bash
          env:
              MOON_VERSION: ${{ steps.version.outputs.version }}
          run: |
              curl -fsSL https://moonrepo.dev/install/moon.sh | bash -s -- "$MOON_VERSION"
              echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

        - name: Verify
          shell: bash
          run: moon --version
