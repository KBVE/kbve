name: 'KBVE - Setup JavaScript'
description: 'Installs the pinned node and pnpm, caches the pnpm store, and optionally installs dependencies'
branding:
    color: 'yellow'
    icon: 'package'

# The versions live in .prototools and package.json and nowhere else. They used
# to be written into every workflow that needed them, which is how node drifted
# to 20 in ci-react-native-ios.yml while seventeen other files said 24 and
# .prototools said 24.10.0 -- a skew that reads as a broken workflow rather than
# a stale pin.

inputs:
    install:
        description: 'Run `pnpm install --frozen-lockfile` after the toolchain is set up.'
        required: false
        default: 'true'
    scrub:
        description: 'Run the install under a scrubbed environment so lifecycle scripts cannot read runner secrets.'
        required: false
        default: 'true'
    keep-env:
        description: 'Space-separated extra env var names to forward through the scrub (e.g. a private-registry token).'
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        # Same shape as setup-moon: read the pin rather than accept it as an
        # input, so a workflow cannot disagree with what everyone runs locally.
        - name: Read the pinned node version
          id: node
          shell: bash
          run: |
              VERSION="$(sed -n 's/^node *= *"\(.*\)"$/\1/p' .prototools)"
              if [ -z "$VERSION" ]; then
                echo "::error::No node version pinned in .prototools"
                exit 1
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "node $VERSION"

        # Before setup-node, which needs pnpm on PATH to resolve the store path
        # for its cache. No version here on purpose: action-setup reads
        # `packageManager` from package.json, so pnpm's version has one home.
        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
              run_install: false

        # `cache: pnpm` replaces the store-path-plus-actions/cache pair that
        # eight workflows each wrote out by hand.
        - name: Setup node
          uses: actions/setup-node@v7
          with:
              node-version: ${{ steps.node.outputs.version }}
              cache: 'pnpm'

        # `pnpm install` welds two jobs together, and only one of them runs
        # third-party code. Resolving and fetching the lockfile executes
        # nothing; the postinstall scripts of the eight packages under
        # `allowBuilds` in pnpm-workspace.yaml -- esbuild, sharp, @swc/core,
        # grpc-tools and four more -- are the whole of the untrusted surface.
        #
        # So the two are split. The fetch keeps the ambient environment, which
        # is what a private registry token or a proxy would need. The build runs
        # under `env -i` with an explicit allowlist, so a compromised postinstall
        # sees no GITHUB_TOKEN, no AWS_*, no APPLE_*, no FORGEJO_* -- absent by
        # construction rather than by denylist.
        #
        # On GitHub-hosted runners this is close to a no-op, since every secret
        # in this repo is mapped at step level and never reaches the install. On
        # ARC the ambient environment is the pod's, which is where the secrets
        # are, and that is the case this exists for.
        #
        # `minimumReleaseAge` and `allowBuilds` already narrow *which* package
        # can run a script. This narrows what one sees when it does.
        #
        # What this deliberately does not do is cut the network for the build.
        # grpc-tools fetches protoc from node-precompiled-binaries.grpc.io,
        # sharp fetches libvips, and esbuild's install.js downloads its platform
        # binary -- three of the eight need egress to build at all.
        - name: Fetch dependencies
          if: ${{ inputs.install == 'true' }}
          shell: bash
          env:
              SETUP_JS_SCRUB: ${{ inputs.scrub }}
          run: |
              set -euo pipefail

              ARGS=(install --frozen-lockfile)
              if [ "$SETUP_JS_SCRUB" = 'true' ] && [ "${RUNNER_OS:-}" != 'Windows' ]; then
                ARGS+=(--ignore-scripts)
              fi

              # Three attempts, because the registry is a network and this one
              # step stands in front of every job in the repository.
              # `--prefer-offline` on a retry reuses whatever the failed attempt
              # already wrote to the store instead of asking for it again.
              for attempt in 1 2 3; do
                if pnpm "${ARGS[@]}"; then
                  exit 0
                fi
                if [ "$attempt" -eq 3 ]; then
                  break
                fi
                echo "::warning::pnpm install failed (attempt $attempt/3), retrying in $((attempt * 15))s"
                ARGS+=(--prefer-offline)
                sleep "$((attempt * 15))"
              done
              exit 1

        # `--pending` builds exactly what the fetch skipped. It also runs the
        # root project's own `prepare`, so husky is still installed here.
        #
        # Windows is exempt: node under git-bash wants SYSTEMROOT, APPDATA and a
        # long tail of host vars an allowlist would have to guess at, and the one
        # Windows caller (utils-tauri-build) is GitHub-hosted, so it has no pod
        # environment to leak. It took the unsplit install above and needs no
        # build step here.
        - name: Build allowed dependencies
          if: ${{ inputs.install == 'true' && inputs.scrub == 'true' && runner.os != 'Windows' }}
          shell: bash
          env:
              # Browsers come from .github/actions/setup-playwright, never from
              # an install. This action used to carry a `playwright` input that
              # flipped this to '0' and read as the switch for the browser
              # suites; it never was one. playwright is not in `allowBuilds`, so
              # pnpm does not run its postinstall and the variable it reads has
              # nothing to say to. Pinned to '1' so that stays true if it ever
              # is listed.
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
              SETUP_JS_KEEP_ENV: ${{ inputs.keep-env }}
          run: |
              set -euo pipefail

              PNPM_BIN="$(command -v pnpm)"

              # Finding node and the store, and reaching the network for the
              # three packages that fetch a binary. Nothing else.
              KEEP=(
                PATH HOME USER LANG LC_ALL TERM TMPDIR CI
                PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
                PNPM_HOME COREPACK_HOME
                XDG_CACHE_HOME XDG_CONFIG_HOME XDG_DATA_HOME
                NODE_OPTIONS NODE_PATH
                npm_config_registry NPM_CONFIG_REGISTRY
                RUNNER_OS RUNNER_ARCH RUNNER_TEMP RUNNER_TOOL_CACHE
                HTTP_PROXY HTTPS_PROXY NO_PROXY
                http_proxy https_proxy no_proxy
              )
              for extra in $SETUP_JS_KEEP_ENV; do
                KEEP+=("$extra")
              done

              FORWARD=()
              for name in "${KEEP[@]}"; do
                if [ -n "${!name:-}" ]; then
                  FORWARD+=("$name=${!name}")
                fi
              done

              # Retried for the same reason the fetch above is, against a
              # different network: three of the eight allowed builds download a
              # binary from a vendor host rather than from the registry, and
              # those hosts have no mirror to fall back to. `herbmail-api@0.1.3`
              # published its image and then lost the release notes to one
              # ECONNRESET from node-precompiled-binaries.grpc.io -- grpc-tools
              # fetching protoc -- with nothing between the reset and a failed
              # job (#17144). A rebuild is idempotent: what already built stays
              # built, and `--pending` picks up only what did not.
              for attempt in 1 2 3; do
                if env -i "${FORWARD[@]}" "$PNPM_BIN" rebuild --pending; then
                  exit 0
                fi
                if [ "$attempt" -eq 3 ]; then
                  break
                fi
                echo "::warning::pnpm rebuild --pending failed (attempt $attempt/3), retrying in $((attempt * 15))s"
                sleep "$((attempt * 15))"
              done
              exit 1
