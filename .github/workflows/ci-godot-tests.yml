name: CI - Godot Tests

on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'apps/**'
            - 'crates/**'
            - '.github/workflows/ci-godot-tests.yml'
            - 'tools/release/godot-matrix.mjs'

permissions: {}

concurrency:
    group: godot-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    discover:
        name: Discover
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: read
        outputs:
            matrix: ${{ steps.pick.outputs.matrix }}
            any: ${{ steps.pick.outputs.any }}
        steps:
            # Full history, not a sparse checkout: the matrix asks moon what a
            # range of commits affected, and that needs the range present.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js
              with:
                  install: 'false'

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # No base on a manual dispatch, which the generator reads as "run
            # everything". Narrowing on a bad guess would skip the suite
            # silently, and a skipped suite looks exactly like a passing one.
            - name: Pick the projects this change touches
              id: pick
              env:
                  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
                  HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
              run: |
                  set -euo pipefail
                  node tools/release/godot-matrix.mjs "$BASE" "$HEAD" > matrix.json
                  cat matrix.json
                  echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
                  if [ "$(cat matrix.json)" = "[]" ]; then
                    echo "any=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No Godot project touched by this change"
                  else
                    echo "any=true" >> "$GITHUB_OUTPUT"
                  fi

    gdextension:
        name: Build ${{ matrix.package }} for ${{ matrix.app_name }}
        needs: [discover]
        if: ${{ needs.discover.outputs.any == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.discover.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7
              if: ${{ matrix.package != '' }}
              with:
                  sparse-checkout: |
                      /*
                      !/apps/kbve/astro-kbve/public/graphify
                  sparse-checkout-cone-mode: false

            - name: Install build prerequisites
              if: ${{ matrix.package != '' }}
              run: |
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends \
                    build-essential pkg-config \
                    libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            - name: Rust toolchain (1.96)
              if: ${{ matrix.package != '' }}
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: '1.96'

            - name: Rust cache
              if: ${{ matrix.package != '' }}
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  key: godot-tests-${{ matrix.app_name }}-linux
                  cache-on-failure: true

            - name: Build cdylib
              if: ${{ matrix.package != '' }}
              env:
                  PKG: ${{ matrix.package }}
                  FEATURES: ${{ matrix.features }}
              run: |
                  set -euo pipefail
                  echo "::notice::Building $PKG with features: ${FEATURES:-<default>}"
                  cargo build --release -p "$PKG" ${FEATURES:+--features "$FEATURES"}

            - name: Stage artefact
              if: ${{ matrix.package != '' }}
              env:
                  PKG: ${{ matrix.package }}
              run: |
                  set -euo pipefail
                  LIB="lib$(echo "$PKG" | tr '-' '_').so"
                  mkdir -p stage/linux
                  for base in target dist/target; do
                    if [ -f "$base/release/$LIB" ]; then
                      cp "$base/release/$LIB" "stage/linux/$LIB"
                      break
                    fi
                  done
                  test -f "stage/linux/$LIB" || {
                    echo "::error::Built library not found at */release/$LIB"; exit 1;
                  }
                  ls -l stage/linux

            - name: Upload artefact
              if: ${{ matrix.package != '' }}
              uses: actions/upload-artifact@v7
              with:
                  name: godot-tests-gdext-${{ matrix.app_name }}-linux
                  path: stage
                  if-no-files-found: error

    test:
        name: gdUnit4 (${{ matrix.app_name }})
        needs: [discover, gdextension]
        if: ${{ always() && needs.discover.outputs.any == 'true' && needs.gdextension.result != 'failure' && needs.gdextension.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.discover.outputs.matrix) }}
        container:
            image: barichello/godot-ci:${{ matrix.godot_version }}
        # A step inside a container runs under `sh -e`, not the `bash -e` a step on the
        # runner gets, and dash has no `pipefail` -- every step below opens with
        # `set -euo pipefail` and died on its first line. The image carries bash, so the
        # shell is named rather than the scripts written down to dash.
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - name: Pull LFS assets (Forgejo)
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  LFS_INCLUDE: ${{ matrix.project_path }}
              run: bash tools/lfs/ensure.sh

            - name: Download GDExtension
              if: ${{ matrix.package != '' }}
              uses: actions/download-artifact@v8
              with:
                  name: godot-tests-gdext-${{ matrix.app_name }}-linux
                  path: gdext

            - name: Stage GDExtension
              if: ${{ matrix.package != '' }}
              env:
                  PROJECT_PATH: ${{ matrix.project_path }}
                  ADDON_PATH: ${{ matrix.addon_path }}
              run: |
                  set -euo pipefail
                  mkdir -p "$PROJECT_PATH/$ADDON_PATH/linux"
                  cp gdext/linux/*.so "$PROJECT_PATH/$ADDON_PATH/linux/"
                  ls -l "$PROJECT_PATH/$ADDON_PATH/linux"

            - name: Install GDExtension runtime libraries
              if: ${{ matrix.package != '' }}
              env:
                  PROJECT_PATH: ${{ matrix.project_path }}
                  ADDON_PATH: ${{ matrix.addon_path }}
              run: |
                  set -euo pipefail
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends \
                    libwebkit2gtk-4.1-0 libfontconfig1
                  MISSING=$(find "$PROJECT_PATH/$ADDON_PATH" -name '*.so' -exec ldd {} \; 2>/dev/null \
                    | awk '/not found/ {print $1}' | sort -u)
                  if [ -n "$MISSING" ]; then
                    echo "::error::Staged GDExtension libraries have unresolved sonames in this container:"
                    echo "$MISSING"
                    exit 1
                  fi

            - name: Run the suite
              working-directory: ${{ matrix.project_path }}
              env:
                  GODOT_BIN: godot
                  GODOT_NO_INSTALL: '1'
              run: |
                  if [ -x scripts/test.sh ]; then
                    bash scripts/test.sh
                  elif [ -d tests ]; then
                    godot --headless --path . --quit-after 10
                  else
                    echo "::notice::No scripts/test.sh or tests/ — nothing to run"
                  fi

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: godot-tests-reports-${{ matrix.app_name }}
                  path: ${{ matrix.project_path }}/reports
                  if-no-files-found: ignore
