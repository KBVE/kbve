name: CI - CodeQL

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - dev
            - main
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

# cancel-in-progress being off is not by itself enough to see a push through.
# GitHub holds one pending run per group, so a third merge into dev cancels the
# second before it has started a single job -- which is how the rust analysis
# for a commit disappears without leaving a log to read. The sha in the group
# gives each push its own lane; a pull request keeps the shared one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: false

permissions: {}

jobs:
    # Rust is not in the pull_request matrix.
    #
    # It used to be, and finished in under four minutes. A toolchain change
    # around 2026-08-27 -- the last green rust job is 2026-08-26, and nothing
    # landed in that window that grew the rust surface -- turned it into a job
    # that does not finish: every run since has been killed at the 60 minute
    # timeout, part way through the query evaluation. Nine of thirty-six
    # queries had been evaluated when the last one was cut off, and the ones
    # still to come are the expensive security queries rather than the cheap
    # diagnostics that had run.
    #
    # A job that cannot pass is not a gate, it is a red cross every PR learns
    # to ignore, so rust analysis moves to push and to the weekly schedule
    # where the wall clock is nobody's critical path. Rust in a PR is still
    # analysed -- on the push to dev that merging it produces, one merge later
    # than before.

    # An extractor only has something to say about a language that is in the
    # diff. Before this job existed the pull_request matrix was the literal
    # pair javascript-typescript and python, so a one-file rust change queued
    # two full extractor runs over a monorepo that the change could not have
    # altered the results of -- and under a busy runner pool the cost is the
    # queued job rather than its wall clock.
    #
    # The file list comes from the API rather than a checkout: a diff this job
    # only counts extensions in is not worth fetching the history for. The API
    # truncates at 3000 files, and a diff that large is treated as "no idea",
    # which is the same answer a push gets.
    languages:
        name: Pick languages
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            matrix: ${{ steps.pick.outputs.matrix }}
            any: ${{ steps.pick.outputs.any }}
        steps:
            - name: Pick the languages this change touches
              id: pick
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  EVENT: ${{ github.event_name }}
              run: |
                  set -euo pipefail

                  js='{"language":"javascript-typescript","build-mode":"none","timeout":60}'
                  py='{"language":"python","build-mode":"none","timeout":60}'
                  # Rust is not in the pull request matrix; see the note on
                  # `analyze`. On push and on the schedule it is the whole
                  # reason the workflow runs, so it is never narrowed away.
                  rs='{"language":"rust","build-mode":"none","timeout":360}'

                  if [ "$EVENT" != "pull_request" ]; then
                    printf 'matrix=[%s,%s,%s]\n' "$js" "$py" "$rs" >> "$GITHUB_OUTPUT"
                    echo "any=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # A file rather than a pipe into grep: `grep -q` closes the
                  # pipe on its first match, and under pipefail the writer's
                  # EPIPE is the status the pipeline reports, so a match would
                  # read as no match.
                  gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
                  count=$(wc -l < files.txt)
                  echo "::notice::$count changed files"

                  want_js=false
                  want_py=false
                  # The API stops at 3000 files, so a diff at the cap is a diff
                  # this job cannot describe -- same answer a push gets. The
                  # config and the workflow decide what every extractor sees,
                  # so a change to either is a change to both languages.
                  if [ "$count" -ge 3000 ] ||
                     grep -qE '^\.github/(workflows/ci-codeql\.yml|codeql/)' files.txt; then
                    want_js=true
                    want_py=true
                  else
                    grep -qE '\.[cm]?[jt]sx?$' files.txt && want_js=true || true
                    grep -qE '\.pyi?$' files.txt && want_py=true || true
                  fi

                  entries=""
                  if [ "$want_js" = true ]; then entries="$js"; fi
                  if [ "$want_py" = true ]; then entries="${entries:+$entries,}$py"; fi

                  echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"
                  if [ -z "$entries" ]; then
                    echo "any=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No CodeQL language touched by this change"
                  else
                    echo "any=true" >> "$GITHUB_OUTPUT"
                  fi

    # The config file drops four paths from the rust extractor's input set.
    # hardware/esp32c6-display is its own workspace targeting
    # riscv32imac-unknown-none-elf, and crates/uniti/fuzz needs nightly and
    # cargo-fuzz; neither toolchain exists on the runner, so the vendored
    # rust-analyzer resolves them against no sysroot. Feeding it those was
    # enough to panic the extractor outright on bundle 2.26.4 --
    # "Unable to fetch file text for `vfs::FileId`" out of index-files.sh --
    # and even before that they were paying query time for code the queries
    # cannot say anything useful about.
    #
    # packages/proto/verify/rust is the third. Its body is one `include!` of
    # crates/kbve-proto/src/gen/mod.rs, a thousand-file generated tree it pulls
    # in wholesale from outside its own directory. It stays excluded: the
    # extractor has nothing to say about generated code, kbve-proto already
    # carries the same tree for it to walk, and this crate reaches it by a
    # relative path that leaves the extractor resolving a second copy. Nothing
    # depends on this crate; it exists so generated code that does not compile
    # fails at the schema rather than downstream.
    #
    # apps/arcade/colony is the fourth, and it is the whole crate rather than
    # the one file that breaks. .gitattributes runs src/private/** through
    # git-crypt, so a checkout without the key -- every runner -- holds a
    # mod.rs whose first bytes are \0GITCRYPT\0. CodeQL does not index a binary
    # file, so it never reaches the extractor's vfs, but colony's def map still
    # names it, and the first colony file that is indexed panics on a file id
    # with no text behind it. Ignoring only src/private changes nothing: the
    # file was already absent from the index, and that absence is the panic.
    # The module is behind colony's `tuning` feature, off by default for
    # exactly this reason, but a def map is built before cfg is applied.
    analyze:
        name: Analyze (${{ matrix.language }})
        needs: [languages]
        if: ${{ needs.languages.outputs.any == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.languages.outputs.matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  config-file: ./.github/codeql/codeql-config.yml

            # The rust extractor dies part way through indexing with
            # "Unable to fetch file text for `vfs::FileId`: FileId(38506)", a
            # panic inside vendored rust-analyzer that names no path. At the
            # default `progress` verbosity the last thing the log says is the
            # manifest list, so there is nothing to exclude and nothing to
            # report upstream. `progress++` logs each file as it is indexed,
            # which turns the id into a path -- the same way the three crates
            # already in codeql-config.yml were found.
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              env:
                  CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: ${{ matrix.language == 'rust' && 'progress++' || '' }}
              with:
                  category: '/language:${{ matrix.language }}'

    # Analyze (rust) has been failing on every push since 2026-08-29 and nobody
    # was told: this workflow is the only one that gates a language and does not
    # report, so the break lived entirely in the runs list. The tracker opens one
    # issue for the job and closes it when rust goes green again.
    #
    # The status is the matrix result, which is a failure if any language fails.
    # javascript-typescript and python have been green throughout, so it reads
    # as rust today; if one of the other two starts breaking, the tracker will
    # say rust and the run link will say otherwise.
    #
    # Pull requests are skipped because rust is not in their matrix at all.
    track-rust:
        name: Track CodeQL Rust
        if: always() && github.event_name != 'pull_request'
        needs: [languages, analyze]
        permissions:
            actions: read
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI - CodeQL'
            job_name: 'Analyze (rust)'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            # `languages` failing skips `analyze`, and a skipped job is not a
            # status the tracker acts on -- which would be the silent break
            # again, one job upstream of where it was.
            status: ${{ needs.languages.result == 'failure' && 'failure' || needs.analyze.result }}
