name: CI - CodeQL

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - dev
            - main
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

# cancel-in-progress being off is not by itself enough to see a push through.
# GitHub holds one pending run per group, so a third merge into dev cancels the
# second before it has started a single job -- which is how the rust analysis
# for a commit disappears without leaving a log to read. The sha in the group
# gives each push its own lane; a pull request keeps the shared one.
# One lane per branch. The sha is not in this group.
#
# It used to be, for every push, so no run ever superseded another: each merge
# opened its own lane and waited its turn. Both trunk branches merge at about
# the same rate -- 6.4 an hour on main and 6.2 on dev over the last nine hours,
# because the release pull request auto-merges continuously and main tracks dev
# one for one -- and that is faster than the queue drains. Measured on
# 2026-09-13: 34 CI and 25 CodeQL push runs queued on dev at once, the oldest
# six hours old, against an account cap of about twenty concurrent jobs, four of
# which were held by 70 minute `Analyze (rust)` jobs. A feature pull request
# waited 27 minutes to start a 105 second job.
#
# A shared group means GitHub holds one pending run and cancels the rest, so
# the queue is bounded at one running and one pending, and the pending one is
# always the tip.
#
# The sha was added for a real reason: under a shared group the commits between
# the tip and the last green run go unvalidated. That holds at a low merge
# rate. At this one it inverts -- those commits were not going unvalidated,
# they were being validated six hours late, behind the pull request feedback
# they were starving. A bounded queue on the tip is worth more than an
# unbounded one on history.
#
# `cancel-in-progress` stays false on a push, which is the half that matters:
# only runs that have not started are dropped, so anything executing finishes.
# A dropped run is cancelled rather than failed -- the tracker below skips when
# any result is cancelled, and utils-ci-failure-tracker.yml acts only on
# failure or success -- so nothing opens an issue for one. The dev->main
# release pull request points at the tip, whose run is the newest pending one,
# which is the one never dropped.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions: {}

jobs:
    # Rust is not in the pull_request matrix.
    #
    # It used to be, and finished in under four minutes. A toolchain change
    # around 2026-08-27 -- the last green rust job is 2026-08-26, and nothing
    # landed in that window that grew the rust surface -- turned it into a job
    # that does not finish: every run since has been killed at the 60 minute
    # timeout, part way through the query evaluation. Nine of thirty-six
    # queries had been evaluated when the last one was cut off, and the ones
    # still to come are the expensive security queries rather than the cheap
    # diagnostics that had run.
    #
    # A job that cannot pass is not a gate, it is a red cross every PR learns
    # to ignore, so rust analysis moves to push and to the weekly schedule
    # where the wall clock is nobody's critical path. Rust in a PR is still
    # analysed -- on the push to dev that merging it produces, one merge later
    # than before.

    # An extractor only has something to say about a language that is in the
    # diff. Before this job existed the pull_request matrix was the literal
    # pair javascript-typescript and python, so a one-file rust change queued
    # two full extractor runs over a monorepo that the change could not have
    # altered the results of -- and under a busy runner pool the cost is the
    # queued job rather than its wall clock.
    #
    # Push is narrowed for the same reason, and it is where the cost actually
    # is: `Analyze (rust)` takes 58 to 73 minutes (runs 34707883257, 34708298860
    # and 34709067024 were 4385s, 3887s and 3511s) and it runs on every push to
    # dev. Nineteen of the last forty commits on dev touched no rust at all,
    # and each of them paid that hour to re-analyse a tree the change could not
    # have altered the rust findings of. The concurrency group above bounds how
    # many of these can be outstanding on a branch; this bounds how many exist.
    #
    # Safe to narrow because the Monday schedule is not narrowed: it analyses
    # all three languages over the whole tree whatever changed. Narrowing a
    # push trades a week of latency on a finding the diff does not touch, not
    # the finding itself.
    #
    # The file list comes from the API rather than a checkout: a diff this job
    # only counts extensions in is not worth fetching the history for. Both
    # endpoints cap -- pulls/files at 3000 files, compare at 300 -- and a diff
    # at the cap is one this job cannot describe, so it runs everything.
    # Not on the dev->main release pull request. Its head branch is dev, so its
    # head sha is a commit that was already pushed to dev -- and this workflow
    # ran on that push, for that same sha. GitHub keys check runs to the sha
    # rather than to the run that made them, so the release pull request shows
    # the push's results either way; running again only queues a second copy of
    # work whose answer is already attached to the commit.
    #
    # It is also the widest possible copy: on a pull request the diff is
    # measured against the base, so the release pull request asks for every
    # language touched since the last release rather than since the last merge.
    languages:
        name: Pick languages
        if: github.head_ref != 'dev'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            matrix: ${{ steps.pick.outputs.matrix }}
            any: ${{ steps.pick.outputs.any }}
            # Whether rust is in the matrix, which is what decides if this run
            # has anything to say about the rust tracker's issue.
            rust: ${{ steps.pick.outputs.rust }}
        steps:
            - name: Pick the languages this change touches
              id: pick
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
                  SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  js='{"language":"javascript-typescript","build-mode":"none","timeout":60}'
                  py='{"language":"python","build-mode":"none","timeout":60}'
                  rs='{"language":"rust","build-mode":"none","timeout":360}'

                  all() {
                    printf 'matrix=[%s,%s,%s]\n' "$js" "$py" "$rs" >> "$GITHUB_OUTPUT"
                    printf 'any=true\nrust=true\n' >> "$GITHUB_OUTPUT"
                    exit 0
                  }

                  # The schedule is the backstop the narrowing below leans on,
                  # and a manual run is someone asking for the whole thing.
                  case "$EVENT" in
                    pull_request)
                      gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
                      cap=3000
                      ;;
                    push)
                      # A new branch has no `before` to compare against, and a
                      # zero sha is how GitHub spells that.
                      case "$BEFORE" in
                        ''|0000000000000000000000000000000000000000) all ;;
                      esac
                      gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[]?.filename' > files.txt
                      cap=300
                      ;;
                    *) all ;;
                  esac

                  count=$(wc -l < files.txt)
                  echo "::notice::$count changed files"
                  # `cmd && all` would be a failing AND-list under `set -e`
                  # whenever the condition is false, so both of these are
                  # spelled as ifs.
                  if [ "$count" -ge "$cap" ]; then all; fi

                  # The config and the workflow decide what every extractor
                  # sees, so a change to either is a change to every language.
                  if grep -qE '^\.github/(workflows/ci-codeql\.yml|codeql/)' files.txt; then all; fi

                  entries=""
                  want_rust=false
                  add() { entries="${entries:+$entries,}$1"; }

                  # A file rather than a pipe into grep: `grep -q` closes the
                  # pipe on its first match, and under pipefail the writer's
                  # EPIPE is the status the pipeline reports, so a match would
                  # read as no match.
                  grep -qE '\.[cm]?[jt]sx?$' files.txt && add "$js" || true
                  grep -qE '\.pyi?$' files.txt && add "$py" || true
                  # Rust is not in the pull request matrix at all: it cannot
                  # finish inside one, which is what moved it to push and to the
                  # schedule in the first place. Cargo manifests count because a
                  # dependency edit changes what the extractor resolves without
                  # touching a .rs file.
                  if [ "$EVENT" != "pull_request" ] &&
                     grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$' files.txt; then
                    add "$rs"
                    want_rust=true
                  fi

                  printf 'matrix=[%s]\nrust=%s\n' "$entries" "$want_rust" >> "$GITHUB_OUTPUT"
                  if [ -z "$entries" ]; then
                    echo "any=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No CodeQL language touched by this change"
                  else
                    echo "any=true" >> "$GITHUB_OUTPUT"
                  fi

    # The config file drops four paths from the rust extractor's input set.
    # hardware/esp32c6-display is its own workspace targeting
    # riscv32imac-unknown-none-elf, and crates/uniti/fuzz needs nightly and
    # cargo-fuzz; neither toolchain exists on the runner, so the vendored
    # rust-analyzer resolves them against no sysroot. Feeding it those was
    # enough to panic the extractor outright on bundle 2.26.4 --
    # "Unable to fetch file text for `vfs::FileId`" out of index-files.sh --
    # and even before that they were paying query time for code the queries
    # cannot say anything useful about.
    #
    # packages/proto/verify/rust is the third. Its body is one `include!` of
    # crates/kbve-proto/src/gen/mod.rs, a thousand-file generated tree it pulls
    # in wholesale from outside its own directory. It stays excluded: the
    # extractor has nothing to say about generated code, kbve-proto already
    # carries the same tree for it to walk, and this crate reaches it by a
    # relative path that leaves the extractor resolving a second copy. Nothing
    # depends on this crate; it exists so generated code that does not compile
    # fails at the schema rather than downstream.
    #
    # apps/arcade/colony is the fourth, and it is the whole crate rather than
    # the one file that breaks. .gitattributes runs src/private/** through
    # git-crypt, so a checkout without the key -- every runner -- holds a
    # mod.rs whose first bytes are \0GITCRYPT\0. CodeQL does not index a binary
    # file, so it never reaches the extractor's vfs, but colony's def map still
    # names it, and the first colony file that is indexed panics on a file id
    # with no text behind it. Ignoring only src/private changes nothing: the
    # file was already absent from the index, and that absence is the panic.
    # The module is behind colony's `tuning` feature, off by default for
    # exactly this reason, but a def map is built before cfg is applied.
    analyze:
        name: Analyze (${{ matrix.language }})
        needs: [languages]
        if: ${{ needs.languages.outputs.any == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.languages.outputs.matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  config-file: ./.github/codeql/codeql-config.yml

            # The rust extractor dies part way through indexing with
            # "Unable to fetch file text for `vfs::FileId`: FileId(38506)", a
            # panic inside vendored rust-analyzer that names no path. At the
            # default `progress` verbosity the last thing the log says is the
            # manifest list, so there is nothing to exclude and nothing to
            # report upstream. `progress++` logs each file as it is indexed,
            # which turns the id into a path -- the same way the three crates
            # already in codeql-config.yml were found.
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              env:
                  CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: ${{ matrix.language == 'rust' && 'progress++' || '' }}
              with:
                  category: '/language:${{ matrix.language }}'

    # Analyze (rust) has been failing on every push since 2026-08-29 and nobody
    # was told: this workflow is the only one that gates a language and does not
    # report, so the break lived entirely in the runs list. The tracker opens one
    # issue for the job and closes it when rust goes green again.
    #
    # The status is the matrix result, which is a failure if any language fails.
    # javascript-typescript and python have been green throughout, so it reads
    # as rust today; if one of the other two starts breaking, the tracker will
    # say rust and the run link will say otherwise.
    #
    # Pull requests are skipped because rust is not in their matrix at all, and
    # so is any run that narrowed rust away: `analyze` reports the matrix
    # result, so a push that only analysed javascript would otherwise report
    # green for a language it never ran and close an open rust issue on the
    # strength of it.
    track-rust:
        name: Track CodeQL Rust
        if: always() && github.event_name != 'pull_request' && (needs.languages.result == 'failure' || needs.languages.outputs.rust == 'true')
        needs: [languages, analyze]
        permissions:
            actions: read
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI - CodeQL'
            job_name: 'Analyze (rust)'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            # `languages` failing skips `analyze`, and a skipped job is not a
            # status the tracker acts on -- which would be the silent break
            # again, one job upstream of where it was.
            status: ${{ needs.languages.result == 'failure' && 'failure' || needs.analyze.result }}
