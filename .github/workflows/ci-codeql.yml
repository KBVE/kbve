name: CI - CodeQL

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - dev
            - main
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

# cancel-in-progress being off is not by itself enough to see a push through.
# GitHub holds one pending run per group, so a third merge into dev cancels the
# second before it has started a single job -- which is how the rust analysis
# for a commit disappears without leaving a log to read. The sha in the group
# gives each push its own lane; a pull request keeps the shared one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: false

permissions: {}

jobs:
    # Rust is not in the pull_request matrix.
    #
    # It used to be, and finished in under four minutes. A toolchain change
    # around 2026-08-27 -- the last green rust job is 2026-08-26, and nothing
    # landed in that window that grew the rust surface -- turned it into a job
    # that does not finish: every run since has been killed at the 60 minute
    # timeout, part way through the query evaluation. Nine of thirty-six
    # queries had been evaluated when the last one was cut off, and the ones
    # still to come are the expensive security queries rather than the cheap
    # diagnostics that had run.
    #
    # A job that cannot pass is not a gate, it is a red cross every PR learns
    # to ignore, so rust analysis moves to push and to the weekly schedule
    # where the wall clock is nobody's critical path. Rust in a PR is still
    # analysed -- on the push to dev that merging it produces, one merge later
    # than before.

    # The config file drops two crates from the rust extractor's input set.
    # hardware/esp32c6-display is its own workspace targeting
    # riscv32imac-unknown-none-elf, and crates/uniti/fuzz needs nightly and
    # cargo-fuzz; neither toolchain exists on the runner, so the vendored
    # rust-analyzer resolves them against no sysroot. Feeding it those was
    # enough to panic the extractor outright on bundle 2.26.4 --
    # "Unable to fetch file text for `vfs::FileId`" out of index-files.sh --
    # and even before that they were paying query time for code the queries
    # cannot say anything useful about.
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON(github.event_name == 'pull_request'
                    && '[{"language":"javascript-typescript","build-mode":"none","timeout":60},{"language":"python","build-mode":"none","timeout":60}]'
                    || '[{"language":"javascript-typescript","build-mode":"none","timeout":60},{"language":"python","build-mode":"none","timeout":60},{"language":"rust","build-mode":"none","timeout":360}]') }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
