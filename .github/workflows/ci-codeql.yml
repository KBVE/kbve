name: CI - CodeQL

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - dev
            - main
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

# cancel-in-progress being off is not by itself enough to see a push through.
# GitHub holds one pending run per group, so a third merge into dev cancels the
# second before it has started a single job -- which is how the rust analysis
# for a commit disappears without leaving a log to read. The sha in the group
# gives each push its own lane; a pull request keeps the shared one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: false

permissions: {}

jobs:
    # Rust is not in the pull_request matrix.
    #
    # It used to be, and finished in under four minutes. A toolchain change
    # around 2026-08-27 -- the last green rust job is 2026-08-26, and nothing
    # landed in that window that grew the rust surface -- turned it into a job
    # that does not finish: every run since has been killed at the 60 minute
    # timeout, part way through the query evaluation. Nine of thirty-six
    # queries had been evaluated when the last one was cut off, and the ones
    # still to come are the expensive security queries rather than the cheap
    # diagnostics that had run.
    #
    # A job that cannot pass is not a gate, it is a red cross every PR learns
    # to ignore, so rust analysis moves to push and to the weekly schedule
    # where the wall clock is nobody's critical path. Rust in a PR is still
    # analysed -- on the push to dev that merging it produces, one merge later
    # than before.

    # The config file drops four paths from the rust extractor's input set.
    # hardware/esp32c6-display is its own workspace targeting
    # riscv32imac-unknown-none-elf, and crates/uniti/fuzz needs nightly and
    # cargo-fuzz; neither toolchain exists on the runner, so the vendored
    # rust-analyzer resolves them against no sysroot. Feeding it those was
    # enough to panic the extractor outright on bundle 2.26.4 --
    # "Unable to fetch file text for `vfs::FileId`" out of index-files.sh --
    # and even before that they were paying query time for code the queries
    # cannot say anything useful about.
    #
    # packages/proto/verify/rust is the third, and it is unextractable by
    # construction rather than by toolchain: its body is one
    # `include!("../../../gen/rust/mod.rs")` over a directory
    # packages/proto/.gitignore keeps out of the tree, so on a fresh checkout
    # the include target does not exist. The extractor logs
    # "failed to load file `../../../gen/rust/mod.rs`" and then takes the same
    # vfs panic. Nothing depends on this crate; it exists so generated code
    # that does not compile fails at the schema rather than downstream.
    #
    # apps/arcade/colony is the fourth, and it is the whole crate rather than
    # the one file that breaks. .gitattributes runs src/private/** through
    # git-crypt, so a checkout without the key -- every runner -- holds a
    # mod.rs whose first bytes are \0GITCRYPT\0. CodeQL does not index a binary
    # file, so it never reaches the extractor's vfs, but colony's def map still
    # names it, and the first colony file that is indexed panics on a file id
    # with no text behind it. Ignoring only src/private changes nothing: the
    # file was already absent from the index, and that absence is the panic.
    # The module is behind colony's `tuning` feature, off by default for
    # exactly this reason, but a def map is built before cfg is applied.
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include: >-
                    ${{ fromJSON(github.event_name == 'pull_request'
                    && '[{"language":"javascript-typescript","build-mode":"none","timeout":60},{"language":"python","build-mode":"none","timeout":60}]'
                    || '[{"language":"javascript-typescript","build-mode":"none","timeout":60},{"language":"python","build-mode":"none","timeout":60},{"language":"rust","build-mode":"none","timeout":360}]') }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  config-file: ./.github/codeql/codeql-config.yml

            # The rust extractor dies part way through indexing with
            # "Unable to fetch file text for `vfs::FileId`: FileId(38506)", a
            # panic inside vendored rust-analyzer that names no path. At the
            # default `progress` verbosity the last thing the log says is the
            # manifest list, so there is nothing to exclude and nothing to
            # report upstream. `progress++` logs each file as it is indexed,
            # which turns the id into a path -- the same way the three crates
            # already in codeql-config.yml were found.
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              env:
                  CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: ${{ matrix.language == 'rust' && 'progress++' || '' }}
              with:
                  category: '/language:${{ matrix.language }}'

    # Analyze (rust) has been failing on every push since 2026-08-29 and nobody
    # was told: this workflow is the only one that gates a language and does not
    # report, so the break lived entirely in the runs list. The tracker opens one
    # issue for the job and closes it when rust goes green again.
    #
    # The status is the matrix result, which is a failure if any language fails.
    # javascript-typescript and python have been green throughout, so it reads
    # as rust today; if one of the other two starts breaking, the tracker will
    # say rust and the run link will say otherwise.
    #
    # Pull requests are skipped because rust is not in their matrix at all.
    track-rust:
        name: Track CodeQL Rust
        if: always() && github.event_name != 'pull_request'
        needs: [analyze]
        permissions:
            actions: read
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI - CodeQL'
            job_name: 'Analyze (rust)'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: ${{ needs.analyze.result }}
