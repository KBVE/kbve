name: CI

# Every project in the workspace, off the moon graph, so a project added later
# is covered without editing this file.
#
# This replaces utils-ci-lint-test.yml and the four per-ecosystem fanout
# workflows it sat beside. It also closes a hole those left: the only
# lint-and-test job in the repository was gated on the dev->main pull request,
# so an ordinary pull request into dev was merged without either.
#
# A workflow is only worth adding beside this one when the execution context
# differs: a runner moon cannot reach, a secret, or a cadence. ci-godot.yml
# earns one because it needs LFS credentials and a self-hosted mac. Everything
# else belongs in a task here, where the project graph already knows what a
# change affects.
on:
    push:
        branches: [dev, main]
    pull_request:
    merge_group:
    # ci-atom.yml gates its security check on lint and test passing, and it runs
    # on a branch push rather than on the pull request it then creates, so it
    # needs to call this rather than wait for the pull_request trigger above.
    workflow_call:

permissions:
    contents: read

# A cancelled check is indistinguishable from a failing one on a pull request,
# so all of this exists to keep the dev->main release PR from wearing grey X's.
#
# `github.workflow` is the *calling* workflow's name when this runs through
# workflow_call, so a nested run and a direct one on the same ref sit in
# different groups rather than cancelling each other.
#
# Every push carries its own sha in the group, which is the only way to stop a
# merge into dev from discarding the one before it. A shared group is not
# enough even with cancel-in-progress off: GitHub holds exactly one *pending*
# run per group, so in a burst of three merges the middle one is cancelled
# before it starts a job. Half of this workflow's runs on dev were being thrown
# away that way, and the commits they covered went unvalidated -- the tip was
# always tested, but nothing in between it and the last green run was.
#
# A pull request keeps the shared group. There a new commit really does
# supersede the run before it, and the old result is worth nothing.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'dev' }}

jobs:
    # The commit-msg hook covers commits, but a pull request title is composed
    # in the browser where no hook runs -- and a squash merge makes that title
    # the commit message. tools/release/notes.mjs reads the type and scope out
    # of those commits, so an unconventional title lands under the wrong
    # heading in a release note rather than failing anything.
    # Not the dev->main release pull request. Its title is generated by
    # ci-dev.yml -- "Release: 2 fixes, 1 CI -> Main" -- and it lands as a merge
    # commit rather than a squash, so the reason above does not apply to it.
    # The check could never pass there, and failed on every release PR.
    title:
        name: Pull request title
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            # Reads scopes.lock.json, so it needs neither moon nor a toolchain.
            - name: Check the pull request title
              env:
                  TITLE: ${{ github.event.pull_request.title }}
              run: node tools/commit/validate.mjs --title "$TITLE"

    # What the shards run, and what they have to provision to run it, both read
    # off the project graph rather than assumed.
    #
    # One query for both answers, on purpose. They used to be two: this job
    # decided the toolchains from `before..HEAD`, and each shard then let
    # `moon ci` resolve its own base -- `Base revision: N/A` -- so on a merge
    # commit the shards ran tasks from a wider range than the toolchain answer
    # covered, and died on `proto::locate::missing_executable` (#16998). Naming
    # the targets here leaves nothing for the shards to re-derive.
    #
    # The shard preamble was 422 seconds before a single task ran, and three
    # quarters of it was for toolchains the change did not touch: 127s of `uv`
    # and 150s of rust cache and disk clearing on a pull request that moved
    # TypeScript. Times three shards.
    #
    # Fails open on toolchains, deliberately: a detection that errors, times
    # out, or meets a ref it cannot resolve installs everything and costs what
    # it costs today. It does not fail open on the target list -- an empty list
    # would report green having run nothing -- so an unresolvable range widens
    # to the whole graph and a moon that cannot answer fails the job.
    toolchains:
        name: Plan the run
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            rust: ${{ steps.detect.outputs.rust }}
            python: ${{ steps.detect.outputs.python }}
            targets: ${{ steps.detect.outputs.targets }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # No install: the project graph is read from moon.yml files, and
            # nothing here runs a task.
            - name: Setup JavaScript
              uses: ./.github/actions/setup-js
              with:
                  install: 'false'

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            - name: Plan what the shards run
              id: detect
              env:
                  EVENT: ${{ github.event_name }}
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.before }}
              run: node tools/moon/ci-plan.mjs

    ci:
        name: ci (${{ matrix.index }}/${{ matrix.total }})
        runs-on: ubuntu-latest
        needs: [toolchains]
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                index: [0, 1, 2]
                total: [3]
        env:
            NEEDS_RUST: ${{ needs.toolchains.outputs.rust != 'false' }}
            NEEDS_PYTHON: ${{ needs.toolchains.outputs.python != 'false' }}
            # Every `project:task` the plan job resolved, newline separated. No
            # base or head here on purpose: affectedness was decided once, up
            # there, and these are explicit targets.
            CI_TARGETS: ${{ needs.toolchains.outputs.targets }}
        steps:
            # Two minutes of deleting preinstalled SDKs, for the target
            # directory of a cargo build. A shard with no rust task fits on the
            # runner as shipped.
            - name: Free disk space
              if: env.NEEDS_RUST == 'true'
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: true
                  dotnet: true
                  haskell: true
                  large-packages: true
                  swap-storage: true
                  docker-images: true

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # moon compares against the base to decide what is affected.
                  fetch-depth: 0

            # libxml2/libxslt are for python, not rust: fudster depends on lxml,
            # and the runner's CPython has no manylinux wheel for it, so uv
            # builds it from source and needs the headers.
            - name: Install the system libraries the rust crates link against
              if: env.NEEDS_RUST == 'true' || env.NEEDS_PYTHON == 'true'
              run: |
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends \
                    pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                    libpq-dev protobuf-compiler libprotobuf-dev \
                    libxml2-dev libxslt1-dev

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js

            - name: Install uv
              if: env.NEEDS_PYTHON == 'true'
              uses: astral-sh/setup-uv@v7
              with:
                  github-token: ${{ github.token }}

            # What cargo downloads, not what it produces. The registry index and
            # the .crate tarballs are what a cold runner spends its first minutes
            # on before it compiles a line, and they are the same for every shard
            # here. registry/src is deliberately not in the list: cargo
            # re-extracts it from the tarballs beside it in seconds.
            - name: Restore the cargo registry
              if: env.NEEDS_RUST == 'true'
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-

            # Compiled dependency artifacts. `moon ci` only runs affected
            # projects, but "affected" is about our crates; their dependencies
            # are cold either way on a fresh runner. save-if limits writes to the
            # trunk branches, so a pull request cannot fill the cache budget with
            # an entry only it will ever read.
            - name: Restore compiled dependencies
              if: env.NEEDS_RUST == 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  key: shard-${{ matrix.index }}
                  save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

            # Everything downstream of a .proto reads the committed .binpb
            # descriptor, not the .proto -- so an edit with no regeneration is
            # silently inert and nothing else in CI notices. Hash-based, so this
            # needs no protoc and cannot flake on a protoc version.
            - name: Check proto descriptors are not stale
              if: matrix.index == 0
              run: node packages/data/codegen/check-descriptors.mjs

            # Same failure mode one layer up: the games load the generated
            # <db>.json/.binpb, never the MDX, so an MDX edit that was never
            # regenerated changes nothing that ships.
            - name: Check data artifacts are not stale
              if: matrix.index == 0
              run: node packages/data/codegen/check-data-artifacts.mjs

            # Provision the rust toolchain before moon does. moon sets it up once
            # per cargo workspace root -- the root one and hardware/esp32c6-display,
            # which is excluded from the root members and carries its own manifest
            # -- and runs those setups concurrently. Both want the same targets,
            # and rustup takes no lock on ~/.rustup/downloads, so the two racing
            # processes write the same <hash>.partial and whichever loses the
            # rename dies with "component download failed". Doing it once here
            # leaves moon's calls as no-ops with nothing to download.
            #
            # The target list is read from .moon/toolchains.yml rather than
            # repeated here, for the same reason setup-moon reads its version from
            # .prototools: a copy would drift from what moon actually provisions.
            - name: Preinstall the rust toolchain
              if: env.NEEDS_RUST == 'true'
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  TARGETS="$(node tools/moon/rust-targets.mjs)"
                  if [ -n "$TARGETS" ]; then
                    echo "rustup target add $TARGETS"
                    rustup target add $TARGETS
                  fi

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # moon only schedules a toolchain install when a task declares that
            # toolchain, but syncing a project needs every toolchain the project
            # infers -- and the root project infers node and pnpm from the root
            # package.json while its own lint and test tasks are plain bash. Shard
            # 0 is the one that draws root:lint, so it alone reached the sync with
            # no node install ever scheduled and died on
            # `proto::locate::missing_executable`. `moon setup` provisions what
            # .moon/toolchains.yml declares, up front, for every shard.
            - name: Provision the moon toolchains
              run: moon setup

            # `moon run`, not `moon ci`. The targets moon ci takes are additive:
            # it runs every affected task carrying runInCI and then the named
            # ones on top, so `moon ci ':lint' ':test' ':typecheck' ':check'`
            # was also running the 60 `e2e` suites, 52 `container` builds and 26
            # `containerx-publish` tasks in the graph -- the last of those carry
            # `--cache-to=type=registry,ref=ghcr.io/...`, a registry write, on
            # every pull request. Run 34279599076 failed in `irc-e2e:e2e` for
            # want of a Playwright browser this runner never had (#17003).
            # Those lanes keep their own workflows, with the credentials and the
            # browsers they need.
            #
            # An explicit target list runs those tasks and their dependencies
            # and nothing else, so a task added later cannot join this lane by
            # defaulting to runInCI.
            #
            # Sharded round-robin over the sorted list rather than by
            # `moon ci --job`, which has no `moon run` counterpart. Deterministic
            # for a given plan, which is what matters -- a target must land on
            # exactly one shard.
            - name: Run the planned lint and test
              run: |
                  TARGETS="$(printf '%s\n' "$CI_TARGETS" | awk 'NF' | awk -v i=${{ matrix.index }} -v n=${{ matrix.total }} '(NR - 1) % n == i')"
                  if [ -z "$TARGETS" ]; then
                    echo "nothing planned for this shard"
                    exit 0
                  fi
                  echo "$TARGETS"
                  # shellcheck disable=SC2086
                  moon run $TARGETS

    # ci.yml runs on every push and pull request and was the only high-traffic
    # workflow with no failure tracker, so a broken dev sat unreported until
    # someone opened a pull request and read the log themselves. A stale proto
    # descriptor did exactly that for hours (#16963, #16965, #16968).
    #
    # dev, main and the merge queue only. On a pull request the failure is the
    # author's, it is already visible on the PR, and tracking it would open an
    # issue for every red branch. A ref test rather than an event test because
    # ci-atom.yml calls this workflow on a push to an atom-* branch, and an atom
    # branch breaking is not dev breaking -- it would land on the same issue.
    #
    # The matrix shards share one job_name deliberately: three shards of one
    # command are one signal, and a per-shard name would open three issues for
    # a single break and leave two of them behind when the work moves shards.
    #
    # `toolchains` is in needs for the reason #16972 documents: a job absent
    # from this list is invisible to `needs.*.result`, so its failure is
    # reported here as a success and closes the open issue. It also gates the
    # shards, so its failure skips them and leaves nothing else to notice.
    track:
        name: Track Failures
        if: ${{ always() && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
        needs: [toolchains, ci]
        permissions:
            actions: read
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI'
            job_name: 'ci'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
