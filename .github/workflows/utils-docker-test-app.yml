name: Docker App Test

on:
    workflow_call:
        inputs:
            project:
                required: true
                type: string
            runner:
                description: 'Runner label (default: ubuntu-latest)'
                required: false
                type: string
                default: 'ubuntu-latest'
            image:
                description: 'Docker image name (e.g. kbve/kbve). If set, pushes CI image to GHCR after e2e passes.'
                required: false
                type: string
                default: ''
            install_playwright:
                description: 'Force-install Playwright browsers regardless of detection (default: auto). Leave empty to auto-detect from source_path.'
                required: false
                type: string
                default: 'auto'
            source_path:
                description: 'Project source path (e.g. apps/cryptothrone). Used to auto-detect Playwright usage.'
                required: false
                type: string
                default: ''
            version_source:
                description: 'Path to MDX/JSON file with version field (for pre-build sync)'
                required: false
                type: string
                default: ''
            version_target:
                description: 'Path to Cargo.toml/package.json to write version into before build'
                required: false
                type: string
                default: ''
        secrets:
            FORGEJO_USER:
                required: false
            FORGEJO_TOKEN:
                required: false

jobs:
    test:
        name: Test ${{ inputs.project }} Docker App
        runs-on: ${{ inputs.runner }}
        timeout-minutes: 180
        permissions:
            contents: read
            packages: write

        steps:
            - name: Free disk space
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: true
                  dotnet: true
                  haskell: true
                  large-packages: false
                  swap-storage: false
                  docker-images: true

            - name: Disable flaky third-party apt sources
              # The GitHub runner ships packages.microsoft.com / azure-cli apt
              # sources that intermittently return 403 and break `apt-get update`
              # inside `playwright install-deps`. We don't need them — remove so
              # OS-dep installs stay resilient (recurring CI flake, #12373).
              run: |
                  sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                             /etc/apt/sources.list.d/azure-cli.list \
                             /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true

            - name: Checkout the monorepo
              uses: actions/checkout@v7
              continue-on-error: true

            - name: Detect Forgejo LFS assets
              id: lfs_detect
              run: |
                  SCOPE="${{ inputs.source_path }}"
                  if [ -n "$SCOPE" ] && git lfs ls-files -I "$SCOPE/**" 2>/dev/null | grep -q .; then
                    echo "uses_lfs=true" >> "$GITHUB_OUTPUT"
                    echo "Forgejo LFS assets present under $SCOPE"
                  else
                    echo "uses_lfs=false" >> "$GITHUB_OUTPUT"
                    echo "No LFS assets under '${SCOPE:-<unset>}' — skipping Forgejo credential setup"
                  fi

            - name: Pull per-game Forgejo LFS blobs
              if: ${{ steps.lfs_detect.outputs.uses_lfs == 'true' }}
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  LFS_SCOPE: ${{ inputs.source_path }}
              run: bash tools/lfs/scope.sh

            - name: Sync version from MDX to build manifest
              if: ${{ inputs.version_source != '' && inputs.version_target != '' }}
              run: |
                  SRC="${{ inputs.version_source }}"
                  TGT="${{ inputs.version_target }}"
                  case "$SRC" in
                    *.mdx) VER=$(sed -n 's/^version: *"\([^"]*\)"/\1/p' "$SRC" | head -1) ;;
                    *.json) VER=$(jq -r '.version // ""' "$SRC" 2>/dev/null) ;;
                    *) VER="" ;;
                  esac
                  if [ -n "$VER" ]; then
                    case "$TGT" in
                      *.json)   jq --arg v "$VER" '.version = $v' "$TGT" > "${TGT}.tmp" && mv "${TGT}.tmp" "$TGT" ;;
                      *.csproj) sed -i "s|<Version>[^<]*</Version>|<Version>${VER}</Version>|" "$TGT" ;;
                      *)        sh tools/release/set-toml-version.sh "$TGT" "$VER" ;;
                    esac
                    echo "Synced version ${VER} → ${TGT}"
                  fi

            # Installs buildx and provisions a docker-container builder that
            # doubles as the fallback if the persistent buildkitd is down.
            - name: Setup Docker Buildx
              uses: Wandalen/wretry.action@v3.8.0
              with:
                  action: docker/setup-buildx-action@v4
                  attempt_limit: 3
                  attempt_delay: 15000
                  with: |
                      driver: docker-container
                      driver-opts: |
                          image=moby/buildkit:v0.24.0
                          network=host

            # Prefer the persistent in-cluster buildkitd (warm .astro / cargo /
            # sccache-local / layer cache across runs). If it is unreachable
            # (not yet deployed, restarting), silently keep the docker-container
            # builder above so builds never break on the cutover.
            - name: Prefer persistent remote buildkitd
              run: |
                  REMOTE=tcp://buildkitd.arc-runners.svc.cluster.local:1234
                  if docker buildx create --name kbve-remote --driver remote "$REMOTE" 2>/dev/null \
                     && timeout 60 docker buildx inspect --bootstrap kbve-remote >/dev/null 2>&1; then
                      docker buildx use kbve-remote
                      echo "::notice::buildx using persistent remote buildkitd ($REMOTE)"
                  else
                      echo "::warning::remote buildkitd unreachable -> keeping docker-container builder"
                      docker buildx rm kbve-remote 2>/dev/null || true
                  fi

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js

            - name: Setup Playwright
              id: playwright
              uses: ./.github/actions/setup-playwright
              with:
                  enable: ${{ inputs.install_playwright }}
                  source-path: ${{ inputs.source_path }}

            # Rust-backed e2e projects boot their server via `cargo run` as a
            # playwright webServer. The agones crate's build script shells out to
            # protoc, which no runner image ships — arpg-e2e died here on every
            # weekly run since it was added. Non-Rust projects just skip it.
            - name: Install protoc
              run: |
                  if command -v protoc >/dev/null 2>&1; then
                    echo "protoc already present: $(protoc --version)"
                    exit 0
                  fi
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq \
                    && sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends protobuf-compiler \
                    && protoc --version \
                    || echo "::warning::protoc install failed; Rust e2e projects that need it will fail with a clear prost-build error"

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            - name: e2e ${{ inputs.project }}
              env:
                  BUILDKIT_PROGRESS: plain
                  INPUT_GITHUB_TOKEN: ${{ github.token }}
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ steps.playwright.outputs.enabled == 'true' && '1' || '' }}
              run: |
                  # A project with a CI-specific suite declares e2e-ci; the rest
                  # just have e2e. Under Nx this was `--configuration=ci`, which
                  # fell back to the default when a project had no such
                  # configuration -- moon has no configurations, so the fallback
                  # is spelled out.
                  TASK=e2e
                  if moon task "${{ inputs.project }}:e2e-ci" >/dev/null 2>&1; then
                    TASK=e2e-ci
                  fi
                  moon run "${{ inputs.project }}:$TASK"

            - name: Mark test passed
              if: success()
              run: echo "${{ inputs.project }}" > /tmp/test-result.txt

            - name: Upload test result marker
              if: success()
              uses: actions/upload-artifact@v7
              with:
                  name: test-passed-docker-${{ inputs.project }}
                  path: /tmp/test-result.txt
                  retention-days: 1

            # The e2e target is expected to build and `load` the image (see the
            # `container` dependsOn in each project.json). If it did not, the
            # tag below would fail with an opaque "No such image" and mask an
            # otherwise green test run — so check first and hand publish the
            # rebuild instead, which it already knows how to do.
            - name: Push CI image to GHCR
              if: success() && inputs.image != ''
              run: |
                  SHORT_SHA="${GITHUB_SHA::8}"
                  CI_TAG="ci-${SHORT_SHA}"
                  if ! docker image inspect "${{ inputs.image }}:latest" >/dev/null 2>&1; then
                    echo "::warning::${{ inputs.image }}:latest is not in the Docker daemon — the e2e target for '${{ inputs.project }}' never built it. Skipping the ci-${SHORT_SHA} promotion tag; publish will do a full rebuild. Add a dependsOn 'container' to that project's e2e target to restore fast promotion."
                    exit 0
                  fi
                  docker tag "${{ inputs.image }}:latest" "ghcr.io/${{ inputs.image }}:${CI_TAG}"
                  docker push "ghcr.io/${{ inputs.image }}:${CI_TAG}"
                  echo "Pushed ghcr.io/${{ inputs.image }}:${CI_TAG}"
