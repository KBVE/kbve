name: CI - Godot

run-name: 'CI - Godot / ${{ fromJSON(inputs.engine).app_name }}'

on:
    workflow_dispatch:
        inputs:
            key:
                description: 'Manifest key'
                required: true
                type: string
            dispatched_at:
                description: 'Unix timestamp when this was dispatched (queue guard)'
                required: true
                type: string
            engine:
                description: 'JSON engine config: app_name, project_path, version, build_targets, dotnet_enabled'
                required: true
                type: string
            version:
                description: 'JSON version config: source, toml, manifest'
                required: false
                type: string
                default: '{}'
            publish:
                description: 'JSON publish config: deploy_to_itch, itch_user, itch_game, itch_channel, notarize'
                required: false
                type: string
                default: '{}'

permissions: {}

jobs:
    queue_guard:
        name: Queue Guard
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - run: |
                  AGE=$(( $(date +%s) - ${{ inputs.dispatched_at }} ))
                  echo "godot/${{ fromJSON(inputs.engine).app_name }} queued ${AGE}s"
                  if [ "$AGE" -gt 7200 ]; then
                    echo "::error::Queue timeout: ${AGE}s > 2h"
                    exit 1
                  fi

    version_gate:
        name: Version Gate
        needs: [queue_guard]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            should_publish: ${{ steps.check.outputs.should_publish }}
            local_version: ${{ steps.check.outputs.local }}
            mac_presets: ${{ steps.split.outputs.mac }}
            other_presets: ${{ steps.split.outputs.other }}
        steps:
            - uses: actions/checkout@v7
            - name: Split macOS presets out of the build matrix
              id: split
              env:
                  TARGETS: ${{ toJSON(fromJSON(inputs.engine).build_targets) }}
              run: |
                  # macOS cannot be exported alongside the others: codesign and
                  # notarytool only exist on a Mac, and the shared export job runs in a
                  # Linux container. Expressions can't filter a matrix, so the split
                  # happens here and each build job consumes one half.
                  MAC=$(jq -c '[.[] | select(test("mac|osx"; "i"))]' <<<"$TARGETS")
                  OTHER=$(jq -c '[.[] | select((test("mac|osx"; "i")) | not)]' <<<"$TARGETS")
                  echo "mac=$MAC" >> "$GITHUB_OUTPUT"
                  echo "other=$OTHER" >> "$GITHUB_OUTPUT"
                  echo "::notice::macOS presets: $MAC — other presets: $OTHER"
            - id: check
              run: |
                  LOCAL="${{ fromJSON(inputs.version).manifest }}"
                  VTOML="${{ fromJSON(inputs.version).toml }}"
                  PUB="0.0.0"
                  if [ -n "$VTOML" ] && [ -f "$VTOML" ]; then
                    PUB=$(grep -m1 '^version' "$VTOML" | sed 's/version = "\(.*\)"/\1/' || echo "0.0.0")
                  fi
                  echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
                  if [ -z "$LOCAL" ] || [ "$LOCAL" = "0.0.0" ] || [ "$LOCAL" = "$PUB" ]; then
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No version bump (local=$LOCAL, published=$PUB) — publish skipped."
                  else
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::v$LOCAL > v$PUB — will publish."
                  fi

    test:
        name: Test (godot --headless)
        needs: [version_gate, gdextension]
        # `always()` so a project with no `engine.gdextension` (job skipped) still
        # tests. A suite that touches the extension's classes can't even parse
        # without the library, so the build is gated on it either way.
        if: ${{ always() && needs.version_gate.result == 'success' && needs.gdextension.result != 'failure' && needs.gdextension.result != 'cancelled' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            actions: read
        container:
            image: barichello/godot-ci:${{ fromJSON(inputs.engine).dotnet_enabled && 'mono-' || '' }}${{ fromJSON(inputs.engine).version }}
        steps:
            - uses: actions/checkout@v7
            - name: Pull LFS assets (Forgejo)
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # git-lfs first: the LFS-presence probe needs it, and the
                  # `:(attr:filter=lfs)` pathspec that used to answer this question
                  # silently returns nothing in a --filter=blob:none partial clone
                  # (no blobs, no attributes to match) — which skipped the pull and
                  # shipped a 132-byte pointer as the macOS dylib.
                  command -v git-lfs >/dev/null 2>&1 || {
                    apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq && apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends git-lfs
                  }
                  # actions/checkout writes its safe.directory entry under a HOME it
                  # then restores, so inside the container git doesn't trust the
                  # workspace and git-lfs exits 128 "Not in a Git repository".
                  git config --global --add safe.directory "$PWD"
                  git lfs install --local
                  if ! git lfs ls-files -n | grep -q "^$PROJECT_PATH/"; then
                    echo "::notice::No LFS-tracked files under $PROJECT_PATH — skipping"
                    exit 0
                  fi
                  if [ -z "$FORGEJO_USER" ] || [ -z "$FORGEJO_TOKEN" ]; then
                    echo "::error::FORGEJO_USER / FORGEJO_TOKEN missing — LFS assets would ship as pointer stubs"
                    exit 1
                  fi
                  printf 'machine git.kbve.com\nlogin %s\npassword %s\n' \
                    "$FORGEJO_USER" "$FORGEJO_TOKEN" > "$HOME/.netrc"
                  chmod 600 "$HOME/.netrc"
                  git lfs pull -I "$PROJECT_PATH/**"
                  # Assert the pull actually resolved: a leftover pointer is a text
                  # file starting with the LFS spec URL. Godot imports those as
                  # ERR_FILE_CORRUPT / refuses to load them, but the export itself
                  # still "succeeds", so nothing else catches it.
                  STUBS=$(git lfs ls-files -n | grep "^$PROJECT_PATH/" \
                    | xargs -r grep -l "^version https://git-lfs" 2>/dev/null | head -5)
                  if [ -n "$STUBS" ]; then
                    echo "::error::LFS pointers unresolved after pull:"
                    echo "$STUBS"
                    exit 1
                  fi
            - name: Download GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              uses: actions/download-artifact@v8
              with:
                  name: gdext-${{ fromJSON(inputs.engine).app_name }}-linux
                  path: gdext
            - name: Stage GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  ADDON_PATH: ${{ fromJSON(inputs.engine).gdextension.addon_path }}
              run: |
                  # Only the linux slot: this container is the only platform the
                  # test pass ever loads. Without it Godot can't register the
                  # extension's classes, and a suite that names one fails at parse
                  # time — "Identifier not declared", then a gdUnit4 crash (132),
                  # which reads like a broken test rather than a missing library.
                  mkdir -p "$PROJECT_PATH/$ADDON_PATH"
                  cp -R gdext/. "$PROJECT_PATH/$ADDON_PATH/"
                  find "$PROJECT_PATH/$ADDON_PATH" -type f -printf '%p\t%s bytes\n'
            - name: Install GDExtension runtime libraries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  ADDON_PATH: ${{ fromJSON(inputs.engine).gdextension.addon_path }}
              run: |
                  # The gdextension job installs webkit's -dev packages on its
                  # runner so the cdylib links, but this container is a different
                  # machine and ships neither. q's `client` feature pulls wry, which
                  # puts a hard DT_NEEDED on libwebkit2gtk-4.1.so.0 — so the .so we
                  # just staged dlopens to "cannot open shared object file", the
                  # extension's classes never register, and the suite dies at parse
                  # time with an unrelated-looking gdUnit4 crash.
                  # libfontconfig1 is cosmetic (kills the system-font error spam)
                  # but comes cheap alongside.
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends \
                    libwebkit2gtk-4.1-0 libfontconfig1
                  # Assert every soname resolves. Without this a future dependency
                  # regresses into the same signal-11 mystery rather than saying so.
                  MISSING=$(find "$PROJECT_PATH/$ADDON_PATH" -name '*.so' -exec ldd {} \; 2>/dev/null \
                    | awk '/not found/ {print $1}' | sort -u)
                  if [ -n "$MISSING" ]; then
                    echo "::error::Staged GDExtension libraries have unresolved sonames in this container:"
                    echo "$MISSING"
                    exit 1
                  fi
            - name: Run headless test pass
              env:
                  GODOT_BIN: godot
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # Prefer the project's own scripts/test.sh when present — it knows
                  # whether the suite is gdUnit4, GUT, or raw godot --quit-after.
                  # Falls back to a sanity --quit-after pass when no harness exists.
                  if [ -x scripts/test.sh ]; then
                    bash scripts/test.sh
                  elif [ -d tests ] || ls test_*.gd 2>/dev/null | head -1 > /dev/null; then
                    godot --headless --path . --quit-after 10
                  else
                    echo "::notice::No scripts/test.sh, tests/ dir, or test_*.gd files — skipping headless run"
                  fi

    gdextension:
        name: GDExtension (${{ matrix.slot }})
        needs: [version_gate]
        # `engine.gdextension` is optional — projects with no native extension skip
        # this whole job.
        if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - slot: linux
                      os: ubuntu-latest
                      dest: linux
                    - slot: windows
                      os: windows-latest
                      dest: windows
                    - slot: android
                      os: ubuntu-latest
                      dest: android/arm64
                      rust_target: aarch64-linux-android
                    # Two targets, lipo'd into one file: the macOS preset exports
                    # `universal`, so an arm64-only extension leaves Intel Macs unable
                    # to load it while the build itself still succeeds.
                    # The in-house MacBook Air rather than macos-latest: the hosted
                    # mac image is a shared 3-core M1, and this is the only slot that
                    # builds two targets, which made it the slowest of the four.
                    # Same label the Unreal mac jobs already use.
                    - slot: macos
                      os: [self-hosted, macOS, ARM64]
                      dest: macos
                      rust_target: aarch64-apple-darwin,x86_64-apple-darwin
        steps:
            - name: Permit colon paths in the index (Windows)
              if: matrix.slot == 'windows'
              run: git config --global core.protectNTFS false
              # git validates every index entry name before sparse rules get to
              # say the file won't be written, so the ':' names under
              # public/graphify/dir/ abort `git checkout` even when that directory
              # is excluded. Relaxing the check lets the index load; the sparse
              # list below still keeps those files off disk, so nothing illegal is
              # ever created. Scoped to this job's runner.
            - uses: actions/checkout@v7
              with:
                  # `apps/kbve/astro-kbve/public/graphify/dir/` holds generated
                  # files with ':' in the name (astro:components.json, node:fs.json,
                  # …). NTFS forbids ':', so a full checkout aborts with "invalid
                  # path" before cargo ever runs. Excluding just that directory
                  # doesn't work — git never descends into a directory a pattern
                  # already matched, so a negation under it is dead. Instead: cone
                  # checkout of only the cargo workspace dirs, which skips
                  # astro-kbve entirely. Root-level files (Cargo.toml/.lock) always
                  # come along. The guard below fails loudly if a new workspace
                  # member lands outside this list.
                  sparse-checkout: |
                      .github/signing
                      packages/rust
                      apps/kbve/kilobase
                      apps/kbve/axum-kbve
                      apps/kbve/kbve-gate
                      apps/kbve/isometric/src-tauri
                      apps/kbve/desktop-kbve/src-tauri
                      apps/herbmail/axum-herbmail
                      apps/memes/axum-memes
                      apps/irc/irc-gateway
                      apps/discordsh/axum-discordsh
                      apps/discordsh/discordsh-bot
                      apps/chuckrpg/axum-chuckrpg
                      apps/rentearth/axum-rentearth
                      apps/rareicon/axum-rareicon
                      apps/cryptothrone/axum-cryptothrone
                      apps/rows
                      apps/jobboard
                      apps/metrics
                      apps/vm
                      apps/mc/behavior_statetree
                      apps/mc/mc_auth
                      apps/agones/factorio/relay
                      apps/agones/palworld/relay
                      apps/agones/cryptothrone/server
                      apps/agones/arpg/server
                      apps/agones/herbmail/server
                      apps/agones/friendslop/server
                      apps/media/reel
            - name: Verify workspace members were checked out
              shell: bash
              run: |
                  # cargo parses every member manifest, so a member missing from the
                  # sparse list fails with a confusing manifest-not-found. Name it here.
                  MISSING=""
                  while read -r m; do
                    [ -f "$m/Cargo.toml" ] || MISSING="$MISSING $m"
                  done < <(sed -n '/^members = \[/,/^\]/p' Cargo.toml | grep -oE "['\"][^'\"]+/[^'\"]+['\"]" | tr -d "'\"")
                  if [ -n "$MISSING" ]; then
                    echo "::error::Workspace members absent from the sparse-checkout list in ci-godot.yml:$MISSING"
                    exit 1
                  fi
            - name: Install Linux build prerequisites
              if: matrix.slot == 'linux'
              timeout-minutes: 25
              run: |
                  set -euo pipefail
                  export DEBIAN_FRONTEND=noninteractive
                  # This step hung twice for the full job budget with no output at all.
                  # The dpkg lock was the wrong suspect: DPkg::Lock::Timeout changed
                  # nothing, and the stall is in the acquire stage, before a package is
                  # ever unpacked. ForceIPv4 is the lever that matters — the hosted
                  # runners resolve azure.archive.ubuntu.com to an AAAA record that
                  # sometimes completes a TCP handshake and then delivers nothing, and
                  # apt has no overall deadline of its own, so it waits forever.
                  #
                  # `timeout` is the belt to that braces: whatever the next silent
                  # network fault turns out to be, apt gets killed and retried instead
                  # of holding the runner. No -qq any more either, because a stalled
                  # run that prints nothing is a run nobody can diagnose.
                  APT=(sudo apt-get
                       -o Acquire::ForceIPv4=true
                       -o Acquire::http::Timeout=30
                       -o Acquire::https::Timeout=30
                       -o Acquire::Retries=3
                       -o DPkg::Lock::Timeout=120)
                  for i in 1 2 3; do
                    if timeout 180 "${APT[@]}" update \
                       && timeout 420 "${APT[@]}" install -y --no-install-recommends \
                            build-essential pkg-config \
                            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
                            libjavascriptcoregtk-4.1-dev; then
                      exit 0
                    fi
                    echo "::warning::apt attempt $i stalled or failed; retrying"
                    sleep $((i * 15))
                  done
                  echo "::error::apt could not install the linux build prerequisites in 3 attempts"
                  exit 1
            - name: Setup Rust (stable)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}
            - name: Assert every target's std is really on disk
              if: matrix.rust_target != ''
              shell: bash
              env:
                  RUST_TARGET: ${{ matrix.rust_target }}
              run: |
                  set -euo pipefail
                  # rustup's own answer is not evidence. On the self-hosted mac it
                  # reported "component rust-std for target x86_64-apple-darwin is up
                  # to date" and rustc then failed with E0463 "can't find crate for
                  # `core`" — the manifest listed a component whose files were not
                  # there. A hosted runner starts clean every time and cannot get into
                  # that state; a persistent one can, and stays there until something
                  # notices. So ask rustc where the target's libdir is and look.
                  IFS=',' read -ra TARGETS <<< "$RUST_TARGET"
                  for T in "${TARGETS[@]}"; do
                    LIBDIR=$(rustc --print target-libdir --target "$T")
                    if [ ! -d "$LIBDIR" ]; then
                      echo "::warning::rust-std for $T is registered but missing from $LIBDIR — reinstalling"
                      # remove-then-add, because `rustup component add` alone is a
                      # no-op against exactly the stale metadata that caused this.
                      rustup component remove rust-std --target "$T" 2>/dev/null || true
                      rustup component add rust-std --target "$T"
                    fi
                    LIBDIR=$(rustc --print target-libdir --target "$T")
                    if [ ! -d "$LIBDIR" ]; then
                      echo "::error::rust-std for $T is still absent from $LIBDIR after reinstalling"
                      exit 1
                    fi
                    echo "$T: $(find "$LIBDIR" -maxdepth 1 -name 'libcore-*.rlib' | head -1)"
                  done
            - name: Point cargo at the Android NDK linker
              if: matrix.slot == 'android'
              run: |
                  # The runner image ships an NDK; take the newest one rather than
                  # pinning a revision that ages out of the image.
                  NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
                  BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
                  CLANG="$BIN/aarch64-linux-android24-clang"
                  test -x "$CLANG" || { echo "::error::No aarch64 clang wrapper under $NDK"; exit 1; }
                  # NDK r23+ ships only llvm-ar; cc-rs otherwise probes for the
                  # long-gone aarch64-linux-android-ar and fails ring's build script.
                  AR="$BIN/llvm-ar"
                  test -x "$AR" || { echo "::error::No llvm-ar under $NDK"; exit 1; }
                  echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
                  echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
                  echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
                  echo "AR_aarch64_linux_android=$AR" >> "$GITHUB_ENV"
                  echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib" >> "$GITHUB_ENV"
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  key: gdext-${{ matrix.slot }}
                  cache-on-failure: true
            - name: Build cdylib
              shell: bash
              env:
                  PKG: ${{ fromJSON(inputs.engine).gdextension.package }}
                  RUST_TARGET: ${{ matrix.rust_target }}
                  FEATURES: ${{ join(fromJSON(inputs.engine).features, ',') }}
              run: |
                  echo "::notice::Building $PKG with features: ${FEATURES:-<default>}"
                  if [ -z "$RUST_TARGET" ]; then
                    cargo build --release -p "$PKG" ${FEATURES:+--features "$FEATURES"}
                  else
                    # Comma-separated because macOS needs both architectures to lipo a
                    # universal dylib; every other slot names a single target or none.
                    IFS=',' read -ra TARGETS <<< "$RUST_TARGET"
                    for T in "${TARGETS[@]}"; do
                      echo "::group::cargo build --target $T"
                      cargo build --release -p "$PKG" --target "$T" ${FEATURES:+--features "$FEATURES"}
                      echo "::endgroup::"
                    done
                  fi
            - name: Stage artefact
              shell: bash
              env:
                  PKG: ${{ fromJSON(inputs.engine).gdextension.package }}
                  RUST_TARGET: ${{ matrix.rust_target }}
                  DEST: ${{ matrix.dest }}
              run: |
                  LIB=$(echo "$PKG" | tr '-' '_')
                  case "${{ matrix.slot }}" in
                    windows) NAME="${LIB}.dll" ;;
                    macos)   NAME="lib${LIB}.dylib" ;;
                    *)       NAME="lib${LIB}.so" ;;
                  esac
                  # Root .cargo/config.toml redirects target-dir to dist/target, but
                  # the cone sparse-checkout only pulls root-level files, not the
                  # .cargo/ directory — so which one exists depends on the checkout.
                  # Look in both instead of betting on it.
                  find_slice() {
                    local sub="$1" base
                    for base in target dist/target; do
                      if [ -f "$base/$sub" ]; then echo "$base/$sub"; return 0; fi
                    done
                    return 1
                  }
                  # Staged under its addon-relative path so the export job can copy
                  # the tree straight in — android nests one level deeper than the
                  # desktop slots.
                  mkdir -p "stage/$DEST"
                  if [ -z "$RUST_TARGET" ]; then
                    SRC=$(find_slice "release/$NAME") \
                      || { echo "::error::Built library not found at */release/$NAME"; exit 1; }
                    cp "$SRC" "stage/$DEST/$NAME"
                  else
                    IFS=',' read -ra TARGETS <<< "$RUST_TARGET"
                    SLICES=()
                    for T in "${TARGETS[@]}"; do
                      S=$(find_slice "$T/release/$NAME") \
                        || { echo "::error::Built library not found at */$T/release/$NAME"; exit 1; }
                      SLICES+=("$S")
                    done
                    if [ "${#SLICES[@]}" -gt 1 ]; then
                      lipo -create "${SLICES[@]}" -output "stage/$DEST/$NAME"
                      lipo -info "stage/$DEST/$NAME"
                    else
                      cp "${SLICES[0]}" "stage/$DEST/$NAME"
                    fi
                  fi
                  # `find -printf` is GNU-only and this step also runs on macOS.
                  find stage -type f -exec ls -l {} +
            - name: Ad-hoc sign the dylib
              if: matrix.slot == 'macos'
              env:
                  DEST: ${{ matrix.dest }}
                  PKG: ${{ fromJSON(inputs.engine).gdextension.package }}
              run: |
                  # cargo's linker-signed signature is rejected by dyld on Apple
                  # Silicon, and lipo invalidates whatever was there anyway. This is
                  # only enough to make the artefact runnable by hand — the export job
                  # re-signs with Developer ID when notarizing.
                  LIB=$(echo "$PKG" | tr '-' '_')
                  bash .github/signing/sign-macos-binary.sh "stage/$DEST/lib${LIB}.dylib"
            - name: Upload artefact
              uses: actions/upload-artifact@v7
              with:
                  name: gdext-${{ fromJSON(inputs.engine).app_name }}-${{ matrix.slot }}
                  path: stage
                  if-no-files-found: error

    build:
        name: Build (${{ matrix.preset }})
        needs: [version_gate, test, gdextension]
        # `always()` so a project with no `engine.gdextension` (job skipped) still builds.
        # macOS presets are excluded here and handled by `build_macos` — signing and
        # notarizing need a Mac, and this job is a Linux container.
        if: ${{ always() && needs.test.result == 'success' && needs.gdextension.result != 'failure' && needs.gdextension.result != 'cancelled' && join(fromJSON(needs.version_gate.outputs.other_presets)) != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            actions: read
        container:
            image: barichello/godot-ci:${{ fromJSON(inputs.engine).dotnet_enabled && 'mono-' || '' }}${{ fromJSON(inputs.engine).version }}
        strategy:
            fail-fast: false
            matrix:
                preset: ${{ fromJSON(needs.version_gate.outputs.other_presets) }}
        steps:
            - uses: actions/checkout@v7
            - name: Pull LFS assets (Forgejo)
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # git-lfs first: the LFS-presence probe needs it, and the
                  # `:(attr:filter=lfs)` pathspec that used to answer this question
                  # silently returns nothing in a --filter=blob:none partial clone
                  # (no blobs, no attributes to match) — which skipped the pull and
                  # shipped a 132-byte pointer as the macOS dylib.
                  command -v git-lfs >/dev/null 2>&1 || {
                    apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq && apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends git-lfs
                  }
                  # actions/checkout writes its safe.directory entry under a HOME it
                  # then restores, so inside the container git doesn't trust the
                  # workspace and git-lfs exits 128 "Not in a Git repository".
                  git config --global --add safe.directory "$PWD"
                  git lfs install --local
                  if ! git lfs ls-files -n | grep -q "^$PROJECT_PATH/"; then
                    echo "::notice::No LFS-tracked files under $PROJECT_PATH — skipping"
                    exit 0
                  fi
                  if [ -z "$FORGEJO_USER" ] || [ -z "$FORGEJO_TOKEN" ]; then
                    echo "::error::FORGEJO_USER / FORGEJO_TOKEN missing — LFS assets would ship as pointer stubs"
                    exit 1
                  fi
                  printf 'machine git.kbve.com\nlogin %s\npassword %s\n' \
                    "$FORGEJO_USER" "$FORGEJO_TOKEN" > "$HOME/.netrc"
                  chmod 600 "$HOME/.netrc"
                  git lfs pull -I "$PROJECT_PATH/**"
                  # Assert the pull actually resolved: a leftover pointer is a text
                  # file starting with the LFS spec URL. Godot imports those as
                  # ERR_FILE_CORRUPT / refuses to load them, but the export itself
                  # still "succeeds", so nothing else catches it.
                  STUBS=$(git lfs ls-files -n | grep "^$PROJECT_PATH/" \
                    | xargs -r grep -l "^version https://git-lfs" 2>/dev/null | head -5)
                  if [ -n "$STUBS" ]; then
                    echo "::error::LFS pointers unresolved after pull:"
                    echo "$STUBS"
                    exit 1
                  fi
            - name: Download GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              uses: actions/download-artifact@v8
              with:
                  pattern: gdext-${{ fromJSON(inputs.engine).app_name }}-*
                  path: gdext
            - name: Stage GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  ADDON_PATH: ${{ fromJSON(inputs.engine).gdextension.addon_path }}
                  APP: ${{ fromJSON(inputs.engine).app_name }}
              run: |
                  # The .gdextension manifest lists a per-platform path and the exporter
                  # hard-fails when one is missing, so every preset in build_targets needs
                  # its lib present even though a single container drives all the exports.
                  # Each artefact already carries its addon-relative directory, so copy
                  # the tree rather than re-deriving the layout here.
                  mkdir -p "$PROJECT_PATH/$ADDON_PATH"
                  for SRC in gdext/gdext-"${APP}"-*; do
                    [ -d "$SRC" ] || continue
                    cp -R "$SRC"/. "$PROJECT_PATH/$ADDON_PATH/"
                  done
                  find "$PROJECT_PATH/$ADDON_PATH" -type f -printf '%p\t%s bytes\n'
            - name: Stamp the build version into the project
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  VERSION: ${{ needs.version_gate.outputs.local_version }}
              run: |
                  # The client has no other way to know what it is. version.toml is the
                  # PREVIOUSLY published version until the post-publish sync runs, so
                  # reading that at runtime would show every build as the one before it.
                  # Stamped here instead, from the manifest the gate already resolved,
                  # and left absent everywhere else so an unstamped build says "dev"
                  # rather than confidently quoting a stale number.
                  [ -n "$VERSION" ] || { echo "::notice::No version to stamp."; exit 0; }
                  GODOT_CFG="$PROJECT_PATH/project.godot"
                  # awk, not python3: barichello/godot-ci carries neither python3
                  # nor python, so this stamped nothing and exited 127 on the two
                  # jobs that run in it. macOS kept passing because its runner
                  # happens to ship one, which is why the break looked partial.
                  #
                  # Two passes over the same file, because whether to replace a
                  # line or insert one is settled by a key that may appear after
                  # the anchor: a single pass would have to commit to inserting
                  # before it knew there was already a version further down.
                  awk -v ver="$VERSION" '
                    NR == FNR { if ($0 ~ /^config\/version=/) found = 1; next }
                    $0 ~ /^config\/version=/ { print "config/version=\"" ver "\""; next }
                    { print }
                    !found && !placed && $0 ~ /^config\/name=/ { print "config/version=\"" ver "\""; placed = 1 }
                  ' "$GODOT_CFG" "$GODOT_CFG" > "$GODOT_CFG.stamped"
                  mv "$GODOT_CFG.stamped" "$GODOT_CFG"
                  # Anchored, and the last word: a project with neither key leaves
                  # awk with nowhere to write, and this is what turns that from an
                  # unstamped build into a failed one.
                  grep -n '^config/version=' "$GODOT_CFG"
            - name: Stage export templates
              run: |
                  mkdir -p ~/.local/share/godot/export_templates
                  if [ -d "/root/.local/share/godot/export_templates" ]; then
                    cp -r /root/.local/share/godot/export_templates/* \
                          ~/.local/share/godot/export_templates/ 2>/dev/null || true
                  fi
            - name: Sanitize preset name for path
              id: san
              run: |
                  CLEAN=$(echo '${{ matrix.preset }}' | tr '/' '-' | tr ' ' '-')
                  echo "name=$CLEAN" >> "$GITHUB_OUTPUT"
            - name: Install software Vulkan for the shader baker
              # The shader baker only runs when a RenderingDevice exists, and
              # `--headless` never makes one, so an export that looks fine bakes
              # nothing and ships a build that compiles ~100 shaders on the
              # player's first launch. lavapipe is Mesa's CPU Vulkan driver — the
              # runners have no GPU and do not need one; the baking itself is
              # CPU work either way. xvfb supplies the X display the x11 driver
              # opens. Texture import wants the same device: Godot compresses
              # VRAM textures on the RenderingDevice, so a headless import
              # silently skips them.
              continue-on-error: true
              run: |
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends \
                    mesa-vulkan-drivers xvfb libfontconfig1 libxcursor1 \
                    libxinerama1 libxrandr2 libxi6 libxext6 libx11-6 libgl1 libxkbcommon0
            - name: Import project
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # Both steps fall back to headless rather than failing: without
                  # the device the build is exactly what it was before the baker
                  # was switched on, which is worth more than a red pipeline.
                  xvfb-run -a -s "-screen 0 1280x720x24" \
                    godot --display-driver x11 --rendering-driver vulkan --import \
                    || godot --headless --import \
                    || true
            - name: Export
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              env:
                  APP: ${{ fromJSON(inputs.engine).app_name }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  # Several exporters pick their output writer off the file
                  # extension and refuse an extensionless path ("Invalid export
                  # format" on macOS, which only takes .app/.zip/.dmg). Web wants
                  # the entry page. Linux is the one platform happy bare.
                  CASE=$(echo '${{ matrix.preset }}' | tr '[:upper:]' '[:lower:]')
                  # iOS before mac: "iOS" contains no 'mac', but keep the order
                  # explicit so a future "macOS iOS Universal"-style preset name
                  # can't fall into the wrong arm.
                  case "$CASE" in
                    *ios*)           OUT="$APP.ipa" ;;
                    *mac*|*osx*)     OUT="$APP.zip" ;;
                    *win*)           OUT="$APP.exe" ;;
                    *web*|*html*)    OUT="index.html" ;;
                    *android*)       OUT="$APP.apk" ;;
                    *)               OUT="$APP" ;;
                  esac
                  mkdir -p "build/$DIR"
                  # Try the device-backed export first so the shader baker has
                  # something to bake into, then fall back. Keyed on the artefact
                  # existing rather than the exit code: a partial export that
                  # left no file still has to reach the headless path.
                  if xvfb-run -a -s "-screen 0 1280x720x24" \
                       godot --display-driver x11 --rendering-driver vulkan \
                       --export-release "${{ matrix.preset }}" "build/$DIR/$OUT" \
                     && [ -s "build/$DIR/$OUT" ]; then
                    echo "::notice::${{ matrix.preset }} exported with a RenderingDevice (shader baker active)"
                  else
                    echo "::warning::${{ matrix.preset }} fell back to a headless export — shaders are NOT baked and first launch will compile them"
                    rm -rf "build/$DIR"
                    mkdir -p "build/$DIR"
                    godot --headless --export-release "${{ matrix.preset }}" "build/$DIR/$OUT"
                  fi
            - name: Upload artefact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ fromJSON(inputs.engine).app_name }}-${{ steps.san.outputs.name }}
                  path: ${{ fromJSON(inputs.engine).project_path }}/build/${{ steps.san.outputs.name }}
                  if-no-files-found: error

    build_macos:
        name: Build (${{ matrix.preset }})
        needs: [version_gate, test, gdextension]
        # Same gate as `build`, over the other half of the preset split. This job exists
        # only because `codesign`, `notarytool` and `stapler` are Mac-only tools, so the
        # Linux export container can produce a macOS .app but can never make it one
        # Gatekeeper will open.
        if: ${{ always() && needs.test.result == 'success' && needs.gdextension.result != 'failure' && needs.gdextension.result != 'cancelled' && join(fromJSON(needs.version_gate.outputs.mac_presets)) != '' }}
        # The in-house MacBook Air. This job was the longest in the workflow at
        # 16-23 minutes, essentially all of it inside Godot's import and export,
        # and a shared 3-core hosted VM is the reason: the same project exports on
        # the Linux container in 7-8 minutes total. A persistent runner also lets
        # the import cache and the editor install survive between runs. Only
        # workflow_dispatch triggers this workflow, which needs write access to
        # the repo, so no fork can reach the runner.
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 90
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                preset: ${{ fromJSON(needs.version_gate.outputs.mac_presets) }}
        steps:
            - uses: actions/checkout@v7
            - name: Pull LFS assets (Forgejo)
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # Same contract as the Linux export job: a leftover pointer imports as
                  # ERR_FILE_CORRUPT while the export still "succeeds", so the pull is
                  # asserted rather than assumed. git-lfs ships on the macOS runner.
                  git lfs install --local
                  if ! git lfs ls-files -n | grep -q "^$PROJECT_PATH/"; then
                    echo "::notice::No LFS-tracked files under $PROJECT_PATH — skipping"
                    exit 0
                  fi
                  if [ -z "$FORGEJO_USER" ] || [ -z "$FORGEJO_TOKEN" ]; then
                    echo "::error::FORGEJO_USER / FORGEJO_TOKEN missing — LFS assets would ship as pointer stubs"
                    exit 1
                  fi
                  printf 'machine git.kbve.com\nlogin %s\npassword %s\n' \
                    "$FORGEJO_USER" "$FORGEJO_TOKEN" > "$HOME/.netrc"
                  chmod 600 "$HOME/.netrc"
                  git lfs pull -I "$PROJECT_PATH/**"
                  STUBS=$(git lfs ls-files -n | grep "^$PROJECT_PATH/" \
                    | xargs -r grep -l "^version https://git-lfs" 2>/dev/null | head -5)
                  if [ -n "$STUBS" ]; then
                    echo "::error::LFS pointers unresolved after pull:"
                    echo "$STUBS"
                    exit 1
                  fi
            - name: Download GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              uses: actions/download-artifact@v8
              with:
                  pattern: gdext-${{ fromJSON(inputs.engine).app_name }}-*
                  path: gdext
            - name: Stage GDExtension binaries
              if: ${{ fromJSON(inputs.engine).gdextension.package != '' }}
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  ADDON_PATH: ${{ fromJSON(inputs.engine).gdextension.addon_path }}
                  APP: ${{ fromJSON(inputs.engine).app_name }}
              run: |
                  # Every platform's lib, not just this one: the .gdextension manifest
                  # lists a path per platform and the exporter hard-fails on any that is
                  # missing, whichever preset is being exported.
                  mkdir -p "$PROJECT_PATH/$ADDON_PATH"
                  for SRC in gdext/gdext-"${APP}"-*; do
                    [ -d "$SRC" ] || continue
                    cp -R "$SRC"/. "$PROJECT_PATH/$ADDON_PATH/"
                  done
                  find "$PROJECT_PATH/$ADDON_PATH" -type f -exec ls -l {} +
            - name: Stamp the build version into the project
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  VERSION: ${{ needs.version_gate.outputs.local_version }}
              run: |
                  # The client has no other way to know what it is. version.toml is the
                  # PREVIOUSLY published version until the post-publish sync runs, so
                  # reading that at runtime would show every build as the one before it.
                  # Stamped here instead, from the manifest the gate already resolved,
                  # and left absent everywhere else so an unstamped build says "dev"
                  # rather than confidently quoting a stale number.
                  [ -n "$VERSION" ] || { echo "::notice::No version to stamp."; exit 0; }
                  GODOT_CFG="$PROJECT_PATH/project.godot"
                  # awk, not python3: barichello/godot-ci carries neither python3
                  # nor python, so this stamped nothing and exited 127 on the two
                  # jobs that run in it. macOS kept passing because its runner
                  # happens to ship one, which is why the break looked partial.
                  #
                  # Two passes over the same file, because whether to replace a
                  # line or insert one is settled by a key that may appear after
                  # the anchor: a single pass would have to commit to inserting
                  # before it knew there was already a version further down.
                  awk -v ver="$VERSION" '
                    NR == FNR { if ($0 ~ /^config\/version=/) found = 1; next }
                    $0 ~ /^config\/version=/ { print "config/version=\"" ver "\""; next }
                    { print }
                    !found && !placed && $0 ~ /^config\/name=/ { print "config/version=\"" ver "\""; placed = 1 }
                  ' "$GODOT_CFG" "$GODOT_CFG" > "$GODOT_CFG.stamped"
                  mv "$GODOT_CFG.stamped" "$GODOT_CFG"
                  # Anchored, and the last word: a project with neither key leaves
                  # awk with nowhere to write, and this is what turns that from an
                  # unstamped build into a failed one.
                  grep -n '^config/version=' "$GODOT_CFG"
            - name: Install Godot and export templates
              id: godot
              env:
                  VER: ${{ fromJSON(inputs.engine).version }}
                  MONO: ${{ fromJSON(inputs.engine).dotnet_enabled && '_mono' || '' }}
              run: |
                  set -euo pipefail
                  # There is no barichello/godot-ci equivalent to run as a container on a
                  # Mac runner, so the editor and its templates are fetched directly.
                  # Both land under $HOME rather than $RUNNER_TEMP, which the runner
                  # wipes between jobs: this is a persistent machine, so a version it
                  # has already fetched is simply there on the next run.
                  BASE="https://github.com/godotengine/godot/releases/download/${VER}-stable"
                  GODOT_DIR="$HOME/.cache/godot-ci/${VER}-stable${MONO}"
                  if [ ! -d "$GODOT_DIR" ]; then
                    curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
                      "$BASE/Godot_v${VER}-stable${MONO}_macos.universal.zip"
                    # Unpacked beside the destination and moved into place, so an
                    # interrupted run cannot leave a half-extracted editor that the
                    # next run then trusts because the directory exists.
                    rm -rf "$GODOT_DIR.partial"
                    mkdir -p "$GODOT_DIR.partial"
                    unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_DIR.partial"
                    mkdir -p "$(dirname "$GODOT_DIR")"
                    mv "$GODOT_DIR.partial" "$GODOT_DIR"
                  else
                    echo "::notice::Reusing the cached Godot $VER editor at $GODOT_DIR"
                  fi
                  BIN=$(find "$GODOT_DIR" -type f -path '*/Contents/MacOS/*' | head -1)
                  test -n "$BIN" || { echo "::error::No Godot binary in the macOS archive"; exit 1; }
                  chmod +x "$BIN"
                  echo "bin=$BIN" >> "$GITHUB_OUTPUT"

                  DEST="$HOME/Library/Application Support/Godot/export_templates/${VER}.stable${MONO:+.mono}"
                  # `ls -A`, not just -d: an aborted extraction leaves the directory
                  # behind, and an empty template dir fails the export much later with
                  # a message about the preset rather than about the templates.
                  if [ -z "$(ls -A "$DEST" 2>/dev/null)" ]; then
                    curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
                      "$BASE/Godot_v${VER}-stable${MONO}_export_templates.tpz"
                    unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
                    mkdir -p "$DEST"
                    mv "$RUNNER_TEMP/tpl/templates/"* "$DEST/"
                  else
                    echo "::notice::Reusing the cached export templates in $DEST"
                  fi
                  echo "::notice::Godot $VER at $BIN, templates in $DEST"
            - name: Sanitize preset name for path
              id: san
              run: echo "name=$(echo '${{ matrix.preset }}' | tr '/' '-' | tr ' ' '-')" >> "$GITHUB_OUTPUT"
            - name: Restore the import cache
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              env:
                  APP: ${{ fromJSON(inputs.engine).app_name }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  set -euo pipefail
                  # `.godot/` is gitignored, so actions/checkout's clean deletes it and
                  # every run re-imported the whole project cold — 7.6 minutes of the 23
                  # this job used to take. Kept outside the workspace instead, where the
                  # clean cannot reach it. Staleness is Godot's problem, not ours: it
                  # writes an .md5 beside each imported asset and re-imports anything
                  # whose source changed, so an out-of-date cache costs time, never
                  # correctness. Keyed per preset because nothing serialises two presets
                  # of one app if this machine ever hosts two runners.
                  SRC="$HOME/.cache/godot-import/${APP}-${DIR}"
                  if [ -d "$SRC" ]; then
                    mkdir -p .godot
                    rsync -a "$SRC/" .godot/
                    echo "::notice::Import cache restored from $SRC ($(du -sh "$SRC" | cut -f1))"
                  else
                    echo "::notice::No import cache at $SRC — this run imports cold"
                  fi
            - name: Import project
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # Texture compression and the shader baker both want a RenderingDevice,
                  # and --headless never makes one. Metal first, headless as the fallback
                  # that still produces a build.
                  "${{ steps.godot.outputs.bin }}" --rendering-driver metal --path . --import \
                    || "${{ steps.godot.outputs.bin }}" --headless --path . --import \
                    || true
            - name: Export .app
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              env:
                  APP: ${{ fromJSON(inputs.engine).app_name }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  # A bundle, not a .zip: the whole point of this job is to codesign what
                  # comes out, and a zip cannot be signed or stapled.
                  mkdir -p "build/$DIR"
                  OUT="build/$DIR/$APP.app"
                  if "${{ steps.godot.outputs.bin }}" --rendering-driver metal \
                       --export-release "${{ matrix.preset }}" "$OUT" \
                     && [ -d "$OUT" ]; then
                    echo "::notice::${{ matrix.preset }} exported with a RenderingDevice (shader baker active)"
                  else
                    echo "::warning::${{ matrix.preset }} fell back to a headless export — shaders are NOT baked and first launch will compile them"
                    rm -rf "$OUT"
                    "${{ steps.godot.outputs.bin }}" --headless \
                      --export-release "${{ matrix.preset }}" "$OUT"
                  fi
                  test -d "$OUT" || { echo "::error::No .app produced at $OUT"; exit 1; }
            - name: Save the import cache
              if: always()
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              env:
                  APP: ${{ fromJSON(inputs.engine).app_name }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  set -euo pipefail
                  # `always()`, because a run that imported and then failed to export
                  # still did the expensive half, and throwing that away would make
                  # every retry after a bad export pay the cold-import cost again.
                  [ -d .godot ] || exit 0
                  DEST="$HOME/.cache/godot-import/${APP}-${DIR}"
                  mkdir -p "$DEST"
                  rsync -a --delete .godot/ "$DEST/"
                  echo "::notice::Import cache saved to $DEST ($(du -sh "$DEST" | cut -f1))"
            - name: Sign and notarize
              if: ${{ fromJSON(inputs.publish).notarize }}
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  set -euo pipefail
                  if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
                    echo "::error::notarize is on but APPLE_* secrets are missing"
                    exit 1
                  fi
                  APP=$(find "$PROJECT_PATH/build/$DIR" -maxdepth 1 -name '*.app' | head -1)
                  [ -n "$APP" ] || { echo "::error::no .app to sign"; exit 1; }

                  KEYCHAIN="${RUNNER_TEMP}/godot-signing.keychain-db"
                  KCPASS=$(uuidgen)
                  security create-keychain -p "${KCPASS}" "${KEYCHAIN}"
                  security set-keychain-settings -lut 21600 "${KEYCHAIN}"
                  security unlock-keychain -p "${KCPASS}" "${KEYCHAIN}"
                  printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
                  security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KCPASS}" "${KEYCHAIN}" >/dev/null
                  ORIG_KEYCHAINS=$(security list-keychains -d user | sed -e 's/"//g' -e 's/^ *//')
                  # Unquoted on purpose: the original list is several paths and each has
                  # to arrive as its own argument, or the search list collapses to one
                  # bogus entry and codesign stops finding the system roots.
                  # shellcheck disable=SC2086
                  security list-keychains -d user -s "${KEYCHAIN}" ${ORIG_KEYCHAINS}
                  cleanup() {
                    # The search list is restored, not just abandoned: this runner is a
                    # real machine that keeps its user keychain list between jobs, so a
                    # run that ended without putting it back would leave every later
                    # codesign on the box pointing at a keychain that no longer exists.
                    # shellcheck disable=SC2086
                    security list-keychains -d user -s ${ORIG_KEYCHAINS} 2>/dev/null || true
                    security delete-keychain "${KEYCHAIN}" 2>/dev/null || true
                    rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/notarize.zip" 2>/dev/null || true
                  }
                  trap cleanup EXIT

                  ENT="${GITHUB_WORKSPACE}/.github/signing/godot-mac-entitlements.plist"
                  # Inside-out, never --deep: Apple deprecated --deep and it silently
                  # mis-signs nested code, which notarization then rejects in a log that
                  # does not name the cause. The GDExtension dylib is the nested code
                  # that matters here — signing it with the same identity as the bundle
                  # is what satisfies library validation at launch.
                  # A read loop rather than xargs: BSD xargs has no --no-run-if-empty, so
                  # an empty find result would invoke codesign with no path.
                  NESTED=0
                  while IFS= read -r -d '' LIB; do
                    codesign --force --timestamp --options runtime \
                      -s "${APPLE_SIGNING_IDENTITY}" --keychain "${KEYCHAIN}" "$LIB"
                    NESTED=$((NESTED + 1))
                  done < <(find "${APP}" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
                  echo "::notice::signed ${NESTED} nested libraries"
                  codesign --force --timestamp --options runtime --entitlements "${ENT}" \
                    -s "${APPLE_SIGNING_IDENTITY}" --keychain "${KEYCHAIN}" "${APP}"
                  codesign --verify --strict --verbose=2 "${APP}"

                  ditto -c -k --keepParent "${APP}" "${RUNNER_TEMP}/notarize.zip"
                  xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
                    --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" \
                    --team-id "${APPLE_TEAM_ID}" --wait
                  # Staple the bundle, not the zip — the zip was only the transport.
                  xcrun stapler staple "${APP}"
                  xcrun stapler validate "${APP}"
                  echo "::notice::Signed + notarized $(basename "${APP}")"
            - name: Package
              env:
                  PROJECT_PATH: ${{ fromJSON(inputs.engine).project_path }}
                  APP_NAME: ${{ fromJSON(inputs.engine).app_name }}
                  DIR: ${{ steps.san.outputs.name }}
              run: |
                  set -euo pipefail
                  APP=$(find "$PROJECT_PATH/build/$DIR" -maxdepth 1 -name '*.app' | head -1)
                  [ -n "$APP" ] || { echo "::error::no .app to package"; exit 1; }
                  # ditto, not zip: the artifact upload/download round trip drops symlinks
                  # and the executable bit, which would leave an unlaunchable bundle even
                  # though every earlier step passed. A ditto archive survives it, and is
                  # also the shape the notarization submission wanted.
                  # Staged outside the project: anything left under the Godot project
                  # root gets picked up by the next --import.
                  mkdir -p "$RUNNER_TEMP/artifact"
                  ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/artifact/$APP_NAME.zip"
                  ls -l "$RUNNER_TEMP/artifact"
            - name: Upload artefact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ fromJSON(inputs.engine).app_name }}-${{ steps.san.outputs.name }}
                  path: ${{ runner.temp }}/artifact
                  if-no-files-found: error
            - name: Wipe Forgejo netrc
              if: always()
              # The LFS step writes the Forgejo token to $HOME/.netrc, which was
              # discarded with the VM on a hosted runner and now outlives the job on
              # a real machine. Same wipe ci-unity already does for the same reason.
              run: rm -f "$HOME/.netrc"

    itch:
        name: Itch.io Publish
        needs: [version_gate, build, build_macos]
        # `always()` because the preset split leaves one of the two build jobs skipped
        # whenever a project targets only macOS or only the others, and a skipped need
        # would otherwise skip publishing entirely.
        if: ${{ always() && needs.version_gate.outputs.should_publish == 'true' && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.build_macos.result != 'failure' && needs.build_macos.result != 'cancelled' && fromJSON(inputs.publish).deploy_to_itch && fromJSON(inputs.publish).itch_user != '' && fromJSON(inputs.publish).itch_game != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                preset: ${{ fromJSON(inputs.engine).build_targets }}
        steps:
            - name: Sanitize preset name
              id: san
              run: echo "name=$(echo '${{ matrix.preset }}' | tr '/' '-' | tr ' ' '-')" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@v8
              with:
                  name: ${{ fromJSON(inputs.engine).app_name }}-${{ steps.san.outputs.name }}
                  path: ./build
            - name: Install butler
              run: |
                  curl -L -o butler.zip 'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default'
                  unzip -q butler.zip
                  chmod +x butler
            - name: Channel from preset
              id: chan
              run: |
                  CASE=$(echo '${{ matrix.preset }}' | tr '[:upper:]' '[:lower:]')
                  case "$CASE" in
                    *html*|*web*)   echo "channel=html5"   >> "$GITHUB_OUTPUT" ;;
                    *windows*|*win*)echo "channel=windows" >> "$GITHUB_OUTPUT" ;;
                    *mac*|*osx*)    echo "channel=mac"     >> "$GITHUB_OUTPUT" ;;
                    *linux*|*x11*)  echo "channel=linux"   >> "$GITHUB_OUTPUT" ;;
                    *android*)      echo "channel=android" >> "$GITHUB_OUTPUT" ;;
                    *)              echo "channel=${{ steps.san.outputs.name }}" >> "$GITHUB_OUTPUT" ;;
                  esac
            - name: Push to itch
              env:
                  BUTLER_API_KEY: ${{ secrets.ITCH_API }}
              run: |
                  ./butler push ./build "${{ fromJSON(inputs.publish).itch_user }}/${{ fromJSON(inputs.publish).itch_game }}:${{ steps.chan.outputs.channel }}" \
                    --userversion "${{ fromJSON(inputs.version).manifest }}"

    post_publish_sync:
        name: Post-publish version sync
        needs: [version_gate, build, build_macos, itch]
        if: ${{ always() && needs.version_gate.outputs.should_publish == 'true' && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.build_macos.result != 'failure' && needs.build_macos.result != 'cancelled' && (needs.build.result == 'success' || needs.build_macos.result == 'success') && (needs.itch.result == 'success' || needs.itch.result == 'skipped') && fromJSON(inputs.version).toml != '' }}
        permissions:
            contents: write
            pull-requests: write
            actions: write
        uses: KBVE/kbve/.github/workflows/utils-post-publish.yml@main
        with:
            app_name: ${{ fromJSON(inputs.engine).app_name }}
            version: ${{ fromJSON(inputs.version).manifest }}
            version_toml_path: ${{ fromJSON(inputs.version).toml }}
        secrets:
            TRIGGER_PAT: ${{ secrets.UNITY_PAT }}

    track_failure:
        name: Track Failures
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        needs:
            [
                queue_guard,
                version_gate,
                test,
                gdextension,
                build,
                build_macos,
                itch,
                post_publish_sync,
            ]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - Godot'
            job_name: ${{ fromJSON(inputs.engine).app_name }}
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'failure'

    track_success:
        name: Track Success
        if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        needs:
            [
                queue_guard,
                version_gate,
                test,
                gdextension,
                build,
                build_macos,
                itch,
                post_publish_sync,
            ]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - Godot'
            job_name: ${{ fromJSON(inputs.engine).app_name }}
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'success'
