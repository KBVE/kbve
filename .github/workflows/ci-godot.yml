name: CI - Godot

run-name: 'CI - Godot / ${{ fromJSON(inputs.engine).app_name }}'

on:
    workflow_dispatch:
        inputs:
            key:
                description: 'Manifest key'
                required: true
                type: string
            dispatched_at:
                description: 'Unix timestamp when this was dispatched (queue guard)'
                required: true
                type: string
            engine:
                description: 'JSON engine config: app_name, project_path, version, build_targets, dotnet_enabled'
                required: true
                type: string
            version:
                description: 'JSON version config: source, toml, manifest'
                required: false
                type: string
                default: '{}'
            publish:
                description: 'JSON publish config: deploy_to_itch, itch_user, itch_game, itch_channel'
                required: false
                type: string
                default: '{}'

permissions: {}

jobs:
    queue_guard:
        name: Queue Guard
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - run: |
                  AGE=$(( $(date +%s) - ${{ inputs.dispatched_at }} ))
                  echo "godot/${{ fromJSON(inputs.engine).app_name }} queued ${AGE}s"
                  if [ "$AGE" -gt 7200 ]; then
                    echo "::error::Queue timeout: ${AGE}s > 2h"
                    exit 1
                  fi

    version_gate:
        name: Version Gate
        needs: [queue_guard]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            should_publish: ${{ steps.check.outputs.should_publish }}
            local_version: ${{ steps.check.outputs.local }}
        steps:
            - uses: actions/checkout@v7
            - id: check
              run: |
                  LOCAL="${{ fromJSON(inputs.version).manifest }}"
                  VTOML="${{ fromJSON(inputs.version).toml }}"
                  PUB="0.0.0"
                  if [ -n "$VTOML" ] && [ -f "$VTOML" ]; then
                    PUB=$(grep -m1 '^version' "$VTOML" | sed 's/version = "\(.*\)"/\1/' || echo "0.0.0")
                  fi
                  echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
                  if [ -z "$LOCAL" ] || [ "$LOCAL" = "0.0.0" ] || [ "$LOCAL" = "$PUB" ]; then
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No version bump (local=$LOCAL, published=$PUB) — publish skipped."
                  else
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::v$LOCAL > v$PUB — will publish."
                  fi

    test:
        name: Test (godot --headless)
        needs: [version_gate]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        container:
            image: barichello/godot-ci:${{ fromJSON(inputs.engine).dotnet_enabled && 'mono-' || '' }}${{ fromJSON(inputs.engine).version }}
        steps:
            - uses: actions/checkout@v7
            - name: Run headless test pass
              env:
                  GODOT_BIN: godot
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  # Prefer the project's own scripts/test.sh when present — it knows
                  # whether the suite is gdUnit4, GUT, or raw godot --quit-after.
                  # Falls back to a sanity --quit-after pass when no harness exists.
                  if [ -x scripts/test.sh ]; then
                    bash scripts/test.sh
                  elif [ -d tests ] || ls test_*.gd 2>/dev/null | head -1 > /dev/null; then
                    godot --headless --path . --quit-after 10
                  else
                    echo "::notice::No scripts/test.sh, tests/ dir, or test_*.gd files — skipping headless run"
                  fi

    build:
        name: Build (${{ matrix.preset }})
        needs: [version_gate, test]
        if: ${{ join(fromJSON(inputs.engine).build_targets) != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        container:
            image: barichello/godot-ci:${{ fromJSON(inputs.engine).dotnet_enabled && 'mono-' || '' }}${{ fromJSON(inputs.engine).version }}
        strategy:
            fail-fast: false
            matrix:
                preset: ${{ fromJSON(inputs.engine).build_targets }}
        steps:
            - uses: actions/checkout@v7
            - name: Stage export templates
              run: |
                  mkdir -p ~/.local/share/godot/export_templates
                  if [ -d "/root/.local/share/godot/export_templates" ]; then
                    cp -r /root/.local/share/godot/export_templates/* \
                          ~/.local/share/godot/export_templates/ 2>/dev/null || true
                  fi
            - name: Sanitize preset name for path
              id: san
              run: |
                  CLEAN=$(echo '${{ matrix.preset }}' | tr '/' '-' | tr ' ' '-')
                  echo "name=$CLEAN" >> "$GITHUB_OUTPUT"
            - name: Import project
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: godot --headless --import || true
            - name: Export
              working-directory: ${{ fromJSON(inputs.engine).project_path }}
              run: |
                  mkdir -p build/${{ steps.san.outputs.name }}
                  godot --headless --export-release "${{ matrix.preset }}" \
                        "build/${{ steps.san.outputs.name }}/${{ fromJSON(inputs.engine).app_name }}"
            - name: Upload artefact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ fromJSON(inputs.engine).app_name }}-${{ steps.san.outputs.name }}
                  path: ${{ fromJSON(inputs.engine).project_path }}/build/${{ steps.san.outputs.name }}
                  if-no-files-found: error

    itch:
        name: Itch.io Publish
        needs: [version_gate, build]
        if: needs.version_gate.outputs.should_publish == 'true' && fromJSON(inputs.publish).deploy_to_itch && fromJSON(inputs.publish).itch_user != '' && fromJSON(inputs.publish).itch_game != ''
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                preset: ${{ fromJSON(inputs.engine).build_targets }}
        steps:
            - name: Sanitize preset name
              id: san
              run: echo "name=$(echo '${{ matrix.preset }}' | tr '/' '-' | tr ' ' '-')" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@v8
              with:
                  name: ${{ fromJSON(inputs.engine).app_name }}-${{ steps.san.outputs.name }}
                  path: ./build
            - name: Install butler
              run: |
                  curl -L -o butler.zip 'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default'
                  unzip -q butler.zip
                  chmod +x butler
            - name: Channel from preset
              id: chan
              run: |
                  CASE=$(echo '${{ matrix.preset }}' | tr '[:upper:]' '[:lower:]')
                  case "$CASE" in
                    *html*|*web*)   echo "channel=html5"   >> "$GITHUB_OUTPUT" ;;
                    *windows*|*win*)echo "channel=windows" >> "$GITHUB_OUTPUT" ;;
                    *mac*|*osx*)    echo "channel=mac"     >> "$GITHUB_OUTPUT" ;;
                    *linux*|*x11*)  echo "channel=linux"   >> "$GITHUB_OUTPUT" ;;
                    *android*)      echo "channel=android" >> "$GITHUB_OUTPUT" ;;
                    *)              echo "channel=${{ steps.san.outputs.name }}" >> "$GITHUB_OUTPUT" ;;
                  esac
            - name: Push to itch
              env:
                  BUTLER_API_KEY: ${{ secrets.ITCH_API }}
              run: |
                  ./butler push ./build "${{ fromJSON(inputs.publish).itch_user }}/${{ fromJSON(inputs.publish).itch_game }}:${{ steps.chan.outputs.channel }}" \
                    --userversion "${{ fromJSON(inputs.version).manifest }}"

    post_publish_sync:
        name: Post-publish version sync
        needs: [version_gate, build, itch]
        if: ${{ always() && needs.version_gate.outputs.should_publish == 'true' && needs.build.result == 'success' && (needs.itch.result == 'success' || needs.itch.result == 'skipped') && fromJSON(inputs.version).toml != '' }}
        permissions:
            contents: write
            pull-requests: write
            actions: write
        uses: KBVE/kbve/.github/workflows/utils-post-publish.yml@main
        with:
            app_name: ${{ fromJSON(inputs.engine).app_name }}
            version: ${{ fromJSON(inputs.version).manifest }}
            version_toml_path: ${{ fromJSON(inputs.version).toml }}
        secrets:
            TRIGGER_PAT: ${{ secrets.UNITY_PAT }}

    track_failure:
        name: Track Failures
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        needs: [queue_guard, version_gate, test, build, itch, post_publish_sync]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - Godot'
            job_name: ${{ fromJSON(inputs.engine).app_name }}
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'failure'

    track_success:
        name: Track Success
        if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        needs: [queue_guard, version_gate, test, build, itch, post_publish_sync]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - Godot'
            job_name: ${{ fromJSON(inputs.engine).app_name }}
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'success'
