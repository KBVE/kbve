name: Godot Tests

# The build half of what was ci-godot-tests.yml. The discover half -- a
# full-history checkout and a `moon setup`, to ask the project graph which Godot
# projects a change reaches -- is gone: ci.yml's plan job already has that graph
# open and already answers that question for its own shards, so it answers this
# one too and hands the matrix down. The suite used to trigger on `apps/**`,
# which is most of the tree, to run that job and be told "none" for every app
# that is not a Godot project.
#
# A reusable workflow rather than a trigger of its own, because the only thing
# it needs that the caller does not have is the matrix.

on:
    workflow_call:
        inputs:
            matrix:
                description: 'Godot projects to test, as the JSON matrix tools/release/godot-matrix.mjs emits.'
                required: true
                type: string
        secrets:
            FORGEJO_USER:
                required: false
            FORGEJO_TOKEN:
                required: false

permissions: {}

jobs:
    gdextension:
        name: Build ${{ matrix.package }} for ${{ matrix.app_name }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(inputs.matrix) }}
        steps:
            - uses: actions/checkout@v7
              if: ${{ matrix.package != '' }}
              with:
                  sparse-checkout: |
                      /*
                      !/packages/data/graph/monorepo
                  sparse-checkout-cone-mode: false

            - name: Install build prerequisites
              if: ${{ matrix.package != '' }}
              run: |
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends \
                    build-essential pkg-config \
                    libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            # rust-toolchain.toml is the single pin; see utils-rust-publish-crate.yml.
            - name: Rust toolchain
              if: ${{ matrix.package != '' }}
              run: rustup show active-toolchain || rustup toolchain install

            - name: Rust cache
              if: ${{ matrix.package != '' }}
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  key: godot-tests-${{ matrix.app_name }}-linux
                  cache-on-failure: true

            - name: Build cdylib
              if: ${{ matrix.package != '' }}
              env:
                  PKG: ${{ matrix.package }}
                  FEATURES: ${{ matrix.features }}
              run: |
                  set -euo pipefail
                  echo "::notice::Building $PKG with features: ${FEATURES:-<default>}"
                  cargo build --release -p "$PKG" ${FEATURES:+--features "$FEATURES"}

            - name: Stage artefact
              if: ${{ matrix.package != '' }}
              env:
                  PKG: ${{ matrix.package }}
              run: |
                  set -euo pipefail
                  LIB="lib$(echo "$PKG" | tr '-' '_').so"
                  mkdir -p stage/linux
                  for base in target dist/target; do
                    if [ -f "$base/release/$LIB" ]; then
                      cp "$base/release/$LIB" "stage/linux/$LIB"
                      break
                    fi
                  done
                  test -f "stage/linux/$LIB" || {
                    echo "::error::Built library not found at */release/$LIB"; exit 1;
                  }
                  ls -l stage/linux

            - name: Upload artefact
              if: ${{ matrix.package != '' }}
              uses: actions/upload-artifact@v7
              with:
                  name: godot-tests-gdext-${{ matrix.app_name }}-linux
                  path: stage
                  if-no-files-found: error

    test:
        name: gdUnit4 (${{ matrix.app_name }})
        needs: [gdextension]
        # A fork's pull request cannot read FORGEJO_*, so the LFS pull below
        # would fetch pointers and the suite would run against them.
        if: ${{ always() && needs.gdextension.result != 'failure' && needs.gdextension.result != 'cancelled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(inputs.matrix) }}
        container:
            image: barichello/godot-ci:${{ matrix.godot_version }}
        # A step inside a container runs under `sh -e`, not the `bash -e` a step on the
        # runner gets, and dash has no `pipefail` -- every step below opens with
        # `set -euo pipefail` and died on its first line. The image carries bash, so the
        # shell is named rather than the scripts written down to dash.
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - name: Pull LFS assets (Forgejo)
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  LFS_INCLUDE: ${{ matrix.project_path }}
              run: bash tools/lfs/ensure.sh

            - name: Download GDExtension
              if: ${{ matrix.package != '' }}
              uses: actions/download-artifact@v8
              with:
                  name: godot-tests-gdext-${{ matrix.app_name }}-linux
                  path: gdext

            - name: Stage GDExtension
              if: ${{ matrix.package != '' }}
              env:
                  PROJECT_PATH: ${{ matrix.project_path }}
                  ADDON_PATH: ${{ matrix.addon_path }}
              run: |
                  set -euo pipefail
                  mkdir -p "$PROJECT_PATH/$ADDON_PATH/linux"
                  cp gdext/linux/*.so "$PROJECT_PATH/$ADDON_PATH/linux/"
                  ls -l "$PROJECT_PATH/$ADDON_PATH/linux"

            - name: Install GDExtension runtime libraries
              if: ${{ matrix.package != '' }}
              env:
                  PROJECT_PATH: ${{ matrix.project_path }}
                  ADDON_PATH: ${{ matrix.addon_path }}
              run: |
                  set -euo pipefail
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends \
                    libwebkit2gtk-4.1-0 libfontconfig1
                  MISSING=$(find "$PROJECT_PATH/$ADDON_PATH" -name '*.so' -exec ldd {} \; 2>/dev/null \
                    | awk '/not found/ {print $1}' | sort -u)
                  if [ -n "$MISSING" ]; then
                    echo "::error::Staged GDExtension libraries have unresolved sonames in this container:"
                    echo "$MISSING"
                    exit 1
                  fi

            - name: Run the suite
              working-directory: ${{ matrix.project_path }}
              env:
                  GODOT_BIN: godot
                  GODOT_NO_INSTALL: '1'
              run: |
                  if [ -x scripts/test.sh ]; then
                    bash scripts/test.sh
                  elif [ -d tests ]; then
                    godot --headless --path . --quit-after 10
                  else
                    echo "::notice::No scripts/test.sh or tests/ — nothing to run"
                  fi

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: godot-tests-reports-${{ matrix.app_name }}
                  path: ${{ matrix.project_path }}/reports
                  if-no-files-found: ignore
