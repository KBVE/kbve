name: CI Tauri

on:
    workflow_dispatch:
        inputs:
            app:
                description: 'Tauri app to build'
                type: choice
                required: true
                default: chuck-launcher
                options:
                    - chuck-launcher
                    - isometric
                    - desktop-kbve
                    - desktop-kbve-appstore

permissions:
    contents: read

jobs:
    resolve:
        name: Resolve app config
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            project: ${{ steps.map.outputs.project }}
            project_path: ${{ steps.map.outputs.project_path }}
            notarize: ${{ steps.map.outputs.notarize }}
            platforms: ${{ steps.map.outputs.platforms }}
            features: ${{ steps.map.outputs.features }}
            config: ${{ steps.map.outputs.config }}
            appstore: ${{ steps.map.outputs.appstore }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # Read off the project graph rather than from a bash `case` over the
            # app name. Every branch of that case was a project's own facts --
            # where it lives, what platforms it targets, whether it is notarized
            # -- restated in a workflow, which is the same drift the dispatch
            # manifest had.
            #
            # `desktop-kbve-appstore` is the exception and stays here: it is not
            # a fourth project but a second way of building desktop-kbve, a
            # sandboxed Mac App Store variant with its own features and tauri
            # config. A variant is a build option, not a project.
            - id: map
              env:
                  APP: ${{ inputs.app }}
              run: |
                  set -euo pipefail
                  PROJECT="$APP"
                  APPSTORE=false
                  FEATURES=""
                  CONFIG=""
                  if [ "$APP" = "desktop-kbve-appstore" ]; then
                    PROJECT="desktop-kbve"
                    APPSTORE=true
                    FEATURES="appstore"
                    CONFIG="src-tauri/tauri.appstore.conf.json"
                  fi

                  NODE=$(moon query projects --id "$PROJECT" | jq -c --arg p "$PROJECT" \
                    '.projects[] | select(.id == $p)')
                  if [ -z "$NODE" ]; then
                    echo "::error::No moon project called '$PROJECT'."
                    exit 1
                  fi

                  PLATFORMS=$(jq -r '.config.env.TAURI_PLATFORMS // ""' <<<"$NODE")
                  NOTARIZE=$(jq -r '.config.env.TAURI_NOTARIZE // "false"' <<<"$NODE")
                  if [ -z "$PLATFORMS" ]; then
                    echo "::error::$PROJECT declares no TAURI_PLATFORMS in its moon.yml env."
                    exit 1
                  fi

                  # The App Store variant is macOS-only and signed for the store
                  # rather than notarized for direct distribution.
                  if [ "$APPSTORE" = "true" ]; then
                    PLATFORMS="macos"
                    NOTARIZE=false
                  fi

                  {
                    echo "project=$PROJECT"
                    echo "project_path=$(jq -r '.source' <<<"$NODE")"
                    echo "platforms=$PLATFORMS"
                    echo "notarize=$NOTARIZE"
                    echo "features=$FEATURES"
                    echo "config=$CONFIG"
                    echo "appstore=$APPSTORE"
                  } >> "$GITHUB_OUTPUT"
                  echo "::notice::$PROJECT -> $PLATFORMS (notarize=$NOTARIZE, appstore=$APPSTORE)"

    build:
        name: Build ${{ inputs.app }}
        needs: resolve
        permissions:
            contents: write
            pull-requests: write
        uses: ./.github/workflows/ci-tauri-builder.yml
        with:
            project: ${{ needs.resolve.outputs.project }}
            project_path: ${{ needs.resolve.outputs.project_path }}
            app_name: ${{ inputs.app }}
            notarize: ${{ fromJSON(needs.resolve.outputs.notarize) }}
            platforms: ${{ needs.resolve.outputs.platforms }}
            features: ${{ needs.resolve.outputs.features }}
            config: ${{ needs.resolve.outputs.config }}
            appstore: ${{ fromJSON(needs.resolve.outputs.appstore) }}
        secrets: inherit
