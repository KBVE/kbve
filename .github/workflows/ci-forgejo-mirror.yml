name: CI - Forgejo Mirror

on:
    push:
        branches: [main]
        tags: ['**']
    workflow_dispatch:

concurrency:
    group: forgejo-mirror-${{ github.ref }}
    cancel-in-progress: false

jobs:
    mirror:
        name: 'Mirror to Forgejo'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history, no LFS)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: false
              env:
                  GIT_LFS_SKIP_SMUDGE: 1

            - name: Push ref and tags to Forgejo
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  if [ -z "${FORGEJO_USER:-}" ] || [ -z "${FORGEJO_TOKEN:-}" ]; then
                      echo "::error::FORGEJO_USER / FORGEJO_TOKEN secrets are not set"
                      exit 1
                  fi

                  REMOTE="https://${FORGEJO_USER}:${FORGEJO_TOKEN}@git.kbve.com/KBVE/kbve.git"

                  echo "::notice::Mirroring ${REF_TYPE} '${REF_NAME}' to Forgejo (pointers only, non-destructive)"

                  # --no-verify is what makes "pointers only" true. git-lfs works
                  # through a pre-push hook, so a plain push here walks every commit
                  # being mirrored, enumerates every LFS object in that history, and
                  # uploads it: 6.6 GB on each run, and a hard failure on any object
                  # the runner cannot fetch.
                  #
                  # It cannot fetch all of them. The checkout is deliberately
                  # lfs: false, and a blob whose file was later deleted -- herbmail's
                  # arms.glb, added in d3be0b8b06 and dropped in 1a4737dbee -- is
                  # reachable only from history, so `(missing)` aborts the whole push
                  # and no ref mirrors at all.
                  #
                  # The blobs do not belong in this remote regardless. Each game's
                  # assets live in its own Forgejo repo (tools/lfs/remotes.tsv), and
                  # Forgejo dedups content across the org, so the monorepo mirror only
                  # ever needed the pointers.
                  if [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" = "main" ]; then
                      git push --no-verify "${REMOTE}" "HEAD:refs/heads/main"
                  fi

                  # A single divergent tag rejects the whole `--tags` push and
                  # then no tag mirrors at all: herbmail-api@0.1.3 was deleted
                  # and recreated on a newer commit here, so Forgejo still held
                  # the original object and rejected the update as
                  # `already exists`.
                  #
                  # GitHub is the source of truth for release tags, so a moved
                  # tag should follow. The refspec is forced, but only over tags
                  # this repository actually has: nothing is pruned, and tags
                  # that exist only on Forgejo are left alone.
                  git ls-remote --tags "${REMOTE}" \
                      | grep -v '\^{}$' \
                      | awk '{ print $2"\t"$1 }' \
                      | sort >"${RUNNER_TEMP}/forgejo-tags.tsv"
                  git show-ref --tags \
                      | awk '{ print $2"\t"$1 }' \
                      | sort >"${RUNNER_TEMP}/github-tags.tsv"
                  join -t "$(printf '\t')" \
                      "${RUNNER_TEMP}/github-tags.tsv" \
                      "${RUNNER_TEMP}/forgejo-tags.tsv" \
                      | awk -F'\t' '$2 != $3 { print "::notice::moving "$1" from "$3" to "$2 }'

                  git push --no-verify --force "${REMOTE}" "refs/tags/*:refs/tags/*"

    track-mirror:
        name: Track Mirror
        if: always()
        needs: [mirror]
        permissions:
            actions: read
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI - Forgejo Mirror'
            job_name: 'Mirror to Forgejo'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: ${{ needs.mirror.result }}
