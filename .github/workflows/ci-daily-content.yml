name: Daily Content

on:
    schedule:
        - cron: '0 1 * * *'
        - cron: '0 2 * * 1'
    workflow_dispatch:
        inputs:
            route:
                description: 'Build a single route (bypasses cadence). Blank = use cadence.'
                required: false
                type: string
            cadence:
                description: 'Cadence to run when route is blank.'
                required: false
                default: 'daily'
                type: string

permissions:
    contents: write
    pull-requests: write
    actions: write

concurrency:
    group: daily-content
    cancel-in-progress: false

jobs:
    router:
        name: Plan daily routes
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has_work: ${{ steps.plan.outputs.has_work }}
        steps:
            - name: Checkout dev
              uses: actions/checkout@v7
              with:
                  ref: dev

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'

            - name: Install uv
              uses: Wandalen/wretry.action@v3.8.0
              with:
                  action: astral-sh/setup-uv@v7
                  attempt_limit: 3
                  attempt_delay: 15000

            - name: Sync Python dependencies
              working-directory: packages/python/kbve
              run: uv sync

            - name: Plan routes
              id: plan
              working-directory: packages/python/kbve
              env:
                  SCHEDULE: ${{ github.event.schedule }}
              run: |
                  if [ -n "${{ github.event.inputs.route }}" ]; then
                    uv run kbve-nx-router --route "${{ github.event.inputs.route }}" --json
                  elif [ "$SCHEDULE" = "0 2 * * 1" ]; then
                    uv run kbve-nx-router --cadence weekly --json
                  else
                    uv run kbve-nx-router --cadence "${{ github.event.inputs.cadence || 'daily' }}" --json
                  fi

    builder:
        name: Build ${{ matrix.route }}
        needs: router
        if: needs.router.outputs.has_work == 'true'
        runs-on: ubuntu-latest
        # report runs coverage across several projects — slow.
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.router.outputs.matrix) }}
        steps:
            - name: Checkout dev
              uses: actions/checkout@v7
              with:
                  ref: dev

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'

            - name: Install uv
              uses: Wandalen/wretry.action@v3.8.0
              with:
                  action: astral-sh/setup-uv@v7
                  attempt_limit: 3
                  attempt_delay: 15000

            - name: Sync Python dependencies
              working-directory: packages/python/kbve
              run: uv sync

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js

            - name: Setup moon
              if: contains(matrix.needs, 'moon')
              uses: ./.github/actions/setup-moon

            # `release-tools:status` compares each version manifest against the
            # newest tag naming that project, and counts the commits since it.
            # The default shallow, tagless checkout makes every project look
            # never-released.
            - name: Fetch tags and history
              if: contains(matrix.needs, 'tags')
              run: |
                  set -euo pipefail
                  if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                    git fetch --prune --unshallow --tags origin
                  else
                    git fetch --prune --tags origin
                  fi

            - name: Setup Rust toolchain
              if: contains(matrix.needs, 'rust')
              run: |
                  set -euo pipefail
                  if command -v rustup &>/dev/null; then
                    rustup update stable
                  else
                    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
                    echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install cargo-audit
              if: contains(matrix.needs, 'rust')
              run: |
                  set -euo pipefail
                  if ! command -v cc &>/dev/null; then
                    apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq && apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq build-essential pkg-config libssl-dev
                  fi
                  if ! command -v cargo-audit &>/dev/null; then
                    cargo install cargo-audit --locked
                    echo "cargo-audit installed: $(cargo audit --version)"
                  else
                    echo "cargo-audit already available: $(cargo audit --version)"
                  fi

            - name: Install pip-audit
              if: contains(matrix.needs, 'python')
              run: |
                  set -euo pipefail
                  pip install pip-audit
                  echo "pip-audit installed: $(pip-audit --version)"

            - name: Install graphify CLI
              if: contains(matrix.needs, 'graphify')
              run: |
                  set -euo pipefail
                  uv tool install 'graphifyy<1.0'
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  graphify --version

            - name: Install protoc
              if: contains(matrix.needs, 'protoc')
              run: |
                  set -euo pipefail
                  PROTOC_VERSION=29.5
                  curl -sLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
                  sudo unzip -o "protoc-${PROTOC_VERSION}-linux-x86_64.zip" -d /usr/local
                  protoc --version

            - name: Build route ${{ matrix.route }}
              working-directory: packages/python/kbve
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  UNITY_PAT: ${{ secrets.UNITY_PAT }}
              run: |
                  set -euo pipefail
                  # kbve-nx-build prints the repo-relative path of everything the
                  # route touched, one per line, and prints nothing when it
                  # skipped. The Create PR step stages exactly that list.
                  uv run kbve-nx-build "${{ matrix.route }}" \
                    --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --workdir "${RUNNER_TEMP}" \
                    --public-dir "$GITHUB_WORKSPACE/apps/kbve/astro-kbve/public/data/nx" \
                    --content-root "$GITHUB_WORKSPACE/apps/kbve/astro-kbve/src/content/docs" \
                    | tee "${RUNNER_TEMP}/changed-${{ matrix.route }}.txt"

            - name: Create PR
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Stage what the route said it wrote, not a fixed list of
                  # directories. Staging the directories meant a route that
                  # failed and reported nothing still had its output committed
                  # in whatever state the failure left it: that is how a
                  # graphify rebuild that died mid-run committed the deletion of
                  # every file under public/graphify.
                  CHANGED="${RUNNER_TEMP}/changed-${{ matrix.route }}.txt"
                  if [ ! -s "${CHANGED}" ]; then
                    echo "::notice::Route ${{ matrix.route }} reported no changed paths — nothing to commit."
                    exit 0
                  fi
                  xargs -r -d '\n' -a "${CHANGED}" git add --

                  if git diff --cached --quiet; then
                    echo "::notice::No pending changes for route ${{ matrix.route }} — nothing to commit."
                    exit 0
                  fi

                  # Stable per-route/day branch. Force-push so a same-day
                  # re-run (nightly + manual dispatch, or an Actions re-run)
                  # updates the existing branch in place instead of failing on
                  # a non-fast-forward push.
                  BRANCH="auto/daily-${{ matrix.route }}-$(date -u +%Y-%m-%d)"
                  git checkout -B "${BRANCH}"
                  git commit -m "chore(content): daily ${{ matrix.route }} scaffold [skip ci]"
                  git push --force origin "${BRANCH}"

                  # Reuse an already-open PR for this branch (force-push updated
                  # it in place) instead of opening a duplicate.
                  PR_NUM=$(gh pr list --head "${BRANCH}" --base dev --state open \
                    --json number --jq '.[0].number // empty')
                  if [ -z "${PR_NUM}" ]; then
                    PR_URL=$(gh pr create \
                      --base dev \
                      --head "${BRANCH}" \
                      --title "chore(content): daily ${{ matrix.route }} scaffold" \
                      --body "Automated daily content update for route \`${{ matrix.route }}\`." \
                      --label "auto-pr")
                    PR_NUM=$(echo "$PR_URL" | grep -o '[0-9]*$')
                    echo "Created PR #${PR_NUM}"
                  else
                    echo "Reusing open PR #${PR_NUM} (force-pushed update)"
                  fi
                  echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"

            # ci-auto-merge-bot-prs.yml validated bot PRs against
            # .github/ci-dispatch-manifest.json and both are gone, so the
            # dispatch to it 422'd on every route and left the day's PRs open.
            # A content route writes generated files under known prefixes and
            # nothing else, which is the whole check — kept here rather than in
            # a workflow this one has to reach across a dispatch to run.
            - name: Approve and auto-merge
              if: steps.pr.outputs.pr_number != ''
              env:
                  GH_TOKEN: ${{ secrets.UNITY_PAT }}
                  PR_NUM: ${{ steps.pr.outputs.pr_number }}
                  ROUTE: ${{ matrix.route }}
              run: |
                  set -euo pipefail

                  # Must stay in sync with what the routes write; a path a
                  # route stages but this omits blocks the merge rather than
                  # merging something unreviewed.
                  ALLOWED='
                  apps/kbve/astro-kbve/src/content/docs/
                  docs/journal/
                  apps/kbve/astro-kbve/public/data/nx/
                  apps/kbve/astro-kbve/public/graphify/
                  apps/kbve/astro-kbve/src/data/
                  packages/data/codegen/generated/
                  apps/rareicon/unity-rareicon/Assets/StreamingAssets/
                  '

                  blocked=0
                  while read -r file; do
                    [ -z "$file" ] && continue
                    ok=0
                    for prefix in $ALLOWED; do
                      case "$file" in "$prefix"*) ok=1; break;; esac
                    done
                    if [ "$ok" -eq 0 ]; then
                      echo "::error::PR #${PR_NUM} (${ROUTE}) touches ${file}, outside the content allowlist"
                      blocked=1
                    fi
                  done <<< "$(gh pr diff "${PR_NUM}" --name-only)"
                  if [ "$blocked" -ne 0 ]; then
                    exit 1
                  fi

                  gh pr review "${PR_NUM}" --approve \
                    --body "Auto-approved — content route \`${ROUTE}\` wrote only generated files."
                  gh pr merge "${PR_NUM}" --squash --auto
