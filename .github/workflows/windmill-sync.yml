name: Windmill Sync

# Push the repo-versioned Windmill scripts/flows (services/windmill) into the
# `kbve` workspace. Runs on the in-cluster arc runner because the Windmill
# API (windmill-app:8000) is ClusterIP-only and windmill.kbve.com is behind
# the staff-JWT gate — an external runner cannot reach it with a token.
#
# Prune-safe: services/windmill/wmill.yaml scopes `includes: f/**`, so the push
# only manages the f/ tree and never touches user-space (u/) scripts.
#
# The commands themselves live in services/windmill/moon.yml, including the CLI
# version pin, so `moon run windmill:push` from a laptop does what this does.
# Only the workspace registration stays here: it needs the superadmin token.

on:
    push:
        branches: [main]
        paths:
            - services/windmill/**
            - .github/workflows/windmill-sync.yml
    workflow_dispatch: {}

concurrency:
    group: windmill-sync
    cancel-in-progress: false

jobs:
    sync:
        name: wmill sync push
        runs-on: arc-runner-set-kbve
        timeout-minutes: 10
        permissions:
            contents: read
        env:
            WMILL_BASE_URL: http://windmill-app.windmill.svc.cluster.local:8000
            WMILL_WORKSPACE: kbve
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # The CLI version is pinned in the project rather than here, so the
            # registration below installs the same one the tasks will.
            - name: Read the pinned CLI version
              id: cli
              run: |
                  VERSION="$(sed -n "s/^ *WMILL_CLI_VERSION: *'\(.*\)'$/\1/p" services/windmill/moon.yml)"
                  if [ -z "$VERSION" ]; then
                    echo "::error::No WMILL_CLI_VERSION pinned in services/windmill/moon.yml"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Configure workspace
              env:
                  WM_TOKEN: ${{ secrets.WINDMILL_SUPERADMIN_TOKEN }}
                  WMILL_CLI_VERSION: ${{ steps.cli.outputs.version }}
              run: |
                  if [ -z "${WM_TOKEN}" ]; then
                    echo "::error::WINDMILL_SUPERADMIN_TOKEN secret is not set"
                    exit 1
                  fi
                  npx --yes "windmill-cli@${WMILL_CLI_VERSION}" workspace add \
                    "${WMILL_WORKSPACE}" "${WMILL_WORKSPACE}" "${WMILL_BASE_URL}" \
                    --token "${WM_TOKEN}"

            - name: Generate lockfiles
              run: moon run windmill:metadata

            - name: Preview (dry-run)
              run: moon run windmill:check

            - name: Push scripts
              run: moon run windmill:push
