name: CI - Web Game

# Builds a browser game and pushes it to itch.
#
# One workflow for every web game, because they differ in nothing this file
# does: each runs its own `build` task and uploads the result. ci-vite-game.yml
# and ci-bevy-game.yml were separate for the engine's sake -- a Vite game and a
# Bevy wasm game -- but moon already knows how to build each, so the engine was
# never this workflow's business. The only real difference is that a wasm build
# needs a nightly rust toolchain, and the project says so.
#
# It also replaced the push-to-main route in ci-bevy.yml, which rebuilt the wasm
# bundle whenever anything in the project changed and shipped it by committing
# the build artifact into astro-kbve's public directory.
#
# Called by release.yml for a tag whose project is in the `web-game` lane.
# workflow_dispatch is kept so a build can be re-run without cutting a tag.
on:
    workflow_call:
        inputs:
            project:
                description: 'moon project id'
                required: true
                type: string
            version:
                description: 'Version being released'
                required: true
                type: string
            publish:
                description: 'JSON publish config: itch_user, itch_game, itch_channel'
                required: true
                type: string
            needs_rust:
                description: 'Install the nightly wasm toolchain (a Bevy game needs it, a Vite one does not)'
                required: false
                default: false
                type: boolean
        secrets:
            ITCH_API_KEY:
                required: false
            # A game whose assets live on the Forgejo LFS remote needs these to
            # materialize them. Absent, the build still runs -- and ships a
            # bundle whose meshes and textures are pointer stubs -- so the pull
            # is verified rather than attempted.
            FORGEJO_USER:
                required: false
            FORGEJO_TOKEN:
                required: false
    workflow_dispatch:
        inputs:
            project:
                description: 'moon project id'
                required: true
                type: string
                default: isometric
            version:
                description: 'Version to label the build with'
                required: true
                type: string
            publish:
                description: 'JSON publish config: itch_user, itch_game, itch_channel'
                required: true
                type: string
            needs_rust:
                description: 'Install the nightly wasm toolchain'
                required: false
                default: false
                type: boolean

run-name: 'CI - Web Game / ${{ inputs.project }} v${{ inputs.version }}'

permissions:
    contents: read

concurrency:
    group: web-game-${{ inputs.project }}
    cancel-in-progress: false

jobs:
    build:
        name: Build and publish
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # dtolnay/rust-toolchain@nightly fails fast when static.rust-lang.org
            # is mid-rollout and the channel manifest checksum mismatches
            # (rustup #3390), so the install is retried rather than taken as a
            # broken build.
            # Only a wasm game needs this, and only that game declares it. A
            # Vite game is node all the way down and would spend four minutes
            # installing a toolchain it never invokes.
            - name: Setup Rust nightly (wasm32 + rust-src for -Z build-std atomics)
              if: ${{ inputs.needs_rust == true }}
              run: |
                  set -euo pipefail
                  if ! command -v rustup >/dev/null; then
                      curl --proto '=https' --tlsv1.2 --retry 10 \
                          --retry-connrefused --location --silent \
                          --show-error --fail https://sh.rustup.rs \
                          | sh -s -- --default-toolchain none -y
                      echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                      export PATH="$HOME/.cargo/bin:$PATH"
                  fi
                  attempt=1
                  max_attempts=5
                  while (( attempt <= max_attempts )); do
                      if rustup toolchain install nightly \
                          --target wasm32-unknown-unknown \
                          --component rust-src \
                          --profile minimal \
                          --allow-downgrade \
                          --no-self-update; then
                          break
                      fi
                      if (( attempt == max_attempts )); then
                          echo "rustup install failed after ${max_attempts} attempts" >&2
                          exit 1
                      fi
                      sleep $(( attempt * 15 ))
                      attempt=$(( attempt + 1 ))
                  done
                  rustup default nightly

                  # rust-toolchain.toml pins 1.98.0 for the whole repo and a
                  # toolchain file beats `rustup default`, so a build that does
                  # not set RUSTUP_TOOLCHAIN itself compiles on 1.98.0 -- which
                  # has no wasm32 target from the install above. mmorpg's bundle
                  # is exactly that build: stable, because the shared-memory one
                  # needs egui to be Send on a threaded wasm target and it is
                  # not. Adding the target with no --toolchain gives it to
                  # whichever toolchain is active here, which is the pinned one.
                  rustup target add wasm32-unknown-unknown
                  rustup show active-toolchain

            - name: Rust Cache
              if: ${{ inputs.needs_rust == true }}
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  cache-on-failure: true

            - name: Install wasm-pack
              if: ${{ inputs.needs_rust == true }}
              run: cargo install wasm-pack --locked

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # Before the build, because the build reads them. The graph is the
            # only thing that knows where a project lives, so the pull is
            # scoped to that directory rather than to the whole remote: the
            # arcade remote holds colony and yuki as well, and pulling those
            # costs minutes for blobs this bundle will not contain.
            - name: Resolve the project source
              id: source
              env:
                  PROJECT: ${{ inputs.project }}
              run: |
                  set -euo pipefail
                  SOURCE=$(moon query projects --id "$PROJECT" | jq -r '.projects[0].source')
                  [ -n "$SOURCE" ] && [ "$SOURCE" != 'null' ] || {
                    echo "::error::no source in the project graph for $PROJECT"
                    exit 1
                  }
                  echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

            # Nothing here for a game whose assets are committed outright. For
            # one that keeps them in LFS, a checkout without this step leaves
            # every mesh and texture a 130-byte pointer file -- which builds,
            # uploads, and fails in the player's browser rather than in CI.
            # ensure.sh proves they materialized instead of trusting the pull.
            - name: Pull LFS assets (Forgejo)
              if: ${{ fromJSON(inputs.publish).lfs_remote != '' }}
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  LFS_REMOTE: ${{ fromJSON(inputs.publish).lfs_remote }}
                  LFS_INCLUDE: ${{ steps.source.outputs.source }}
                  LFS_REQUIRED: '1'
              run: bash tools/lfs/ensure.sh

            # The project's own build task, so the bundle CI ships is the one a
            # developer gets locally. moon resolves its project-local npm
            # install through the task graph.
            #
            # Which task, because `build` is not universal. A Vite game's build
            # is the bundle; a rust game inherits `build` from the rust
            # toolchain, where it means a native `cargo build`. The project
            # names its wasm task in WEB_GAME_TASK and verify-tag carries it
            # here, defaulting to `build` so a Vite game says nothing.
            - name: Build
              env:
                  CI: 'true'
              run: moon run ${{ inputs.project }}:${{ fromJSON(inputs.publish).web_game_task || 'build' }}

            - name: Resolve the build output
              id: dist
              env:
                  SOURCE: ${{ steps.source.outputs.source }}
                  TARGET: ${{ inputs.project }}:${{ fromJSON(inputs.publish).web_game_task || 'build' }}
              run: |
                  set -euo pipefail
                  DIST="$SOURCE/dist"
                  if [ ! -d "$DIST" ] || [ -z "$(ls -A "$DIST")" ]; then
                    echo "::error::$TARGET produced nothing at $DIST"
                    exit 1
                  fi
                  echo "path=$DIST" >> "$GITHUB_OUTPUT"
                  echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
                  echo "::notice::$(du -sh "$DIST" | cut -f1) in $DIST"

            # Kept whether or not the push happens, so a build can be inspected
            # or hand-uploaded when itch is unreachable.
            - name: Upload the bundle
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ inputs.project }}-${{ inputs.version }}-web
                  path: ${{ steps.dist.outputs.path }}
                  if-no-files-found: error
                  retention-days: 14

            # After the upload on purpose: a bundle that fails here is exactly
            # the one worth downloading. Opt-in per project, because a Vite game
            # has nothing to smoke.
            - name: Smoke the bundle
              env:
                  PROJECT: ${{ inputs.project }}
              run: |
                  set -euo pipefail
                  if moon task "$PROJECT:smoke" >/dev/null 2>&1; then
                    moon run "$PROJECT:smoke"
                  else
                    echo "::notice::$PROJECT has no smoke task; skipping"
                  fi

            # Absent on a fork, where the build is still worth running and the
            # push is not possible. Saying so beats failing on a missing secret.
            - name: Check for the itch credential
              id: itch
              env:
                  KEY: ${{ secrets.ITCH_API_KEY }}
              run: |
                  if [ -n "$KEY" ]; then
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::ITCH_API_KEY is not set; the bundle was built but not published."
                  fi

            - name: Push to itch
              if: ${{ steps.itch.outputs.ready == 'true' }}
              working-directory: ${{ steps.dist.outputs.source }}
              env:
                  BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
                  ITCH_TARGET: ${{ fromJSON(inputs.publish).itch_user }}/${{ fromJSON(inputs.publish).itch_game }}:${{ fromJSON(inputs.publish).itch_channel }}
                  ITCH_USERVERSION: ${{ inputs.version }}
              run: bash "$GITHUB_WORKSPACE/tools/itch/push.sh"
