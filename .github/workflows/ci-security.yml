name: CI - Security

on:
    pull_request:
        branches:
            - dev
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions: {}

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Dependency Review
              uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: always

    # One job rather than a failure/success pair. The pair reported the same
    # five inputs twice and differed only in a status string, and their two
    # conditions had to stay each other's exact complement by hand.
    track:
        name: Track Failures
        if: ${{ always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
        needs: [dependency-review]
        permissions:
            issues: write
            contents: read
        uses: ./.github/workflows/utils-ci-failure-tracker.yml
        with:
            workflow_name: 'CI - Security'
            job_name: 'dependency-review'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
