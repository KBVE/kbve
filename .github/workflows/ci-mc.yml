name: CI - MC

# Everything CI does for apps/mc: the two pre-baked cache images, and the
# integration smoke that boots what they build.
#
# One workflow rather than three because all of it triggers on the same thing --
# any change under apps/mc, on the same branches, at the same time. Three files
# meant three copies of that trigger to keep in step. The jobs stay separate and
# independent; only the trigger surface is shared.
#
# Named for the app, not for Java. The only other gradle build in the repository
# is packages/../kbve-wgpu/android, which Expo owns and which must never be
# pulled into this lane by a filename that promises a language.
#
# The cache layers: the two pre-baked images apps/mc/Dockerfile pulls in
# with COPY --from: ghcr.io/kbve/mc:gradle, the Fabric Loom dependency cache,
# and ghcr.io/kbve/mc:mods, the Modrinth jar payload. Neither is a versioned
# app; both are infrastructure that only needs rebuilding when a pin moves.
#
# This replaces ci-mc-gradle-cache.yml and ci-mc-mods-cache.yml, which were the
# same hundred lines with a different moon task at the end, and ci-mc-smoke.yml,
# whose trigger was already identical to theirs.
#
# The trigger is coarse -- any change under apps/mc -- and apps/mc/tools/
# cache-plan.mjs decides precisely which layers that change invalidates. A
# GitHub path filter is per workflow rather than per matrix entry, so a filter
# precise enough to matter would have to be duplicated per layer and kept in
# step with the matrix by hand. One list, in the script, instead.

on:
    workflow_dispatch:
        inputs:
            layer:
                description: 'Which cache layer to rebuild.'
                required: false
                default: 'all'
                type: choice
                options: [all, gradle, mods]
    push:
        branches: [main, dev]
        paths:
            - 'apps/mc/**'
            - '!apps/mc/**/*.md'
            - '!apps/mc/**/*.mdx'
            - '.github/workflows/ci-mc.yml'
    pull_request:
        branches: [main, dev]
        paths:
            - 'apps/mc/**'
            - '!apps/mc/**/*.md'
            - '!apps/mc/**/*.mdx'
            - '.github/workflows/ci-mc.yml'

permissions: {}

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has_work: ${{ steps.plan.outputs.has_work }}
        steps:
            # The plan diffs against the base, so the base has to be in the
            # clone. Everything else here is shallow on purpose; this job is
            # seconds either way.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Which layers changed
              id: plan
              env:
                  LAYER_INPUT: ${{ inputs.layer }}
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
              run: node apps/mc/tools/cache-plan.mjs

    build:
        name: ghcr.io/kbve/mc:${{ matrix.layer }}
        needs: plan
        if: needs.plan.outputs.has_work == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        permissions:
            contents: read
            packages: write
        strategy:
            # One layer failing must not stop the other from being rebuilt.
            fail-fast: false
            matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
        # Per layer rather than per workflow, so a gradle rebuild does not
        # queue behind a mods rebuild that has nothing to do with it.
        concurrency:
            group: mc-cache-${{ matrix.layer }}
            cancel-in-progress: false
        steps:
            - name: Free disk space
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: true
                  dotnet: true
                  haskell: true
                  # Nothing else fits beside a full Loom cache; the mods layer
                  # is small enough not to pay the removal time.
                  large-packages: ${{ matrix.freeLargePackages }}
                  swap-storage: false
                  docker-images: true

            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Docker Buildx
              uses: Wandalen/wretry.action@v3.8.0
              with:
                  action: docker/setup-buildx-action@v4
                  attempt_limit: 3
                  attempt_delay: 15000

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.15.0
                  run_install: false

            - name: Get pnpm Store Path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm Cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml', 'package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install pnpm Dependencies
              run: pnpm install --frozen-lockfile
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # Pull requests build without pushing, to validate the Dockerfile
            # without letting a pull request overwrite the tag that every main
            # build depends on.
            - name: Build ghcr.io/kbve/mc:${{ matrix.layer }} (local)
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  INPUT_GITHUB_TOKEN: ${{ github.token }}
              run: moon run mc:container-${{ matrix.layer }}

            - name: Build + Push ghcr.io/kbve/mc:${{ matrix.layer }}
              if: ${{ github.event_name != 'pull_request' }}
              env:
                  INPUT_GITHUB_TOKEN: ${{ github.token }}
              run: moon run mc:container-${{ matrix.layer }}-publish

    # Three-job MC integration smoke:
    # 1. client-smoke      — Loom runClient under xvfb, scans the boot log
    # for Mixin spec violations / apply failures.
    # Catches the class-load crash family that
    # compileJava and docker image builds miss
    # (non-private static fields in mixin classes,
    # missing @At targets, signature drift after
    # a yarn bump).
    # 2. server-ping-smoke — boots a single fabric container (no velocity,
    # no lobby) and probes it with itzg/mc-monitor
    # (Server List Ping). Pure Go binary, no npm
    # tree — chosen over mineflayer to avoid the
    # prismarine-* transitive surface. SLP works
    # pre-login so FabricProxy-Lite enforcement is
    # irrelevant; a green ping proves the fabric
    # mod stack reached "Done" without crashing.
    # 3. dependency-review — gates new PR-introduced dependencies on the
    # GH-native advisory DB (high+ blocks merge).

    client-smoke:
        name: Headless Client Smoke (Loom runClient)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            GRADLE_OPTS: '-Xmx3g -Dorg.gradle.daemon=false'

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm v10
              uses: pnpm/action-setup@v6
              with:
                  version: 11.15.0
                  run_install: false

            - name: Cache Gradle (Loom MC + libs)
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      apps/mc/behavior_statetree/java/.gradle
                  key: ${{ runner.os }}-mc-loom-${{ hashFiles('apps/mc/behavior_statetree/java/build.gradle', 'apps/mc/behavior_statetree/java/settings.gradle', 'apps/mc/behavior_statetree/java/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-mc-loom-

            - name: Install xvfb + Mesa software GL
              run: |
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends \
                      xvfb \
                      libgl1 \
                      libglu1-mesa \
                      libglx-mesa0 \
                      mesa-utils \
                      libxext6 libxrandr2 libxcursor1 libxi6 libxxf86vm1 \
                      libasound2t64 libpulse0

            - name: Run headless client smoke
              env:
                  TIMEOUT_SECS: '300'
              run: bash apps/mc/scripts/headless-client-smoke.sh

            - name: Upload client log on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: client-smoke-log
                  path: /tmp/mc-headless-client.log
                  if-no-files-found: ignore
                  retention-days: 7

    server-ping-smoke:
        name: Server Ping Smoke (fabric + mc-monitor)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            MC_MONITOR_VERSION: '0.16.2'

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm v10
              uses: pnpm/action-setup@v6
              with:
                  version: 11.15.0
                  run_install: false

            - name: Get pnpm Store Path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: Setup pnpm Cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml', 'package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install pnpm Dependencies
              run: pnpm install --frozen-lockfile
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

            - name: Install mc-monitor (itzg)
              run: |
                  set -euo pipefail
                  ARCH=linux_amd64
                  V="${MC_MONITOR_VERSION}"
                  curl -fsSL -o /tmp/mc-monitor.tgz \
                      "https://github.com/itzg/mc-monitor/releases/download/${V}/mc-monitor_${V}_${ARCH}.tar.gz"
                  sudo tar -xzf /tmp/mc-monitor.tgz -C /usr/local/bin mc-monitor
                  sudo chmod +x /usr/local/bin/mc-monitor
                  command -v mc-monitor && file /usr/local/bin/mc-monitor

            - name: Login to GHCR (pull mc images)
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            - name: Ensure ghcr.io/kbve/mc:latest present (pull or build)
              run: |
                  set -e
                  if docker pull ghcr.io/kbve/mc:latest 2>/dev/null; then
                      docker tag ghcr.io/kbve/mc:latest kbve/mc:latest
                  else
                      echo "[ensure] ghcr image missing, building locally"
                      moon run mc:container
                  fi
                  docker image inspect kbve/mc:latest >/dev/null

            - name: Boot fabric server (no velocity, SLP allowed pre-login)
              run: |
                  docker rm -f mc-smoke-fabric 2>/dev/null || true
                  docker run -d --name mc-smoke-fabric \
                      -p 25565:25565 \
                      -e EULA=TRUE \
                      -e ONLINE_MODE=false \
                      -e MEMORY=2G \
                      kbve/mc:latest

            - name: Wait for fabric server ready
              run: |
                  for i in $(seq 1 120); do
                      if docker logs mc-smoke-fabric 2>&1 | grep -q "Done ("; then
                          echo "fabric ready after ${i} polls"
                          break
                      fi
                      if [ "$i" -eq 120 ]; then
                          echo "[smoke] fabric never reached Done within 600s"
                          docker logs mc-smoke-fabric 2>&1 | tail -80
                          exit 1
                      fi
                      sleep 5
                  done

            - name: Probe fabric (mc-monitor SLP)
              env:
                  MC_HOST: 127.0.0.1
                  MC_PORT: '25565'
                  RETRY_INTERVAL: 5s
                  RETRY_LIMIT: '24'
              run: bash apps/mc/scripts/server-ping-smoke.sh

            - name: Dump fabric logs on failure
              if: failure()
              run: docker logs mc-smoke-fabric --tail 400 2>&1 || true

            - name: Tear down fabric
              if: always()
              run: docker rm -f mc-smoke-fabric 2>/dev/null || true

    dependency-review:
        name: Dependency Review (PR delta)
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Dependency Review
              uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: on-failure

    track_failure:
        name: Track Failures
        if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request' }}
        needs: [plan, build, client-smoke, server-ping-smoke]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - MC'
            job_name: 'mc'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'failure'

    track_success:
        name: Track Success
        if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request' }}
        needs: [plan, build, client-smoke, server-ping-smoke]
        permissions:
            issues: write
            contents: read
        uses: KBVE/kbve/.github/workflows/utils-ci-failure-tracker.yml@main
        with:
            workflow_name: 'CI - MC'
            job_name: 'mc'
            run_id: ${{ github.run_id }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            status: 'success'
