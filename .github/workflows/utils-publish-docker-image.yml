name: Docker Image Publish

on:
    workflow_call:
        inputs:
            project:
                required: true
                type: string
            target:
                required: true
                type: string
            image:
                required: false
                type: string
                default: ''
            cargo_toml:
                description: 'Path to TOML file with version = "x.y.z" (Cargo.toml or version.toml)'
                required: false
                type: string
                default: ''
            branch:
                required: false
                type: string
                default: main
            version_source:
                description: 'Path to MDX/JSON file with version field (for pre-build sync)'
                required: false
                type: string
                default: ''
            version_target:
                description: 'Path to Cargo.toml/package.json to write version into before build'
                required: false
                type: string
                default: ''
            release_version:
                description: >-
                    The version the tag resolved to. A tag may run ahead of the
                    committed manifest, and an image that bakes its own version
                    in at build time -- edge stamps deno.json into the VERSION
                    its /health reports -- would otherwise ship labelled with the
                    version it replaced. Given this, the build stamps the version
                    files first.
                required: false
                type: string
                default: ''
            version_toml_path:
                description: 'version.toml to stamp with release_version before building'
                required: false
                type: string
                default: ''
            version_target_path:
                description: 'Second version file (Cargo.toml/deno.json) to stamp before building'
                required: false
                type: string
                default: ''
            source_path:
                description: 'Project source path (e.g. apps/cryptothrone). Used to detect Forgejo LFS assets for the rebuild fallback.'
                required: false
                type: string
                default: ''
            runner:
                description: 'Runner label for the publish build. Defaults to ubuntu-latest; heavy compiles (AzerothCore) need a self-hosted runner with real core count.'
                required: false
                type: string
                default: 'ubuntu-latest'
            timeout_minutes:
                description: 'Job timeout. The 60 minute default is ample for Go and Rust images but not for a full AzerothCore compile.'
                required: false
                type: number
                default: 60
        secrets:
            GHCR_TOKEN:
                required: true
            FORGEJO_USER:
                required: false
            FORGEJO_TOKEN:
                required: false

jobs:
    publish:
        runs-on: ${{ inputs.runner }}
        timeout-minutes: ${{ inputs.timeout_minutes }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Free disk space
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: true
                  dotnet: true
                  haskell: true
                  large-packages: false
                  swap-storage: false
                  docker-images: true

            - name: Checkout Repository
              uses: actions/checkout@v7
              continue-on-error: true
              with:
                  ref: ${{ inputs.branch }}

            # docker/login-action fails with "Password required" when the secret
            # resolves empty, which is what a missing secret looks like -- and it
            # names neither the secret nor the caller. Every docker release failed
            # that way while `MY_GITHUB_TOKEN` had never existed in this org.
            - name: Registry credentials present
              env:
                  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
              run: |
                  if [ -z "$GHCR_TOKEN" ]; then
                    echo "::error::GHCR_TOKEN resolved empty. The caller must pass a token with write:packages (release.yml passes secrets.UNITY_PAT)."
                    exit 1
                  fi
                  echo "GHCR_TOKEN present."

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_TOKEN }}

            - name: Check version against GHCR
              id: version_check
              if: ${{ inputs.image != '' && inputs.cargo_toml != '' }}
              run: |
                  # The tag is the release version when there is one. Reading the
                  # committed manifest instead would tag the image with the
                  # version the tag replaced, and check GHCR for the wrong tag --
                  # so a re-release could be skipped as "already published".
                  if [ -n "${{ inputs.release_version }}" ]; then
                    LOCAL_VERSION="${{ inputs.release_version }}"
                    echo "Release version (from tag): $LOCAL_VERSION"
                  else
                    LOCAL_VERSION=$(bash tools/docker/version.sh "${{ inputs.cargo_toml }}")
                    echo "Local version: $LOCAL_VERSION"
                  fi

                  IMAGE="${{ inputs.image }}"
                  GHCR_IMAGE="ghcr.io/${IMAGE#ghcr.io/}"

                  echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

                  if docker manifest inspect "${GHCR_IMAGE}:${LOCAL_VERSION}" >/dev/null 2>&1; then
                    echo "Tag $LOCAL_VERSION already exists on GHCR — skipping."
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "Tag $LOCAL_VERSION not found on GHCR — publishing."
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  fi

            # --- Promote CI image (build-once pattern) ---
            # Try to pull the CI-tagged image pushed by the test job.
            # If found, retag it for release and skip the full rebuild.

            - name: Promote CI image (skip rebuild)
              id: promote
              if: ${{ steps.version_check.outputs.should_publish != 'false' && inputs.image != '' && inputs.cargo_toml != '' }}
              run: |
                  SHORT_SHA="${GITHUB_SHA::8}"
                  CI_IMAGE="ghcr.io/${{ inputs.image }}:ci-${SHORT_SHA}"
                  echo "Attempting to pull CI image: ${CI_IMAGE}"
                  if docker pull "${CI_IMAGE}" 2>/dev/null; then
                    echo "found=true" >> "$GITHUB_OUTPUT"
                    LOCAL_VERSION=$(bash tools/docker/version.sh "${{ inputs.cargo_toml }}")

                    docker tag "${CI_IMAGE}" "ghcr.io/${{ inputs.image }}:latest"
                    docker tag "${CI_IMAGE}" "ghcr.io/${{ inputs.image }}:${LOCAL_VERSION}"
                    echo "Promoted ${CI_IMAGE} → ghcr.io/${{ inputs.image }}:{latest,${LOCAL_VERSION}}"
                  else
                    echo "CI image not found, will build from scratch"
                    echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

            # --- Full build path (fallback when no CI image available) ---

            - name: Setup JavaScript
              uses: ./.github/actions/setup-js

            - name: Set up QEMU
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' && startsWith(inputs.runner, 'ubuntu-') }}
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' }}
              uses: Wandalen/wretry.action@v3.8.0
              with:
                  action: docker/setup-buildx-action@v4
                  attempt_limit: 3
                  attempt_delay: 15000

            - name: Sync version from MDX to build manifest
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' && inputs.version_source != '' && inputs.version_target != '' }}
              run: |
                  SRC="${{ inputs.version_source }}"
                  TGT="${{ inputs.version_target }}"
                  case "$SRC" in
                    *.mdx) VER=$(sed -n 's/^version: *"\([^"]*\)"/\1/p' "$SRC" | head -1) ;;
                    *.json) VER=$(jq -r '.version // ""' "$SRC" 2>/dev/null) ;;
                    *) VER="" ;;
                  esac
                  if [ -n "$VER" ]; then
                    sed -i "s/^version = .*/version = \"${VER}\"/" "$TGT"
                    echo "Synced version ${VER} → ${TGT}"
                  fi

            # A tag-driven release resolves its version before anything is built,
            # and the post-publish sync writes the tree forward only afterwards.
            # That is too late for an image that reads a version file during its
            # own build, so the files are stamped here, in the build checkout.
            # Nothing is committed: this checkout is thrown away, and the atom PR
            # is what makes the change durable.
            - name: Stamp the release version into the build checkout
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' && inputs.release_version != '' }}
              run: |
                  VERSION="${{ inputs.release_version }}"
                  for f in "${{ inputs.version_toml_path }}" "${{ inputs.version_target_path }}"; do
                    [ -z "$f" ] && continue
                    if [ ! -f "$f" ]; then
                      echo "::warning::'$f' not found — skipping."
                      continue
                    fi
                    case "$f" in
                      *.toml)
                        sh tools/release/set-toml-version.sh "$f" "$VERSION"
                        ;;
                      *.json)
                        # sed rather than jq: jq reprints the whole document in
                        # its own style, so a one-line version bump arrived as a
                        # 15-line reindent of deno.json (tabs to spaces).
                        sed 's|^\([[:space:]]*"version"[[:space:]]*:[[:space:]]*\)"[^"]*"|\1"'"$VERSION"'"|' "$f" > "$f.tmp"
                        mv "$f.tmp" "$f"
                        ;;
                      *)
                        echo "::warning::Unknown version file type '$f' — skipping."
                        continue
                        ;;
                    esac
                    echo "Stamped $f to $VERSION"
                  done

            - name: Detect Forgejo LFS assets
              id: lfs_detect
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' }}
              run: |
                  SCOPE="${{ inputs.source_path }}"
                  if [ -n "$SCOPE" ] && git lfs ls-files -I "$SCOPE/**" 2>/dev/null | grep -q .; then
                    echo "uses_lfs=true" >> "$GITHUB_OUTPUT"
                    echo "Forgejo LFS assets present under $SCOPE"
                  else
                    echo "uses_lfs=false" >> "$GITHUB_OUTPUT"
                    echo "No LFS assets under '${SCOPE:-<unset>}' — skipping Forgejo credential setup"
                  fi

            - name: Pull per-game Forgejo LFS blobs
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' && steps.lfs_detect.outputs.uses_lfs == 'true' }}
              env:
                  FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
                  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
                  LFS_SCOPE: ${{ inputs.source_path }}
              run: bash tools/lfs/scope.sh

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # A docker build task inherits its project's toolchain, so on a rust
            # project moon tries to provision rust before running `docker buildx`
            # and dies on proto::locate::missing_executable (no rustup toolchain
            # on this runner). herbmail-api@0.1.3 was the first rust image tagged
            # since the moon migration and failed exactly there. Same two steps
            # ci.yml runs: preinstall the pinned rustup toolchain so moon's own
            # install is a no-op, then `moon setup` for everything
            # .moon/toolchains.yml declares.
            - name: Detect whether the build task needs rust
              id: toolchain
              env:
                  TARGET: ${{ inputs.project }}:${{ inputs.target }}-publish
              run: |
                  if moon task "$TARGET" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s);process.exit((t.toolchains||[]).includes("rust")?0:1)})'; then
                    echo "rust=true" >> "$GITHUB_OUTPUT"
                    echo "$TARGET needs rust"
                  else
                    echo "rust=false" >> "$GITHUB_OUTPUT"
                    echo "$TARGET does not need rust"
                  fi

            - name: Preinstall the rust toolchain
              if: steps.toolchain.outputs.rust == 'true'
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  TARGETS="$(node tools/moon/rust-targets.mjs)"
                  if [ -n "$TARGETS" ]; then
                    echo "rustup target add $TARGETS"
                    # shellcheck disable=SC2086
                    rustup target add $TARGETS
                  fi

            - name: Provision the moon toolchains
              run: moon setup

            - name: Build the image
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' }}
              env:
                  INPUT_GITHUB_TOKEN: ${{ github.token }}
                  # Resolved release version (the value the image is tagged with),
                  # forwarded into builds that declare a value-less PUBLIC_ARPG_VERSION
                  # build-arg (arpg-web) so the bundle's baked version matches the tag
                  # instead of the lagging committed version.toml. Other images ignore it.
                  PUBLIC_ARPG_VERSION: ${{ steps.version_check.outputs.local_version }}
              run: |
                  moon run ${{ inputs.project }}:${{ inputs.target }}-publish

            - name: Ensure image is in Docker daemon
              if: ${{ steps.version_check.outputs.should_publish != 'false' && steps.promote.outputs.found != 'true' && inputs.image != '' }}
              run: |
                  VERSION="${{ steps.version_check.outputs.local_version }}"
                  IMAGE="${{ inputs.image }}"

                  # Try to find the versioned image first, then tag as latest
                  if docker image inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
                    echo "Found ${IMAGE}:${VERSION}, tagging as latest"
                    docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
                  elif ! docker image inspect "${IMAGE}:latest" >/dev/null 2>&1; then
                    echo "Image not in Docker daemon (buildx docker-container driver). Re-exporting..."
                    docker buildx build --platform linux/amd64 \
                      -f $(find . -path "*/${{ inputs.project }}/Dockerfile" -print -quit) \
                      -t "${IMAGE}:latest" \
                      --load \
                      . 2>/dev/null || echo "::warning::Could not re-export image for daemon"
                  fi

            # Trivy removed 03/26/2026 — supply chain compromise (aquasecurity/trivy#10425)
            # Re-evaluate alternative scanners (grype, docker scout) before re-adding.

            - name: Push Docker Images
              if: ${{ steps.version_check.outputs.should_publish != 'false' && inputs.image != '' }}
              run: |
                  IMAGE="${{ inputs.image }}"
                  VERSION="${{ steps.version_check.outputs.local_version }}"
                  GHCR_IMAGE="ghcr.io/${IMAGE#ghcr.io/}"

                  # Ensure latest tag exists
                  if docker image inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
                    docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
                  fi

                  # Ensure GHCR has version + latest tags
                  for TAG in "${VERSION}" "latest"; do
                    if ! docker image inspect "${GHCR_IMAGE}:${TAG}" >/dev/null 2>&1; then
                      # Try to create the tag from whichever source exists
                      for SRC in "${IMAGE}:${TAG}" "${IMAGE}:latest" "${GHCR_IMAGE}:latest"; do
                        if docker image inspect "${SRC}" >/dev/null 2>&1; then
                          docker tag "${SRC}" "${GHCR_IMAGE}:${TAG}"
                          break
                        fi
                      done
                    fi
                  done

                  IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E "^${GHCR_IMAGE}:" | sort -u || true)
                  if [ -z "$IMAGES" ]; then
                    echo "::error::No images found matching '${IMAGE}'. Listing all images:"
                    docker images
                    exit 1
                  fi
                  echo "Pushing images:"
                  echo "$IMAGES"
                  for IMG in $IMAGES; do
                    docker push "$IMG"
                  done
