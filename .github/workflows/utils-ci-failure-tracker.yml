name: CI Failure Tracker

on:
    workflow_call:
        inputs:
            workflow_name:
                required: true
                type: string
            job_name:
                required: true
                type: string
            run_id:
                required: true
                type: string
            run_url:
                required: true
                type: string
            status:
                required: true
                type: string # "failure", "success", "cancelled", "skipped"
            version:
                required: false
                type: string
                default: ''

jobs:
    track:
        if: inputs.status == 'failure' || inputs.status == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            # The job logs endpoint is the only Actions API call here that is
            # not anonymously readable on a public repository: the run's job
            # list returns 200 without a token, the log blob returns 403. With
            # issues:write alone every issue this workflow has ever opened said
            # "Log blob unavailable" and carried no error at all, while the
            # failed step name -- read from the job list -- came through fine,
            # which is what made it look like a timing problem.
            actions: read
            issues: write

        steps:
            # A caller that keeps its own sha in the concurrency group (ci.yml does,
            # so that no commit merged into dev goes unvalidated) runs every push to
            # completion, and those runs finish out of order: a slow shard started at
            # 19:01 reported its failure at 20:25, long after a run started at 19:04
            # had gone green and closed the issue. Four issues opened and closed in
            # two hours that way (#16984, #16989, #16990, #16991) for two real breaks.
            #
            # So the issue records the run that last decided its state, and a result
            # from an older run is dropped. Run ids increase with run creation, which
            # is push order -- the ordering the results themselves do not keep.
            - name: Search for existing failure issue
              id: search
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WORKFLOW_NAME: ${{ inputs.workflow_name }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  set -euo pipefail
                  TITLE="[CI] ${WORKFLOW_NAME} / ${JOB_NAME} — Failed"
                  ISSUE=$(gh issue list --repo "${{ github.repository }}" \
                    --search "\"$TITLE\" in:title" \
                    --state open --json number,title \
                    --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
                  echo "issue_number=${ISSUE:-}" >> "$GITHUB_OUTPUT"
                  echo "title=$TITLE" >> "$GITHUB_OUTPUT"

                  # The marker lives on the open issue, or on the most recently closed
                  # one with this title when there is none -- a stale failure arriving
                  # after a close must not open a second issue for a fixed break.
                  MARKER_ISSUE="${ISSUE:-}"
                  if [ -z "$MARKER_ISSUE" ]; then
                    # Listing rather than searching: the search index lags a close by
                    # up to a minute, which is exactly the window a stale result lands in.
                    MARKER_ISSUE=$(gh issue list --repo "${{ github.repository }}" \
                      --state closed --limit 100 --json number,title,closedAt \
                      --jq "[.[] | select(.title == \"$TITLE\")] | sort_by(.closedAt) | last | .number // empty")
                  fi

                  LAST_RUN=""
                  if [ -n "$MARKER_ISSUE" ]; then
                    LAST_RUN=$(gh issue view "$MARKER_ISSUE" --repo "${{ github.repository }}" \
                      --json body --jq .body \
                      | sed -n 's/.*<!-- ci-tracker:run=\([0-9][0-9]*\) -->.*/\1/p' | head -1)
                  fi

                  STALE=false
                  if [ -n "$LAST_RUN" ] && [ "$RUN_ID" -lt "$LAST_RUN" ]; then
                    STALE=true
                    echo "::notice::Run ${RUN_ID} is older than run ${LAST_RUN}, which last decided #${MARKER_ISSUE}. Dropping this result."
                  fi
                  echo "stale=$STALE" >> "$GITHUB_OUTPUT"

                  if [ -n "${ISSUE:-}" ]; then
                    echo "Found open issue #$ISSUE"
                  else
                    echo "No open issue found"
                  fi

            - name: Extract failed step logs
              if: inputs.status == 'failure' && steps.search.outputs.stale != 'true'
              id: logs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  set -euo pipefail
                  # Snapshot the run's jobs once. Tracker jobs ("Track <job>") match the
                  # job_name input too, so they are excluded — otherwise the tracker reads
                  # its own still-running log blob and stores an Azure BlobNotFound XML body
                  # as the failure summary (#15168).
                  gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                    --paginate --jq '.jobs[] | {id, name, conclusion, steps}' \
                    > /tmp/run_jobs.json 2>/dev/null || echo "" > /tmp/run_jobs.json

                  # Prefer the failed job; fall back to a name match on the job_name input.
                  JOB_ID=$(jq -rs --arg n "$JOB_NAME" \
                    '[.[] | select((.name | startswith("Track ")) | not)]
                     | (map(select(.conclusion == "failure")) + map(select(.name | contains($n))))
                     | .[0].id // empty' /tmp/run_jobs.json 2>/dev/null || echo "")

                  FAILED_STEP=""
                  if [ -n "$JOB_ID" ]; then
                    FAILED_STEP=$(jq -rs --argjson id "$JOB_ID" \
                      '[.[] | select(.id == $id) | .steps[]? | select(.conclusion == "failure") | .name][0] // empty' \
                      /tmp/run_jobs.json 2>/dev/null || echo "")
                  fi

                  # Try to get log snippet — the log blob lands asynchronously, so a fetch
                  # right after the job ends can return an Azure error document instead.
                  # The error is kept rather than discarded: a 403 here means the caller
                  # did not grant actions:read, which is silent and looks exactly like a
                  # blob that never arrived.
                  RAW_LOG=""
                  LOG_SNIPPET="See [run logs](${{ inputs.run_url }}) for details."
                  if [ -n "$JOB_ID" ]; then
                    for attempt in 1 2 3; do
                      CANDIDATE=$(gh api "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" \
                        2>/tmp/log_error.txt || echo "")
                      if [ -n "$CANDIDATE" ] && ! printf '%s' "$CANDIDATE" | head -c 512 | grep -qiE '<\?xml|<Error>|<Code>(BlobNotFound|AuthenticationFailed|ResourceNotFound)'; then
                        RAW_LOG="$CANDIDATE"
                        break
                      fi
                      if grep -qiE 'HTTP 403|Resource not accessible' /tmp/log_error.txt 2>/dev/null; then
                        echo "::warning::Cannot read job logs — the calling job needs actions:read."
                        break
                      fi
                      echo "Log blob not ready (attempt ${attempt}/3), retrying..."
                      sleep 10
                    done
                    if [ -n "$RAW_LOG" ]; then
                      LOG_SNIPPET=$(echo "$RAW_LOG" | tail -50 | head -50)
                    else
                      # Annotations are a separate store and stay readable when the log
                      # blob is not, so a `::error::` line still reaches the issue.
                      ANNOTATIONS=$(gh api "repos/${{ github.repository }}/check-runs/${JOB_ID}/annotations" \
                        --jq '.[] | select(.annotation_level == "failure") | .message' 2>/dev/null | head -20 || echo "")
                      if [ -n "$ANNOTATIONS" ]; then
                        LOG_SNIPPET="$ANNOTATIONS"
                      else
                        LOG_SNIPPET="Log blob unavailable when this issue was written. See [run logs](${{ inputs.run_url }})."
                      fi
                    fi
                  fi

                  # Classify a likely cause from the logs so the issue states WHY, not just where.
                  REASON=""
                  if printf '%s' "${RAW_LOG}${LOG_SNIPPET}" | grep -qiE 'Forgejo LFS auth failed|Authentication required|Authorization error|info/lfs/objects/batch'; then
                    REASON="🔑 Forgejo LFS authentication failed — FORGEJO_TOKEN is likely invalid or expired. Rotate the token via kube (forgejo namespace: forgejo-deploy-keys / forgejo-admin) and re-sync the FORGEJO_TOKEN GitHub secret."
                  fi

                  # Write to file to avoid delimiter issues
                  echo "$LOG_SNIPPET" > /tmp/log_snippet.txt
                  echo "failed_step=${FAILED_STEP:-unknown}" >> "$GITHUB_OUTPUT"
                  echo "reason=${REASON}" >> "$GITHUB_OUTPUT"

            - name: Create new failure issue
              if: inputs.status == 'failure' && steps.search.outputs.issue_number == '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TITLE: ${{ steps.search.outputs.title }}
                  WORKFLOW_NAME: ${{ inputs.workflow_name }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  FAILED_STEP: ${{ steps.logs.outputs.failed_step }}
                  REASON: ${{ steps.logs.outputs.reason }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  LOG_SNIPPET=$(cat /tmp/log_snippet.txt 2>/dev/null || echo "Logs unavailable")
                  RUN_MARKER="<!-- ci-tracker:run=${RUN_ID} -->"
                  VERSION_LINE=""
                  VERSION_MARKER=""
                  if [ -n "${VERSION:-}" ]; then
                    VERSION_LINE="**Version:** ${VERSION}"
                    VERSION_MARKER="<!-- ci-tracker:version=${VERSION} -->"
                  fi
                  REASON_LINE=""
                  if [ -n "${REASON:-}" ]; then
                    REASON_LINE="**Likely cause:** ${REASON}"
                  fi

                  cat > /tmp/issue-body.md << ISSUEEOF
                  ## ${TITLE}
                  ${RUN_MARKER}
                  ${VERSION_MARKER}

                  **Workflow:** ${WORKFLOW_NAME}
                  **Job:** ${JOB_NAME}
                  ${VERSION_LINE}
                  **Failed step:** ${FAILED_STEP}
                  ${REASON_LINE}
                  **Status:** Failing since ${TIMESTAMP}
                  **Consecutive failures:** 1

                  ### Latest Failure

                  - **Run:** [#${RUN_ID}](${RUN_URL})
                  - **Trigger:** ${{ github.event_name }}
                  - **Ref:** ${{ github.ref }}

                  ### Error Summary

                  \`\`\`
                  ${LOG_SNIPPET}
                  \`\`\`

                  ### Failure History

                  | # | Date | Run | Ref | Trigger |
                  |---|------|-----|-----|---------|
                  | 1 | ${TIMESTAMP} | [#${RUN_ID}](${RUN_URL}) | ${{ github.ref }} | ${{ github.event_name }} |

                  ---
                  *Auto-generated by ci-failure-tracker*
                  ISSUEEOF

                  sed 's/^                  //' /tmp/issue-body.md > /tmp/issue-body-clean.md

                  gh issue create --repo "${{ github.repository }}" \
                    --title "$TITLE" \
                    --label "bug,ci,6" \
                    --body-file /tmp/issue-body-clean.md

                  # Search-then-create is not atomic. Two jobs failing within the same
                  # few seconds both search, both find nothing, and both create -- #16768
                  # and #16770 are the same title 40 seconds apart. Whoever creates last
                  # reconciles: keep the lowest number, fold the rest into it. Every run
                  # after this one then finds a single issue and comments on it.
                  DUPES=$(gh issue list --repo "${{ github.repository }}" \
                    --search "\"$TITLE\" in:title" \
                    --state open --json number,title \
                    --jq "[.[] | select(.title == \"$TITLE\") | .number] | sort | .[1:] | .[]")

                  KEEP=$(gh issue list --repo "${{ github.repository }}" \
                    --search "\"$TITLE\" in:title" \
                    --state open --json number,title \
                    --jq "[.[] | select(.title == \"$TITLE\") | .number] | sort | .[0] // empty")

                  for dupe in $DUPES; do
                    echo "Closing duplicate #$dupe in favour of #$KEEP"
                    gh issue comment "$dupe" --repo "${{ github.repository }}" \
                      --body "Duplicate of #${KEEP} — two runs failed close enough together that both opened an issue for the same job. Tracking there."
                    gh issue close "$dupe" --repo "${{ github.repository }}" --reason "not planned"
                  done

            - name: Comment on existing failure issue
              if: inputs.status == 'failure' && steps.search.outputs.issue_number != '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.search.outputs.issue_number }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  FAILED_STEP: ${{ steps.logs.outputs.failed_step }}
                  REASON: ${{ steps.logs.outputs.reason }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  LOG_SNIPPET=$(cat /tmp/log_snippet.txt 2>/dev/null || echo "Logs unavailable")
                  VERSION_LINE=""
                  if [ -n "${VERSION:-}" ]; then
                    VERSION_LINE="- **Version:** ${VERSION}"
                  fi
                  REASON_LINE=""
                  if [ -n "${REASON:-}" ]; then
                    REASON_LINE="- **Likely cause:** ${REASON}"
                  fi

                  cat > /tmp/comment-body.md << COMMENTEOF
                  ## Failure — ${TIMESTAMP}

                  - **Run:** [#${RUN_ID}](${RUN_URL})
                  - **Failed step:** ${FAILED_STEP}
                  ${REASON_LINE}
                  ${VERSION_LINE}
                  - **Ref:** ${{ github.ref }}
                  - **Trigger:** ${{ github.event_name }}

                  \`\`\`
                  ${LOG_SNIPPET}
                  \`\`\`
                  COMMENTEOF

                  sed 's/^                  //' /tmp/comment-body.md > /tmp/comment-body-clean.md

                  gh issue comment "$ISSUE_NUMBER" \
                    --repo "${{ github.repository }}" \
                    --body-file /tmp/comment-body-clean.md

                  # Stamp the run that decided this state, so a slower run started
                  # before it cannot reopen or close the issue behind it.
                  BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body --jq .body)
                  if printf '%s' "$BODY" | grep -q '<!-- ci-tracker:run='; then
                    printf '%s' "$BODY" | sed "s|<!-- ci-tracker:run=[0-9]* -->|<!-- ci-tracker:run=${RUN_ID} -->|" > /tmp/marked-body.md
                  else
                    { printf '%s\n\n' "$BODY"; printf '<!-- ci-tracker:run=%s -->\n' "$RUN_ID"; } > /tmp/marked-body.md
                  fi
                  gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/marked-body.md

            - name: Close resolved issue
              if: inputs.status == 'success' && steps.search.outputs.issue_number != '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.search.outputs.issue_number }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  RESOLVE_TITLE="## Resolved — ${TIMESTAMP}"
                  if [ -n "${VERSION:-}" ]; then
                    RESOLVE_TITLE="## Resolved — shipped v${VERSION} — ${TIMESTAMP}"
                  fi

                  cat > /tmp/resolve-body.md << RESOLVEEOF
                  ${RESOLVE_TITLE}

                  - **Run:** [#${RUN_ID}](${RUN_URL})
                  - **Ref:** ${{ github.ref }}
                  - **Trigger:** ${{ github.event_name }}

                  Auto-closing this issue.
                  RESOLVEEOF

                  sed 's/^                  //' /tmp/resolve-body.md > /tmp/resolve-body-clean.md

                  gh issue comment "$ISSUE_NUMBER" \
                    --repo "${{ github.repository }}" \
                    --body-file /tmp/resolve-body-clean.md

                  # Stamp the run that decided this state, so a slower run started
                  # before it cannot reopen or close the issue behind it.
                  BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body --jq .body)
                  if printf '%s' "$BODY" | grep -q '<!-- ci-tracker:run='; then
                    printf '%s' "$BODY" | sed "s|<!-- ci-tracker:run=[0-9]* -->|<!-- ci-tracker:run=${RUN_ID} -->|" > /tmp/marked-body.md
                  else
                    { printf '%s\n\n' "$BODY"; printf '<!-- ci-tracker:run=%s -->\n' "$RUN_ID"; } > /tmp/marked-body.md
                  fi
                  gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/marked-body.md

                  gh issue close "$ISSUE_NUMBER" \
                    --repo "${{ github.repository }}" \
                    --reason completed
