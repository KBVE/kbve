name: CI Failure Tracker

on:
    workflow_call:
        inputs:
            workflow_name:
                required: true
                type: string
            job_name:
                required: true
                type: string
            run_id:
                required: true
                type: string
            run_url:
                required: true
                type: string
            status:
                required: true
                type: string # "failure", "success", "cancelled", "skipped"
            version:
                required: false
                type: string
                default: ''

jobs:
    track:
        if: inputs.status == 'failure' || inputs.status == 'success'
        runs-on: ubuntu-latest
        # The log blob lands asynchronously and the fetch below backs off for up
        # to two minutes waiting for it. Five was not enough room for that plus
        # the issue writes.
        timeout-minutes: 10
        permissions:
            # The job logs endpoint is the only Actions API call here that is
            # not anonymously readable on a public repository: the run's job
            # list returns 200 without a token, the log blob returns 403. With
            # issues:write alone every issue this workflow has ever opened said
            # "Log blob unavailable" and carried no error at all, while the
            # failed step name -- read from the job list -- came through fine,
            # which is what made it look like a timing problem.
            actions: read
            issues: write
            # tools/ci/failure-summary.mjs is checked out and run below.
            contents: read

        steps:
            # Only the summariser. The tracker reads everything else over the
            # API, and a full checkout of this repository is minutes of LFS.
            - name: Checkout the summariser
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  sparse-checkout: tools/ci
                  sparse-checkout-cone-mode: false

            # A caller that keeps its own sha in the concurrency group (ci.yml does,
            # so that no commit merged into dev goes unvalidated) runs every push to
            # completion, and those runs finish out of order: a slow shard started at
            # 19:01 reported its failure at 20:25, long after a run started at 19:04
            # had gone green and closed the issue. Four issues opened and closed in
            # two hours that way (#16984, #16989, #16990, #16991) for two real breaks.
            #
            # So the issue records the run that last decided its state, and a result
            # from an older run is dropped. Run ids increase with run creation, which
            # is push order -- the ordering the results themselves do not keep.
            - name: Search for existing failure issue
              id: search
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WORKFLOW_NAME: ${{ inputs.workflow_name }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  set -euo pipefail
                  # The identity of the issue is the prefix, and only the prefix.
                  # What follows it is the current headline -- "kinetree:build
                  # could not find cargo" rather than a fourth issue this week
                  # titled "Failed" -- and it is rewritten as the cause changes,
                  # so it cannot take part in matching. Every lookup here and the
                  # reaper's regex therefore anchor on the prefix alone.
                  PREFIX="[CI] ${WORKFLOW_NAME} / ${JOB_NAME} — Failed"

                  # Two lookups, unioned. The search index lags a create by up to
                  # a minute, which is the whole window a duplicate lives in:
                  # #17096 and #17097 are the same break 94 seconds apart, and the
                  # second run searched for the first and did not see it. The
                  # newest hundred open issues are listed unindexed, so a twin
                  # minutes old is always there; search covers the rest of the
                  # repository, where an issue older than a hundred opens is not.
                  gh issue list --repo "${{ github.repository }}" \
                    --search "\"$PREFIX\" in:title" \
                    --state open --json number,title > /tmp/by_search.json
                  gh issue list --repo "${{ github.repository }}" \
                    --state open --limit 100 --json number,title > /tmp/by_list.json
                  ISSUES=$(jq -s --arg p "$PREFIX" \
                    'add | map(select(.title | startswith($p)) | .number) | unique | .[]' \
                    /tmp/by_search.json /tmp/by_list.json)

                  # The lowest number is the one that is kept and reported on;
                  # every other match is a duplicate of it.
                  ISSUE=$(printf '%s\n' "$ISSUES" | head -1)
                  echo "issue_number=${ISSUE:-}" >> "$GITHUB_OUTPUT"
                  echo "issue_numbers=$(printf '%s' "$ISSUES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
                  echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

                  # The marker lives on the open issue, or on the most recently closed
                  # one with this title when there is none -- a stale failure arriving
                  # after a close must not open a second issue for a fixed break.
                  MARKER_ISSUE="${ISSUE:-}"
                  if [ -z "$MARKER_ISSUE" ]; then
                    # Listing rather than searching: the search index lags a close by
                    # up to a minute, which is exactly the window a stale result lands in.
                    MARKER_ISSUE=$(gh issue list --repo "${{ github.repository }}" \
                      --state closed --limit 100 --json number,title,closedAt \
                      --jq "[.[] | select(.title | startswith(\"$PREFIX\"))] | sort_by(.closedAt) | last | .number // empty")
                  fi

                  LAST_RUN=""
                  if [ -n "$MARKER_ISSUE" ]; then
                    LAST_RUN=$(gh issue view "$MARKER_ISSUE" --repo "${{ github.repository }}" \
                      --json body --jq .body \
                      | sed -n 's/.*<!-- ci-tracker:run=\([0-9][0-9]*\) -->.*/\1/p' | head -1)
                  fi

                  STALE=false
                  if [ -n "$LAST_RUN" ] && [ "$RUN_ID" -lt "$LAST_RUN" ]; then
                    STALE=true
                    echo "::notice::Run ${RUN_ID} is older than run ${LAST_RUN}, which last decided #${MARKER_ISSUE}. Dropping this result."
                  fi
                  echo "stale=$STALE" >> "$GITHUB_OUTPUT"

                  if [ -n "${ISSUE:-}" ]; then
                    echo "Found open issue #$ISSUE"
                  else
                    echo "No open issue found"
                  fi

            - name: Extract failed step logs
              if: inputs.status == 'failure' && steps.search.outputs.stale != 'true'
              id: logs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  set -euo pipefail
                  # Snapshot the run's jobs once. Tracker jobs ("Track <job>") match the
                  # job_name input too, so they are excluded — otherwise the tracker reads
                  # its own still-running log blob and stores an Azure BlobNotFound XML body
                  # as the failure summary (#15168).
                  gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                    --paginate --jq '.jobs[] | {id, name, conclusion, steps}' \
                    > /tmp/run_jobs.json 2>/dev/null || echo "" > /tmp/run_jobs.json

                  # Prefer the failed job; fall back to a name match on the job_name input.
                  JOB_ID=$(jq -rs --arg n "$JOB_NAME" \
                    '[.[] | select((.name | startswith("Track ")) | not)]
                     | (map(select(.conclusion == "failure")) + map(select(.name | contains($n))))
                     | .[0].id // empty' /tmp/run_jobs.json 2>/dev/null || echo "")

                  FAILED_STEP=""
                  if [ -n "$JOB_ID" ]; then
                    FAILED_STEP=$(jq -rs --argjson id "$JOB_ID" \
                      '[.[] | select(.id == $id) | .steps[]? | select(.conclusion == "failure") | .name][0] // empty' \
                      /tmp/run_jobs.json 2>/dev/null || echo "")
                  fi

                  # Try to get log snippet — the log blob lands asynchronously, so a fetch
                  # right after the job ends can return an Azure error document instead.
                  # The error is kept rather than discarded: a 403 here means the caller
                  # did not grant actions:read, which is silent and looks exactly like a
                  # blob that never arrived.
                  # The blob is written after the job ends, and the tracker used
                  # to give it thirty seconds. Losing that race is what put
                  # "Process completed with exit code 1" in #16998 -- the log had
                  # the answer two lines up and nobody read it, and #17013 lost
                  # the same race at two minutes. Backs off to about four before
                  # falling through to annotations.
                  RAW_LOG=""
                  if [ -n "$JOB_ID" ]; then
                    for delay in 0 5 10 20 40 60 60 60; do
                      [ "$delay" -gt 0 ] && sleep "$delay"
                      CANDIDATE=$(gh api "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" \
                        2>/tmp/log_error.txt || echo "")
                      if [ -n "$CANDIDATE" ] && ! printf '%s' "$CANDIDATE" | head -c 512 | grep -qiE '<\?xml|<Error>|<Code>(BlobNotFound|AuthenticationFailed|ResourceNotFound)'; then
                        RAW_LOG="$CANDIDATE"
                        break
                      fi
                      if grep -qiE 'HTTP 403|Resource not accessible' /tmp/log_error.txt 2>/dev/null; then
                        echo "::warning::Cannot read job logs — the calling job needs actions:read."
                        break
                      fi
                      echo "Log blob not ready, retrying..."
                    done
                  fi

                  # Both branches produce the same JSON, so the headline that
                  # scopes the title is read the same way whichever one ran.
                  if [ -n "$RAW_LOG" ]; then
                    printf '%s' "$RAW_LOG" > /tmp/raw.log
                    node tools/ci/failure-summary.mjs /tmp/raw.log > /tmp/summary.json
                  else
                    # Annotations are a separate store and stay readable when the
                    # log blob is not. A `run:` step contributes only its exit
                    # code there, so anything else is worth more than all of them.
                    gh api "repos/${{ github.repository }}/check-runs/${JOB_ID}/annotations" \
                      --jq '[.[] | select(.annotation_level == "failure") | .message]' \
                      > /tmp/annotations.json 2>/dev/null || echo '[]' > /tmp/annotations.json
                    node tools/ci/failure-summary.mjs --annotations /tmp/annotations.json > /tmp/summary.json \
                      || printf '{"headline":"","reason":"","excerpt":"Log blob unavailable when this issue was written. See [run logs](%s)."}' \
                         "${{ inputs.run_url }}" > /tmp/summary.json
                  fi
                  jq -r '.excerpt // ""' /tmp/summary.json > /tmp/log_snippet.txt
                  HEADLINE=$(jq -r '.headline // ""' /tmp/summary.json)
                  REASON=$(jq -r '.reason // ""' /tmp/summary.json)
                  echo "cause=$(jq -r '.cause // "unclassified"' /tmp/summary.json)"

                  # What the title says, which is not always what the body
                  # says. A title reading only "Failed" is identical for every
                  # break in the repository (#17013), so when the log offered no
                  # headline the step name goes in instead -- it at least
                  # separates a broken lint run from a broken descriptor check.
                  # The body keeps the empty headline, because there the step is
                  # already named on its own line.
                  TITLE_HEADLINE="$HEADLINE"
                  if [ -z "$TITLE_HEADLINE" ] && [ -n "${FAILED_STEP:-}" ]; then
                    TITLE_HEADLINE="failed in ${FAILED_STEP}"
                  fi

                  # A cause the log text names but the table does not. The LFS one
                  # predates the table and is kept here so a fallback snippet --
                  # where there is no log to classify -- still reaches it.
                  if [ -z "$REASON" ] && grep -qiE 'Forgejo LFS auth failed|info/lfs/objects/batch' /tmp/log_snippet.txt; then
                    REASON="FORGEJO_TOKEN is likely invalid or expired. Rotate the token via kube (forgejo namespace: forgejo-deploy-keys / forgejo-admin) and re-sync the FORGEJO_TOKEN GitHub secret."
                  fi

                  echo "failed_step=${FAILED_STEP:-unknown}" >> "$GITHUB_OUTPUT"
                  echo "headline=${HEADLINE}" >> "$GITHUB_OUTPUT"
                  echo "title_headline=${TITLE_HEADLINE}" >> "$GITHUB_OUTPUT"
                  echo "reason=${REASON}" >> "$GITHUB_OUTPUT"

            - name: Create new failure issue
              if: inputs.status == 'failure' && steps.search.outputs.issue_number == '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREFIX: ${{ steps.search.outputs.prefix }}
                  WORKFLOW_NAME: ${{ inputs.workflow_name }}
                  JOB_NAME: ${{ inputs.job_name }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  FAILED_STEP: ${{ steps.logs.outputs.failed_step }}
                  HEADLINE: ${{ steps.logs.outputs.headline }}
                  TITLE_HEADLINE: ${{ steps.logs.outputs.title_headline }}
                  REASON: ${{ steps.logs.outputs.reason }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TITLE="$PREFIX"
                  if [ -n "${TITLE_HEADLINE:-}" ]; then TITLE="${PREFIX}: ${TITLE_HEADLINE}"; fi
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  LOG_SNIPPET=$(cat /tmp/log_snippet.txt 2>/dev/null || echo "Logs unavailable")
                  RUN_MARKER="<!-- ci-tracker:run=${RUN_ID} -->"
                  VERSION_LINE=""
                  VERSION_MARKER=""
                  if [ -n "${VERSION:-}" ]; then
                    VERSION_LINE="Version ${VERSION}."
                    VERSION_MARKER="<!-- ci-tracker:version=${VERSION} -->"
                  fi
                  # The headline, when there is one, already says what broke, so
                  # the body opens with the cause and the log rather than with
                  # five lines of metadata the title and the run link repeat.
                  HEADLINE_LINE="\`${JOB_NAME}\` is failing in **${FAILED_STEP}**."
                  if [ -n "${HEADLINE:-}" ]; then
                    HEADLINE_LINE="\`${JOB_NAME}\` is failing in **${FAILED_STEP}**: ${HEADLINE}."
                  fi
                  REASON_LINE=""
                  if [ -n "${REASON:-}" ]; then
                    REASON_LINE="**Likely cause.** ${REASON}"
                  fi

                  cat > /tmp/issue-body.md << ISSUEEOF
                  ${RUN_MARKER}
                  ${VERSION_MARKER}
                  ${HEADLINE_LINE}

                  ${REASON_LINE}

                  \`\`\`
                  ${LOG_SNIPPET}
                  \`\`\`

                  Failing since ${TIMESTAMP} — **1** consecutive failure.
                  Workflow \`${WORKFLOW_NAME}\`, job \`${JOB_NAME}\`, on \`${{ github.ref }}\` via ${{ github.event_name }}. ${VERSION_LINE}

                  ### Failure history

                  | # | Date | Run | Ref | Trigger |
                  |---|------|-----|-----|---------|
                  | 1 | ${TIMESTAMP} | [#${RUN_ID}](${RUN_URL}) | ${{ github.ref }} | ${{ github.event_name }} |

                  ---
                  *Auto-generated by ci-failure-tracker*
                  ISSUEEOF

                  sed 's/^                  //' /tmp/issue-body.md > /tmp/issue-body-clean.md

                  gh issue create --repo "${{ github.repository }}" \
                    --title "$TITLE" \
                    --label "bug,ci,6" \
                    --body-file /tmp/issue-body-clean.md

                  # Search-then-create is not atomic. Two jobs failing within the same
                  # few seconds both search, both find nothing, and both create -- #16768
                  # and #16770 are the same title 40 seconds apart. Whoever creates last
                  # reconciles: keep the lowest number, fold the rest into it. Every run
                  # after this one then finds a single issue and comments on it.
                  # Listed rather than searched, for the reason the lookup above
                  # gives: the twin this is meant to fold in is seconds old and
                  # the search index has not reached it yet.
                  MATCHES=$(gh issue list --repo "${{ github.repository }}" \
                    --state open --limit 100 --json number,title \
                    --jq "[.[] | select(.title | startswith(\"$PREFIX\")) | .number] | sort | .[]")

                  KEEP=$(printf '%s\n' "$MATCHES" | head -1)
                  DUPES=$(printf '%s\n' "$MATCHES" | tail -n +2)

                  for dupe in $DUPES; do
                    echo "Closing duplicate #$dupe in favour of #$KEEP"
                    gh issue comment "$dupe" --repo "${{ github.repository }}" \
                      --body "Duplicate of #${KEEP} — two runs failed close enough together that both opened an issue for the same job. Tracking there."
                    gh issue close "$dupe" --repo "${{ github.repository }}" --reason "not planned"
                  done

            - name: Comment on existing failure issue
              if: inputs.status == 'failure' && steps.search.outputs.issue_number != '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.search.outputs.issue_number }}
                  PREFIX: ${{ steps.search.outputs.prefix }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  FAILED_STEP: ${{ steps.logs.outputs.failed_step }}
                  HEADLINE: ${{ steps.logs.outputs.headline }}
                  TITLE_HEADLINE: ${{ steps.logs.outputs.title_headline }}
                  REASON: ${{ steps.logs.outputs.reason }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  LOG_SNIPPET=$(cat /tmp/log_snippet.txt 2>/dev/null || echo "Logs unavailable")
                  VERSION_LINE=""
                  if [ -n "${VERSION:-}" ]; then
                    VERSION_LINE="Version ${VERSION}."
                  fi
                  HEADLINE_LINE=""
                  if [ -n "${HEADLINE:-}" ]; then
                    HEADLINE_LINE="**${HEADLINE}**"
                  fi
                  REASON_LINE=""
                  if [ -n "${REASON:-}" ]; then
                    REASON_LINE="**Likely cause.** ${REASON}"
                  fi

                  cat > /tmp/comment-body.md << COMMENTEOF
                  ### Failed again — ${TIMESTAMP}

                  ${HEADLINE_LINE}

                  ${REASON_LINE}

                  \`\`\`
                  ${LOG_SNIPPET}
                  \`\`\`

                  [Run #${RUN_ID}](${RUN_URL}) — step \`${FAILED_STEP}\`, on \`${{ github.ref }}\` via ${{ github.event_name }}. ${VERSION_LINE}
                  COMMENTEOF

                  sed 's/^                  //' /tmp/comment-body.md > /tmp/comment-body-clean.md

                  gh issue comment "$ISSUE_NUMBER" \
                    --repo "${{ github.repository }}" \
                    --body-file /tmp/comment-body-clean.md

                  # Stamp the run that decided this state, so a slower run started
                  # before it cannot reopen or close the issue behind it.
                  BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body --jq .body)
                  if printf '%s' "$BODY" | grep -q '<!-- ci-tracker:run='; then
                    printf '%s' "$BODY" | sed "s|<!-- ci-tracker:run=[0-9]* -->|<!-- ci-tracker:run=${RUN_ID} -->|" > /tmp/marked-body.md
                  else
                    { printf '%s\n\n' "$BODY"; printf '<!-- ci-tracker:run=%s -->\n' "$RUN_ID"; } > /tmp/marked-body.md
                  fi
                  gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/marked-body.md

                  # A job that starts failing for a new reason keeps its issue --
                  # the prefix is unchanged and it is the same job breaking -- but
                  # the title should say what it is breaking on now rather than
                  # what it broke on the first time.
                  if [ -n "${TITLE_HEADLINE:-}" ]; then
                    gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                      --title "${PREFIX}: ${TITLE_HEADLINE}"
                  fi

            - name: Close resolved issue
              if: inputs.status == 'success' && steps.search.outputs.issue_number != '' && steps.search.outputs.stale != 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBERS: ${{ steps.search.outputs.issue_numbers }}
                  RUN_ID: ${{ inputs.run_id }}
                  RUN_URL: ${{ inputs.run_url }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  RESOLVE_TITLE="## Resolved — ${TIMESTAMP}"
                  if [ -n "${VERSION:-}" ]; then
                    RESOLVE_TITLE="## Resolved — shipped v${VERSION} — ${TIMESTAMP}"
                  fi

                  cat > /tmp/resolve-body.md << RESOLVEEOF
                  ${RESOLVE_TITLE}

                  - **Run:** [#${RUN_ID}](${RUN_URL})
                  - **Ref:** ${{ github.ref }}
                  - **Trigger:** ${{ github.event_name }}

                  Auto-closing this issue.
                  RESOLVEEOF

                  sed 's/^                  //' /tmp/resolve-body.md > /tmp/resolve-body-clean.md

                  # Every open issue for this job, not just the lowest. A green run
                  # used to close one of a duplicate pair and leave the other open
                  # for a break that was already fixed (#17096).
                  for ISSUE_NUMBER in $ISSUE_NUMBERS; do
                    gh issue comment "$ISSUE_NUMBER" \
                      --repo "${{ github.repository }}" \
                      --body-file /tmp/resolve-body-clean.md

                    # Stamp the run that decided this state, so a slower run started
                    # before it cannot reopen or close the issue behind it.
                    BODY=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json body --jq .body)
                    if printf '%s' "$BODY" | grep -q '<!-- ci-tracker:run='; then
                      printf '%s' "$BODY" | sed "s|<!-- ci-tracker:run=[0-9]* -->|<!-- ci-tracker:run=${RUN_ID} -->|" > /tmp/marked-body.md
                    else
                      { printf '%s\n\n' "$BODY"; printf '<!-- ci-tracker:run=%s -->\n' "$RUN_ID"; } > /tmp/marked-body.md
                    fi
                    gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/marked-body.md

                    gh issue close "$ISSUE_NUMBER" \
                      --repo "${{ github.repository }}" \
                      --reason completed
                  done
