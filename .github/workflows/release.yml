name: Release

# Runs only when a release tag is pushed. Nothing here fires on a normal push
# or pull request, so the cost of having it is zero until someone releases.
#
# Tags are `<moon project id>@<semver>` -- axum-kbve@1.0.296 -- which means a
# tag resolves to a node in the project graph. That is what replaces
# .github/ci-dispatch-manifest.json: the graph already knows where every
# project lives, which lane it publishes to and what image it builds, so the
# only fact left for a human to state is the version.
#
# Releasing is deliberate and manual on purpose. The manifest existed to guess
# intent from a diff -- "these files changed, so this app probably wants
# publishing" -- and it guessed from a hand-maintained path list that fell out
# of step with the tree twice over. A tag is the intent, stated once.
on:
    push:
        tags: ['*@*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to verify, e.g. axum-kbve@1.0.296'
                required: true

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        name: Verify tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Overrides the read-only default at the top of the file. Only this job
        # writes, and only to create the draft release.
        permissions:
            contents: write
        outputs:
            project: ${{ steps.tag.outputs.project }}
            version: ${{ steps.tag.outputs.version }}
            source: ${{ steps.tag.outputs.source }}
            lanes: ${{ steps.tag.outputs.lanes }}
            file: ${{ steps.tag.outputs.file }}
            docker_target: ${{ steps.tag.outputs.docker_target }}
            docker_image: ${{ steps.tag.outputs.docker_image }}
            pypi_name: ${{ steps.tag.outputs.pypi_name }}
            external_publish: ${{ steps.tag.outputs.external_publish }}
            deployment_yamls: ${{ steps.tag.outputs.deployment_yamls }}
            runner: ${{ steps.tag.outputs.runner }}
            engine: ${{ steps.tag.outputs.engine }}
            publish: ${{ steps.tag.outputs.publish }}
            shell_path: ${{ steps.tag.outputs.shell_path }}
            tauri_platforms: ${{ steps.tag.outputs.tauri_platforms }}
            tauri_notarize: ${{ steps.tag.outputs.tauri_notarize }}
            web_game_needs_rust: ${{ steps.tag.outputs.web_game_needs_rust }}
            dispatched_at: ${{ steps.tag.outputs.dispatched_at }}
            has_e2e: ${{ steps.tag.outputs.has_e2e }}
            has_test: ${{ steps.tag.outputs.has_test }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            # Resolves the tag against the project graph and the project's own
            # manifest. A mismatch means the version bump was never committed,
            # and publishing it would label an artifact with a version its
            # manifest never claimed.
            - name: Tag matches the manifest
              id: tag
              run: node tools/release/verify-tag.mjs "${{ inputs.tag || github.ref_name }}"

            # GitHub's own generated notes diff against the chronologically
            # previous tag, which in a monorepo interleaves every other
            # project's commits. notes.mjs takes the previous tag *for this
            # project* and asks which commits in that range touched the
            # project's source, so the notes describe the artifact rather than
            # the calendar.
            #
            # Created as a draft: the editorial pass is still worth doing, the
            # transcription is not. Re-running on a tag that already has a
            # release refreshes the notes rather than failing on a second
            # create -- only the body, so a draft edited by hand is the one
            # thing this would overwrite, which is why it stays a draft until a
            # person publishes it.
            - name: Draft the release
              if: ${{ github.event_name == 'push' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  node tools/release/notes.mjs "$TAG" > notes.md
                  cat notes.md >> "$GITHUB_STEP_SUMMARY"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release edit "$TAG" --notes-file notes.md
                  else
                    gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
                  fi

            - name: Summary
              env:
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  {
                    echo "### \`$TAG\`"
                    echo
                    echo "- project: \`${{ steps.tag.outputs.project }}\` at \`${{ steps.tag.outputs.source }}\`"
                    echo "- version: \`${{ steps.tag.outputs.version }}\` (from \`${{ steps.tag.outputs.file }}\`)"
                    echo "- lanes: \`${{ steps.tag.outputs.lanes }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            # A tag whose project opts into no lane is almost always a typo or a
            # project that was never meant to be released, and silently doing
            # nothing is the one outcome that looks identical to success.
            # mc and chisel-ubuntu-axum build several images from one project,
            # so there is no single task a tag can mean. Saying so is better
            # than picking one of them and publishing the wrong image.
            - name: Docker lane has one publish task
              if: ${{ contains(fromJSON(steps.tag.outputs.lanes), 'docker') && steps.tag.outputs.docker_target == '' }}
              run: |
                  echo "::error::${{ steps.tag.outputs.project }} does not resolve to a single" \
                    "container publish task, so this tag cannot say which image to build." \
                    "Run the publish workflow directly with the target you mean."
                  exit 1

            - name: Tag names no publish lane
              if: ${{ steps.tag.outputs.lanes == '[]' }}
              run: |
                  echo "::error::${{ steps.tag.outputs.project }} carries no release lane tag." \
                    "Add one of 'docker', 'npm', 'pypi' or 'crates' to its moon.yml, or do not tag it."
                  exit 1

    # Nothing tested a package before publishing it once the manifest went:
    # npm-test-package.yml, python-test-package.yml and rust-test-crate.yml were
    # each reachable only through ci-publish.yml, and they ran `<project>:e2e`
    # for the projects the manifest flagged has_test.
    #
    # `test` is the gate instead, because every project has one and only one of
    # the 26 crates has an e2e suite -- asking every release for `e2e` would
    # fail on a task that was never meant to exist. The suite runs on top when
    # the project does have it.
    test:
        name: Test before publishing
        needs: [verify]
        if: ${{ github.event_name == 'push' && needs.verify.outputs.has_test == 'true' }}
        # The same runner the publish uses. This compiles the same code, so a
        # project that needs a bigger machine to build needs it to test.
        runs-on: ${{ needs.verify.outputs.runner }}
        timeout-minutes: ${{ needs.verify.outputs.runner == 'ubuntu-latest' && 60 || 240 }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install the system libraries the rust crates link against
              run: |
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y --no-install-recommends \
                    pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                    libpq-dev protobuf-compiler libprotobuf-dev

            - name: Setup Node v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.15.0
                  run_install: false

            - name: Install pnpm Dependencies
              run: pnpm install --frozen-lockfile

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  github-token: ${{ github.token }}

            - name: Setup moon
              uses: ./.github/actions/setup-moon

            - name: Test
              run: moon run ${{ needs.verify.outputs.project }}:test

            - name: End-to-end
              if: ${{ needs.verify.outputs.has_e2e == 'true' }}
              run: moon run ${{ needs.verify.outputs.project }}:e2e

    # Each lane below is the publisher that already existed, called with the
    # project the tag named. They take version_source/version_target to sync a
    # version out of MDX before publishing; under tags the version is already
    # committed and has just been verified, so those are left empty and the
    # sync step skips itself.
    docker:
        name: Publish image
        needs: [verify, test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'docker') }}
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/utils-publish-docker-image.yml
        with:
            project: ${{ needs.verify.outputs.project }}
            target: ${{ needs.verify.outputs.docker_target }}
            image: ${{ needs.verify.outputs.docker_image }}
            cargo_toml: ${{ needs.verify.outputs.file }}
            # A project declares a runner when the default two-core hosted one
            # is not enough for it. Self-hosted runners are declared for builds
            # that do not fit the default budget, so give them a proportionate
            # ceiling rather than raising it for every release.
            runner: ${{ needs.verify.outputs.runner }}
            timeout_minutes: ${{ needs.verify.outputs.runner == 'ubuntu-latest' && 60 || 240 }}
        secrets:
            MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
            FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
            FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

    crates:
        name: Publish crate
        needs: [verify, test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'crates') }}
        permissions:
            contents: write
            packages: write
            issues: write
            pull-requests: write
            id-token: write
        uses: ./.github/workflows/rust-publish-crate.yml
        with:
            package: ${{ needs.verify.outputs.project }}
        secrets:
            CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

    npm:
        name: Publish package
        needs: [verify, test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'npm') }}
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/utils-npm-publish.yml
        with:
            project: ${{ needs.verify.outputs.project }}
        secrets:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    python:
        name: Publish distribution
        needs: [verify, test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'python') }}
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/utils-python-publish.yml
        with:
            project: ${{ needs.verify.outputs.project }}
            pypi_name: ${{ needs.verify.outputs.pypi_name }}
        secrets:
            PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

    # Where a release goes beyond its own registry: itch, Steam, Modrinth, the
    # Factorio mod portal. The deleted ci-docker.yml called this with the dispatch
    # manifest's `external_publish` blob; the blob is the project's own env now,
    # reassembled by verify-tag into the shape this workflow already reads.
    external:
        name: Publish externally
        needs: [verify, test, docker]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && needs.verify.outputs.external_publish != '' }}
        permissions:
            contents: read
        uses: ./.github/workflows/utils-external-publish.yml
        with:
            app_name: ${{ needs.verify.outputs.project }}
            version: ${{ needs.verify.outputs.version }}
            source_path: ${{ needs.verify.outputs.source }}
            external_publish: ${{ needs.verify.outputs.external_publish }}
        secrets:
            MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
            MODRINTH_SESSION: ${{ secrets.MODRINTH_SESSION }}
            MODRINTH_PASSKEY: ${{ secrets.MODRINTH_PASSKEY }}
            ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
            CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
            FACTORIO: ${{ secrets.FACTORIO }}

    # Pin the published tag into the kube manifests ArgoCD watches.
    #
    # Publishing an image does not change what the cluster runs -- Argo deploys
    # whatever tag the manifest names -- so without this a release reaches the
    # registry and stops there. utils-post-publish.yml also wrote version.toml
    # and synced the version into Cargo.toml/package.json; both are hand-edited
    # now and are already committed by the time the tag exists, so only the
    # deployment pin is asked for here.
    deploy:
        name: Pin the deployment tag
        needs: [verify, docker]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && needs.verify.outputs.deployment_yamls != '' }}
        permissions:
            contents: write
            pull-requests: write
            actions: write
        uses: ./.github/workflows/utils-post-publish.yml
        with:
            app_name: ${{ needs.verify.outputs.project }}
            version: ${{ needs.verify.outputs.version }}
            version_toml_path: ''
            image_name: ghcr.io/${{ needs.verify.outputs.docker_image }}
            deployment_yamls: ${{ needs.verify.outputs.deployment_yamls }}
        secrets:
            TRIGGER_PAT: ${{ secrets.TRIGGER_PAT }}

    # The engine lanes. Each calls the build workflow that already existed, with
    # the engine blob the dispatch manifest used to carry -- it is the project's
    # own ENGINE_CONFIG now.
    #
    # `version.toml` is left empty in the version blob on purpose. That field
    # fed a gate comparing the MDX version against the published one, to decide
    # whether a push had bumped anything. A tag is that decision, so the gate
    # has nothing left to weigh and passes.
    godot:
        name: Build and publish (Godot)
        needs: [verify]
        if: ${{ github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'godot') }}
        permissions:
            contents: write
            packages: read
            issues: write
            pull-requests: write
            actions: write
        uses: ./.github/workflows/ci-godot.yml
        with:
            key: ${{ needs.verify.outputs.project }}
            dispatched_at: ${{ needs.verify.outputs.dispatched_at }}
            engine: ${{ needs.verify.outputs.engine }}
            version: '{"source":"","toml":"","manifest":"${{ needs.verify.outputs.version }}"}'
            publish: ${{ needs.verify.outputs.publish }}
        secrets: inherit

    unreal-game:
        name: Build and publish (Unreal)
        needs: [verify]
        if: ${{ github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'unreal-game') }}
        permissions:
            contents: write
            packages: write
            issues: write
            pull-requests: write
            actions: write
        uses: ./.github/workflows/ci-unreal.yml
        with:
            task: game
            key: ${{ needs.verify.outputs.project }}
            dispatched_at: ${{ needs.verify.outputs.dispatched_at }}
            engine: ${{ needs.verify.outputs.engine }}
            version: '{"source":"","toml":"","manifest":"${{ needs.verify.outputs.version }}"}'
            publish: ${{ needs.verify.outputs.publish }}
        secrets: inherit

    ue5-server:
        name: Build and publish (Unreal server)
        needs: [verify]
        if: ${{ github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'ue5-server') }}
        permissions:
            contents: write
            packages: write
            issues: write
            pull-requests: write
            actions: write
        uses: ./.github/workflows/ci-unreal.yml
        with:
            task: server
            key: ${{ needs.verify.outputs.project }}
            dispatched_at: ${{ needs.verify.outputs.dispatched_at }}
            engine: '{"shell_path":"${{ needs.verify.outputs.shell_path }}"}'
            version: '{"source":"","toml":"","manifest":"${{ needs.verify.outputs.version }}"}'
        secrets: inherit

    # Unity takes the engine blob unpacked into flat inputs rather than as JSON,
    # so this is the one lane that names its fields.
    unity:
        name: Build and publish (Unity)
        needs: [verify]
        if: ${{ github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'unity') }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            actions: write
            checks: write
        uses: ./.github/workflows/ci-unity.yml
        with:
            key: ${{ needs.verify.outputs.project }}
            app_name: ${{ needs.verify.outputs.project }}
            project_path: ${{ fromJSON(needs.verify.outputs.engine).project_path }}
            engine_version: ${{ fromJSON(needs.verify.outputs.engine).version }}
            build_targets: ${{ toJSON(fromJSON(needs.verify.outputs.engine).build_targets) }}
            license_method: ${{ fromJSON(needs.verify.outputs.engine).license_method }}
            manifest_version: ${{ needs.verify.outputs.version }}
            deploy_to_itch: ${{ fromJSON(needs.verify.outputs.publish).deploy_to_itch }}
            itch_user: ${{ fromJSON(needs.verify.outputs.publish).itch_user }}
            itch_game: ${{ fromJSON(needs.verify.outputs.publish).itch_game }}
            # Steam is the one target with structured config; it rides in the
            # external_publish blob and is passed through as JSON.
            deploy_to_steam: ${{ needs.verify.outputs.external_publish != '' && contains(needs.verify.outputs.external_publish, 'steam_apps') }}
            steam_apps: ${{ needs.verify.outputs.external_publish != '' && toJSON(fromJSON(needs.verify.outputs.external_publish).steam_apps) || '[]' }}
            dispatched_at: ${{ needs.verify.outputs.dispatched_at }}
        secrets: inherit

    # The Tauri desktop apps. Calls the builder directly rather than through
    # ci-tauri.yml: that one exists to turn a dropdown into a project, and a tag
    # already names the project.
    #
    # The Mac App Store variant of desktop-kbve is deliberately not reachable
    # from a tag. It is a second build of the same version rather than a release
    # of its own, so it stays a dispatch on ci-tauri.yml.
    desktop:
        name: Build (Tauri)
        needs: [verify, test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'desktop') }}
        permissions:
            contents: write
            pull-requests: write
        uses: ./.github/workflows/ci-tauri-builder.yml
        with:
            project: ${{ needs.verify.outputs.project }}
            project_path: ${{ needs.verify.outputs.source }}
            app_name: ${{ needs.verify.outputs.project }}
            notarize: ${{ needs.verify.outputs.tauri_notarize == 'true' }}
            platforms: ${{ needs.verify.outputs.tauri_platforms }}
        secrets: inherit

    # Every browser game, whatever engine built it. ci-vite-game.yml and
    # ci-bevy-game.yml were one workflow each for two games that differ only in
    # their build task, which moon owns.
    web-game:
        name: Build and publish (web)
        needs: [verify]
        if: ${{ github.event_name == 'push' && contains(fromJSON(needs.verify.outputs.lanes), 'web-game') }}
        permissions:
            contents: read
        uses: ./.github/workflows/ci-web-game.yml
        with:
            project: ${{ needs.verify.outputs.project }}
            version: ${{ needs.verify.outputs.version }}
            publish: ${{ needs.verify.outputs.publish }}
            needs_rust: ${{ needs.verify.outputs.web_game_needs_rust == 'true' }}
        secrets:
            ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
