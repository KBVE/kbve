# Workflow tooling. Not a released thing itself.
layer: 'tool'
language: 'javascript'
stack: 'infrastructure'

owners:
    defaultOwner: '@h0lybyte'

tasks:
    # A calling job that grants a called workflow less than it asks for does not
    # fail the job -- GitHub refuses to create the run, with no job and no log.
    # actionlint cannot see it, because every file involved is valid on its own.
    # `lint` rather than a task of its own, so `moon ci` reaches it.
    lint:
        # ci.yml runs `moon ci ':lint' ':test'`, which matches the task id
        # exactly -- a task called lint-pins is never reached by it. The dep is
        # what puts the pin check in CI.
        deps: ['~:lint-pins', '~:lint-tracker']
        command: 'node permissions.mjs'
        toolchains: ['node']
        inputs:
            - 'permissions.mjs'
            - '/.github/workflows/*.yml'

    # A toolchain version written into a workflow is a copy of one that
    # .prototools or package.json already owns, and the copy is what drifts.
    lint-pins:
        command: 'node pins.mjs'
        toolchains: ['node']
        inputs:
            - 'pins.mjs'
            - '/.prototools'
            - '/package.json'
            - '/.github/workflows/*.yml'

    # A tracker issue can only be closed by a call site passing the same
    # workflow_name and job_name it was opened with, so a deleted job strands
    # its issue open forever (#16598). The reaper closes those; this proves it
    # can still read the call sites, which is the half that needs no token.
    lint-tracker:
        command: 'node tracker-reaper.mjs --scan'
        toolchains: ['node']
        inputs:
            - 'tracker-reaper.mjs'
            - '/.github/workflows/*.yml'
