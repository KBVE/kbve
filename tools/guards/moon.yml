$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'tool'
language: 'bash'

tasks:
    # The other half of the stub check below. The guard is the only thing that
    # notices when a root workspace dependency lands without the stubs being
    # regenerated -- #17013 was two of them, `bevy_egui` and `ron`, three
    # commits apart -- and by then it is a red dev. A task means the fix is
    # `moon run guards:sync` rather than a path the failure message has to
    # spell out.
    sync:
        command: 'python3 tools/guards/sync-cargo-workspace-stubs.py'
        options:
            cache: false
            runFromWorkspaceRoot: true

    # Regenerates the baseline after an intentional coverage change, the same
    # way `sync` does for the cargo stubs.
    sync-lfs-baseline:
        command: 'python3 tools/guards/check-lfs-coverage.py --write'
        options:
            cache: false
            runFromWorkspaceRoot: true

    lint:
        deps: ['~:lint-paths', '~:lint-lfs']
        script: >-
            python3 tools/guards/sync-cargo-workspace-stubs.py --check
            && ./tools/guards/kong-config-hash.sh --check
            && python3 tools/guards/validate-vector-config.py
            && python3 tools/guards/check-godot-paths.py
        inputs:
            - '/Cargo.toml'
            - '/apps/**/Cargo.workspace.toml'
            - '/tools/guards/sync-cargo-workspace-stubs.py'
            - '/tools/guards/kong-config-hash.sh'
            - '/tools/guards/validate-vector-config.py'
            - '/tools/guards/check-godot-paths.py'
            - '/.github/workflows/ci-godot-tests.yml'
            - '/apps/**/moon.yml'
            - '/apps/kube/kong/manifests/kong-config.yaml'
            - '/apps/kube/kong/manifests/kong-deployment.yaml'
            - '/apps/kube/vector/manifests/vector-config.yaml'
            - '/apps/kube/vector/manifests/vector-daemonset.yaml'
        options:
            runFromWorkspaceRoot: true

    # A path illegal on Windows anywhere in the tree breaks every Windows job,
    # so the check reads `git ls-files` rather than a fixed input list -- and
    # therefore cannot be cached against one, since the file that breaks it is
    # by definition one nobody thought to list.
    lint-paths:
        command: 'python3 tools/guards/check-portable-paths.py'
        options:
            cache: false
            runFromWorkspaceRoot: true

    # A .gitattributes rule names a product directory literally, and product
    # directories get renamed -- apps/rareicon/unreal to
    # apps/rareicon/unreal-rareicon. The rename commit is green either way;
    # the art commit after it writes real .umap bytes into plain git. Reads
    # `git ls-files` for the same reason lint-paths does: the file that breaks
    # it is the one nobody thought to list.
    lint-lfs:
        script: >-
            bash tools/guards/check-lfs-coverage.test.sh
        options:
            cache: false
            runFromWorkspaceRoot: true
