# Commit scopes that are not a moon project.
#
# A scope should normally name the project the change is in --
# `fix(axum-kbve):` -- and those come from the project graph via
# scopes.lock.json, so they need no listing here. This file is for changes that
# are genuinely repository-wide or span a domain rather than one project.
#
# Seeded from this repository's own history rather than invented: every entry
# below appears at least twice in the last two thousand commits. A validator
# whose vocabulary disagrees with the practice it is meant to describe gets
# turned off within a week.
extra:
    # Repository-wide
    - 'ci' # workflows, actions, runners
    - 'moon' # workspace configuration, toolchains, the project graph
    - 'repo' # gitignore, gitattributes, licence, README
    - 'agents' # AGENTS.md and the conventions it records
    - 'deps' # dependency bumps that span projects
    - 'deps-dev'
    - 'git'
    - 'skills'

    # Language and ecosystem groups
    - 'crates'
    - 'rust'
    - 'python'
    - 'docker'
    - 'codegen'

    # Content collections, which are data rather than a project
    - 'content'
    - 'journal'
    - 'itemdb'
    - 'npcdb'
    - 'mapdb'
    - 'professiondb'

    # Cluster and platform areas, which span several projects each
    - 'kube'
    - 'kubectl'
    - 'kubevirt'
    - 'monitoring'
    - 'observability'
    - 'metrics'
    - 'vector'
    - 'sql'
    - 'auth'
    - 'hardware'
    - 'graph'
    - 'store'
    - 'media'
    - 'dashboard'

    # Game and product families, where a change spans a family's projects
