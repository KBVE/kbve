    # Infrastructure and tooling areas the history uses once or twice each.
    # Included because a scope that is correct but rare is still correct, and
    # the frequency cutoff that seeded this file is not a judgement about them.
    - 'argocd'
    - 'crossplane'
    - 'ci-godot'
