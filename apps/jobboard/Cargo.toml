[package]
name = "jobboard"
authors = ["kbve", "h0lybyte"]
version = "0.1.9"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Job Board — decoupled Rust/Axum REST API (first-party auth)"

[dependencies]
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }

axum = { workspace = true, features = ["default", "macros"] }

tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "cors", "timeout"] }
reqwest = { workspace = true, features = ["rustls", "http2", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }

uuid = { workspace = true, features = ["v4", "serde"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
lru = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "json"] }

prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
dotenvy = { workspace = true }
rustls = { workspace = true, features = ["default", "ring"] }
rust-embed = "8"
mime_guess = "2"

jedi = { path = "../../packages/rust/jedi", features = ["postgres"] }

[build-dependencies]
prost-build = { workspace = true }
tonic-prost-build = { workspace = true }
