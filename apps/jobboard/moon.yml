$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    web-dev:
        script: 'cd web && npm run dev'
        options:
            cache: false
    web-build:
        script: 'cd web && npm run build'
        outputs: ['web/dist']

    # The inherited rust lint and test compile src/rest/spa.rs, whose RustEmbed
    # derive names `web/dist` as its folder. The derive resolves that at compile
    # time, so on a clean checkout -- CI, or a fresh worktree -- both fail with a
    # missing folder rather than anything about the code being linted. Neither
    # task is declared here otherwise; these entries exist only to add the dep.
    lint:
        deps: ['~:web-build']

    test:
        deps: ['~:web-build']
    serve-static:
        script: 'JOBBOARD_WEB_DIR=apps/jobboard/web/dist cargo run -p jobboard'
        options:
            runFromWorkspaceRoot: true
            cache: false
    dev:
        script: 'bash -c ''set -o pipefail; : > jobboards.txt; docker compose up --build 2>&1 | tee /dev/stderr | { grep -iE "error|fail|fatal|panic|unhealthy|exited with code [1-9]|didn.t complete" >> jobboards.txt || true; }; exit ${PIPESTATUS[0]}'''
        options:
            cache: false
    down:
        script: 'docker compose down -v'
        options:
            cache: false
    containerx:
        script: 'docker buildx build --load -f apps/jobboard/Dockerfile -t kbve/jobboard:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/jobboard:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/jobboard:buildcache,mode=max -f apps/jobboard/Dockerfile -t ghcr.io/kbve/jobboard:latest -t kbve/jobboard:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/jobboard/manifest/jobboard-deployment.yaml"]'
