$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    containerx:
        script: 'docker buildx build --load -f apps/vm/kubectl/Dockerfile -t kbve/kubectl:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/kubectl:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/kubectl:buildcache,mode=max -f apps/vm/kubectl/Dockerfile -t ghcr.io/kbve/kubectl:latest -t kbve/kubectl:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The runner a release of this project builds on. Declared because the
    # default two-core hosted runner is not enough for it -- the dispatch
    # manifest carried this per entry, and dropping it would put a build
    # that needs arc-runner-set back on a 60 minute ceiling it cannot meet.
    CI_RUNNER: 'arc-runner-set'
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/kubevirt/autologon/job.yaml","apps/kube/kubevirt/autologon/scaled-job.yaml","apps/kube/kubevirt/runner/job.yaml","apps/kube/kubevirt/runner/scaled-job.yaml","apps/kube/kubevirt/keda/scaled-jobs.yaml","apps/kube/agones/factorio/manifests/rotation-deployment.yaml","apps/kube/agones/palworld/manifests/rotation-deployment.yaml","apps/kube/agones/palworld/jobs/config-restart-job.yaml","apps/kube/namespace/manifests/pod-gc-cronjob.yaml","apps/kube/ca-staleness-monitor/manifests/ca-staleness-monitor.yaml","apps/kube/crossplane/providers/s3-healthcheck-cronjob.yaml","apps/kube/github/runners/manifests/runner-reaper.yaml","apps/kube/forgejo/manifest/forgejo-oauth-register-job.yaml","apps/kube/kilobase/manifests/backup-restore-test.yaml","apps/kube/kilobase/manifests/backup-watchdog.yaml"]'
