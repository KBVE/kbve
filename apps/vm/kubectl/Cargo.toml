[package]
name = "kbve-kubectl"
authors = ["kbve", "h0lybyte"]
version = "0.1.9"
edition = "2021"
rust-version.workspace = true
publish = false
description = "KBVE kubectl wrapper — chiseled Ubuntu kubectl with Rust CLI extensions for KubeVirt VM lifecycle management"

[dependencies]
base64 = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }

[features]
default = []
