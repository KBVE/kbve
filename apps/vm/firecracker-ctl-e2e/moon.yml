$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['vitest']

# The specs under e2e/ are this project's only vitest suite, and they need the
# service the `e2e` task starts. The vitest preset's inherited `test` runs the
# same files with nothing behind them, so it fails on a refused connection or a
# missing container -- which reads as a broken suite rather than a task that was
# never meant to run on its own. `e2e` runs vitest itself, so nothing is lost.
workspace:
    inheritedTasks:
        exclude: ['test']

tasks:
    e2e:
        script: 'docker rm -f firecracker-ctl-e2e 2>/dev/null || true && docker buildx build --platform linux/amd64 -f apps/vm/firecracker-ctl-e2e/mock/Dockerfile.mock -t kbve/firecracker-ctl:mock --load ../../.. && docker run -d --name firecracker-ctl-e2e -p 19001:9001 -e FC_USE_JAILER=false -e RUST_LOG=info -e FC_MAX_CONCURRENT_VMS=5 -e FC_VM_TTL_SECS=60 kbve/firecracker-ctl:mock && echo ''Waiting for firecracker-ctl container to become ready...'' && for i in $(seq 1 60); do if curl -sf http://127.0.0.1:19001/health >/dev/null 2>&1; then echo ''Container ready after ''"$i"''s''; break; fi; if [ $i -eq 60 ]; then echo ''Container did not become ready in 60s''; docker logs firecracker-ctl-e2e 2>&1 | tail -30; docker rm -f firecracker-ctl-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs firecracker-ctl-e2e 2>&1 | tail -50; docker rm -f firecracker-ctl-e2e 2>/dev/null || true; exit $EC'
        options:
            cache: false
