[package]
name = "firecracker-ctl"
authors = ["kbve", "h0lybyte"]
version = "0.1.42"
edition = "2021"
rust-version.workspace = true
publish = false
description = "REST API service for managing Firecracker microVMs"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
uuid = { workspace = true, features = ["v4", "v5"] }
kbve = { path = "../../../packages/rust/kbve", default-features = false, features = ["wallet"] }
tokio-stream = { workspace = true }
dashmap = { workspace = true }
# Used by /fc/* persistent endpoint proxy (Phase 2d) to reverse-proxy
# into the VM on its TAP IP. No TLS needed — connections are plaintext
# over the internal /30 link inside the pod netns.
reqwest = { workspace = true, features = ["stream", "rustls"] }
# Used by fc_destroy to SIGTERM the VMM process via kill(2).
libc = "0.2"
utoipa = { workspace = true, features = ["axum_extras"] }

[dev-dependencies]
tempfile = { workspace = true }
http-body-util = { workspace = true }

[features]
default = []
