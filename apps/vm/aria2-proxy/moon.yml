$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'
tags: ['docker']

tasks:
    containerx:
        script: 'docker buildx build --load -f apps/vm/aria2-proxy/Dockerfile -t kbve/aria2-proxy:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/aria2-proxy:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/aria2-proxy:buildcache,mode=max -f apps/vm/aria2-proxy/Dockerfile -t ghcr.io/kbve/aria2-proxy:latest -t kbve/aria2-proxy:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/kubevirt/download-proxy/deployment.yaml"]'
