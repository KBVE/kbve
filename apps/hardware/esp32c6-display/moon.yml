$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust']

tasks:
    build:
        script: 'set -a; [ -f wifi.env ] && . ./wifi.env; set +a; cargo build --release'
    flash:
        script: 'espflash flash --monitor ../../../dist/target/riscv32imac-unknown-none-elf/release/esp32c6-display'
        deps: ['~:build']
    monitor:
        script: 'espflash monitor'
    lint:
        script: 'set -a; [ -f wifi.env ] && . ./wifi.env; set +a; cargo clippy --release -- -D warnings'
