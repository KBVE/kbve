$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker', 'vitest']

tasks:
    container-publish:
        script: 'docker buildx build --push --cache-from=type=registry,ref=ghcr.io/kbve/agones-factorio:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/agones-factorio:buildcache,mode=max -f apps/agones/factorio/Dockerfile -t ghcr.io/kbve/agones-factorio:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
    e2e:
        script: 'docker rm -f agones-factorio-e2e 2>/dev/null || true && docker run -d --name agones-factorio-e2e -p 34197:34197/udp -p 27015:27015/tcp -e FACTORIO_RCON_PASSWORD=e2e-test -e FACTORIO_RCON_BIND=0.0.0.0 kbve/agones-factorio:latest && echo ''Waiting for Factorio to come up...'' && for i in $(seq 1 240); do if docker logs agones-factorio-e2e 2>&1 | grep -q ''Hosting game''; then echo ''Factorio ready after ''"$i"''s''; break; fi; if [ $i -eq 240 ]; then echo ''Factorio did not start in 240s''; docker logs agones-factorio-e2e 2>&1 | tail -120; docker rm -f agones-factorio-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && FACTORIO_HOST=127.0.0.1 FACTORIO_UDP=34197 FACTORIO_RCON=27015 FACTORIO_RCON_PASSWORD=e2e-test FACTORIO_CONTAINER=agones-factorio-e2e npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs agones-factorio-e2e 2>&1 | tail -120; docker rm -f agones-factorio-e2e 2>/dev/null || true; exit $EC'
        deps: ['~:container']
        options:
            cache: false

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/factorio/manifests/gameserver.yaml"]'
    # A release of this project also publishes the Factorio mods to
    # mods.factorio.com. Which mods is the `factorio-mod` lane in the graph, not
    # a list here -- the dispatch manifest carried {name, source_path} pairs and
    # both facts are a project.
    PUBLISHES_FACTORIO_MODS: 'true'
