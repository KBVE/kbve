$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker', 'vitest']

tasks:
    e2e:
        script: 'docker rm -f agones-factorio-e2e 2>/dev/null || true && docker run -d --name agones-factorio-e2e -p 34197:34197/udp -p 27015:27015/tcp -e FACTORIO_RCON_PASSWORD=e2e-test -e FACTORIO_RCON_BIND=0.0.0.0 kbve/agones-factorio:latest && echo ''Waiting for Factorio to come up...'' && for i in $(seq 1 240); do if docker logs agones-factorio-e2e 2>&1 | grep -q ''Hosting game''; then echo ''Factorio ready after ''"$i"''s''; break; fi; if [ $i -eq 240 ]; then echo ''Factorio did not start in 240s''; docker logs agones-factorio-e2e 2>&1 | tail -120; docker rm -f agones-factorio-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && FACTORIO_HOST=127.0.0.1 FACTORIO_UDP=34197 FACTORIO_RCON=27015 FACTORIO_RCON_PASSWORD=e2e-test FACTORIO_CONTAINER=agones-factorio-e2e npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs agones-factorio-e2e 2>&1 | tail -120; docker rm -f agones-factorio-e2e 2>/dev/null || true; exit $EC'
        deps: ['~:container']
        options:
            cache: false
