$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    containerx:
        script: 'docker buildx build --load -f apps/agones/factorio/relay/Dockerfile -t kbve/agones-factorio-relay:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/agones-factorio-relay:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/agones-factorio-relay:buildcache,mode=max -f apps/agones/factorio/relay/Dockerfile -t ghcr.io/kbve/agones-factorio-relay:latest -t kbve/agones-factorio-relay:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/factorio/manifests/gameserver.yaml"]'
