$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker']

tasks:
    test:
        script: 'uv run --with-requirements requirements.txt --python 3.12 python -m unittest discover .'
    e2e:
        script: 'rm -rf .e2e-venv && python3 -m venv .e2e-venv && .e2e-venv/bin/pip install --quiet -r requirements.txt coverage && .e2e-venv/bin/python -m coverage run --source=save_intel -m unittest discover . && .e2e-venv/bin/python -m coverage run --append --source=save_intel e2e_save_intel.py && .e2e-venv/bin/python -m coverage report --show-missing --fail-under=70'
        deps: ['~:container']
        options:
            cache: false
    containerx:
        script: 'docker buildx build --load -f apps/agones/palworld/savetool/Dockerfile -t kbve/agones-palworld-savetool:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/agones-palworld-savetool:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/agones-palworld-savetool:buildcache,mode=max -f apps/agones/palworld/savetool/Dockerfile -t ghcr.io/kbve/agones-palworld-savetool:latest -t kbve/agones-palworld-savetool:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
