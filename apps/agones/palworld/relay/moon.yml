$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    containerx:
        script: 'docker buildx build --load -f apps/agones/palworld/relay/Dockerfile -t kbve/agones-palworld-relay:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/agones-palworld-relay:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/agones-palworld-relay:buildcache,mode=max -f apps/agones/palworld/relay/Dockerfile -t ghcr.io/kbve/agones-palworld-relay:latest -t kbve/agones-palworld-relay:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
