$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker', 'vite', 'vitest']

tasks:
    dev:
        script: 'vite'
    build:
        script: 'vite build && vite build --mode embed && vite build --mode discord'
        outputs: ['dist']
    build-app:
        script: 'vite build'
        outputs: ['dist']
    build-embed:
        script: 'vite build --mode embed'
        outputs: ['dist/arpg-embed.js']
    build-discord:
        script: 'vite build --mode discord'
        outputs: ['dist/discord/arpg']
    typecheck:
        script: 'tsc --noEmit'
    preview:
        script: 'vite preview'
        deps: ['~:build-app']
    # The registry build of the `container` task the docker tag provides.
    # It lives here rather than on the parent arpg project because a release
    # tag names a project and then looks for that project's publish task; a
    # task on a sibling is one a tag can never reach.
    container-publish:
        script: 'docker buildx build --load --build-arg PUBLIC_ARPG_VERSION --cache-from=type=registry,ref=ghcr.io/kbve/arpg-web:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/arpg-web:buildcache,mode=max -f apps/agones/arpg/web/Dockerfile -t kbve/arpg-web:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The runner a release of this project builds on. Declared because the
    # default two-core hosted runner is not enough for it -- the dispatch
    # manifest carried this per entry, and dropping it would put a build
    # that needs arc-runner-set back on a 60 minute ceiling it cannot meet.
    CI_RUNNER: 'arc-runner-set'
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/arpg/manifests/web-deployment.yaml"]'
