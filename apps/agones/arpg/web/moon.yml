$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker', 'vite', 'vitest']

tasks:
    dev:
        script: 'vite'
    build:
        script: 'vite build && vite build --mode embed && vite build --mode discord'
        outputs: ['dist']
    build-app:
        script: 'vite build'
        outputs: ['dist']
    build-embed:
        script: 'vite build --mode embed'
        outputs: ['dist/arpg-embed.js']
    build-discord:
        script: 'vite build --mode discord'
        outputs: ['dist/discord/arpg']
    typecheck:
        script: 'tsc --noEmit'
    preview:
        script: 'vite preview'
        deps: ['~:build-app']
    # The registry build of the `container` task the docker tag provides.
    # It lives here rather than on the parent arpg project because a release
    # tag names a project and then looks for that project's publish task; a
    # task on a sibling is one a tag can never reach.
    container-publish:
        script: 'docker buildx build --load --build-arg PUBLIC_ARPG_VERSION --cache-from=type=registry,ref=ghcr.io/kbve/arpg-web:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/arpg-web:buildcache,mode=max -f apps/agones/arpg/web/Dockerfile -t kbve/arpg-web:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
