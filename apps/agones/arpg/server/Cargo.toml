[package]
name = "arpg-server"
authors = ["kbve", "h0lybyte"]
version = "0.1.28"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "ARPG game server — axum + tokio host for the simgrid grid-authoritative bevy sim (Diablo-style isometric)."

[[bin]]
name = "arpg-server"
path = "src/main.rs"

[dependencies]
simgrid = { path = "../../../../packages/rust/simgrid" }
bevy_items = { path = "../../../../packages/rust/bevy/bevy_items" }
bevy_spells = { path = "../../../../packages/rust/bevy/bevy_spells" }
bevy_mapdb = { path = "../../../../packages/rust/bevy/bevy_mapdb" }
jedi = { path = "../../../../packages/rust/jedi", features = ["postgres", "valkey", "observ"] }
bevy = { workspace = true, features = ["bevy_state"] }
axum = { workspace = true, features = ["ws", "json", "http1", "tokio"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
async-trait = { workspace = true }
agones = { workspace = true }
serde_json = { workspace = true }
