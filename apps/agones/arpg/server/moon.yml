$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    build:
        script: 'cargo build -p arpg-server'
        outputs: ['/dist/target/debug/arpg-server']
        options:
            runFromWorkspaceRoot: true
    build-release:
        script: 'cargo build --release -p arpg-server'
        outputs: ['/dist/target/release/arpg-server']
        options:
            runFromWorkspaceRoot: true
    container-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/arpg-server:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/arpg-server:buildcache,mode=max -f apps/agones/arpg/server/Dockerfile -t kbve/arpg-server:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/arpg/manifests/fleet.yaml"]'
