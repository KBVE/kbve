$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    build:
        script: 'cargo build -p herbmail-server'
        outputs: ['/dist/target/debug/herbmail-server']
        options:
            runFromWorkspaceRoot: true
    build-release:
        script: 'cargo build --release -p herbmail-server'
        outputs: ['/dist/target/release/herbmail-server']
        options:
            runFromWorkspaceRoot: true
    e2e:
        script: 'docker rm -f herbmail-server-e2e 2>/dev/null || true && docker run -d --name herbmail-server-e2e -p 7979:7979 -e HM_SERVER_ADDR=0.0.0.0:7979 kbve/herbmail-server:latest && echo ''Waiting for herbmail-server...'' && for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:7979/healthz >/dev/null 2>&1; then echo ''ready after ''"$i"''s''; break; fi; if [ $i -eq 60 ]; then echo ''did not start in 60s''; docker logs herbmail-server-e2e 2>&1 | tail -80; docker rm -f herbmail-server-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && HM_HOST=127.0.0.1 HM_PORT=7979 npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs herbmail-server-e2e 2>&1 | tail -80; docker rm -f herbmail-server-e2e 2>/dev/null || true; exit $EC'
        deps: ['~:container']
        options:
            cache: false
    container-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/herbmail-server:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/herbmail-server:buildcache,mode=max -f apps/agones/herbmail/server/Dockerfile -t kbve/herbmail-server:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
