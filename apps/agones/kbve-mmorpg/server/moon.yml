$schema: 'https://moonrepo.dev/schemas/project.json'

# Dedicated server for apps/arcade/kbve-mmorpg. Headless bevy + avian3d, replicated
# with lightyear over a WebSocket, hosted on Agones.
layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    build:
        script: 'cargo build -p mmorpg-server'
        outputs: ['/dist/target/debug/mmorpg-server']
        options:
            runFromWorkspaceRoot: true
    build-release:
        script: 'cargo build --release -p mmorpg-server'
        outputs: ['/dist/target/release/mmorpg-server']
        options:
            runFromWorkspaceRoot: true
    container-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/mmorpg-server:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/mmorpg-server:buildcache,mode=max -f apps/agones/kbve-mmorpg/server/Dockerfile -t kbve/mmorpg-server:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The runner a release of this project builds on. bevy, avian and lightyear
    # in one release profile is not a two-core job -- the same reason friendslop
    # declares it.
    CI_RUNNER: 'arc-runner-set'
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/mmorpg/manifests/fleet.yaml"]'
