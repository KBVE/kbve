[package]
name = "kbve-mmorpg-server"
authors = ["kbve", "h0lybyte"]
version = "0.0.1"
edition = "2024"
publish = false
rust-version.workspace = true
license = "MIT"
description = "mmorpg dedicated server — authoritative avian3d sim replicated with lightyear over WebSocket, hosted on Agones."

[[bin]]
name = "kbve-mmorpg-server"
path = "src/main.rs"

[dependencies]
mmorpg_net = { path = "../../../../crates/mmorpg_net" }
# Netcode token helpers only -- the protocol in that crate is isometric's.
bevy_kbve_net = { path = "../../../../crates/bevy_kbve_net" }
bevy = { workspace = true, default-features = false, features = ["std", "bevy_state"] }
lightyear = { workspace = true, features = [
	"server",
	"replication",
	"prediction",
	"interpolation",
	"input_native",
	"netcode",
	"websocket",
	"websocket_self_signed",
	"avian3d",
] }
lightyear_avian3d = { version = "0.29", default-features = false, features = ["3d"] }
avian3d = { workspace = true, default-features = false, features = [
	"3d",
	"f32",
	"parry-f32",
	"serialize",
] }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["default", "rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
agones = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
jedi = { path = "../../../../crates/jedi" }
ulid = { workspace = true, features = ["std"] }
rand = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["default", "rust_crypto"] }
