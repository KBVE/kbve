# Playerbots overlay. Layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.playerbots.yml ...
#
# Rebuilds the WHOLE ToCloud9 stack from the KBVE fork, not just the
# worldserver. That is not optional: the integration it carries changes api/proto
# (guilds, worldserver) and shared/events, so it is a wire-protocol change. The
# published ghcr.io/walkline/* images cannot talk to this worldserver, and
# mixing them produces protocol errors rather than a clean failure.
#
# Only mysql / nats / redis stay on their pinned upstream images.
#
# The KBVE fork descends from the 20260728 snapshot of 3kynox's integration and
# carries our patches on top. Forking is partly why: those were personal
# integration branches that get rebased and deleted as work lands upstream, so
# the SHAs could vanish. Refs stay commit SHAs, not branches -- this must match
# TOCLOUD9_REF in gameserver/Dockerfile exactly, or the Go services and the
# worldserver's libsidecar disagree on the wire protocol.
#
# Go services use a git build context, so nothing needs cloning locally.
# Bump TC9_FORK_REF and PLAYERBOTS_* together -- the module's mmaps work and the
# core that reads it are a matched pair.

x-tc9-fork: &tc9_fork
    context: https://github.com/KBVE/ToCloud9.git#72d67abbf615f9a26a2dd569be87a47a5773de3f

services:
    # --- core (compiled from AC + module + libsidecar) ---

    ac-db-import:
        image: kbve/tocloud9-db-import-playerbots:${PLAYERBOTS_TAG:-dev}
        # Base compose forces linux/amd64 for the upstream image. We compile
        # natively instead -- emulating a full AzerothCore build under QEMU is
        # not worth the hours. CI sets this to linux/amd64.
        platform: ${PLAYERBOTS_PLATFORM:-linux/arm64}
        build:
            context: ./gameserver
            dockerfile: Dockerfile
            target: db-import
            additional_contexts:
                modules: ./modules
        environment:
            # dbimport only ever opens auth/world/characters pools -- it never registers
            # PlayerbotsDatabase, so 15 has no 4th bit to act on and behaves as 7.
            # acore_playerbots is created and migrated by the module inside
            # worldserver instead, from modules/mod-playerbots/data/sql.
            AC_UPDATES_ENABLE_DATABASES: '7'
            AC_UPDATES_AUTO_SETUP: '1'
            # ToCloud9's db-import stage hardcodes this, unlike the upstream image.
            AC_DATA_DIR: /repo/data

    # The base stack pins v19 because the OLD gameserver-ac image (2026-04-29,
    # Go libsidecar) expected generator v19 mmaps. 3kynox's nav5 core carries
    # the mmaps changes from mod-playerbots PR #204 and expects v20 -- v19 tiles
    # are rejected per-tile with
    #   MMAP:loadMap: <tile>.mmtile was built with generator v19, expected v20
    # which leaves bots (and players) without navmesh on those tiles.
    download-miscs:
        environment:
            CLIENT_DATA_URL: ${PLAYERBOTS_CLIENT_DATA_URL:-https://github.com/wowgaming/client-data/releases/download/v20.0/Data.zip}

    gameserver-ac:
        image: kbve/tocloud9-gameserver-playerbots:${PLAYERBOTS_TAG:-dev}
        platform: ${PLAYERBOTS_PLATFORM:-linux/arm64}
        build:
            context: ./gameserver
            dockerfile: Dockerfile
            target: gameserver
            additional_contexts:
                modules: ./modules
        environment:
            # The C++ libsidecar reads ONLY TC9_*-prefixed variables. The bare
            # names in the base compose (NATS_URL, SERVERS_REGISTRY_SERVICE_ADDRESS,
            # ...) are leftovers from the Go libsidecar and are silently ignored,
            # so the sidecar falls back to localhost defaults and fails with
            #   RegisterGameServer RPC failed: ipv4:127.0.0.1:8999: Connection refused
            # The kube manifests already set both spellings; compose did not.
            TC9_NATS_URL: nats://nats:4222
            TC9_SERVERS_REGISTRY_ADDRESS: servers-registry:8999
            TC9_GUID_PROVIDER_ADDRESS: guidserver:8996
            TC9_MATCHMAKING_ADDRESS: matchmakingserver:8994
            TC9_GROUP_SERVICE_ADDRESS: groupserver:8998
            TC9_GUILD_SERVICE_ADDRESS: guildserver:8995
            TC9_GRPC_PORT: 9509
            TC9_PREFERRED_HOSTNAME: gameserver-ac
            TC9_CHARACTER_GUIDS_BUFFER_SIZE: 5
            TC9_ITEM_GUIDS_BUFFER_SIZE: 50
            AC_PLAYERBOTS_DATABASE_INFO: '${PLAYERBOTS_DB_HOST};${PLAYERBOTS_DB_PORT};${PLAYERBOTS_DB_USER};${PLAYERBOTS_DB_PASS};${PLAYERBOTS_DB_NAME}'
            # ConfigMgr applies AC_* env overrides to module configs too, using the
            # same camelCase split as the core (LoginDatabaseInfo ->
            # AC_LOGIN_DATABASE_INFO). Keeps playerbots.conf's 2699 lines as the
            # baseline while letting us tune the few knobs that matter.
            # Without this the module opens the pool, finds no database and
            # gives up -- it will not self-populate acore_playerbots.
            AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: '1'
            # Required by mod-playerbots. worldserver.conf ships this at 0, and
            # bots run on grids no real player has activated, so without the
            # preload they operate against unloaded terrain. Costs a lot of RAM
            # and a slower startup, since every non-instanced grid loads up front.
            AC_PRELOAD_ALL_NON_INSTANCED_MAP_GRIDS: '1'
            # Matches worldserver-fleet.yaml. worldserver.conf ships
            # MapUpdate.Threads = 1, so without this the compose stack measures a
            # single-threaded world loop and kube runs a four-threaded one --
            # exactly the drift that makes a tick budget verified here mean
            # nothing there. Overridable so a laptop can pin it back to 1.
            AC_MAP_UPDATE_THREADS: '${AI_MAP_UPDATE_THREADS:-4}'
            AC_AI_PLAYERBOT_ENABLED: '${AI_PLAYERBOT_ENABLED:-1}'
            # Deliberately low for a first run. The upstream default is 500, which
            # would swamp a laptop and make it impossible to tell a bot bug from
            # simple CPU starvation.
            #
            # Min AND Max must move together. playerbots.conf ships both at 500,
            # and lowering only Max leaves the pair inverted -- the bot manager
            # calls urand(min, max), which trips
            #   ASSERTION FAILED  Random.cpp:46  urand  Condition: max >= min
            # and the worldserver aborts with SIGSEGV (exit 139) seconds after
            # reaching "ready", well after startup looks clean.
            AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: '${AI_PLAYERBOT_MAX_RANDOM_BOTS:-20}'
            AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: '${AI_PLAYERBOT_MAX_RANDOM_BOTS:-20}'
            AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: '${AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN:-1}'

    # --- Go services, rebuilt from the same fork for protocol parity ---

    servers-registry:
        image: kbve/tocloud9-servers-registry-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/servers-registry/Dockerfile

    authserver:
        image: kbve/tocloud9-authserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/authserver/Dockerfile

    charserver:
        image: kbve/tocloud9-charserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/charserver/Dockerfile

    chatserver:
        image: kbve/tocloud9-chatserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/chatserver/Dockerfile

    guildserver:
        image: kbve/tocloud9-guildserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/guildserver/Dockerfile

    guidserver:
        image: kbve/tocloud9-guidserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/guidserver/Dockerfile

    mailserver:
        image: kbve/tocloud9-mailserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/mailserver/Dockerfile

    auctionhouse:
        image: kbve/tocloud9-auctionhouse-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/auctionhouse/Dockerfile

    groupserver:
        image: kbve/tocloud9-groupserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/groupserver/Dockerfile

    matchmakingserver:
        image: kbve/tocloud9-matchmakingserver-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/matchmakingserver/Dockerfile

    gateway:
        image: kbve/tocloud9-gateway-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/gateway/Dockerfile

    gateway-second:
        image: kbve/tocloud9-gateway-playerbots:${PLAYERBOTS_TAG:-dev}
        build:
            <<: *tc9_fork
            dockerfile: apps/gateway/Dockerfile
