$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    # The registry build, which is CI's. It pushes rather than loading, and
    # carries the buildcache the local task has no use for.
    container-publish:
        script: >-
            docker buildx build --push
            --cache-from=type=registry,ref=ghcr.io/kbve/agones-shim:buildcache
            --cache-to=type=registry,ref=ghcr.io/kbve/agones-shim:buildcache,mode=max
            -f $projectSource/Dockerfile
            -t ghcr.io/kbve/agones-shim:latest
            .
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/tocloud9/manifests/worldserver-fleet.yaml","apps/kube/agones/tocloud9/manifests/worldserver-b-fleet.yaml","apps/kube/agones/tocloud9/manifests/gateway-fleet.yaml","apps/kube/agones/tocloud9/manifests/authserver-fleet.yaml"]'
