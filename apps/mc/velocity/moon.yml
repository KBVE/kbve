$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker', 'vitest']

tasks:
    container-publish:
        script: 'docker buildx build --push --cache-from=type=registry,ref=ghcr.io/kbve/mc-velocity:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/mc-velocity:buildcache,mode=max -f apps/mc/velocity/Dockerfile -t ghcr.io/kbve/mc-velocity:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
    e2e:
        script: 'docker rm -f mc-velocity-e2e 2>/dev/null || true && docker run -d --name mc-velocity-e2e -p 25578:25577 -e TYPE=VELOCITY -e MEMORY=512M -e PLUGINS=''https://cdn.modrinth.com/data/Vebnzrzj/versions/GZjsuCmU/LuckPerms-Velocity-5.5.17.jar'' kbve/mc-velocity:latest && echo ''Waiting for Velocity to come up...'' && for i in $(seq 1 300); do if docker logs mc-velocity-e2e 2>&1 | grep -q ''Done (''; then echo ''Velocity ready after ''"$i"''s''; break; fi; if [ $i -eq 300 ]; then echo ''Velocity did not start in 300s''; docker logs mc-velocity-e2e 2>&1 | tail -80; docker rm -f mc-velocity-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && VELOCITY_HOST=127.0.0.1 VELOCITY_PORT=25578 VELOCITY_CONTAINER=mc-velocity-e2e npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs mc-velocity-e2e 2>&1 | tail -80; docker rm -f mc-velocity-e2e 2>/dev/null || true; exit $EC'
        deps: ['~:container']
        options:
            cache: false
