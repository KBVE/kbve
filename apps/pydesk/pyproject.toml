[project]
name = "pydesk"
version = "0.1.0"
description = "PyDesk - FastAPI application with fudster and kbve library integrations"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fudster[all]>=0.1.0",
    "kbve>=0.1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.uv.sources]
fudster = { path = "../../packages/python/fudster", editable = true }
kbve = { path = "../../packages/python/kbve", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-sugar>=0.9,<2.0",
    "pytest-cov>=4.1,<7.0",
    "pytest-html>=4.0,<6.0",
]

[tool.coverage.run]
branch = true
source = [ "pydesk" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../coverage/apps/pydesk/html' --cov-report xml:'../../coverage/apps/pydesk/coverage.xml' --html='../../reports/apps/pydesk/unittests/html/index.html' --junitxml='../../reports/apps/pydesk/unittests/junit.xml'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# flake8's default rule set, which is what the .flake8 files this replaces were
# running: pycodestyle errors and warnings plus pyflakes. Ruff's own default is
# narrower (E4, E7, E9, F), so it is named rather than inherited.
select = ["E", "W", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
