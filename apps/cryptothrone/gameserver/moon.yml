$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    build:
        script: 'cargo build -p cryptothrone-server'
        outputs: ['/dist/target/debug/cryptothrone-server']
        options:
            runFromWorkspaceRoot: true
    build-release:
        script: 'cargo build --release -p cryptothrone-server'
        outputs: ['/dist/target/release/cryptothrone-server']
        options:
            runFromWorkspaceRoot: true
    e2e:
        script: 'docker rm -f cryptothrone-server-e2e 2>/dev/null || true && docker run -d --name cryptothrone-server-e2e -p 7979:7979 -e CT_SERVER_ADDR=0.0.0.0:7979 kbve/cryptothrone-server:latest && echo ''Waiting for cryptothrone-server...'' && for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:7979/healthz >/dev/null 2>&1; then echo ''ready after ''"$i"''s''; break; fi; if [ $i -eq 60 ]; then echo ''did not start in 60s''; docker logs cryptothrone-server-e2e 2>&1 | tail -80; docker rm -f cryptothrone-server-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && CT_HOST=127.0.0.1 CT_PORT=7979 npx vitest run; EC=$?; echo ''--- container logs ---''; docker logs cryptothrone-server-e2e 2>&1 | tail -80; docker rm -f cryptothrone-server-e2e 2>/dev/null || true; exit $EC'
        deps: ['~:container']
        options:
            cache: false
    container-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/cryptothrone-server:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/cryptothrone-server:buildcache,mode=max -f apps/cryptothrone/gameserver/Dockerfile -t kbve/cryptothrone-server:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The runner a release of this project builds on. Declared because the
    # default two-core hosted runner is not enough for it -- the dispatch
    # manifest carried this per entry, and dropping it would put a build
    # that needs arc-runner-set back on a 60 minute ceiling it cannot meet.
    CI_RUNNER: 'arc-runner-set'
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/agones/cryptothrone/manifests/fleet.yaml"]'
