$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    dev:
        script: 'STATIC_DIR=./dist/apps/astro-cryptothrone STATIC_PRECOMPRESSED=false cargo run -p axum-cryptothrone'
        deps: ['astro-cryptothrone:build']
        options:
            runFromWorkspaceRoot: true
    coverage:
        script: "cargo llvm-cov -p axum-cryptothrone --ignore-filename-regex 'main\\.rs' --fail-under-lines 80 --summary-only"
        options:
            runFromWorkspaceRoot: true
    e2e:
        script: 'nx e2e astro-cryptothrone-e2e'
        deps: ['~:test']
        options:
            runFromWorkspaceRoot: true
    container-prep:
        script: 'rm -rf ./apps/cryptothrone/axum-cryptothrone/dist/ && mkdir -p ./apps/cryptothrone/axum-cryptothrone/dist/ && cp -a ./dist/apps/astro-cryptothrone/. ./apps/cryptothrone/axum-cryptothrone/dist/'
        deps: ['astro-cryptothrone:build']
        options:
            runFromWorkspaceRoot: true
    containerx:
        script: 'docker buildx build --load -f apps/cryptothrone/axum-cryptothrone/Dockerfile -t kbve/cryptothrone:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
