$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    dev:
        script: 'STATIC_DIR=./dist/apps/astro-cryptothrone STATIC_PRECOMPRESSED=false cargo run -p axum-cryptothrone'
        deps: ['astro-cryptothrone:build']
        options:
            runFromWorkspaceRoot: true
    coverage:
        script: "cargo llvm-cov -p axum-cryptothrone --ignore-filename-regex 'main\\.rs' --fail-under-lines 80 --summary-only"
        options:
            runFromWorkspaceRoot: true
    e2e:
        deps: ['~:test', 'astro-cryptothrone-e2e:e2e']
        options:
            cache: false
    container-prep:
        script: 'rm -rf ./apps/cryptothrone/axum-cryptothrone/dist/ && mkdir -p ./apps/cryptothrone/axum-cryptothrone/dist/ && cp -a ./dist/apps/astro-cryptothrone/. ./apps/cryptothrone/axum-cryptothrone/dist/'
        deps: ['astro-cryptothrone:build']
        options:
            runFromWorkspaceRoot: true
    containerx:
        script: 'docker buildx build --load -f apps/cryptothrone/axum-cryptothrone/Dockerfile -t kbve/cryptothrone:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/cryptothrone:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/cryptothrone:buildcache,mode=max -f apps/cryptothrone/axum-cryptothrone/Dockerfile -t ghcr.io/kbve/cryptothrone:latest -t kbve/cryptothrone:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/cryptothrone/manifest/cryptothrone-deployment.yaml"]'
