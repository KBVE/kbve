[package]
name = "axum-cryptothrone"
authors = ["kbve", "h0lybyte"]
version = "0.1.51"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "fs", "cors", "set-header", "normalize-path"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
axum = { version = "0.8.5", features = ["ws", "macros"] }
axum-extra = { workspace = true, features = ["cookie"] }
socket2 = { workspace = true }
num_cpus = { workspace = true }
dotenvy = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
jsonwebtoken = { version = "9.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
kube = { workspace = true, features = ["client", "rustls-tls"] }
k8s-openapi = { workspace = true, features = ["v1_32"] }
rustls = { workspace = true, features = ["default", "ring"] }

# Workspace path dependencies
jedi = { path = "../../../packages/rust/jedi", features = ["postgres", "valkey"] }
kbve = { path = "../../../packages/rust/kbve" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
serial_test = { workspace = true }
http-body-util = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
