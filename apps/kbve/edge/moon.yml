$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['docker']

tasks:
  containerx:
    script: "docker buildx build --load -f apps/kbve/edge/Dockerfile -t kbve/edge:latest apps/kbve/edge"
    options:
      runFromWorkspaceRoot: true
      cache: false
  containerx-publish:
    script: "docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/edge:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/edge:buildcache,mode=max -f apps/kbve/edge/Dockerfile -t ghcr.io/kbve/edge:latest -t kbve/edge:latest apps/kbve/edge"
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: true
  containerx-dev:
    script: "docker buildx build --load -f apps/kbve/edge/Dockerfile.dev -t kbve/edge:dev apps/kbve/edge"
    options:
      runFromWorkspaceRoot: true
      cache: false
  run:
    script: "docker run --rm -p 9000:9000 kbve/edge:latest start --main-service /home/deno/functions/main -p 9000"
    options:
      runFromWorkspaceRoot: true
  run-dev:
    script: "docker run --rm -p 9000:9000 -v $PWD/apps/kbve/edge/functions:/home/deno/functions kbve/edge:dev start --main-service /home/deno/functions/main -p 9000"
    options:
      runFromWorkspaceRoot: true
  check:
    script: "bash apps/kbve/edge/scripts/check.sh"
    options:
      runFromWorkspaceRoot: true
  e2e:
    deps: ['edge-e2e:e2e']
    options:
      cache: false

  # The dev image, built from Dockerfile.dev.
  container-dev:
    deps: ['~:containerx-dev']
    options:
      cache: false

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/functions/manifests/functions-deployment.yaml"]'
