$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    # Inherited from the rust preset, which cannot know that cargo needs a
    # Postgres toolchain here: the Dockerfile installs postgresql-server-dev-17,
    # `cargo install cargo-pgrx` and runs `cargo pgrx init` before it compiles
    # anything. Without that, both die in pgrx-bindgen -- "Unable to generate
    # bindings for pg17" -- which reads as a broken crate rather than a missing
    # toolchain. ci-e2e.yml already excludes this project by name for the same
    # reason; this puts that decision in the graph. The image build is what
    # compiles the extension in CI, and it still runs.
    #
    # Only these two: runInCI also filters `moon run` whenever CI is set (see
    # the windmill fix), and ci.yml only ever reaches :lint and :test, so
    # setting it on anything else here would protect nothing and could strand a
    # lane that invokes the task by name.
    lint:
        options:
            runInCI: false
    test:
        options:
            runInCI: false

    bump:
        script: 'bash tools/scripts/public/kilobase/version_bump.sh {args.version}'
        options:
            runFromWorkspaceRoot: true
    local:
        script: "cargo pgrx package --features pg17 --out-dir='../../../dist/target/kilobase'"
    pgrx:
        script: 'cargo pgrx run'
    copy-requirements:
        script: 'cp apps/kbve/kilobase/requirements.txt dist/target/kilobase/requirements.txt'
        deps: ['~:build']
        options:
            runFromWorkspaceRoot: true
    seal:
        script: 'cd ../../../tools/scripts/public/kube/etc && ./generate-sealed-secret.sh -n "{args.namespace}" -k "{args.keyName}" -s "{args.secrets}"'
        inputs: ['args']
    container-test:
        script: 'docker buildx build --load -f apps/kbve/kilobase/Dockerfile.test -t kilobase-test:latest apps/kbve/kilobase'
        options:
            runFromWorkspaceRoot: true
            cache: false
    e2e:
        script: 'bash kilobase_dev.sh e2e'
        deps: ['~:container-test']
        inputs:
            ['src/**/*.rs', 'Cargo.toml', 'Dockerfile.test', 'kilobase_dev.sh']
        outputs: ['test-results/test-results.json']
    dev-test:
        script: 'bash kilobase_dev.sh test'
    dev-unit:
        script: 'bash kilobase_dev.sh unit'
    dev-results:
        script: 'bash kilobase_dev.sh results'
    dev-clean:
        script: 'bash kilobase_dev.sh clean'
    image-e2e:
        script: 'bash image_e2e.sh'
    debug:
        script: 'cd ./apps/kbve/kilobase && docker-compose --env-file .env up --build'
        deps: ['~:container']
        options:
            runFromWorkspaceRoot: true
    container-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/kilobase:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/kilobase:buildcache,mode=max -f apps/kbve/kilobase/Dockerfile -t kbve/kilobase:latest apps/kbve/kilobase'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
