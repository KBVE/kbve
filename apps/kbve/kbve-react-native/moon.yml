$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

tasks:
    start:
        script: 'expo start'
    ios:
        script: 'expo start --ios'
    android:
        script: 'expo start --android'
    web:
        script: 'expo start --web'
    export:
        script: 'expo export -p all --output-dir dist'
        outputs: ['dist']
    prebuild:
        script: 'expo prebuild'
    run-ios:
        script: 'expo run:ios'
    run-android:
        script: 'expo run:android'
    build-native-ios:
        script: 'expo prebuild --clean -p ios && expo run:ios'
        deps: ['kbve_wgpu:build-ios']
    build-native-android:
        script: 'expo prebuild --clean -p android && expo run:android'
        deps: ['kbve_wgpu:build-android']
    typecheck:
        script: 'tsc --noEmit -p apps/kbve/kbve-react-native/tsconfig.json'
        options:
            runFromWorkspaceRoot: true
