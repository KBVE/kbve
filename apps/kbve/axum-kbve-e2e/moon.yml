$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['vitest']

# The specs under e2e/ are this project's only vitest suite, and they need the
# service the `e2e` task starts. The vitest preset's inherited `test` runs the
# same files with nothing behind them, so it fails on a refused connection or a
# missing container -- which reads as a broken suite rather than a task that was
# never meant to run on its own. `e2e` runs vitest itself, so nothing is lost.
workspace:
    inheritedTasks:
        exclude: ['test']

tasks:
    e2e:
        script: "docker rm -f axum-kbve-e2e 2>/dev/null || true && docker run -d --name axum-kbve-e2e -p 4323:4321 -e HTTP_HOST=0.0.0.0 -e HTTP_PORT=4321 -e RUST_LOG=info -e GAME_WT_DISABLE=1 kbve/kbve:latest && echo 'Waiting for axum-kbve container to become ready...' && for i in $(seq 1 120); do if docker logs axum-kbve-e2e 2>&1 | grep -q 'HTTP listening'; then echo 'Container ready after '\"$i\"'s'; break; fi; if [ $i -eq 120 ]; then echo 'Container did not become ready in 120s'; docker logs axum-kbve-e2e 2>&1 | tail -30; docker rm -f axum-kbve-e2e 2>/dev/null || true; exit 1; fi; sleep 1; done && VERSION=$(grep '^version' ../axum-kbve/Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/') && KBVE_VERSION=$VERSION npx vitest run; EC=$?; echo '--- container logs ---'; docker logs axum-kbve-e2e 2>&1 | tail -50; docker rm -f axum-kbve-e2e 2>/dev/null || true; exit $EC"
        deps: ['axum-kbve:container']
        options:
            cache: false
