$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['vitest']

# The specs under e2e/ are this project's only vitest suite, and they need the
# service the `e2e` task starts. The vitest preset's inherited `test` runs the
# same files with nothing behind them, so it fails on a refused connection or a
# missing container -- which reads as a broken suite rather than a task that was
# never meant to run on its own. `e2e` runs vitest itself, so nothing is lost.
workspace:
    inheritedTasks:
        exclude: ['test']

tasks:
    e2e:
        script: "docker rm -f edge-e2e-test 2>/dev/null || true && docker run -d --name edge-e2e-test -p 9100:9000 -e JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long -e VERIFY_JWT=true -e SUPABASE_URL=http://localhost:54321 -e SUPABASE_ANON_KEY=dummy-anon-key -e SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key -e CLICKHOUSE_ENDPOINT=http://localhost:8123 -e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=dummy kbve/edge:latest start --main-service /home/deno/functions/main && npx vitest run; EC=$?; if [ $EC -ne 0 ]; then echo '--- edge-e2e-test container state ---'; docker ps -a --filter name=edge-e2e-test --format 'table {{.Names}}\\t{{.Status}}\\t{{.Ports}}' || true; echo '--- edge-e2e-test logs (last 200 lines) ---'; docker logs --tail 200 edge-e2e-test 2>&1 || true; echo '--- end edge-e2e-test logs ---'; fi; docker rm -f edge-e2e-test 2>/dev/null || true; exit $EC"
        options:
            cache: false
