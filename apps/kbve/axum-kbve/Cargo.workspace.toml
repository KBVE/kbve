[workspace]
resolver = "2"
members = [
    "apps/kbve/axum-kbve",
    "packages/rust/jedi",
    "packages/rust/kbve",
    "packages/rust/holy",
    "packages/rust/bevy/bevy_kbve_net",
    "packages/rust/bevy/bevy_npc",
    "packages/rust/bevy/bevy_inventory",
    "packages/rust/bevy/bevy_items",
    "packages/rust/bevy/bevy_skills",
]

[workspace.package]
rust-version = "1.96"

[workspace.dependencies]
agones = "1.57"
ammonia = "4.1.2"
anyhow = "1.0"
argon2 = "0.5.0"
askama = "0.16.0"
async-trait = "0.1.88"
avian3d = { version = "0.7", default-features = false }
axum = { version = "0.8.9", default-features = false }
axum-extra = "0.12.6"
base64 = "0.22.1"
bb8 = "0.9"
bevy = { version = "0.19", default-features = false }
bincode = "2.0"
bitflags = "2.9.0"
bytes = "1"
chrono = { version = "0.4.44", default-features = false }
criterion = { version = "0.5", default-features = false }
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
http = "1.4.0"
http-body-util = "0.1"
jni = "0.21"
js-sys = { version = "0.3", default-features = false }
jsonwebtoken = { version = "10.3.0", default-features = false }
k8s-openapi = "0.27"
kube = { version = "3", default-features = false }
lightyear = { version = "0.28", default-features = false }
log = "0.4"
lru = "0.18"
metrics = "0.24"
num_cpus = "1.17.0"
objc2 = "0.6.3"
pollster = "0.4"
postcard = { version = "1.0", default-features = false }
proc-macro2 = "1"
prost = "0.14.1"
prost-build = "0.14"
prost-types = "0.14"
quote = "1.0.44"
rand = "0.10"
raw-window-handle = "0.6.2"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2"
serde = "1.0"
serde_json = "1.0"
serial_test = "3"
sha2 = "0.11"
socket2 = "0.6.1"
syn = "3"
sysinfo = "0.38.2"
tempfile = "3"
thiserror = "2.0.12"
tikv-jemallocator = "0.7"
tokio = { version = "1.49", default-features = false }
tokio-postgres = "0.7.2"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
ulid = "1.2.1"
url = "2.5"
utoipa = "5"
uuid = "1"
wasm-bindgen = { version = "=0.2.114", default-features = false }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
webpki-roots = "0.26"
wgpu = "29"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
