[package]
name = "axum-kbve"
authors = ["kbve", "h0lybyte"]
version = "1.0.287"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# RCON allowlist (packages/data/rcon/commands.yaml) baked via include_str! at compile time.
serde_yaml = "0.9"
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "fs", "cors", "set-header"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
axum = { workspace = true, features = ["default", "ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = { workspace = true }
axum-extra = { workspace = true, features = ["cookie"] }
askama = { workspace = true }
socket2 = { workspace = true }
num_cpus = { workspace = true }
dotenvy = { workspace = true }

# Proto + serialization
prost = { workspace = true }
chrono = { workspace = true, features = ["default", "serde"] }

# OpenAPI spec generation. Emits /api/openapi.json which the astro side
# renders via Scalar at /dashboard/api and consumes for /llms.txt.
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }

# MCP server. Re-uses the utoipa OpenAPI spec to expose every annotated
# handler as an MCP tool at /api/mcp. Token passthrough lets clients BYO
# bearer; the upstream call is dispatched against the local axum listener.
rmcp = { version = "1.8.0", default-features = false, features = ["server", "transport-streamable-http-server", "tower", "macros"] }
rmcp-openapi = { version = "0.31.3", features = ["authorization-token-passthrough"] }
url = { workspace = true }
http = { workspace = true }

# DB + Auth (Phase 5)
reqwest = { workspace = true, features = ["json", "rustls", "stream", "form", "query"] }
jsonwebtoken = { workspace = true, features = ["default", "rust_crypto"] }
dashmap = { workspace = true, features = ["rayon"] }
rayon = "1.10"
regex = { workspace = true }
lru = { workspace = true }

# Game server (headless Bevy + avian3d + lightyear)
bevy = { workspace = true, features = ["bevy_state", "bevy_render", "bevy_asset"] }
avian3d = { workspace = true, features = ["3d", "f32", "parry-f32", "serialize"] }
lightyear = { workspace = true, features = ["server", "replication", "prediction", "interpolation", "input_native", "websocket", "websocket_self_signed", "netcode", "webtransport", "webtransport_self_signed", "avian3d"] }
base64 = { workspace = true }
rand = { workspace = true }
lightyear_avian3d = { version = "0.29", default-features = false, features = ["3d"] }
lightyear_replication = { version = "0.29", default-features = false, features = ["server"] }
bevy_kbve_net = { path = "../../../packages/rust/bevy/bevy_kbve_net", features = ["npcdb", "creatures"] }
bevy_inventory = { path = "../../../packages/rust/bevy/bevy_inventory" }
bevy_items = { path = "../../../packages/rust/bevy/bevy_items", features = ["inventory"] }
bevy_skills = { path = "../../../packages/rust/bevy/bevy_skills" }
bevy_chat = { path = "../../../packages/rust/bevy/bevy_chat" }
bevy_dungeon = { path = "../../../packages/rust/bevy/bevy_dungeon" }
futures-util = { workspace = true, features = ["default"] }
tokio-tungstenite = { workspace = true, features = ["default", "rustls-tls-webpki-roots"] }
webpki-roots = { workspace = true }

# Workspace path dependencies
jedi = { path = "../../../packages/rust/jedi", features = ["aws", "clickhouse", "forgejo", "postgres", "valkey"] }
kbve = { path = "../../../packages/rust/kbve", features = ["wallet"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

# Referral handler hashes client IP + subnet before any DB write.
hmac = "0.13"
sha2 = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[build-dependencies]
prost-build = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
http-body-util = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[package.metadata.askama]
dirs = ["templates"]
