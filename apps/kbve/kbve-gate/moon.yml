$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    containerx:
        script: 'docker buildx build --load -f apps/kbve/kbve-gate/Dockerfile -t kbve/kbve-gate:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/kbve-gate:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/kbve-gate:buildcache,mode=max -f apps/kbve/kbve-gate/Dockerfile -t ghcr.io/kbve/kbve-gate:latest -t kbve/kbve-gate:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/monitoring/manifests/grafana-gate-deployment.yaml","apps/kube/argocd/manifests/argocd-gate-deployment.yaml","apps/kube/storage/manifests/longhorn-gate-deployment.yaml","apps/kube/forgejo/manifest/forgejo-gate-deployment.yaml","apps/kube/studio/manifests/studio-gate-deployment.yaml","apps/kube/windmill/manifest/windmill-gate-deployment.yaml"]'
