<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KBVE Desktop</title>
	</head>
	<body>
		<div id="root"></div>
		<script>
			// White-screen guard: surface boot errors that kill the module
			// graph before React can render anything.
			(function () {
				function show(msg) {
					try {
						fetch('/__client_log', { method: 'POST', body: msg });
					} catch (_) {}
					// Module-graph link errors on a cold dev server are a race
					// with the dep optimizer; one automatic reload heals them.
					if (
						/star export entries|Importing binding/.test(msg) &&
						!sessionStorage.getItem('kbve-boot-retry')
					) {
						sessionStorage.setItem('kbve-boot-retry', '1');
						setTimeout(function () {
							location.reload();
						}, 400);
						return;
					}
					sessionStorage.removeItem('kbve-boot-retry');
					var root = document.getElementById('root');
					if (!root || root.childElementCount > 0) return;
					var pre = document.createElement('pre');
					pre.style.cssText =
						'margin:2rem;padding:1rem;white-space:pre-wrap;font:12px monospace;' +
						'color:#ff6b6b;background:#1b1f26;border-radius:8px;';
					pre.textContent = 'Boot error:\n' + msg;
					root.appendChild(pre);
				}
				window.addEventListener('error', function (e) {
					show(
						(e.message || String(e.error)) +
							(e.filename ? '\n' + e.filename + ':' + e.lineno : ''),
					);
				});
				window.addEventListener('unhandledrejection', function (e) {
					show(String((e.reason && e.reason.stack) || e.reason));
				});
			})();
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
