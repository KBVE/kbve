$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
stack: 'frontend'
tags: ['tauri', 'vite', 'vitest', 'eslint', 'desktop']
env:
    # What a Tauri build of this app produces. ci-tauri.yml resolved these
    # from a bash `case` over an app name -- a lookup table of the same kind
    # the dispatch manifest was, one project per branch.
    TAURI_PLATFORMS: 'linux,macos,windows'
    TAURI_NOTARIZE: 'true'
    TAURI_DEV_PORT: '1421'

tasks:
    install-deps:
        command: 'pnpm install --frozen-lockfile'
        toolchains: ['node']
        inputs: ['package.json']
        env:
            CI: 'true'
        options:
            cache: false

    build:
        deps: ['~:install-deps']

    test:
        deps: ['~:install-deps']

    build-sidecars:
        script: 'cd src-tauri && bash sidecars/build.sh'

    build-tauri:
        deps: ['~:build-sidecars']
        command: 'cargo tauri build'
