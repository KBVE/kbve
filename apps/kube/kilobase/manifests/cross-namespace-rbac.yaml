---
# Cross-namespace RBAC for external services to access kilobase secrets.
# Lets External Secrets Operator service accounts in other namespaces read
# specific secrets in the kilobase namespace.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: kilobase-secrets-reader-for-discord
    namespace: kilobase
    labels:
        app.kubernetes.io/name: kilobase
        app.kubernetes.io/component: rbac
        app.kubernetes.io/managed-by: argocd
rules:
    - apiGroups: ['']
      resources: ['secrets']
      resourceNames:
          [
              'supabase-jwt',
              'supabase-postgres',
              'supabase-db',
              'supabase-server-tls',
              'twitch-oauth-config',
              'ows-db-password',
              'referral-hash',
          ]
      verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: notification-bot-read-secrets
    namespace: kilobase
    labels:
        app.kubernetes.io/name: kilobase
        app.kubernetes.io/component: rbac
        app.kubernetes.io/managed-by: argocd
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: kilobase-secrets-reader-for-discord
subjects:
    - kind: ServiceAccount
      name: kbve-external-secrets
      namespace: kbve
    - kind: ServiceAccount
      name: herbmail-external-secrets
      namespace: herbmail
    - kind: ServiceAccount
      name: memes-external-secrets
      namespace: memes
    - kind: ServiceAccount
      name: irc-gateway-external-secrets
      namespace: irc
    - kind: ServiceAccount
      name: rentearth-external-secrets
      namespace: rentearth
    - kind: ServiceAccount
      name: ows-external-secrets
      namespace: rows
    - kind: ServiceAccount
      name: rows-external-secrets
      namespace: rows-chuckrpg-dev
    - kind: ServiceAccount
      name: rows-external-secrets
      namespace: rows-chuckrpg-beta
    - kind: ServiceAccount
      name: rows-external-secrets
      namespace: rows-rentearth-release
    - kind: ServiceAccount
      name: cryptothrone-external-secrets
      namespace: cryptothrone
    - kind: ServiceAccount
      name: arpg-external-secrets
      namespace: arpg
    - kind: ServiceAccount
      name: firecracker-external-secrets
      namespace: firecracker
    - kind: ServiceAccount
      name: herbmail-game-external-secrets
      namespace: herbmail-game
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: supabase-service-key-reader-for-rows-tenants
    namespace: kilobase
    labels:
        app.kubernetes.io/name: kilobase
        app.kubernetes.io/component: rbac
        app.kubernetes.io/managed-by: argocd
rules:
    - apiGroups: ['']
      resources: ['secrets']
      resourceNames: ['supabase-service-key']
      verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: rows-tenants-read-service-key
    namespace: kilobase
    labels:
        app.kubernetes.io/name: kilobase
        app.kubernetes.io/component: rbac
        app.kubernetes.io/managed-by: argocd
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: supabase-service-key-reader-for-rows-tenants
subjects:
    - kind: ServiceAccount
      name: ows-external-secrets
      namespace: rows
    - kind: ServiceAccount
      name: rows-external-secrets
      namespace: rows-chuckrpg-beta
    - kind: ServiceAccount
      name: rows-external-secrets
      namespace: rows-chuckrpg-dev
