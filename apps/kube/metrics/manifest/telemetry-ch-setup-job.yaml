apiVersion: v1
kind: ConfigMap
metadata:
    name: telemetry-ch-setup-script
    namespace: kbve
    labels:
        kbve.com/category: observability
        kbve.com/stack: core
        kbve.com/managed-by: argocd
data:
    setup.sh: |
        #!/bin/sh
        set -eu

        echo "Verifying ClickHouse connectivity..."
        curl -sf --max-time 10 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "SELECT 1" >/dev/null || {
          echo "ERROR: Cannot connect to ClickHouse at ${CLICKHOUSE_ENDPOINT}"
          exit 1
        }
        echo "ClickHouse connection OK."

        echo "Creating telemetry database..."
        curl -sf --max-time 10 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "CREATE DATABASE IF NOT EXISTS telemetry ON CLUSTER 'cluster'" || {
          echo "ERROR: Failed to create telemetry database"
          exit 1
        }
        echo "Database 'telemetry' ready."

        echo "Creating errors_raw table (ReplicatedMergeTree, 30d TTL)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.errors_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(3, 'UTC') DEFAULT now64(3),
            project         LowCardinality(String),
            platform        LowCardinality(String) DEFAULT 'web',
            release         LowCardinality(String) DEFAULT '',
            environment     LowCardinality(String) DEFAULT 'production',
            fingerprint     String,
            error_type      LowCardinality(String) DEFAULT '',
            message         String,
            stack           String DEFAULT '',
            url             String DEFAULT '',
            user_id         String DEFAULT '',
            session_id      String DEFAULT '',
            user_agent      String DEFAULT '',
            handled         UInt8 DEFAULT 0,
            extra           String DEFAULT '{}'
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/telemetry/errors_raw', '{replica}')
        ORDER BY (project, fingerprint, timestamp)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 30 DAY
        " || {
          echo "ERROR: Failed to create errors_raw table"
          exit 1
        }
        echo "Table 'telemetry.errors_raw' ready."

        echo "Enforcing 30-day TTL on errors_raw..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "ALTER TABLE telemetry.errors_raw ON CLUSTER 'cluster' MODIFY TTL toDateTime(timestamp) + INTERVAL 30 DAY" || {
          echo "ERROR: Failed to apply TTL to errors_raw"
          exit 1
        }
        echo "TTL on 'telemetry.errors_raw' enforced at 30 days."

        echo "Creating errors_distributed table (Distributed)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.errors_distributed ON CLUSTER 'cluster'
        AS telemetry.errors_raw
        ENGINE = Distributed('cluster', 'telemetry', 'errors_raw', cityHash64(fingerprint))
        " || {
          echo "ERROR: Failed to create errors_distributed table"
          exit 1
        }
        echo "Table 'telemetry.errors_distributed' ready."

        # Defense-in-depth tripwires on the raw table (canonical list:
        # packages/data/ch/schemas/telemetry.sql). Caps sit above the metrics
        # ingest clamps; ADD CONSTRAINT only checks future inserts (no backfill).
        echo "Applying sanitization constraints on errors_raw..."
        for c in \
          "chk_project_len CHECK length(project) > 0 AND length(project) <= 256" \
          "chk_fingerprint_len CHECK length(fingerprint) <= 64" \
          "chk_message_len CHECK length(message) <= 8192" \
          "chk_stack_len CHECK length(stack) <= 32768" \
          "chk_url_len CHECK length(url) <= 2048" \
          "chk_handled_bit CHECK handled <= 1"; do
          curl -sf --max-time 30 \
            "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
            -d "ALTER TABLE telemetry.errors_raw ON CLUSTER 'cluster' ADD CONSTRAINT IF NOT EXISTS ${c}" || {
            echo "ERROR: Failed to add constraint: ${c}"
            exit 1
          }
        done
        echo "Constraints on 'telemetry.errors_raw' applied."

        echo "Creating error_groups view (fingerprint rollup)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE VIEW IF NOT EXISTS telemetry.error_groups ON CLUSTER 'cluster'
        AS SELECT
            project,
            fingerprint,
            any(error_type)  AS error_type,
            any(message)     AS sample_message,
            count()          AS events,
            uniq(session_id) AS sessions,
            min(timestamp)   AS first_seen,
            max(timestamp)   AS last_seen
        FROM telemetry.errors_distributed
        GROUP BY project, fingerprint
        " || {
          echo "ERROR: Failed to create error_groups view"
          exit 1
        }
        echo "View 'telemetry.error_groups' ready."

        echo "Creating perf_raw table (ReplicatedMergeTree, 30d TTL)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.perf_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(3, 'UTC') DEFAULT now64(3),
            project         LowCardinality(String),
            platform        LowCardinality(String) DEFAULT 'web',
            release         LowCardinality(String) DEFAULT '',
            environment     LowCardinality(String) DEFAULT 'production',
            metric          LowCardinality(String),
            value           Float64,
            rating          LowCardinality(String) DEFAULT '',
            navigation_type LowCardinality(String) DEFAULT '',
            url             String DEFAULT '',
            user_id         String DEFAULT '',
            session_id      String DEFAULT '',
            user_agent      String DEFAULT '',
            extra           String DEFAULT '{}'
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/telemetry/perf_raw', '{replica}')
        ORDER BY (project, metric, timestamp)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 30 DAY
        " || {
          echo "ERROR: Failed to create perf_raw table"
          exit 1
        }
        echo "Table 'telemetry.perf_raw' ready."

        echo "Enforcing 30-day TTL on perf_raw..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "ALTER TABLE telemetry.perf_raw ON CLUSTER 'cluster' MODIFY TTL toDateTime(timestamp) + INTERVAL 30 DAY" || {
          echo "ERROR: Failed to apply TTL to perf_raw"
          exit 1
        }
        echo "TTL on 'telemetry.perf_raw' enforced at 30 days."

        echo "Creating perf_distributed table (Distributed)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.perf_distributed ON CLUSTER 'cluster'
        AS telemetry.perf_raw
        ENGINE = Distributed('cluster', 'telemetry', 'perf_raw', cityHash64(session_id))
        " || {
          echo "ERROR: Failed to create perf_distributed table"
          exit 1
        }
        echo "Table 'telemetry.perf_distributed' ready."

        echo "Applying sanitization constraints on perf_raw..."
        for c in \
          "chk_perf_project_len CHECK length(project) > 0 AND length(project) <= 256" \
          "chk_perf_metric_len CHECK length(metric) > 0 AND length(metric) <= 64" \
          "chk_perf_url_len CHECK length(url) <= 2048" \
          "chk_perf_value_range CHECK value >= 0 AND value <= 3600000"; do
          curl -sf --max-time 30 \
            "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
            -d "ALTER TABLE telemetry.perf_raw ON CLUSTER 'cluster' ADD CONSTRAINT IF NOT EXISTS ${c}" || {
            echo "ERROR: Failed to add constraint: ${c}"
            exit 1
          }
        done
        echo "Constraints on 'telemetry.perf_raw' applied."

        echo "Creating perf_summary view (metric quantile rollup)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE VIEW IF NOT EXISTS telemetry.perf_summary ON CLUSTER 'cluster'
        AS SELECT
            project,
            metric,
            count()               AS samples,
            uniq(session_id)      AS sessions,
            quantile(0.50)(value) AS p50,
            quantile(0.75)(value) AS p75,
            quantile(0.95)(value) AS p95,
            min(timestamp)        AS first_seen,
            max(timestamp)        AS last_seen
        FROM telemetry.perf_distributed
        GROUP BY project, metric
        " || {
          echo "ERROR: Failed to create perf_summary view"
          exit 1
        }
        echo "View 'telemetry.perf_summary' ready."

        echo "Creating events_raw table (ReplicatedMergeTree, 30d TTL)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.events_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(3, 'UTC') DEFAULT now64(3),
            project         LowCardinality(String),
            platform        LowCardinality(String) DEFAULT 'web',
            release         LowCardinality(String) DEFAULT '',
            environment     LowCardinality(String) DEFAULT 'production',
            name            LowCardinality(String),
            url             String DEFAULT '',
            user_id         String DEFAULT '',
            session_id      String DEFAULT '',
            user_agent      String DEFAULT '',
            extra           String DEFAULT '{}'
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/telemetry/events_raw', '{replica}')
        ORDER BY (project, name, timestamp)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 30 DAY
        " || {
          echo "ERROR: Failed to create events_raw table"
          exit 1
        }
        echo "Table 'telemetry.events_raw' ready."

        echo "Enforcing 30-day TTL on events_raw..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "ALTER TABLE telemetry.events_raw ON CLUSTER 'cluster' MODIFY TTL toDateTime(timestamp) + INTERVAL 30 DAY" || {
          echo "ERROR: Failed to apply TTL to events_raw"
          exit 1
        }
        echo "TTL on 'telemetry.events_raw' enforced at 30 days."

        echo "Creating events_distributed table (Distributed)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE TABLE IF NOT EXISTS telemetry.events_distributed ON CLUSTER 'cluster'
        AS telemetry.events_raw
        ENGINE = Distributed('cluster', 'telemetry', 'events_raw', cityHash64(session_id))
        " || {
          echo "ERROR: Failed to create events_distributed table"
          exit 1
        }
        echo "Table 'telemetry.events_distributed' ready."

        echo "Applying sanitization constraints on events_raw..."
        for c in \
          "chk_event_project_len CHECK length(project) > 0 AND length(project) <= 256" \
          "chk_event_name_len CHECK length(name) > 0 AND length(name) <= 128" \
          "chk_event_url_len CHECK length(url) <= 2048"; do
          curl -sf --max-time 30 \
            "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
            -d "ALTER TABLE telemetry.events_raw ON CLUSTER 'cluster' ADD CONSTRAINT IF NOT EXISTS ${c}" || {
            echo "ERROR: Failed to add constraint: ${c}"
            exit 1
          }
        done
        echo "Constraints on 'telemetry.events_raw' applied."

        echo "Creating event_counts view (name rollup)..."
        curl -sf --max-time 30 \
          "${CLICKHOUSE_ENDPOINT}/?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}" \
          -d "
        CREATE VIEW IF NOT EXISTS telemetry.event_counts ON CLUSTER 'cluster'
        AS SELECT
            project,
            name,
            count()          AS events,
            uniq(session_id) AS sessions,
            uniq(user_id)    AS users,
            min(timestamp)   AS first_seen,
            max(timestamp)   AS last_seen
        FROM telemetry.events_distributed
        GROUP BY project, name
        " || {
          echo "ERROR: Failed to create event_counts view"
          exit 1
        }
        echo "View 'telemetry.event_counts' ready."

        echo ""
        echo "Telemetry schema setup complete."

---
apiVersion: batch/v1
kind: Job
metadata:
    name: telemetry-ch-setup
    namespace: kbve
    labels:
        app: telemetry-ch-setup
        component: vector
        kbve.com/category: observability
        kbve.com/stack: core
        kbve.com/managed-by: argocd
    annotations:
        # PreSync, not PostSync: this job *is* the schema the service needs, so
        # running it after the deployment meant the app could come up, be marked
        # healthy, accept events and drop every one of them into a database with
        # no tables in it. Argo waits for a PreSync hook to succeed before it
        # syncs anything else, which is the ordering that was always intended.
        # Idempotent by construction — every statement is CREATE IF NOT EXISTS —
        # so running it on each sync costs a few metadata queries.
        argocd.argoproj.io/hook: PreSync
        # Without a delete policy the completed hook Job stays put under its fixed
        # name, and the next sync cannot recreate it — a Job's pod template and
        # selector are immutable — so the PostSync hook never reaches a terminal
        # state and the application sits in Progressing indefinitely. Every other
        # hook Job in this repo sets one; this was the only one that did not.
        # BeforeHookCreation rather than HookSucceeded, matching the sibling
        # ClickHouse setup job in apps/kube/kbve: the finished Job survives until
        # the next sync needs the name, so its logs are still there to read when
        # the setup is what went wrong.
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
    ttlSecondsAfterFinished: 86400
    # ArgoCD blocks the whole sync until this hook completes, and backoffLimit
    # only counts pods that ran and failed -- a pod stuck pulling a bad image
    # never fails, so it retries forever and pins the app to a stale revision.
    # 600s because creates ClickHouse tables.
    activeDeadlineSeconds: 600
    backoffLimit: 3
    template:
        metadata:
            labels:
                app: telemetry-ch-setup
        spec:
            restartPolicy: OnFailure
            containers:
                - name: setup
                  image: curlimages/curl:8.12.1
                  command:
                      - /bin/sh
                      - /scripts/setup.sh
                  env:
                      - name: CLICKHOUSE_ENDPOINT
                        value: http://clickhouse-clickhouse-cluster.clickhouse.svc.cluster.local:8123
                      - name: CLICKHOUSE_USER
                        value: kbve_ingest
                      - name: CLICKHOUSE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-credentials
                                key: password
                  volumeMounts:
                      - name: setup-script
                        mountPath: /scripts
                        readOnly: true
                  resources:
                      requests:
                          memory: 32Mi
                          cpu: 50m
                      limits:
                          memory: 64Mi
                          cpu: 100m
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: setup-script
                  configMap:
                      name: telemetry-ch-setup-script
                      defaultMode: 365
