# Allow the discordsh-external-secrets ServiceAccount (in discordsh
# namespace) to read the clickhouse-vector-credentials secret from the
# vector namespace. Used by the ExternalSecret at
# apps/kube/discordsh/manifest/discordsh-externalsecret.yaml so the bot can
# read the Palworld telemetry the relay writes to gameops.* for
# /palworld-online.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: clickhouse-credentials-reader-for-discordsh
    namespace: vector
    labels:
        app.kubernetes.io/part-of: observability
rules:
    - apiGroups: ['']
      resources: ['secrets']
      verbs: ['get', 'list', 'watch']
      resourceNames: ['clickhouse-vector-credentials']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: discordsh-read-clickhouse-credentials
    namespace: vector
    labels:
        app.kubernetes.io/part-of: observability
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: clickhouse-credentials-reader-for-discordsh
subjects:
    - kind: ServiceAccount
      name: discordsh-external-secrets
      namespace: discordsh
