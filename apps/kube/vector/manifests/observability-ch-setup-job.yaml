apiVersion: v1
kind: ConfigMap
metadata:
    name: observability-ch-setup-script
    namespace: vector
    labels:
        kbve.com/category: observability
        kbve.com/stack: core
        kbve.com/managed-by: argocd
data:
    setup.sh: |
        #!/bin/sh
        set -eu

        ch() {
          curl -sf --max-time "$1" "${CLICKHOUSE_ENDPOINT}/" \
            -H "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
            -H "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
            --data-binary "$2"
        }

        ensure_ttl() {
          TABLE="$1"
          DAYS="$2"
          MATCH=$(ch 10 "SELECT count() FROM system.tables WHERE database = 'observability' AND name = '${TABLE}' AND (create_table_query LIKE '%toIntervalDay(${DAYS})%' OR create_table_query LIKE '%INTERVAL ${DAYS} DAY%')") || {
            echo "ERROR: Failed to read TTL state for ${TABLE}"
            exit 1
          }
          if [ "${MATCH}" = "1" ]; then
            echo "TTL on 'observability.${TABLE}' already ${DAYS} days, skipping ALTER."
            return 0
          fi
          echo "Applying ${DAYS}-day TTL to observability.${TABLE}..."
          ch 30 "ALTER TABLE observability.${TABLE} ON CLUSTER 'cluster' MODIFY TTL toDateTime(timestamp) + INTERVAL ${DAYS} DAY" || {
            echo "ERROR: Failed to apply TTL to ${TABLE}"
            exit 1
          }
          echo "TTL on 'observability.${TABLE}' enforced at ${DAYS} days."
        }

        echo "Verifying ClickHouse connectivity..."
        ch 10 "SELECT 1" > /dev/null || {
          echo "ERROR: Cannot connect to ClickHouse at ${CLICKHOUSE_ENDPOINT}"
          exit 1
        }
        echo "ClickHouse connection OK."

        echo "Creating observability database..."
        ch 10 "CREATE DATABASE IF NOT EXISTS observability ON CLUSTER 'cluster'" || {
          echo "ERROR: Failed to create observability database"
          exit 1
        }
        echo "Database 'observability' ready."

        echo "Creating logs_raw table (ReplicatedMergeTree)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.logs_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(3, 'UTC'),
            service         LowCardinality(String),
            level           LowCardinality(String),
            message         String,
            metadata        String DEFAULT '{}',
            pod_name        String DEFAULT '',
            pod_namespace   LowCardinality(String) DEFAULT '',
            ingested_at     DateTime64(3, 'UTC') DEFAULT now64(3)
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/observability/logs_raw', '{replica}')
        ORDER BY (service, timestamp)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 8 DAY
        " || {
          echo "ERROR: Failed to create logs_raw table"
          exit 1
        }
        echo "Table 'observability.logs_raw' ready."

        ensure_ttl logs_raw 8

        echo "Creating logs_distributed table (Distributed)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.logs_distributed ON CLUSTER 'cluster'
        AS observability.logs_raw
        ENGINE = Distributed('cluster', 'observability', 'logs_raw', rand())
        " || {
          echo "ERROR: Failed to create logs_distributed table"
          exit 1
        }
        echo "Table 'observability.logs_distributed' ready."

        echo "Creating alerts_raw table (ReplicatedMergeTree, 30d TTL)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.alerts_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(3, 'UTC'),
            status          LowCardinality(String),
            alertname       LowCardinality(String),
            severity        LowCardinality(String) DEFAULT '',
            namespace       LowCardinality(String) DEFAULT '',
            pod             String DEFAULT '',
            service         LowCardinality(String) DEFAULT '',
            summary         String DEFAULT '',
            description     String DEFAULT '',
            labels          String DEFAULT '{}',
            annotations     String DEFAULT '{}',
            fingerprint     String,
            starts_at       DateTime64(3, 'UTC'),
            ends_at         Nullable(DateTime64(3, 'UTC')),
            generator_url   String DEFAULT '',
            source          LowCardinality(String) DEFAULT 'webhook',
            ingested_at     DateTime64(3, 'UTC') DEFAULT now64(3)
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/observability/alerts_raw', '{replica}')
        ORDER BY (timestamp, alertname, fingerprint)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 30 DAY
        " || {
          echo "ERROR: Failed to create alerts_raw table"
          exit 1
        }
        echo "Table 'observability.alerts_raw' ready."

        ensure_ttl alerts_raw 30

        echo "Creating alerts_distributed table (Distributed)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.alerts_distributed ON CLUSTER 'cluster'
        AS observability.alerts_raw
        ENGINE = Distributed('cluster', 'observability', 'alerts_raw', cityHash64(fingerprint))
        " || {
          echo "ERROR: Failed to create alerts_distributed table"
          exit 1
        }
        echo "Table 'observability.alerts_distributed' ready."

        echo "Creating traces_raw table (ReplicatedMergeTree, 8d TTL)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.traces_raw ON CLUSTER 'cluster'
        (
            timestamp       DateTime64(9, 'UTC'),
            trace_id        String,
            span_id         String,
            parent_span_id  String DEFAULT '',
            service         LowCardinality(String) DEFAULT '',
            span_name       LowCardinality(String) DEFAULT '',
            span_kind       LowCardinality(String) DEFAULT 'unspecified',
            duration_ns     UInt64 DEFAULT 0,
            status_code     LowCardinality(String) DEFAULT 'unset',
            status_message  String DEFAULT '',
            attributes      String DEFAULT '{}',
            resource        String DEFAULT '{}',
            events          String DEFAULT '[]',
            ingested_at     DateTime64(3, 'UTC') DEFAULT now64(3)
        )
        ENGINE = ReplicatedMergeTree('/clickhouse/tables/{shard}/observability/traces_raw', '{replica}')
        ORDER BY (service, timestamp, trace_id)
        PARTITION BY toYYYYMMDD(timestamp)
        TTL toDateTime(timestamp) + INTERVAL 8 DAY
        " || {
          echo "ERROR: Failed to create traces_raw table"
          exit 1
        }
        echo "Table 'observability.traces_raw' ready."

        ensure_ttl traces_raw 8

        echo "Creating traces_distributed table (Distributed)..."
        ch 30 "
        CREATE TABLE IF NOT EXISTS observability.traces_distributed ON CLUSTER 'cluster'
        AS observability.traces_raw
        ENGINE = Distributed('cluster', 'observability', 'traces_raw', cityHash64(trace_id))
        " || {
          echo "ERROR: Failed to create traces_distributed table"
          exit 1
        }
        echo "Table 'observability.traces_distributed' ready."

        echo ""
        echo "Observability schema setup complete."
---
apiVersion: batch/v1
kind: Job
metadata:
    name: observability-ch-setup
    namespace: vector
    labels:
        app: observability-ch-setup
        component: vector
        kbve.com/category: observability
        kbve.com/stack: core
        kbve.com/managed-by: argocd
    annotations:
        kbve.sh/last-updated: '2026-08-07'
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
    ttlSecondsAfterFinished: 86400
    # ArgoCD blocks the whole sync until this hook completes, and backoffLimit
    # only counts pods that ran and failed -- a pod stuck pulling a bad image
    # never fails, so it retries forever and pins the app to a stale revision.
    # 600s because creates ClickHouse tables.
    activeDeadlineSeconds: 600
    backoffLimit: 3
    template:
        metadata:
            labels:
                app: observability-ch-setup
        spec:
            restartPolicy: OnFailure
            containers:
                - name: setup
                  image: curlimages/curl:8.12.1
                  command:
                      - /bin/sh
                      - /scripts/setup.sh
                  env:
                      - name: CLICKHOUSE_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-vector-credentials
                                key: endpoint
                      - name: CLICKHOUSE_USER
                        value: kbve_ingest
                      - name: CLICKHOUSE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-vector-credentials
                                key: password
                  volumeMounts:
                      - name: setup-script
                        mountPath: /scripts
                        readOnly: true
                  resources:
                      requests:
                          memory: 32Mi
                          cpu: 50m
                      limits:
                          memory: 64Mi
                          cpu: 100m
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: setup-script
                  configMap:
                      name: observability-ch-setup-script
                      defaultMode: 365
