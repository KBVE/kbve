apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: reel-data
    namespace: reel
spec:
    accessModes: ['ReadWriteOnce']
    storageClassName: longhorn
    resources:
        requests:
            storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: reel
    namespace: reel
spec:
    replicas: 1
    selector:
        matchLabels: { app: reel }
    template:
        metadata:
            labels: { app: reel }
            annotations:
                secret.reloader.stakater.com/reload: vpn-wireguard,reel-gluetun
        spec:
            containers:
                - name: gluetun
                  image: qmcgaw/gluetun
                  securityContext:
                      capabilities:
                          add: ['NET_ADMIN']
                  envFrom:
                      - secretRef: { name: vpn-wireguard }
                      - secretRef: { name: reel-gluetun, optional: true }
                  env:
                      - { name: FIREWALL, value: 'on' }
                      - { name: FIREWALL_INPUT_PORTS, value: '8080' }
                      - {
                            name: FIREWALL_OUTBOUND_SUBNETS,
                            value: '10.244.0.0/16,10.96.0.0/12',
                        }
                      - { name: WIREGUARD_MTU, value: '1320' }
                      - { name: SERVER_COUNTRIES, value: 'Germany' }
                      - { name: SERVER_CITIES, value: 'Frankfurt' }
                  volumeMounts:
                      - { name: gluetun-run, mountPath: /tmp/gluetun }
                  # Had no resources at all, so the scheduler accounted it as
                  # zero while it carries every byte of reel's traffic and can
                  # take as much of the node as it likes. Sized from the same
                  # 7-day window: p99 0.002 cores, peak 0.005, 0.06Gi memory.
                  resources:
                      requests: { cpu: '50m', memory: 128Mi }
                      limits: { cpu: '2', memory: 1Gi }
                - name: reel
                  image: ghcr.io/kbve/reel:0.1.45
                  env:
                      - { name: REEL_API_ADDR, value: '0.0.0.0:8080' }
                      - { name: REEL_ACTIVE_DIR, value: '/data/active' }
                      - { name: REEL_LIBRARY_DIR, value: '/data/library' }
                      - { name: REEL_SESSION_DIR, value: '/data/session' }
                      - {
                            name: REEL_STATE_FILE,
                            value: '/data/reel-state.json',
                        }
                      - { name: REEL_TTL_SECS, value: '21600' }
                      - { name: REEL_UPLOAD_LIMIT_BPS, value: '2097152' }
                      - {
                            name: RUST_LOG,
                            value: 'reel=debug,warn,librqbit::torrent_state::live=error',
                        }
                      - { name: REEL_LOG_JSON, value: 'true' }
                      - {
                            name: REEL_BT_PORT_FILE,
                            value: '/tmp/gluetun/forwarded_port',
                        }
                      - { name: REEL_ENCODE_THREADS, value: '16' }
                  envFrom:
                      - secretRef: { name: reel-api }
                  ports:
                      - containerPort: 8080
                  readinessProbe:
                      httpGet: { path: /healthz, port: 8080 }
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  livenessProbe:
                      httpGet: { path: /healthz, port: 8080 }
                      initialDelaySeconds: 90
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 6
                  # requests are a reservation, not a ceiling: whatever is
                  # requested is unavailable to every other pod whether or not
                  # this one touches it. reel is a transcoder, so it is idle
                  # almost always and wants many cores briefly -- which is what
                  # limits are for. Requesting the burst permanently parked 8 of
                  # the node's 64 cores against measured usage of a rounding
                  # error, on a node already at 81% cpu requested.
                  #
                  # Measured over 7 days from the cluster's own Prometheus:
                  #
                  #             p99        peak       requested
                  #   cpu       0.005      0.372      8
                  #   memory               0.24Gi     8Gi
                  #
                  # Requests now sit above the observed peak with room to spare;
                  # limits are untouched, so a real encode still takes 16 cores
                  # when the node has them. The tradeoff is that under contention
                  # reel is throttled toward its request rather than holding
                  # cores nothing else can use -- correct for a background
                  # transcoder, and it is not latency-sensitive.
                  #
                  # Caveat worth keeping: that 7-day window caught no meaningful
                  # encode, so the peak reflects an idle service. If encoding
                  # becomes routine, re-measure rather than assuming 500m holds.
                  resources:
                      requests: { cpu: '500m', memory: 1Gi }
                      limits: { cpu: '16', memory: 8Gi }
                  volumeMounts:
                      - { name: data, mountPath: /data }
                      - {
                            name: gluetun-run,
                            mountPath: /tmp/gluetun,
                            readOnly: true,
                        }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: reel-data }
                - name: gluetun-run
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: reel
    namespace: reel
spec:
    selector: { app: reel }
    ports:
        - { port: 8080, targetPort: 8080 }
