apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
    name: kasm-secret-store
    namespace: firecracker
spec:
    provider:
        kubernetes:
            remoteNamespace: kasm
            auth:
                serviceAccount:
                    name: firecracker-external-secrets
                    namespace: firecracker
            server:
                url: https://kubernetes.default.svc
                caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                    namespace: kube-system
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
    name: vpn-wireguard
    namespace: firecracker
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: kasm-secret-store
        kind: SecretStore
    target:
        name: vpn-wireguard
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: vpn-wireguard-firecracker
