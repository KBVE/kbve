apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: firecracker-read-vpn-wireguard
    namespace: kasm
rules:
    - apiGroups: ['']
      resources: ['secrets']
      resourceNames: ['vpn-wireguard']
      verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: firecracker-read-vpn-wireguard
    namespace: kasm
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: firecracker-read-vpn-wireguard
subjects:
    - kind: ServiceAccount
      name: firecracker-external-secrets
      namespace: firecracker
