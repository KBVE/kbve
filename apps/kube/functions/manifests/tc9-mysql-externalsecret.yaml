# Sync the acore MySQL credentials from tocloud9 into kilobase.
#
# Consumed by functions-deployment.yaml as TC9_MYSQL_USER / TC9_MYSQL_PASSWORD.
# The `wow` edge function treats an empty user or password as "not configured"
# and short-circuits (see acore.ts isConfigured), so a missing sync degrades to
# a disabled account lane rather than a crashloop — which also means a broken
# sync is silent. Check the ExternalSecret's status, not the pod's.
#
# Host and port are deliberately not synced: acore.ts already defaults them to
# mysql.tocloud9.svc.cluster.local:3306, and neither is a secret.
#
# RBAC for this store lives in the source namespace, at
# agones/tocloud9/manifests/mysql-cross-namespace-rbac.yaml. Without that Role
# the SecretStore authenticates fine and then reads nothing.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
    name: tocloud9-remote-secret-store
    namespace: kilobase
spec:
    provider:
        kubernetes:
            remoteNamespace: tocloud9
            auth:
                serviceAccount:
                    name: functions-mc-external-secrets
                    namespace: kilobase
            server:
                url: https://kubernetes.default.svc
                caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                    namespace: kube-system
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
    name: tc9-mysql-credentials
    namespace: kilobase
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: tocloud9-remote-secret-store
        kind: SecretStore
    target:
        name: tc9-mysql-credentials
        creationPolicy: Owner
    data:
        - secretKey: username
          remoteRef:
              key: tocloud9-mysql
              property: username
        - secretKey: password
          remoteRef:
              key: tocloud9-mysql
              property: password
