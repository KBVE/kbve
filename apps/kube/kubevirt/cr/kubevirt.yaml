# KubeVirt CR — configures the operator deployment.
# Based on Talos docs: https://docs.siderolabs.com/talos/v1.12/advanced-guides/install-kubevirt
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
    name: kubevirt
    namespace: kubevirt
spec:
    configuration:
        developerConfiguration:
            featureGates:
                - LiveMigration
                - HotplugVolumes
                - NetworkBindingPlugins
                - ExpandDisks
        smbios:
            sku: TalosCloud
            version: v0.1.0
            manufacturer: Talos Virtualization
            product: talosvm
            family: ccio
        network:
            permitBridgeInterfaceOnPodNetwork: true
    imagePullPolicy: IfNotPresent
    # Needs at least one field actually set. Both an omitted key and a bare
    # {} serialize to null through server-side apply, and the CRD schema
    # rejects null: "spec.customizeComponents in body must be of type
    # object". An empty patches list means the same thing and validates.
    customizeComponents:
        patches: []
    workloadUpdateStrategy:
        workloadUpdateMethods:
            - LiveMigrate
