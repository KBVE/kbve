apiVersion: apps/v1
kind: Deployment
metadata:
    name: ergo-irc
    namespace: irc
    labels:
        app: ergo-irc
        kbve.com/category: application
        kbve.com/stack: core
        kbve.com/managed-by: argocd
    annotations:
        fluentd.alpha.kubernetes.io/exclude: 'false'
spec:
    replicas: 1
    # ergo-data-pvc is ReadWriteOnce and the datastore is a single-writer file
    # (/ircd/db/ircd.db). A rolling update would start the replacement before
    # terminating the incumbent, and the new pod cannot attach a volume the old
    # one still holds -- it sits in ContainerCreating on a multi-attach error
    # until something gives. Recreate takes the brief outage instead, which is
    # what every other PVC-backed deployment here already does.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: ergo-irc
    template:
        metadata:
            labels:
                app: ergo-irc
            annotations:
                logging.coreos.com/local-retention-days: '30'
        spec:
            containers:
                - name: ergo
                  # Pinned, not `:stable`. A floating tag plus the default
                  # IfNotPresent pull means the running version is whatever was
                  # cached on the node that happened to schedule the pod: the
                  # bridge doc recorded ergo-2.18.0 live while `:stable` upstream
                  # had already moved to 2.19.1, so any reschedule was an
                  # unannounced two-minor jump. Upgrades belong in a commit.
                  image: ghcr.io/ergochat/ergo:v2.19.1@sha256:ef885e44f7fa19101bbbc41baef11dc280dc8107465dccaf6f0860f41b48a682
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 6667
                        name: irc
                      - containerPort: 6697
                        name: ircs
                      - containerPort: 8080
                        name: websocket
                      - containerPort: 8067
                        name: websocket-proxy
                  volumeMounts:
                      - name: ergo-config
                        mountPath: /ircd/ircd.yaml
                        subPath: ircd.yaml
                        readOnly: true
                      - name: ergo-data
                        mountPath: /ircd/db
                      - name: tls-certs
                        mountPath: /etc/ssl/certs
                        readOnly: true
                  env:
                      - name: ERGO_CONFIG
                        value: /ircd/ircd.yaml
                  resources:
                      requests:
                          memory: 128Mi
                          cpu: 100m
                      limits:
                          memory: 512Mi
                          cpu: 500m
                  livenessProbe:
                      tcpSocket:
                          port: 6667
                      initialDelaySeconds: 30
                      periodSeconds: 10
                  readinessProbe:
                      tcpSocket:
                          port: 6667
                      initialDelaySeconds: 5
                      periodSeconds: 5
            volumes:
                - name: ergo-config
                  configMap:
                      name: ergo-config
                - name: ergo-data
                  persistentVolumeClaim:
                      claimName: ergo-data-pvc
                - name: tls-certs
                  secret:
                      secretName: ergo-irc-tls-secret
                      optional: true
