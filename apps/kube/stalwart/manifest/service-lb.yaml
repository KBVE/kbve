apiVersion: v1
kind: Service
metadata:
    name: stalwart-lb
    namespace: stalwart
    annotations:
        lbipam.cilium.io/ips: '142.132.206.71'
        lbipam.cilium.io/sharing-key: public-71
        lbipam.cilium.io/sharing-cross-namespace: '*'
    labels:
        app: stalwart
        kbve.com/lb-pool: public
        kbve.com/category: application
        kbve.com/stack: mail
        kbve.com/managed-by: argocd
spec:
    type: LoadBalancer
    selector:
        app: stalwart
    ports:
        - name: smtp
          port: 25
          targetPort: 25
          protocol: TCP
        - name: submission
          port: 587
          targetPort: 587
          protocol: TCP
        - name: smtps
          port: 465
          targetPort: 465
          protocol: TCP
