apiVersion: apps/v1
kind: Deployment
metadata:
    name: stalwart
    namespace: stalwart
    labels:
        app: stalwart
        kbve.com/category: application
        kbve.com/stack: mail
        kbve.com/managed-by: argocd
    annotations:
        reloader.stakater.com/auto: 'true'
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: stalwart
    template:
        metadata:
            labels:
                app: stalwart
        spec:
            terminationGracePeriodSeconds: 60
            securityContext:
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                fsGroup: 2000
                seccompProfile:
                    type: RuntimeDefault
                # UID 2000 cannot bind 25/443/465 otherwise: k8s does not grant
                # ambient NET_BIND_SERVICE to non-root, unlike plain Docker which
                # defaults ip_unprivileged_port_start=0.
                sysctls:
                    - name: net.ipv4.ip_unprivileged_port_start
                      value: '0'
            initContainers:
                - name: seed-config
                  image: docker.io/stalwartlabs/stalwart:v0.16.16
                  imagePullPolicy: IfNotPresent
                  command:
                      [
                          'sh',
                          '-c',
                          'cp /config-src/config.json /etc/stalwart/config.json',
                      ]
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: config
                        mountPath: /config-src
                        readOnly: true
                      - name: etc
                        mountPath: /etc/stalwart
            containers:
                - name: stalwart
                  image: docker.io/stalwartlabs/stalwart:v0.16.16
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: STALWART_HOSTNAME
                        value: mail.herbmail.com
                      - name: STALWART_DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: stalwart-db-credentials
                                key: password
                      # The bootstrap admin credentials Stalwart prints on
                      # first boot never reached stdout (kubectl logs shows
                      # zero lines for the running container), so the web
                      # admin was unreachable. Stalwart's documented reset is
                      # this env var, "user:password"; it is only consulted
                      # when set, and it stays optional so the pod still
                      # starts before the sealed secret exists.
                      - name: STALWART_RECOVERY_ADMIN
                        valueFrom:
                            secretKeyRef:
                                name: stalwart-recovery-admin
                                key: credentials
                                optional: true
                      - name: STALWART_HOOK_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: stalwart-hook-secret
                                key: secret
                                optional: true
                  ports:
                      - name: smtp
                        containerPort: 25
                        protocol: TCP
                      - name: submission
                        containerPort: 587
                        protocol: TCP
                      - name: smtps
                        containerPort: 465
                        protocol: TCP
                      - name: admin
                        containerPort: 8080
                        protocol: TCP
                  resources:
                      requests:
                          memory: 256Mi
                          cpu: 100m
                      limits:
                          memory: 1024Mi
                          cpu: 1000m
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                          # The image ships /usr/local/bin/stalwart with the
                          # file capability cap_net_bind_service=ep. Exec of a
                          # file-capped binary fails outright ("operation not
                          # permitted") when that cap is outside the bounding
                          # set, so drop ALL alone crashlooped the pod before
                          # main() ever ran. Re-adding it only widens the
                          # bounding set; port 25 still binds through the
                          # ip_unprivileged_port_start sysctl above.
                          add:
                              - NET_BIND_SERVICE
                  readinessProbe:
                      tcpSocket:
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      tcpSocket:
                          port: 8080
                      initialDelaySeconds: 15
                      periodSeconds: 30
                  volumeMounts:
                      - name: etc
                        mountPath: /etc/stalwart
                      - name: data
                        mountPath: /var/lib/stalwart
                        subPath: lib
                      - name: tls
                        mountPath: /opt/stalwart-tls
                        readOnly: true
            volumes:
                - name: config
                  configMap:
                      name: stalwart-config
                - name: etc
                  emptyDir:
                      sizeLimit: 64Mi
                - name: data
                  persistentVolumeClaim:
                      claimName: stalwart-data
                - name: tls
                  secret:
                      secretName: stalwart-tls
                      optional: true
