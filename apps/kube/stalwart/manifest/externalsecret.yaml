# ServiceAccount used by ExternalSecrets to read stalwart-db-password out of
# the kilobase namespace. Bound by cross-namespace-rbac.yaml in
# apps/kube/kilobase/manifests.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: stalwart-external-secrets
    namespace: stalwart
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
    name: kilobase-remote-secret-store
    namespace: stalwart
spec:
    provider:
        kubernetes:
            remoteNamespace: kilobase
            auth:
                serviceAccount:
                    name: stalwart-external-secrets
                    namespace: stalwart
            server:
                url: https://kubernetes.default.svc
                caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                    namespace: kube-system
---
# The same sealed secret CNPG uses to manage the stalwart role's password,
# mirrored here so the deployment can read it as STALWART_DB_PASSWORD. One
# plaintext, sealed once, both consumers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
    name: stalwart-db-credentials
    namespace: stalwart
spec:
    refreshInterval: 15m
    secretStoreRef:
        name: kilobase-remote-secret-store
        kind: SecretStore
    target:
        name: stalwart-db-credentials
        creationPolicy: Owner
    data:
        - secretKey: password
          remoteRef:
              key: stalwart-db-password
              property: password
