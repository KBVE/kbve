apiVersion: agones.dev/v1
kind: Fleet
metadata:
    name: mmorpg-server
    namespace: mmorpg
    labels:
        app: mmorpg-server
        app.kubernetes.io/part-of: mmorpg
spec:
    replicas: 0
    scheduling: Packed
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                app: mmorpg-server
                app.kubernetes.io/part-of: mmorpg
        spec:
            ports:
                # No hostPort. Both lanes are TCP and reach the pod through the
                # Cilium gateway (HTTPRoute -> mmorpg-game Service), so the pod
                # stays compatible with baseline PodSecurity — same shape as
                # arpg and friendslop. The ports also sit above the chart's
                # 7000-7900 dynamic range so nothing here can collide with a
                # fleet that does use host ports.
                - name: ws
                  portPolicy: None
                  containerPort: 7960
                  protocol: TCP
                - name: http
                  portPolicy: None
                  containerPort: 7961
                  protocol: TCP
            health:
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 5
            sdkServer:
                logLevel: Info
            template:
                metadata:
                    labels:
                        app: mmorpg-server
                        app.kubernetes.io/part-of: mmorpg
                spec:
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 10001
                        runAsGroup: 10001
                        fsGroup: 10001
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: mmorpg-server
                          image: ghcr.io/kbve/mmorpg-server:0.0.1
                          imagePullPolicy: IfNotPresent
                          env:
                              - name: MMORPG_GAME_ADDR
                                value: '0.0.0.0:7960'
                              - name: MMORPG_HTTP_ADDR
                                value: '0.0.0.0:7961'
                              # What the browser is told to open. The address the
                              # socket binds says nothing about the URL a player
                              # reaches it by, and the token response carries this
                              # verbatim.
                              - name: MMORPG_PUBLIC_WS_URL
                                value: 'wss://mmorpg.kbve.com/ws'
                              # Signed-in players join with a GoTrue token; the
                              # server verifies it against the JWKS published
                              # here and takes the name from its claims. Unset
                              # would mean guests only — it does not fail open.
                              - name: SUPABASE_URL
                                value: 'https://supabase.kbve.com'
                              # Signs the ConnectTokens the HTTP door mints and
                              # the game port checks. Both halves live in this
                              # process, so a missing secret is not a mismatch —
                              # it is the all-zero development key, which anyone
                              # who reads the source can forge. The server logs a
                              # warning when it falls back to it.
                              - name: GAME_PRIVATE_KEY
                                valueFrom:
                                    secretKeyRef:
                                        name: mmorpg-netcode
                                        key: private-key
                                        optional: true
                              - name: RUST_LOG
                                value: 'info,mmorpg_server=debug'
                          ports:
                              - name: ws
                                containerPort: 7960
                                protocol: TCP
                              - name: http
                                containerPort: 7961
                                protocol: TCP
                          readinessProbe:
                              httpGet:
                                  path: /healthz
                                  port: 7961
                              initialDelaySeconds: 3
                              periodSeconds: 5
                              failureThreshold: 3
                          livenessProbe:
                              httpGet:
                                  path: /healthz
                                  port: 7961
                              initialDelaySeconds: 10
                              periodSeconds: 15
                              failureThreshold: 5
                          resources:
                              requests:
                                  # The sim thread runs a fixed 30 Hz tick and is
                                  # the floor here, not the socket traffic.
                                  cpu: '500m'
                                  memory: '256Mi'
                              limits:
                                  cpu: '2000m'
                                  memory: '1Gi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop:
                                      - ALL
