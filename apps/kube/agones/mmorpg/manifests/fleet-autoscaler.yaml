apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
    name: mmorpg-server-autoscaler
    namespace: mmorpg
    labels:
        app: mmorpg-server
        app.kubernetes.io/part-of: mmorpg
spec:
    fleetName: mmorpg-server
    policy:
        type: Buffer
        buffer:
            # One server, always up. This is a public playtest: everyone who
            # opens the itch page lands in the same world, and a buffer that
            # allocated a fresh instance per player would put each of them alone
            # in it.
            bufferSize: 1
            minReplicas: 1
            maxReplicas: 1
    sync:
        type: FixedInterval
        fixedInterval:
            seconds: 30
