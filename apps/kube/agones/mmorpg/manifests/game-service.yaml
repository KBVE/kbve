apiVersion: v1
kind: Service
metadata:
    name: mmorpg-game
    namespace: mmorpg
    labels:
        app: mmorpg-server
        app.kubernetes.io/part-of: mmorpg
        kbve.com/category: game-server
        kbve.com/stack: agones
        kbve.com/managed-by: argocd
spec:
    type: ClusterIP
    selector:
        app: mmorpg-server
    # A player's token names one server, and netcode checks the address the
    # packets arrive from against it. Without affinity the gateway is free to
    # send the upgrade to a different pod than the one the token was minted by,
    # which reads to the player as a connection that opens and immediately dies.
    sessionAffinity: ClientIP
    ports:
        - name: ws
          port: 7960
          targetPort: 7960
          protocol: TCP
        - name: http
          port: 7961
          targetPort: 7961
          protocol: TCP
