apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: herbmail-game-tls
    namespace: herbmail-game
    labels:
        app.kubernetes.io/part-of: herbmail
spec:
    secretName: herbmail-game-tls
    dnsNames:
        - game.herbmail.com
    issuerRef:
        name: letsencrypt-http
        kind: ClusterIssuer
        group: cert-manager.io
