apiVersion: agones.dev/v1
kind: Fleet
metadata:
    name: friendslop-server
    namespace: friendslop
    labels:
        app: friendslop-server
        app.kubernetes.io/part-of: friendslop
spec:
    replicas: 0
    scheduling: Packed
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                app: friendslop-server
                app.kubernetes.io/part-of: friendslop
        spec:
            ports:
                # Reliable lane. No hostPort — clients reach it through the
                # Cilium gateway (HTTPRoute -> friendslop-game Service), so the
                # pod stays compatible with baseline PodSecurity.
                - name: ws
                  portPolicy: None
                  containerPort: 7980
                  protocol: TCP
                # Unreliable lane. Dynamic rather than None because UDP cannot
                # traverse an L7 HTTPRoute — it has to reach the node directly,
                # so Agones maps 7981 to a host port and publishes the pair in
                # GameServer status. The server reads that back over the SDK and
                # advertises it to clients; without the mapping it would tell
                # them 7981, which is not reachable from outside the pod.
                #
                # NOTE: a hostPort violates PodSecurity `baseline`. This
                # namespace must be labelled `privileged` (or a hostPort
                # exception granted) or the GameServer pods will be rejected.
                - name: udp
                  portPolicy: Dynamic
                  containerPort: 7981
                  protocol: UDP
            health:
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 5
            sdkServer:
                logLevel: Info
            template:
                metadata:
                    labels:
                        app: friendslop-server
                        app.kubernetes.io/part-of: friendslop
                spec:
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 10001
                        runAsGroup: 10001
                        fsGroup: 10001
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: friendslop-server
                          image: ghcr.io/kbve/friendslop-server:0.0.1
                          imagePullPolicy: IfNotPresent
                          env:
                              - name: FS_SERVER_ADDR
                                value: '0.0.0.0:7980'
                              - name: FS_UDP_ADDR
                                value: '0.0.0.0:7981'
                              # Every peer bakes terrain from this, so changing
                              # it desyncs collision until clients reconnect.
                              - name: FS_SERVER_SEED
                                value: '1337'
                              - name: FS_TICK_HZ
                                value: '60'
                              - name: FS_TERRAIN_EXTENT
                                value: '256'
                              - name: FS_TERRAIN_RESOLUTION
                                value: '513'
                              - name: RUST_LOG
                                value: 'info,friendslop_server=debug,q=info'
                          ports:
                              - name: ws
                                containerPort: 7980
                                protocol: TCP
                              - name: udp
                                containerPort: 7981
                                protocol: UDP
                          readinessProbe:
                              httpGet:
                                  path: /healthz
                                  port: 7980
                              initialDelaySeconds: 3
                              periodSeconds: 5
                              failureThreshold: 3
                          livenessProbe:
                              httpGet:
                                  path: /healthz
                                  port: 7980
                              initialDelaySeconds: 10
                              periodSeconds: 15
                              failureThreshold: 5
                          resources:
                              requests:
                                  # The sim thread runs a fixed 60 Hz tick and
                                  # is the floor here, not the socket traffic.
                                  cpu: '500m'
                                  memory: '256Mi'
                              limits:
                                  cpu: '2000m'
                                  memory: '1Gi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop:
                                      - ALL
