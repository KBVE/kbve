apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
    name: friendslop-server-autoscaler
    namespace: friendslop
    labels:
        app: friendslop-server
        app.kubernetes.io/part-of: friendslop
spec:
    fleetName: friendslop-server
    policy:
        type: Buffer
        buffer:
            bufferSize: 1
            minReplicas: 1
            maxReplicas: 1
    sync:
        type: FixedInterval
        fixedInterval:
            seconds: 30
