# The worldserver fleet — the only part of ToCloud9 that belongs in Agones.
#
# Two things make this unusual, and both are deliberate:
#
# 1. portPolicy: None. Players never connect to a worldserver directly; they
#    reach `gateway`, which forwards to whichever worldserver owns their map.
#    So these pods need no hostPort and stay compatible with baseline
#    PodSecurity, the same shape as the herbmail fleet.
#
# 2. No GameServerAllocation anywhere. ToCloud9's own servers-registry is the
#    allocator: each worldserver self-registers its pod IP and the registry
#    assigns maps across the fleet and redirects players when one dies. Adding
#    an Agones allocation policy on top would fight it. Agones owns the pod
#    pool and nothing else.
#
# AzerothCore has no Agones SDK integration, so it can never call Ready() or
# Health() itself. The agones-bridge sidecar does it: it waits for the world
# socket to accept — the only honest readiness signal, since libsidecar's
# /ready is a hardcoded {"ready":true} that says nothing about map loading —
# then marks the GameServer Ready and beats Health until the socket dies.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
    name: tocloud9-worldserver
    namespace: tocloud9
    labels:
        app: tocloud9-worldserver
        app.kubernetes.io/part-of: tocloud9
    annotations:
        # After the db-import and client-data hooks (wave 1). Scaling the fleet
        # before the schema exists produces a crashloop, not a useful error.
        argocd.argoproj.io/sync-wave: '2'
spec:
    # One, deliberately, until cross-shard bot handoff is proven.
    #
    # servers-registry bin-packs maps across every worldserver that advertises
    # Cluster.AvailableMaps="" (which this fleet does), so two replicas own
    # disjoint halves of the world. mod-playerbots then teleports bots across
    # all of AiPlayerbot.RandomBotMaps = 0,1,530,571, so roughly every other
    # teleport lands a bot on a map this shard does not own. It is logged out,
    # handed to the owner over NATS, logged back in, and teleported again --
    # observed in production as the same bots handed off eighteen times in
    # forty minutes, burning ~2.9 cores per shard while never actually playing.
    #
    # Upstream hit this and wrote it down: 3kynox/mod-playerbots f3d819fc says
    # each worldserver "kept logging in characters owned by other shards, which
    # C2 then kicked and handed off, looping forever". Their fix benches bots
    # whose saved map belongs elsewhere -- correct, and it is in our pin -- but
    # benching is also why the pool can never seat all 100 bots on a partition.
    #
    # With a single worldserver every map is assigned to it, so nothing is ever
    # foreign, the handoff path is never entered rather than merely tuned, and
    # no bot is benched.
    #
    # Sharding is not abandoned. The way back is a second Fleet declaring an
    # explicit Cluster.AvailableMaps for instances and battlegrounds: the
    # distributor hands an explicit list to that server verbatim and drops those
    # maps from the balancer, so open world stays whole while instanced content
    # scales. That is the follow-up; this change is what makes bots work now and
    # proves the diagnosis before anything larger gets built on it.
    replicas: 1
    scheduling: Packed
    strategy:
        type: RollingUpdate
        rollingUpdate:
            # Agones rejects 0 here ("must be at least 1"), unlike a Deployment.
            maxSurge: 1
            maxUnavailable: 1
    template:
        metadata:
            labels:
                app: tocloud9-worldserver
                app.kubernetes.io/part-of: tocloud9
        spec:
            # Mandatory once the pod holds more than one container: Agones has
            # to be told which one the ports and health checks belong to, and
            # rejects the Fleet outright without it.
            container: worldserver
            # Declared here because the SDK can only update a Counter that
            # already exists -- set_counter_count on an undeclared name fails.
            # agones-shim fills this from libsidecar's active_connections, so it
            # tracks real gateway sessions rather than bots.
            counters:
                players:
                    count: 0
                    capacity: 1000
            ports:
                - name: world
                  portPolicy: None
                  containerPort: 8085
                  protocol: TCP
            health:
                # A cold worldserver spends a long time loading maps before it
                # binds the world socket — over ten minutes was observed
                # locally, and Longhorn RWX reads will not make that faster.
                # Health checking must not start until well past that.
                initialDelaySeconds: 1800
                periodSeconds: 15
                failureThreshold: 5
            sdkServer:
                logLevel: Info
            template:
                metadata:
                    labels:
                        app: tocloud9-worldserver
                        app.kubernetes.io/part-of: tocloud9
                spec:
                    terminationGracePeriodSeconds: 120
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        fsGroup: 1000
                        seccompProfile:
                            type: RuntimeDefault
                    volumes:
                        - name: client-data
                          persistentVolumeClaim:
                              claimName: tocloud9-client-data
                              readOnly: true
                        # /repo/bin is root-owned 0755 in the image, so a
                        # non-root worldserver cannot write its logs beside the
                        # binary. Give it somewhere writable instead.
                        - name: logs
                          emptyDir:
                              sizeLimit: 512Mi
                    containers:
                        - name: worldserver
                          image: ghcr.io/kbve/tocloud9-gameserver-playerbots:0.0.3
                          imagePullPolicy: IfNotPresent
                          env:
                              # AzerothCore's own settings. AC_* overrides the
                              # matching worldserver.conf key.
                              - name: AC_CLUSTER_ENABLED
                                value: '1'
                              # 1 = PVP. Pairs with realmlist.icon, which only
                              # sets the label the client shows.
                              - name: AC_GAME_TYPE
                                value: '1'
                              - name: AC_DATA_DIR
                                value: '/data'
                              - name: AC_LOGS_DIR
                                value: '/logs'
                              - name: AC_CONSOLE_ENABLE
                                value: '0'
                              - name: AC_RA_ENABLE
                                value: '0'
                              # SOAP is the only remote command channel this
                              # build has: console and RA are both off above
                              # because neither is reachable from another pod.
                              #
                              # The var is AC_SOAP_ENABLED, with the D. The
                              # AC_* override is the config key uppercased
                              # with dots as underscores, and the key here is
                              # SOAP.Enabled -- unlike its neighbours
                              # Console.Enable and Ra.Enable, which have no D.
                              # This file carried AC_SOAP_ENABLE for a long
                              # time; that name maps to no key at all, so
                              # setting it to '1' is a silent no-op. Verified
                              # against a running pod: worldserver.conf on
                              # disk still reads Console.Enable = 1 while
                              # AC_CONSOLE_ENABLE=0 wins, which is what proves
                              # the override is live and name-sensitive.
                              #
                              # SOAP.IP must be set explicitly. AzerothCore
                              # defaults it to 127.0.0.1, so flipping Enabled
                              # alone binds the listener to container loopback
                              # and every cross-pod dial gets connection
                              # refused with no log line to explain it.
                              #
                              # Reaching this port is a separate problem from
                              # opening it -- see worldserver-soap-service.yaml
                              # for why a Service in front of a Fleet only
                              # half-solves it.
                              - name: AC_SOAP_ENABLED
                                value: '1'
                              - name: AC_SOAP_IP
                                value: '0.0.0.0'
                              - name: AC_SOAP_PORT
                                value: '7878'
                              - name: AC_LOGIN_DATABASE_INFO
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-db
                                        key: AC_LOGIN_DATABASE_INFO
                              - name: AC_WORLD_DATABASE_INFO
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-db
                                        key: AC_WORLD_DATABASE_INFO
                              - name: AC_CHARACTER_DATABASE_INFO
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-db
                                        key: AC_CHARACTER_DATABASE_INFO
                              # mod-playerbots keeps its own database. Unlike the
                              # other three this one is NOT created by db-import:
                              # worldserver opens the pool and migrates it at
                              # startup from the module SQL baked into the image.
                              #
                              # Composed here rather than sealed as a fourth DSN.
                              # seal-credentials.sh generates a fresh password on
                              # every run, so adding a key to tocloud9-db meant
                              # rotating credentials the live MySQL still expects
                              # -- there was no way to append one value without
                              # breaking the other three. Building it from the
                              # MySQL secret removes that bind and makes a
                              # playerbots DSN that disagrees with the actual
                              # password impossible.
                              #
                              # $(VAR) expands from env vars defined EARLIER in
                              # this same container, so these two must stay above
                              # the line that uses them.
                              - name: TC9_DB_USER
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-mysql
                                        key: username
                              - name: TC9_DB_PASS
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-mysql
                                        key: password
                              - name: AC_PLAYERBOTS_DATABASE_INFO
                                value: 'mysql;3306;$(TC9_DB_USER);$(TC9_DB_PASS);acore_playerbots'
                              # Redundant, and kept only as documentation.
                              # playerbots.conf.dist already ships this at 1 and
                              # PlayerbotsDatabaseScript defaults it to true, so
                              # the module migrates acore_playerbots on every
                              # path whether or not this is set.
                              #
                              # It is spelled out because the flag is easy to
                              # assume is load-bearing and is not: the module
                              # builds its own DatabaseLoader and reads only
                              # Playerbots.Updates.EnableDatabases, never the
                              # main Updates.EnableDatabases bitmask -- which
                              # this worldserver does not set at all, leaving it
                              # at the conf's 7, a mask with no playerbots bit.
                              #
                              # An earlier version of this comment claimed the
                              # module would "find no database and give up"
                              # without it. That was wrong. What was actually
                              # missing was the GRANT on acore_playerbots, added
                              # in #16254 -- until then the pool failed to open
                              # and the worldserver died with SIGSEGV, which had
                              # nothing to do with this flag.
                              - name: AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES
                                value: '1'
                              # Required by mod-playerbots: bots act on grids no
                              # real player has activated. This is what makes the
                              # worldserver slow to start and memory-hungry.
                              - name: AC_PRELOAD_ALL_NON_INSTANCED_MAP_GRIDS
                                value: '1'
                              # worldserver.conf ships MapUpdate.Threads = 1, so
                              # every loaded grid on every map is updated by a
                              # single thread and the cpu limit below is mostly
                              # unreachable. Grid preload makes that worse: the
                              # thread walks all non-instanced grids whether or
                              # not anyone is standing on them. Measured on the
                              # compose stack with 20 bots and threads = 1, the
                              # world update tail sat at p99 45ms / max 50ms
                              # against a 50ms tick -- already at the budget with
                              # a fraction of the intended bot count.
                              #
                              # Name derived from Config.cpp's IniKeyToEnvVarKey:
                              # '.' becomes '_' and a lower-to-upper transition
                              # splits, so MapUpdate.Threads -> MAP_UPDATE_THREADS.
                              # Only keys already present in the conf are
                              # overridable, and this one is.
                              # 8 is upstream's ceiling, not an arbitrary
                              # number: the installation guide calls this "the
                              # single most impactful performance setting for
                              # playerbots", recommends 4-6, and says benefit is
                              # unlikely past 8 because AzerothCore is bound by
                              # single-core performance. Raising the cpu limit
                              # further therefore buys nothing on its own -- the
                              # map loop cannot spread past these threads.
                              - name: AC_MAP_UPDATE_THREADS
                                value: '8'
                              - name: AC_AI_PLAYERBOT_ENABLED
                                value: '1'
                              # Min and Max must move together. playerbots.conf
                              # ships both at 500, and an inverted pair trips an
                              # assertion in urand(min, max) that aborts the
                              # worldserver with SIGSEGV well after it logs ready.
                              #
                              # The pool is fleet-wide, not per-server: two
                              # shards configured at 20 hold 20 bots between
                              # them, not 40, because they coordinate through the
                              # shared acore_playerbots database.
                              #
                              # 1000, which is the measured step this ramp was
                              # built to justify.
                              #
                              # cpu does not respond to bot count in this range
                              # at all. One shard drew 3.53 cores at 39 bots,
                              # 3.16 at 250 and 3.06 at 500, against a limit of
                              # 16. Memory is equally flat: 6.52, 6.43, 6.47GiB
                              # against 64. The load is dominated by
                              # PreloadAllNonInstancedMapGrids, which updates
                              # every grid on every map whether or not anyone is
                              # standing on it, and that is consistent with
                              # upstream running 5000 bots on a six core 5700x.
                              #
                              # The tick tail is the real constraint, and unlike
                              # cpu it does respond. Measured at MapUpdate.Threads
                              # 8 throughout: p99 was 37ms at 250 and 40ms at 500
                              # once the bots had spread out and gone active,
                              # against a 50ms budget. A freshly booted shard
                              # reads about 3ms better than a settled one, so
                              # only settled numbers are comparable.
                              #
                              # That is roughly 3ms of p99 per doubling. If it
                              # holds, 1000 lands near 43ms -- inside the budget
                              # but no longer comfortable, and the margin is thin
                              # enough that this is the step where the tail has
                              # to be watched rather than assumed. If p99 settles
                              # past ~45ms, this is the ceiling for one shard:
                              # threads are already at upstream's stated maximum
                              # of 8, so the answer beyond that is a second shard
                              # rather than a bigger box.
                              #
                              # Watch the tick, not the memory. The signal is
                              # delay_99_percentile on :8901/metrics approaching
                              # 50ms, plus "Update time diff" lines in the log,
                              # which were 0 across the whole 500 run. A tick
                              # collapse costs a full grid preload to recover,
                              # which is why health initialDelaySeconds is 1800.
                              #
                              # Startup is longer again. With RandomBotAccountCount
                              # 0 the factory sizes its own pool: RNDbot accounts
                              # are ceil(maxRandomBots / charsPerAccount) and
                              # charsPerAccount is 10 here, so this takes the pool
                              # from 100 accounts to 150 and generates roughly 500
                              # new characters on first boot. The 250-character
                              # boot at 500 bots took about 10 minutes to fully
                              # seat, well inside the 1800s health delay and the
                              # shim's 2400s ready timeout.
                              - name: AC_AI_PLAYERBOT_MIN_RANDOM_BOTS
                                value: '1000'
                              - name: AC_AI_PLAYERBOT_MAX_RANDOM_BOTS
                                value: '1000'
                              # 0 means automatic, which is correct and was
                              # not before. This pool is NOT sized by this
                              # setting: RandomPlayerbotMgr allocates
                              # ceil(maxRandomBots / charsPerAccount) RNDbot
                              # accounts and addClassAccountPoolSize AddClass
                              # accounts, and anything beyond that is left
                              # "unassigned" -- dead weight. The previous 70
                              # produced 10 RNDbot / 50 AddClass / 10 unassigned
                              # while maxRandomBots was 100, so raising it did
                              # nothing for the bot pool. Raising maxRandomBots
                              # below is what grows it; auto then follows.
                              - name: AC_AI_PLAYERBOT_RANDOM_BOT_ACCOUNT_COUNT
                                value: '0'
                              - name: AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN
                                value: '1'
                              # Cluster wiring. The bare names are what the
                              # AzerothCore cluster patch reads and are the set
                              # verified working in apps/agones/tocloud9; the
                              # TC9_* names are what the C++ libsidecar reads.
                              # Both are set so neither path falls back to its
                              # localhost default.
                              # mod-group-xp. Stock AzerothCore splits kill XP
                              # across the party -- total XP times a small group
                              # rate (1.4 at five members) divided by the summed
                              # levels present -- so a full group nets about 28%
                              # of solo XP each and grouping is a straight loss.
                              # SoloParity floors that rate at 1.0 so every
                              # member earns what they would have earned alone;
                              # Bonus is the extra paid on top for grouping.
                              #
                              # Names follow Config.cpp's IniKeyToEnvVarKey: '.'
                              # becomes '_' and a lower-to-upper transition
                              # splits, so GroupXP.SoloParity ->
                              # GROUP_XP_SOLO_PARITY. Bound to the keys in
                              # etc/modules/mod_group_xp.conf, which the runtime
                              # image copies from the module's conf.dist.
                              - name: AC_GROUP_XP_ENABLE
                                value: '1'
                              - name: AC_GROUP_XP_SOLO_PARITY
                                value: '1'
                              - name: AC_GROUP_XP_BONUS
                                value: '0.1'
                              - name: NATS_URL
                                value: 'nats://nats:4222'
                              - name: SERVERS_REGISTRY_SERVICE_ADDRESS
                                value: 'servers-registry:8999'
                              - name: GUID_PROVIDER_SERVICE_ADDRESS
                                value: 'guidserver:8996'
                              - name: MATCHMAKING_SERVICE_ADDRESS
                                value: 'matchmakingserver:8994'
                              - name: GRPC_PORT
                                value: '9509'
                              - name: CHARACTER_GUIDS_BUFFER_SIZE
                                value: '5'
                              - name: ITEM_GUIDS_BUFFER_SIZE
                                value: '50'
                              - name: TC9_NATS_URL
                                value: 'nats://nats:4222'
                              - name: TC9_SERVERS_REGISTRY_ADDRESS
                                value: 'servers-registry:8999'
                              - name: TC9_GUID_PROVIDER_ADDRESS
                                value: 'guidserver:8996'
                              - name: TC9_GROUP_SERVICE_ADDRESS
                                value: 'groupserver:8998'
                              - name: TC9_GUILD_SERVICE_ADDRESS
                                value: 'guildserver:8995'
                              - name: TC9_MATCHMAKING_ADDRESS
                                value: 'matchmakingserver:8994'
                              - name: TC9_GRPC_PORT
                                value: '9509'
                              - name: TC9_HEALTH_CHECK_PORT
                                value: '8901'
                              # What this worldserver advertises to
                              # servers-registry. Must be the pod IP: the
                              # gateway dials it directly, in-cluster.
                              - name: TC9_PREFERRED_HOSTNAME
                                valueFrom:
                                    fieldRef:
                                        fieldPath: status.podIP
                          ports:
                              - name: world
                                containerPort: 8085
                                protocol: TCP
                              - name: grpc
                                containerPort: 9509
                                protocol: TCP
                              - name: health
                                containerPort: 8901
                                protocol: TCP
                              - name: soap
                                containerPort: 7878
                                protocol: TCP
                          volumeMounts:
                              - name: client-data
                                mountPath: /data
                                readOnly: true
                              - name: client-data
                                mountPath: /repo/bin/etc/worldserver.conf
                                subPath: etc/worldserver.conf
                                readOnly: true
                              - name: logs
                                mountPath: /logs
                          resources:
                              # Sized from a measured run, not a guess. One
                              # worldserver with PreloadAllNonInstancedMapGrids
                              # and only 20 bots used 6.35Gi, which already
                              # exceeds the previous 6Gi limit -- that would
                              # OOMKill on the first pod and read as an Agones
                              # crashloop rather than a memory problem. The
                              # cluster default is 500 bots, so headroom is
                              # deliberate. Playerbots is CPU-bound before it is
                              # memory-bound.
                              #
                              # requests.cpu tracks MapUpdate.Threads above: with
                              # 4 map threads a request of 2 means the scheduler
                              # reserves half of what the process is configured
                              # to run, and the shortfall shows up as cfs
                              # throttling -- a rising world diff with no obvious
                              # cause. The limit stays at 8 to leave room for the
                              # network and database threads alongside them.
                              #
                              # Memory is the resource this cluster has spare:
                              # the node sits at 14% of 593G requested, while cpu
                              # is at 81%. So memory is sized for the failure
                              # cost rather than the measurement -- an OOMKill
                              # costs a full grid preload to come back, which is
                              # thirty minutes of a shard being gone, and there
                              # is no reason to run close to the line when ~480G
                              # is unrequested.
                              requests:
                                  cpu: '8'
                                  memory: '16Gi'
                              limits:
                                  cpu: '16'
                                  memory: '64Gi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                        - name: agones-bridge
                          image: ghcr.io/kbve/agones-shim:0.0.3
                          imagePullPolicy: IfNotPresent
                          env:
                              # An HTTP 200 here means libsidecar is up, which happens within
                              # milliseconds of registration with servers-registry and well after
                              # the world socket binds. That is 'registered and routable' -- a
                              # stronger signal than the socket check this replaces, which marked
                              # the server Ready while the gateway still could not route to it.
                              # Without a deadline the shim waits for readiness forever. When the
                              # game container died on 2026-08-22 the shim kept probing, the pod
                              # stayed Running because the sidecar was alive, and Agones left the
                              # GameServer in Scheduled and never replaced it -- a dead server that
                              # is never recycled, with no crashloop and nothing to alert on.
                              # Past this the shim exits non-zero so Agones can replace the pod.
                              # 2400s because a cold worldserver preloads every non-instanced map grid; over ten minutes observed locally, and health initialDelaySeconds is already 1800.
                              - name: AGONES_SHIM_READY_TIMEOUT_SECS
                                value: '2400'
                              - name: AGONES_SHIM_READY_HTTP
                                value: 'http://127.0.0.1:8901/healthcheck'
                              - name: AGONES_SHIM_LIVE_TCP
                                value: '8085'
                              # active_connections counts gateway sessions, so this is real players;
                              # bots are server-side and never appear here.
                              - name: AGONES_SHIM_COUNTER_NAME
                                value: 'players'
                              - name: AGONES_SHIM_COUNTER_METRICS_URL
                                value: 'http://127.0.0.1:8901/metrics'
                              - name: AGONES_SHIM_COUNTER_METRIC
                                value: 'active_connections'
                          resources:
                              requests:
                                  cpu: '10m'
                                  memory: '16Mi'
                              limits:
                                  cpu: '100m'
                                  memory: '64Mi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop: ['ALL']
