# First contact for the client. `set realmlist <host>` in the client points
# here, and 3.3.5a always dials 3724 — the port is not negotiable, so this is
# Static and must be free on every node that runs it.
#
# authserver answers the logon challenge, then serves the realm list. Note that
# the realm *address* it hands back does not come from the acore_auth.realmlist
# row: it comes from whichever gateways are registered in servers-registry
# (authserver/service/realm.go). A realm with no live gateway is flagged
# offline automatically, which is the behaviour that makes the gateway fleet
# safe to roll.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
    name: tocloud9-authserver
    namespace: tocloud9
    labels:
        app: tocloud9-authserver
        app.kubernetes.io/part-of: tocloud9
    annotations:
        argocd.argoproj.io/sync-wave: '2'
spec:
    # A static hostPort binds once per node, so this cannot exceed the number
    # of `node.kbve.com/type: dedicated-server` nodes. Above that, the extra
    # GameServers sit unschedulable forever. Start at 1 and raise it only
    # alongside node count.
    replicas: 1
    scheduling: Packed
    strategy:
        # Not RollingUpdate: a replacement cannot bind the hostPort until the
        # old pod releases it, and Agones rejects maxSurge: 0 ("must be at
        # least 1"), so a surge-free rolling update is not expressible. Recreate
        # deletes the old GameServer first, which is the ordering this needs.
        # A brief outage on every update is by design.
        type: Recreate
    template:
        metadata:
            labels:
                app: tocloud9-authserver
                app.kubernetes.io/part-of: tocloud9
        spec:
            # Mandatory once the pod holds more than one container: Agones has
            # to be told which one the ports and health checks belong to, and
            # rejects the Fleet outright without it.
            container: authserver
            ports:
                - name: auth
                  portPolicy: Static
                  hostPort: 3724
                  containerPort: 3724
                  protocol: TCP
            health:
                initialDelaySeconds: 30
                periodSeconds: 15
                failureThreshold: 5
            sdkServer:
                logLevel: Info
            template:
                metadata:
                    labels:
                        app: tocloud9-authserver
                        app.kubernetes.io/part-of: tocloud9
                spec:
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 10001
                        runAsGroup: 10001
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: authserver
                          image: ghcr.io/kbve/tocloud9-services-playerbots:0.0.2
                          # One image carries every ToCloud9 service; pick this one.
                          command: ['/app/authserver']
                          imagePullPolicy: IfNotPresent
                          env:
                              - name: PORT
                                value: '3724'
                              - name: DB_SCHEMA_TYPE
                                value: 'ac'
                              - name: SERVERS_REGISTRY_SERVICE_ADDRESS
                                value: 'servers-registry:8999'
                              - name: AUTH_DB_CONNECTION
                                valueFrom:
                                    secretKeyRef:
                                        name: tocloud9-db
                                        key: AUTH_DB_CONNECTION
                          ports:
                              - name: auth
                                containerPort: 3724
                                protocol: TCP
                          resources:
                              requests:
                                  cpu: '100m'
                                  memory: '64Mi'
                              limits:
                                  cpu: '1'
                                  memory: '256Mi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop:
                                      - ALL
                        - name: agones-bridge
                          image: ghcr.io/kbve/agones-shim:0.0.2
                          imagePullPolicy: IfNotPresent
                          env:
                              # Without a deadline the shim waits for readiness forever. When the
                              # game container died on 2026-08-22 the shim kept probing, the pod
                              # stayed Running because the sidecar was alive, and Agones left the
                              # GameServer in Scheduled and never replaced it -- a dead server that
                              # is never recycled, with no crashloop and nothing to alert on.
                              # Past this the shim exits non-zero so Agones can replace the pod.
                              # 300s because the authserver binds in seconds; anything past five minutes is a failure, not a slow start.
                              - name: AGONES_SHIM_READY_TIMEOUT_SECS
                                value: '300'
                              - name: AGONES_SHIM_READY_TCP
                                value: '3724'
                          resources:
                              requests:
                                  cpu: '10m'
                                  memory: '16Mi'
                              limits:
                                  cpu: '100m'
                                  memory: '64Mi'
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop: ['ALL']
