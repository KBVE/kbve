# Scale the worldserver fleet on real player load.
#
# The fleet was pinned at replicas: 2 because Agones had no idea how busy a
# worldserver was. Nothing here is Allocated -- ToCloud9's own servers-registry
# assigns maps and routes players, so the usual Buffer policy, which counts
# Allocated GameServers, would sit at zero forever and never scale.
#
# The Counter policy works instead, because it scales on a number the game
# server reports about itself: agones-shim publishes `players` from libsidecar's
# active_connections.
#
# That bots do not appear in it is measured, not assumed, and the source reads
# the other way -- TC9Sidecar.cpp fills connectedPlayers from
# sWorldSessionMgr->GetActiveSessionCount(), which is _sessions.size() minus the
# queue and looks like it would count a bot's session. On the compose stack with
# bots demonstrably live (newest playerbots_random_bots event 7s old, 12 events
# in 120s) both worldservers reported active_connections 0 while the delay
# percentiles from the same collector moved, so the endpoint was awake and the
# zero was real. mod-playerbots keeps its sessions out of that map.
#
# This matters more than it looks: if bots did register, the fleet would scale
# up, each new shard would pull its share of a fleet-wide bot pool, and the
# autoscaler would chase its own tail across 24Gi pods. Re-check this after any
# mod-playerbots bump.
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
    name: tocloud9-worldserver-autoscaler
    namespace: tocloud9
    labels:
        app: tocloud9-worldserver
        app.kubernetes.io/part-of: tocloud9
    annotations:
        # After the fleet itself (wave 2), so the autoscaler never targets a
        # fleet that does not exist yet.
        argocd.argoproj.io/sync-wave: '3'
spec:
    fleetName: tocloud9-worldserver
    policy:
        type: Counter
        counter:
            key: players
            # Keep room for this many more players across the fleet. A
            # worldserver takes a long time to come up -- map grid preload runs
            # into minutes -- so the buffer has to cover the players who arrive
            # during that window, not just the ones already here.
            bufferSize: 100
            # Two is the floor the stack needs: map layering assigns overlapping
            # sets across shards, and dropping to one removes the redundancy the
            # registry relies on when a worldserver dies.
            minCapacity: 2000
            # 3000, not 8000. Capacity is 1000 per shard, so 8000 asked for eight
            # replicas -- and at requests.cpu 4 that is 32 cores on a node with
            # roughly 12 unrequested (52 of 64 already claimed, largely by reel,
            # longhorn and the ARC runners). The autoscaler would have created
            # GameServers that sat Pending forever while reporting a scaled
            # fleet. Memory is not the limit here and never was: the node is at
            # 14% of 593G.
            #
            # Three is honest rather than comfortable -- two fit today and the
            # third lands only if something else gives cpu back. Raise this when
            # the node does, not when the fleet looks busy.
            maxCapacity: 3000
    sync:
        type: FixedInterval
        fixedInterval:
            # Slower than the default 30s on purpose. Scaling up costs a full
            # grid preload, and reacting to a brief spike would spend minutes of
            # CPU on a worldserver that is no longer needed by the time it is
            # ready.
            seconds: 60
