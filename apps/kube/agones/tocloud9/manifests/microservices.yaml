# The nine stateless ToCloud9 microservices. These are plain Deployments on
# purpose: they are not game servers, hold no per-match state, and must not be
# Agones-managed. Only the worldserver belongs in a Fleet.
#
# Images are pinned to :master rather than the chart's :v0.0.4 default. That is
# the tag combination verified end to end by apps/agones/tocloud9 — the Go
# services read bare env names (PORT, NATS_URL), while the chart's TC9_* names
# belong to the worldserver's C++ libsidecar, which is configured separately in
# fleet.yaml.
# Service discovery. Holds the ws:* / gw:* records that worldservers and
# gateways self-register into, and assigns maps across the fleet. This is
# ToCloud9's allocator — Agones deliberately does not allocate here.
apiVersion: v1
kind: Service
metadata:
    name: servers-registry
    namespace: tocloud9
    labels:
        app: servers-registry
        app.kubernetes.io/part-of: tocloud9
spec:
    selector:
        app: servers-registry
    ports:
        - name: grpc
          port: 8999
          targetPort: 8999
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: servers-registry
    namespace: tocloud9
    labels:
        app: servers-registry
        app.kubernetes.io/part-of: tocloud9
spec:
    replicas: 1
    selector:
        matchLabels:
            app: servers-registry
    template:
        metadata:
            labels:
                app: servers-registry
                app.kubernetes.io/part-of: tocloud9
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: servers-registry
                  image: ghcr.io/kbve/tocloud9-services-playerbots:0.0.4
                  # One image carries every ToCloud9 service; pick this one.
                  command: ['/app/servers-registry']
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: PORT
                        value: '8999'
                      - name: REDIS_URL
                        value: 'redis://:@redis:6379/0'
                      - name: LAYER_MAPS
                        value: ''
                  ports:
                      - name: grpc
                        containerPort: 8999
                        protocol: TCP
                  resources:
                      requests:
                          cpu: '250m'
                          memory: '256Mi'
                      limits:
                          cpu: '1'
                          memory: '512Mi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
---
