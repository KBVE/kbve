# Battleground queues, including cross-realm.
apiVersion: v1
kind: Service
metadata:
    name: matchmakingserver
    namespace: tocloud9
    labels:
        app: matchmakingserver
        app.kubernetes.io/part-of: tocloud9
spec:
    selector:
        app: matchmakingserver
    ports:
        - name: grpc
          port: 8994
          targetPort: 8994
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: matchmakingserver
    namespace: tocloud9
    labels:
        app: matchmakingserver
        app.kubernetes.io/part-of: tocloud9
spec:
    replicas: 1
    selector:
        matchLabels:
            app: matchmakingserver
    template:
        metadata:
            labels:
                app: matchmakingserver
                app.kubernetes.io/part-of: tocloud9
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: matchmakingserver
                  image: ghcr.io/kbve/tocloud9-services-playerbots:0.0.4
                  # One image carries every ToCloud9 service; pick this one.
                  command: ['/app/matchmakingserver']
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: PORT
                        value: '8994'
                      - name: CHAR_DB_CONNECTION
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-db
                                key: CHAR_DB_CONNECTION
                      - name: WORLD_DB_CONNECTION
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-db
                                key: WORLD_DB_CONNECTION
                      - name: SERVERS_REGISTRY_SERVICE_ADDRESS
                        value: 'servers-registry:8999'
                      # The dungeon finder forms its parties through the group
                      # service, so matchmaking is a client of it now. Without
                      # this the config default localhost:8998 is used and every
                      # JoinLFG dies on connection refused.
                      - name: GROUP_SERVICE_ADDRESS
                        value: 'groupserver:8998'
                      - name: BATTLE_GROUPS
                        value: '1:1'
                      - name: NATS_URL
                        value: 'nats://nats:4222'
                  ports:
                      - name: grpc
                        containerPort: 8994
                        protocol: TCP
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '1'
                          memory: '512Mi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
