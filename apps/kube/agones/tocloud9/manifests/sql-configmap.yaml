# The ToCloud9 schema deltas, byte-identical to apps/agones/tocloud9/sql.
# Upstream applies these with a `dbimport` binary compiled from its own
# AzerothCore tree; that target builds all of AzerothCore, so we use the
# published acore importer for the base schema and apply these files with a
# plain mysql client instead. Origin: github.com/walkline/ToCloud9 (MIT),
# except auth__000002_configure_realm.sql, which is ours.
apiVersion: v1
kind: ConfigMap
metadata:
    name: tocloud9-sql
    namespace: tocloud9
    labels:
        app.kubernetes.io/part-of: tocloud9
data:
    auth__000001_create_admin_account.sql: |
        INSERT INTO acore_auth.account (id, username, salt, verifier, session_key, totp_secret, email, reg_mail, joindate, last_ip, last_attempt_ip, failed_logins, locked, lock_country, last_login, online, expansion, mutetime, mutereason, muteby, locale, os, recruiter, totaltime) VALUES (1, 'ADMIN', 0x9140667E6B813C4057EB9ED0265FD5349A4DD0CDEF726887F848DE9F84629C91, 0x3C3887BAE646B9F53D26EF8BA800546C32DE2D397575F31A791A56AEB5685638, 0xA18792D37F1F4A6961F7CE4BEEBC4F0661DB1445F441AC131C1A3611CB1720E54488CA3561855556, null, '', '', '2024-02-07 23:12:39', '192.168.178.22', '192.168.178.22', 0, 0, '00', '2025-07-30 13:28:49', 0, 2, 0, '', '', 0, 'Win', 0, 2050391);

        INSERT INTO acore_auth.account_access (id, gmlevel, RealmID, comment) VALUES (1, 3, -1, '');
    auth__000002_configure_realm.sql: |
        UPDATE acore_auth.realmlist SET name = 'KBVE', icon = 1 WHERE id = 1;

        UPDATE acore_auth.motd SET text = 'Welcome to KBVE WoW' WHERE realmid IN (-1, 1);
    characters__000001_create_guild_invites_table.up.sql: |
        CREATE TABLE IF NOT EXISTS `guild_invites` (
            `charGuid` int unsigned NOT NULL DEFAULT '0',
            `guildId` int unsigned NOT NULL DEFAULT '0',
            PRIMARY KEY (`charGuid`)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
    characters__000002_add_auto_increment_to_mail.up.sql: |
        ALTER TABLE `mail`
            MODIFY COLUMN `id` INT UNSIGNED NOT NULL AUTO_INCREMENT;
    characters__000003_create_group_invites_table.up.sql: |
        CREATE TABLE IF NOT EXISTS `group_invites` (
            `invited` int unsigned NOT NULL DEFAULT '0',
            `inviter` int unsigned NOT NULL DEFAULT '0',
            `groupId` int unsigned NOT NULL DEFAULT '0',
            `invitedName` varchar(12),
            `inviterName` varchar(12),
            PRIMARY KEY (`invited`)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        ALTER TABLE `groups`
            MODIFY COLUMN `guid` INT UNSIGNED NOT NULL AUTO_INCREMENT;
    characters__000004_create_channels_members_table.up.sql: |
        CREATE TABLE IF NOT EXISTS `channels_members` (
          `channelId` INT UNSIGNED NOT NULL,
          `playerGUID` BIGINT UNSIGNED NOT NULL,
          `playerName` VARCHAR(12) NOT NULL,
          `flags` TINYINT UNSIGNED NOT NULL DEFAULT 0,
          `joinedAt` BIGINT NOT NULL,
          PRIMARY KEY (`channelId`, `playerGUID`),
          INDEX `idx_channel` (`channelId`),
          INDEX `idx_player` (`playerGUID`)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
    characters__000005_add_group_invite_gameserver.up.sql: |
        ALTER TABLE `group_invites`
            ADD COLUMN `inviterMapId` INT UNSIGNED NOT NULL DEFAULT 0 AFTER `inviterName`,
            ADD COLUMN `inviterGameServerId` VARCHAR(255) NOT NULL DEFAULT '' AFTER `inviterMapId`;
