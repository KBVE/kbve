# Seeds the three AzerothCore databases. Must complete before the fleet scales:
# a fleet of worldservers racing an unimported schema just crashloops, which is
# exactly what happens locally if you skip this step.
#
# Two containers, in order:
#   1. acore/ac-wotlk-db-import  — base AzerothCore auth/characters/world schema
#   2. mysql client              — the six ToCloud9 deltas from tocloud9-sql
#
# The importer tag is pinned and MUST NOT be moved to :master. AzerothCore
# collapsed creature.id1/id2/id3 into a single `id` column after the commit
# ToCloud9's worldserver is built against, so a HEAD world DB makes the
# worldserver abort at startup with:
#   In mysql_stmt_prepare() id: 61, sql: "INSERT INTO creature (guid, id1, ...)"
#   Unknown column 'id1' in 'field list'
# If the pinned tag ever drifts too, the correct fix is to build upstream's own
# importer (game-server/azerothcore/Dockerfile --target db-import), which
# compiles all of AzerothCore and therefore always matches the worldserver.
apiVersion: batch/v1
kind: Job
metadata:
    name: tocloud9-db-import
    namespace: tocloud9
    labels:
        app.kubernetes.io/part-of: tocloud9
    annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: '1'
spec:
    backoffLimit: 3
    template:
        metadata:
            labels:
                app.kubernetes.io/part-of: tocloud9
        spec:
            restartPolicy: OnFailure
            # acore/ac-wotlk-db-import publishes linux/amd64 only.
            nodeSelector:
                kubernetes.io/arch: amd64
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            initContainers:
                - name: wait-for-mysql
                  image: busybox:1.36
                  command: ['/bin/sh', '-c']
                  args:
                      - |
                          until nc -z -w 2 mysql 3306; do
                              echo "waiting for mysql:3306"
                              sleep 5
                          done
                          echo "mysql is accepting connections"
                  resources:
                      requests:
                          cpu: '10m'
                          memory: '16Mi'
                      limits:
                          cpu: '100m'
                          memory: '64Mi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                - name: ac-db-import
                  image: acore/ac-wotlk-db-import:16.0.0-dev
                  env:
                      - name: AC_UPDATES_ENABLE_DATABASES
                        value: '7'
                      - name: AC_DATA_DIR
                        value: '/azerothcore/env/dist/data'
                      - name: AC_LOGIN_DATABASE_INFO
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-db
                                key: AC_LOGIN_DATABASE_INFO
                      - name: AC_WORLD_DATABASE_INFO
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-db
                                key: AC_WORLD_DATABASE_INFO
                      - name: AC_CHARACTER_DATABASE_INFO
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-db
                                key: AC_CHARACTER_DATABASE_INFO
                  resources:
                      requests:
                          cpu: '500m'
                          memory: '512Mi'
                      limits:
                          cpu: '2'
                          memory: '2Gi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
            containers:
                - name: tc9-sql
                  image: mysql:8.4
                  env:
                      - name: MYSQL_PWD
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-mysql
                                key: password
                  command: ['/bin/sh', '-c']
                  args:
                      - |
                          set -eu
                          # This Job is a Sync hook, so it re-runs on every ArgoCD
                          # sync. The vendored deltas are not idempotent: the auth
                          # delta INSERTs a fixed account id and 000005 ADDs columns.
                          # A second run therefore fails, and since the fleets sit in
                          # wave 2 behind this Job, that failure blocks the entire
                          # rollout. Skip when the last delta is already present.
                          APPLIED=$(mysql -h mysql -P 3306 -u acore -N -B acore_characters \
                              -e "SELECT COUNT(*) FROM information_schema.columns \
                                  WHERE table_schema='acore_characters' \
                                    AND table_name='group_invites' \
                                    AND column_name='inviterGameServerId';")
                          if [ "$APPLIED" = "1" ]; then
                              echo "ToCloud9 deltas already applied, nothing to do"
                              exit 0
                          fi
                          for f in /sql/auth__*.sql; do
                              echo "acore_auth <- $(basename "$f")"
                              mysql -h mysql -P 3306 -u acore acore_auth < "$f"
                          done
                          for f in /sql/characters__*.sql; do
                              echo "acore_characters <- $(basename "$f")"
                              mysql -h mysql -P 3306 -u acore acore_characters < "$f"
                          done
                          echo "ToCloud9 SQL deltas applied"
                  volumeMounts:
                      - name: sql
                        mountPath: /sql
                        readOnly: true
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '1'
                          memory: '512Mi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: sql
                  configMap:
                      name: tocloud9-sql
