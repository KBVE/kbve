---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
    annotations:
        # Ahead of the wave-1 import Job, which cannot run
        # until the controller has produced the Secret.
        argocd.argoproj.io/sync-wave: '-1'
    name: tocloud9-db
    namespace: tocloud9
spec:
    encryptedData:
        AC_CHARACTER_DATABASE_INFO: 
        AC_LOGIN_DATABASE_INFO: 
        AC_WORLD_DATABASE_INFO: 
        AUTH_DB_CONNECTION: 
        CHAR_DB_CONNECTION: 
        WORLD_DB_CONNECTION: 
    template:
        metadata:
            name: tocloud9-db
            namespace: tocloud9
