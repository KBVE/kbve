# ToCloud9 is MySQL-only and cannot use kilobase/CNPG: the AzerothCore
# worldserver is C++ against libmysqlclient, every ToCloud9 Go repo is
# `*_mysql.go`, and apps/mysqlreverseproxy parses the MySQL wire protocol
# directly. This is the first MySQL workload in the cluster.
#
# Deliberately a plain StatefulSet rather than an operator: the thing under
# test is the Agones fleet and the raw-TCP lane, not database HA. All three
# databases are shared by every worldserver, so the DB sits outside the fleet
# and does not scale with it.
apiVersion: v1
kind: Service
metadata:
    name: mysql
    namespace: tocloud9
    labels:
        app: mysql
        app.kubernetes.io/part-of: tocloud9
spec:
    clusterIP: None
    selector:
        app: mysql
    ports:
        - name: mysql
          port: 3306
          targetPort: 3306
          protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: mysql
    namespace: tocloud9
    labels:
        app: mysql
        app.kubernetes.io/part-of: tocloud9
spec:
    serviceName: mysql
    replicas: 1
    selector:
        matchLabels:
            app: mysql
    template:
        metadata:
            labels:
                app: mysql
                app.kubernetes.io/part-of: tocloud9
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: mysql
                  image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
                  args:
                      - --log-bin-trust-function-creators=1
                      # MySQL ships a 128M buffer pool. AzerothCore's world
                      # database alone is larger than that, so every worldserver
                      # start and every bot that wanders into a new zone was
                      # reading creature and gameobject templates off disk. The
                      # node is at 14% memory with ~480G unrequested, so this is
                      # the cheapest throughput available to the stack.
                      #
                      # Half the container limit below. The rest is deliberate:
                      # connection buffers, sort and temp tables all live outside
                      # the pool, and sizing the pool to the limit is how MySQL
                      # gets OOMKilled rather than merely slow.
                      - --innodb-buffer-pool-size=8G
                      # 151 is the stock ceiling. Each worldserver opens pooled
                      # connections for four databases and there are twelve Go
                      # services besides, so the ceiling is reachable with a
                      # handful of shards -- and it fails as connection refused
                      # during a rollout, which reads like a network fault.
                      - --max-connections=500
                      # From the mod-playerbots installation guide, which pairs
                      # these with the buffer pool above for bot-heavy servers.
                      # MySQL defaults io_capacity to 200, sized for a spinning
                      # disk; this cluster is on Longhorn-backed SSD and a few
                      # hundred bots write position, inventory and quest state
                      # continuously, so the default throttles background flush
                      # and lets the redo log back up under exactly the load we
                      # are about to add.
                      - --innodb-io-capacity=500
                      - --innodb-io-capacity-max=2500
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-mysql
                                key: root_password
                      - name: MYSQL_USER
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-mysql
                                key: username
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: tocloud9-mysql
                                key: password
                  ports:
                      - name: mysql
                        containerPort: 3306
                        protocol: TCP
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/mysql
                      - name: initdb
                        mountPath: /docker-entrypoint-initdb.d
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      failureThreshold: 6
                  livenessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      failureThreshold: 5
                  resources:
                      requests:
                          cpu: '500m'
                          memory: '4Gi'
                      limits:
                          cpu: '2'
                          memory: '16Gi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: initdb
                  configMap:
                      name: tocloud9-mysql-initdb
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes:
                  - ReadWriteOnce
              storageClassName: longhorn
              resources:
                  requests:
                      storage: 20Gi
