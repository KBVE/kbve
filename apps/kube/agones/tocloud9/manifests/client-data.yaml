# ~4GB of WoW 3.3.5a client data (dbc/maps/mmaps/vmaps), shared read-only by
# every worldserver in the fleet, plus the cluster-mode worldserver.conf.
#
# ReadWriteMany because the whole fleet mounts the same copy. That routes
# through Longhorn's share-manager, which is a single point of failure for the
# fleet — acceptable for a test case. If this ever carries real players, bake
# the data into the worldserver image instead: it is immutable and identical
# per pod, so an image layer scales better than an NFS export.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: tocloud9-client-data
    namespace: tocloud9
    labels:
        app.kubernetes.io/part-of: tocloud9
    annotations:
        argocd.argoproj.io/sync-wave: '0'
spec:
    accessModes:
        - ReadWriteMany
    storageClassName: longhorn
    resources:
        requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
    name: tocloud9-client-data
    namespace: tocloud9
    labels:
        app.kubernetes.io/part-of: tocloud9
    annotations:
        argocd.argoproj.io/hook: Sync
        # Without a delete policy the Job is immutable on resync and the whole
        # Application wedges.
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: '1'
spec:
    # ArgoCD blocks the whole sync until this hook completes, and backoffLimit
    # only counts pods that ran and failed -- a pod stuck pulling a bad image
    # never fails, so it retries forever and pins the app to a stale revision.
    # 1800s because several GB of client data over the network.
    activeDeadlineSeconds: 1800
    backoffLimit: 3
    template:
        metadata:
            labels:
                app.kubernetes.io/part-of: tocloud9
        spec:
            restartPolicy: OnFailure
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: fetch
                  image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
                  env:
                      - name: CLIENT_DATA_URL
                        # v20, not v19: the mmaps generator version is a property of the
                        # CORE binary. The playerbots worldserver carries the nav5
                        # mmaps changes and expects v20; v19 tiles are rejected
                        # per-tile and creatures lose their navmesh. This must move
                        # in lockstep with the worldserver image.
                        value: 'https://github.com/wowgaming/client-data/releases/download/v20.0/Data.zip'
                      - name: WORLDSERVER_CONF_URL
                        # Pinned to the same core the worldserver image is built from.
                        # walkline's cluster-mode branch is a different core, and this
                        # file is mounted over the image's own worldserver.conf.
                        value: 'https://raw.githubusercontent.com/KBVE/azerothcore-wotlk/907c29b947cf868af747a0dd62bccbc66dd73b1b/src/server/apps/worldserver/worldserver.conf.dist'
                  command: ['/bin/sh', '-c']
                  args:
                      - |
                          set -eu
                          mkdir -p /data/etc
                          echo "fetching cluster-mode worldserver.conf"
                          python -c "import os,urllib.request;urllib.request.urlretrieve(os.environ['WORLDSERVER_CONF_URL'],'/data/etc/worldserver.conf')"
                          STAMP=/data/.client-data-url
                          if [ -d /data/dbc ] && [ -d /data/maps ] && [ -d /data/vmaps ] && [ -d /data/mmaps ] \
                              && [ "$(cat "$STAMP" 2>/dev/null || true)" = "$CLIENT_DATA_URL" ]; then
                              echo "client data already present at $CLIENT_DATA_URL, skipping download"
                              exit 0
                          fi
                          echo "removing any previous client data"
                          rm -rf /data/Cameras /data/dbc /data/maps /data/mmaps /data/vmaps "$STAMP"
                          echo "downloading client data (1.2GB zipped, ~3.1GB unpacked), this takes a while"
                          cd /data
                          python -c "import os,urllib.request;urllib.request.urlretrieve(os.environ['CLIENT_DATA_URL'],'data.zip')"
                          python -m zipfile -e data.zip .
                          rm -f data.zip
                          printf '%s' "$CLIENT_DATA_URL" > "$STAMP"
                          echo "client data ready"
                          ls -1 /data
                  volumeMounts:
                      - name: client-data
                        mountPath: /data
                  resources:
                      requests:
                          cpu: '250m'
                          memory: '512Mi'
                      limits:
                          cpu: '2'
                          memory: '4Gi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: client-data
                  persistentVolumeClaim:
                      claimName: tocloud9-client-data
