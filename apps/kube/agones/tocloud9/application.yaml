apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: agones-tocloud9
    namespace: argocd
    labels:
        app.kubernetes.io/part-of: tocloud9
    annotations:
        kbve.com/source-path: kube/agones/tocloud9
        kbve.com/manifest-path: apps/kube/agones/tocloud9/manifests
        kbve.com/application-file: kube/agones/tocloud9/application.yaml
        kbve.com/managed-by: argocd
        kbve.com/schema-version: v1
        kbve.com/category: game-server
        kbve.com/stack: agones
spec:
    project: default
    source:
        repoURL: https://github.com/kbve/kbve
        targetRevision: main
        path: apps/kube/agones/tocloud9/manifests
    destination:
        server: https://kubernetes.default.svc
        namespace: tocloud9
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=false
            - ServerSideApply=true
        retry:
            limit: 3
            backoff:
                duration: 30s
                factor: 2
                maxDuration: 5m
