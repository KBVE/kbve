apiVersion: agones.dev/v1
kind: GameServer
metadata:
    name: palworld
    namespace: palworld
    labels:
        app: palworld
        app.kubernetes.io/part-of: palworld
spec:
    container: palworld
    ports:
        - name: game
          portPolicy: Static
          hostPort: 8211
          containerPort: 8211
          protocol: UDP
    health:
        initialDelaySeconds: 300
        periodSeconds: 15
        failureThreshold: 20
    sdkServer:
        logLevel: Info
    template:
        metadata:
            labels:
                app: palworld
                app.kubernetes.io/part-of: palworld
        spec:
            terminationGracePeriodSeconds: 120
            securityContext:
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            volumes:
                - name: palworld-saves
                  persistentVolumeClaim:
                      claimName: palworld-saves
                - name: palworld-backups
                  persistentVolumeClaim:
                      claimName: palworld-backups
                - name: chat-relay
                  emptyDir: {}
                - name: save-intel
                  emptyDir: {}
                - name: savetool-tmp
                  emptyDir: {}
            containers:
                - name: palworld
                  image: ghcr.io/kbve/agones-palworld:0.0.36
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: PUID
                        value: '1000'
                      - name: PGID
                        value: '1000'
                      - name: SERVER_SETTINGS_MODE
                        value: 'auto'
                      - name: SERVER_NAME
                        value: 'KBVE Palworld'
                      - name: SERVER_DESCRIPTION
                        value: 'KBVE community server — crossplay Steam/Xbox/PS5. Search: kbve'
                      - name: PUBLIC_IP
                        value: '142.132.206.74'
                      - name: PUBLIC_PORT
                        value: '8211'
                      - name: CROSSPLAY_PLATFORMS
                        value: '(Steam,Xbox,PS5,Mac)'
                      - name: MAX_PLAYERS
                        value: '32'
                      - name: RCON_ENABLED
                        value: 'true'
                      - name: RCON_PORT
                        value: '25575'
                      - name: RESTAPI_ENABLED
                        value: 'true'
                      - name: RESTAPI_PORT
                        value: '8212'
                      - name: PAL_EGG_DEFAULT_HATCHING_TIME
                        value: '1.000000'
                      - name: SUPPLY_DROP_SPAN
                        value: '60'
                      - name: ITEM_WEIGHT_RATE
                        value: '0.500000'
                      - name: ENABLE_PREDATOR_BOSS_PAL
                        value: 'True'
                      - name: BASE_CAMP_WORKER_MAXNUM
                        value: '35'
                      - name: GUILD_PLAYER_MAX_NUM
                        value: '50'
                      - name: AUTO_RESET_GUILD_NO_ONLINE_PLAYERS
                        value: 'true'
                      - name: AUTO_RESET_GUILD_TIME_NO_ONLINE_PLAYERS
                        value: '720.000000'
                      - name: DEATH_PENALTY
                        value: 'ItemAndEquipment'
                      - name: SERVER_REPLICATE_PAWN_CULL_DISTANCE
                        value: '10000.000000'
                      - name: ALLOW_GLOBAL_PALBOX_EXPORT
                        value: 'True'
                      - name: ALLOW_GLOBAL_PALBOX_IMPORT
                        value: 'False'
                      - name: ENABLE_INVADER_ENEMY
                        value: 'True'
                      - name: MULTITHREAD_ENABLED
                        value: 'true'
                      - name: COMMUNITY_SERVER
                        value: 'true'
                      - name: BACKUP_ENABLED
                        value: 'true'
                      - name: RESTART_ENABLED
                        value: 'false'
                      - name: PLAYER_DETECTION_ENABLED
                        value: 'false'
                      - name: RCON_PLAYER_DETECTION
                        value: 'false'
                      - name: WORKSHOP_MOD_UPDATE_CRON
                        value: ''
                      - name: ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: palworld-rcon
                                key: admin_password
                      - name: SERVER_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: palworld-rcon
                                key: server_password
                  ports:
                      - containerPort: 8211
                        protocol: UDP
                      - containerPort: 27015
                        protocol: UDP
                      - containerPort: 25575
                        protocol: TCP
                      - containerPort: 8212
                        protocol: TCP
                  volumeMounts:
                      - name: palworld-saves
                        mountPath: /palworld/Pal/Saved
                      - name: palworld-backups
                        mountPath: /palworld/backups
                      - name: chat-relay
                        mountPath: /shared/chat
                  resources:
                      requests:
                          cpu: '4'
                          memory: '16Gi'
                      limits:
                          cpu: '6'
                          memory: '32Gi'
                  securityContext:
                      allowPrivilegeEscalation: true
                      capabilities:
                          drop:
                              - ALL
                          add:
                              - CHOWN
                              - SETUID
                              - SETGID
                              - DAC_OVERRIDE
                              - FOWNER
                  lifecycle:
                      preStop:
                          exec:
                              command:
                                  - /usr/local/bin/agones-shim-prestop
                - name: palworld-relay
                  image: ghcr.io/kbve/agones-palworld-relay:0.0.13
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8300
                        protocol: TCP
                  env:
                      - name: PALWORLD_REST_ADDR
                        value: 'http://127.0.0.1:8212'
                      - name: PALWORLD_ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: palworld-rcon
                                key: admin_password
                      - name: PALWORLD_RCON_ADDR
                        value: '127.0.0.1:25575'
                      - name: PALWORLD_SERVER_ID
                        value: 'palworld-1'
                      - name: IRC_SERVER
                        value: 'ergo-irc-service.irc.svc.cluster.local'
                      - name: IRC_PORT
                        value: '6667'
                      - name: IRC_USE_TLS
                        value: 'false'
                      - name: IRC_NICK
                        value: 'palworld-bot'
                      - name: IRC_CHANNEL
                        value: '#general'
                      - name: AGONES_SDK_HTTP
                        value: 'http://127.0.0.1:9358'
                      - name: AGONES_HEALTH_INTERVAL_SECS
                        value: '5'
                      - name: AGONES_REST_PROBE_TIMEOUT_SECS
                        value: '2'
                      - name: AGONES_INITIAL_READY_DELAY_SECS
                        value: '60'
                      - name: CLICKHOUSE_URL
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-credentials
                                key: endpoint
                                optional: true
                      - name: CLICKHOUSE_USER
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-credentials
                                key: username
                                optional: true
                      - name: CLICKHOUSE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: clickhouse-credentials
                                key: password
                                optional: true
                      - name: CLICKHOUSE_DATABASE
                        value: 'gameops'
                      - name: RUST_LOG
                        value: 'info,agones_palworld_relay=debug'
                      - name: CHAT_LOG_PATH
                        value: /shared/chat/chat.log
                      - name: LIVE_API_PORT
                        value: '8300'
                      - name: SAVE_INTEL_PATH
                        value: /intel/bases.json
                  volumeMounts:
                      - name: chat-relay
                        mountPath: /shared/chat
                        readOnly: true
                      - name: save-intel
                        mountPath: /intel
                        readOnly: true
                  resources:
                      requests:
                          cpu: '50m'
                          memory: '64Mi'
                      limits:
                          cpu: '500m'
                          memory: '256Mi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities:
                          drop:
                              - ALL
                - name: palworld-savetool
                  image: ghcr.io/kbve/agones-palworld-savetool:0.0.2
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SAVE_INTEL_SAVE_DIR
                        value: /palworld/Pal/Saved/SaveGames
                      - name: SAVE_INTEL_OUT
                        value: /intel/bases.json
                      - name: SAVE_INTEL_INTERVAL_S
                        value: '300'
                  volumeMounts:
                      - name: palworld-saves
                        mountPath: /palworld/Pal/Saved
                        readOnly: true
                      - name: save-intel
                        mountPath: /intel
                      - name: savetool-tmp
                        mountPath: /tmp
                  resources:
                      requests:
                          cpu: '50m'
                          memory: '128Mi'
                      limits:
                          cpu: '1'
                          memory: '2Gi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities:
                          drop:
                              - ALL
