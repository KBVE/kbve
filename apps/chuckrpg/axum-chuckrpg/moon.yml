$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    container:
        script: 'docker buildx build --platform linux/amd64 -f apps/chuckrpg/axum-chuckrpg/Dockerfile -t kbve/chuckrpg:latest --load .'
        options:
            runFromWorkspaceRoot: true

    # The registry build of `container`. Separate rather than a flag because
    # moon has no configurations: under Nx this was `--configuration=production`
    # on the same target. It differs only in pushing the layer cache to the
    # registry and carrying runInCI, so a local `container` stays a local build.
    container-publish:
        script: 'docker buildx build --platform linux/amd64 --cache-from=type=gha --cache-from=type=registry,ref=ghcr.io/kbve/chuckrpg:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/chuckrpg:buildcache,mode=max -f apps/chuckrpg/axum-chuckrpg/Dockerfile -t kbve/chuckrpg:latest --load .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
