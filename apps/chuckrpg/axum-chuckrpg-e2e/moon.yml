$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['vitest']

tasks:
    e2e:
        script: 'docker rm -f axum-chuckrpg-e2e 2>/dev/null || true && docker run -d --name axum-chuckrpg-e2e -p 4324:4322 -e HTTP_HOST=0.0.0.0 -e HTTP_PORT=4322 -e RUST_LOG=info kbve/chuckrpg:latest && npx vitest run; EC=$?; docker rm -f axum-chuckrpg-e2e 2>/dev/null || true; exit $EC'
        deps: ['axum-chuckrpg:container']
        options:
            cache: false
