$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    # The Nx target tagged this one explicitly rather than taking kbve/$project.
    container:
        args: ['-t', 'kbve/metrics:latest']

    # The registry build, which is CI's. It loads rather than pushing -- the
    # workflow pushes afterwards -- but carries the buildcache and the ghcr tag.
    containerx-publish:
        script: >-
            docker buildx build --load
            --cache-from=type=registry,ref=ghcr.io/kbve/metrics:buildcache
            --cache-to=type=registry,ref=ghcr.io/kbve/metrics:buildcache,mode=max
            -f $projectSource/Dockerfile
            -t ghcr.io/kbve/metrics:latest
            -t kbve/metrics:latest
            .
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

    # The local build. `container` above tags it kbve/metrics; this is the same
    # image under the name the containerx target used.
    containerx:
        script: 'docker buildx build --load -f $projectSource/Dockerfile -t kbve/metrics:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/metrics/manifest/metrics-deployment.yaml"]'
