[package]
name = "met"
authors = ["kbve", "h0lybyte"]
version = "0.1.5"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Metrics — in-house client telemetry ingest (errors/perf/events) to ClickHouse"

[dependencies]
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
axum = { version = "0.8.5", features = ["macros"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "cors", "timeout"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
hex = { workspace = true }
ahash = "0.8"
parking_lot = "0.12"

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "json"] }

anyhow = { workspace = true }
thiserror = { workspace = true }
dotenvy = { workspace = true }

metrics = { workspace = true }
jedi = { path = "../../packages/rust/jedi", features = ["clickhouse", "prometheus"] }
kbve = { path = "../../packages/rust/kbve", default-features = false, features = ["gate-auth"] }
