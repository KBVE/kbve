$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['playwright', 'vite', 'eslint', 'web-game']
tasks:
    rebake:
        script: 'bash art/character/rebake.sh'
    lfs-pull:
        script: '(cd "$(git rev-parse --show-toplevel)" && ./kbve.sh -lfs herbmail pull --include=''apps/herbmail/herbmail-game/public/**'') || echo ''herbmail LFS pull skipped (no creds / offline) — assets may be pointer stubs'''
        options:
            runFromWorkspaceRoot: true
    lfs-push:
        script: '(cd "$(git rev-parse --show-toplevel)" && ./kbve.sh -lfs herbmail push origin HEAD)'
        options:
            runFromWorkspaceRoot: true
    lfs-register:
        script: '(cd "$(git rev-parse --show-toplevel)" && ./kbve.sh -lfs herbmail register origin)'
        options:
            runFromWorkspaceRoot: true
    e2e:
        script: 'pnpm exec playwright test -c apps/herbmail/herbmail-game/playwright.config.ts'
        deps: ['~:build']
        options:
            runFromWorkspaceRoot: true
    test:
        script: 'vitest run --config apps/herbmail/herbmail-game/vite.config.ts'
        options:
            runFromWorkspaceRoot: true

env:
    # The engine configuration this project builds with. JSON rather than
    # a key per field: it is nested and list-valued, and the build
    # workflows already take it in exactly this shape -- it was the
    # dispatch manifest's `engine` block, moved beside the project.
    ENGINE_CONFIG: '{"version":"vite","project_path":"apps/herbmail/herbmail-game","build_targets":["html5"]}'
    # Where a release of this project publishes to, declared beside the
    # project. This was the `external_publish` blob of its dispatch manifest
    # entry; release.yml reads it off the graph.
    ITCH_CHANNEL: 'html5'
    ITCH_GAME: 'herbmail'
    ITCH_USER: 'kbve'
