[package]
name = "herbmail-api"
authors = ["kbve", "h0lybyte"]
version = "0.1.5"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "fs", "cors", "set-header", "timeout"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
axum = { workspace = true, features = ["default", "ws", "macros"] }
axum-extra = { workspace = true, features = ["cookie"] }
reqwest = { workspace = true, features = ["json"] }
mail-send = { workspace = true }
mail-builder = { workspace = true }
mail-parser = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
askama = { workspace = true }
socket2 = { workspace = true }
num_cpus = { workspace = true }
dotenvy = { workspace = true }

# Workspace path dependencies
jedi = { path = "../../../crates/jedi" }
kbve = { path = "../../../crates/kbve" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
serial_test = { workspace = true }
http-body-util = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[package.metadata.askama]
dirs = ["templates"]
