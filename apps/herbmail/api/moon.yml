$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    dev:
        script: 'STATIC_DIR=./dist/apps/herbmail-web STATIC_PRECOMPRESSED=false cargo run -p herbmail-api'
        deps: ['herbmail-web:build']
        options:
            runFromWorkspaceRoot: true
    e2e:
        deps: ['~:test']
        options:
            cache: false
    container-prep:
        script: 'rm -rf ./apps/herbmail/api/dist/ && mkdir -p ./apps/herbmail/api/dist/ && cp -a ./dist/apps/herbmail-web/. ./apps/herbmail/api/dist/'
        deps: ['herbmail-web:build']
        options:
            runFromWorkspaceRoot: true
    containerx:
        script: 'docker buildx build --load -f apps/herbmail/api/Dockerfile -t kbve/herbmail:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/herbmail:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/herbmail:buildcache,mode=max -f apps/herbmail/api/Dockerfile -t ghcr.io/kbve/herbmail:latest -t kbve/herbmail:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/herbmail/manifest/herbmail-deployment.yaml"]'
