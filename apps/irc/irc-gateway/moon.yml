$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    dev:
        script: 'STATIC_DIR=./dist/apps/astro-irc STATIC_PRECOMPRESSED=false ERGO_WS_URL=ws://localhost:8080 ERGO_IRC_HOST=localhost ERGO_IRC_PORT=6667 cargo run -p irc-gateway'
        deps: ['astro-irc:build']
        options:
            runFromWorkspaceRoot: true
            # A task named dev takes moon's server preset, and that preset sets
            # runInCI false. The Playwright suites start this server with
            # `moon run <project>:dev`, which under CI resolves to no task at
            # all -- "No tasks found. Unable to execute action pipeline."
            runInCI: true
    e2e:
        deps: ['~:test', 'irc-e2e:e2e']
        options:
            cache: false
    deploy:
        script: "docker rm -f irc-gateway-local 2>/dev/null || true && lsof -ti:4321 | xargs kill -9 2>/dev/null || true && moon run irc-gateway:container && VERSION=$(grep '^version' apps/irc/irc-gateway/Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/') && docker run --rm --name irc-gateway-local -p 4321:4321 -e JWT_SECRET=local-dev-secret kbve/irc-gateway:$VERSION"
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx:
        # The Dockerfile copies packages/proto, a gitignored tree that only
        # exists once protobuf:build has run -- the same reason the inherited
        # container task carries this dep.
        deps: ['protobuf:build']
        # The version tag is what the e2e and deploy tasks run; tagging only
        # :latest left them pulling a tag that a publish alone had produced.
        script: "v=$(grep '^version' apps/irc/irc-gateway/Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/') && docker buildx build --load -f apps/irc/irc-gateway/Dockerfile -t kbve/irc-gateway:latest -t kbve/irc-gateway:$v ."
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/irc-gateway:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/irc-gateway:buildcache,mode=max -f apps/irc/irc-gateway/Dockerfile -t ghcr.io/kbve/irc-gateway:latest -t kbve/irc-gateway:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/irc/manifests/irc-gateway-deployment.yaml"]'
