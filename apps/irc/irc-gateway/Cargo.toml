[package]
name = "irc-gateway"
authors = ["kbve", "h0lybyte"]
version = "0.1.29"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "cors", "set-header", "fs"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
axum = { version = "0.8.5", features = ["ws", "macros", "json"] }
axum-extra = { workspace = true, features = ["cookie"] }
socket2 = { workspace = true }
num_cpus = { workspace = true }
dotenvy = { workspace = true }
tokio-tungstenite = "0.28"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
futures-util = { workspace = true, features = ["sink"] }

# Workspace path dependencies
jedi = { path = "../../../packages/rust/jedi", features = ["valkey"] }
kbve = { path = "../../../packages/rust/kbve" }

# Shared chat message schema — ChatMessage + MessageKind +
# to_irc_privmsg/from_irc_privmsg. Default features only; we don't
# need the plugin or ffi features here.
bevy_chat = { path = "../../../packages/rust/bevy/bevy_chat" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
serial_test = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
