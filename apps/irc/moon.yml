$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

tasks:
    e2e:
        script: 'nx test irc-gateway --no-cloud && nx e2e irc-e2e --no-cloud && docker rm -f irc-e2e-test 2>/dev/null || true && nx container irc-gateway --configuration=local --no-cloud && nx e2e:docker irc-e2e --no-cloud; EC=$?; docker rm -f irc-e2e-test 2>/dev/null || true; exit $EC'
        options:
            runFromWorkspaceRoot: true
            cache: false
    container:
        deps: ['irc-gateway:container']
        options:
            cache: false
