$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    e2e:
        script: "cd e2e && docker rm -f rows-e2e 2>/dev/null || true && docker run -d --name rows-e2e -p 4325:4322 -e HTTP_HOST=0.0.0.0 -e HTTP_PORT=4322 -e RUST_LOG=info -e OWS_API_KEY=be92671d-af96-4a6b-bdf7-6a3b6270dae6 -e DATABASE_URL='postgres://e2e:e2e@127.0.0.1:1/none' kbve/rows:latest && npx vitest run; EC=$?; docker rm -f rows-e2e 2>/dev/null || true; exit $EC"
        deps: ['~:container']
        options:
            cache: false
    containerx:
        script: 'docker buildx build --load -f apps/rows/Dockerfile -t kbve/rows:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/rows:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/rows:buildcache,mode=max -f apps/rows/Dockerfile -t ghcr.io/kbve/rows:latest -t kbve/rows:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
