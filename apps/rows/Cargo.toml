[package]
name = "rows"
authors = ["kbve", "h0lybyte"]
version = "0.1.38"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Rust OWS — single-binary game backend (REST + gRPC)"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }

# REST (axum)
axum = { version = "0.8.5", features = ["macros"] }
axum-extra = { workspace = true, features = ["cookie"] }

# gRPC (tonic)
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Tower (shared middleware layer for axum + tonic multiplexing)
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit", "steer"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "cors", "set-header", "timeout"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http = { workspace = true }
http-body = "1"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Auth / crypto
uuid = { workspace = true, features = ["v4", "serde"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = { workspace = true, features = ["password-hash"] }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "json"] }

# Messaging (RabbitMQ)
lapin = "4.4.0"

# K8s / Agones
kube = { workspace = true, features = ["default", "runtime", "derive", "client"] }
k8s-openapi = { workspace = true, features = ["v1_32"] }

# Concurrent collections
dashmap = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true, features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true, features = ["default", "serde"] }
async-trait = { workspace = true }
futures-lite = "2"
tokio-stream = { workspace = true }
rustls = { workspace = true, features = ["default", "ring"] }

# Workspace path dependencies
jedi = { path = "../../packages/rust/jedi", features = ["prometheus"] }
kbve = { path = "../../packages/rust/kbve" }

[build-dependencies]
tonic-prost-build = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
