$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    dev:
        script: 'STATIC_DIR=./dist/apps/astro-discordsh STATIC_PRECOMPRESSED=false cargo run -p axum-discordsh'
        deps: ['astro-discordsh:build']
        options:
            runFromWorkspaceRoot: true
            # A task named dev takes moon's server preset, and that preset sets
            # runInCI false. The Playwright suites start this server with
            # `moon run <project>:dev`, which under CI resolves to no task at
            # all -- "No tasks found. Unable to execute action pipeline."
            runInCI: true
    e2e:
        deps: ['~:test', 'discordsh-e2e:e2e']
        options:
            cache: false
    container-prep:
        script: 'rm -rf ./apps/discordsh/axum-discordsh/dist/ && mkdir -p ./apps/discordsh/axum-discordsh/dist/ && cp -a ./dist/apps/astro-discordsh/. ./apps/discordsh/axum-discordsh/dist/'
        deps: ['astro-discordsh:build']
        options:
            runFromWorkspaceRoot: true
    containerx:
        # The Dockerfile copies packages/proto, a gitignored tree that only
        # exists once protobuf:build has run -- the same reason the inherited
        # container task carries this dep.
        deps: ['protobuf:build']
        # The version tag is what the e2e and deploy tasks run; tagging only
        # :latest left them pulling a tag that a publish alone had produced.
        script: "v=$(grep '^version' apps/discordsh/axum-discordsh/Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/') && docker buildx build --load -f apps/discordsh/axum-discordsh/Dockerfile -t kbve/discordsh:latest -t kbve/discordsh:$v ."
        options:
            runFromWorkspaceRoot: true
            cache: false
    containerx-publish:
        script: 'docker buildx build --load --cache-from=type=registry,ref=ghcr.io/kbve/discordsh:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/discordsh:buildcache,mode=max -f apps/discordsh/axum-discordsh/Dockerfile -t ghcr.io/kbve/discordsh:latest -t kbve/discordsh:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/discordsh/manifest/deployment.yaml"]'
