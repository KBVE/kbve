[package]
name = "axum-discordsh"
authors = ["kbve", "h0lybyte"]
version = "0.1.46"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { workspace = true, features = ["compression-full", "limit", "trace", "fs", "cors", "set-header"] }
tokio = { workspace = true, features = ["default", "full", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
axum = { workspace = true, features = ["default", "ws", "macros"] }
axum-extra = { workspace = true, features = ["cookie"] }
askama = { workspace = true }
socket2 = { workspace = true }
num_cpus = { workspace = true }
dotenvy = { workspace = true }
sysinfo = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }

# Workspace path dependencies
kbve = { path = "../../../packages/rust/kbve", features = ["supabase", "image-gen"] }
jedi = { path = "../../../packages/rust/jedi", features = ["postgres"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = { workspace = true }
serial_test = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[package.metadata.askama]
dirs = ["templates"]
