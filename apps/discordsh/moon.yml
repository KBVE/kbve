$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

tasks:
    e2e:
        script: "docker rm -f discordsh-web-e2e-test 2>/dev/null || true; lsof -ti:4322 | xargs kill -9 2>/dev/null || true; sleep 1; echo 'port 4322 released' && E2E_PORT=4323 moon run discordsh-web-e2e:e2e-mock"
        deps:
            [
                'discordsh-api:test',
                'discordsh-api:container',
                'discordsh-web-e2e:e2e-docker',
            ]
        options:
            runFromWorkspaceRoot: true
    container:
        deps: ['discordsh-api:container']
        options:
            cache: false
