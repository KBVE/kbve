$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['unity']

tasks:
    dev-android:
        script: 'bash Scripts/dev-android.sh'

env:
    # The engine configuration this project builds with. JSON rather than
    # a key per field: it is nested and list-valued, and the build
    # workflows already take it in exactly this shape -- it was the
    # dispatch manifest's `engine` block, moved beside the project.
    ENGINE_CONFIG: '{"version":"6000.3.10f1","project_path":"apps/rareicon/unity","build_targets":["StandaloneLinux64","StandaloneWindows64","StandaloneOSX","Android","iOS"],"license_method":"personal"}'
    # Itch, Steam and the release lane moved to unreal-rareicon with the game
    # itself. This project keeps its engine config so it can still be built by
    # hand, and publishes nowhere.
