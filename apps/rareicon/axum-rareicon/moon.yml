$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    test:
        script: 'cargo test -p axum-rareicon'
        options:
            runFromWorkspaceRoot: true
    lint:
        script: 'cargo clippy -p axum-rareicon --all-targets -- -D warnings'
        options:
            runFromWorkspaceRoot: true
    container:
        script: 'docker buildx build --platform linux/amd64 -f apps/rareicon/axum-rareicon/Dockerfile -t kbve/rareicon:latest --load .'
        options:
            runFromWorkspaceRoot: true

    # The registry build of `container`. Separate rather than a flag because
    # moon has no configurations: under Nx this was `--configuration=production`
    # on the same target. It differs only in pushing the layer cache to the
    # registry and carrying runInCI, so a local `container` stays a local build.
    container-publish:
        script: 'docker buildx build --platform linux/amd64 --cache-from=type=gha --cache-from=type=registry,ref=ghcr.io/kbve/rareicon:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/rareicon:buildcache,mode=max -f apps/rareicon/axum-rareicon/Dockerfile -t kbve/rareicon:latest --load .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it. This was the
    # dispatch manifest's deployment_yaml/deployment_yamls field.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/rareicon/manifest/deployment.yaml"]'
