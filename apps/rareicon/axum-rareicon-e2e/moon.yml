$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['vitest']

tasks:
    e2e:
        script: 'docker rm -f axum-rareicon-e2e 2>/dev/null || true && docker run -d --name axum-rareicon-e2e -p 4325:4323 -e HTTP_HOST=0.0.0.0 -e HTTP_PORT=4323 -e RUST_LOG=info kbve/rareicon:latest && npx vitest run; EC=$?; docker rm -f axum-rareicon-e2e 2>/dev/null || true; exit $EC'
        deps: ['axum-rareicon:container']
        options:
            cache: false
