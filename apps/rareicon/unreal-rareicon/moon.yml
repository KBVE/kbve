$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['unreal-game', 'ue5-server']

# The game module links KBVEUnr, whose staticlib is built from crates/unr
# rather than committed. Declaring it means a fresh clone builds instead of
# hitting the Build.cs "missing libunr.a" guard.
dependsOn:
    - 'KBVEUnr'
    - 'KBVEWorld'
    - 'KBVEMover'
    # build-world and build-input run the editor scripts shipped there.
    # 'kbve' is the Rust crate; the python package is 'kbve-py'.
    - 'kbve-py'

tasks:
    lfs-push:
        script: './kbve.sh -lfs rareicon push'
        options:
            runFromWorkspaceRoot: true
    lfs-pull:
        script: './kbve.sh -lfs rareicon pull'
        options:
            runFromWorkspaceRoot: true
    lfs-fetch:
        script: './kbve.sh -lfs rareicon fetch --all'
        options:
            runFromWorkspaceRoot: true
    lfs-register:
        script: './kbve.sh -lfs rareicon register'
        options:
            runFromWorkspaceRoot: true
    # UBT decides for itself what needs recompiling, and it reads state moon
    # cannot see -- the engine install and every plugin under packages/unreal.
    # A moon cache hit would report success without relinking the module the
    # editor then loads, so these never cache.
    build-editor:
        deps: ['KBVEUnr:sync-unr']
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/Build.sh" RareIconEditor Mac Development "$PWD/RareIcon.uproject"'
        options:
            cache: false
    build-game:
        deps: ['KBVEUnr:sync-unr']
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/Build.sh" RareIcon Mac Development "$PWD/RareIcon.uproject"'
        options:
            cache: false
    build-server:
        deps: ['KBVEUnr:sync-unr']
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/Build.sh" RareIconServer Mac Development "$PWD/RareIcon.uproject"'
        options:
            cache: false
    compile:
        deps: ['KBVEUnr:sync-unr']
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/Build.sh" RareIconEditor Mac Development "$PWD/RareIcon.uproject"'
        options:
            cache: false
    # Ingest the PolyHaven source set, then import it and rebuild the ground
    # material. Conversion happens here rather than in the editor: 4k EXR/PNG
    # is 94 MB of source for what ships as 17 MB of 2k PNG, and the normal map
    # needs its green channel flipped from OpenGL to DirectX convention before
    # Unreal ever sees it.
    import-terrain:
        deps: ['~:build-editor']
        script: './apps/rareicon/unreal-rareicon/scripts/import-terrain.sh'
        options:
            runFromWorkspaceRoot: true
            cache: false
    # Scene and keybinds are generated from scripts/config/*.json by the shared
    # editor scripts in the kbve python package. Not Config/ -- that is Unreal's, and
    # on a case-insensitive filesystem a config/ of our own silently merges into
    # it and then fails to resolve on Linux. The umap and the input uassets are
    # binary and unreviewable; the JSON is the part worth reading, and the logic
    # is the same for every KBVE Unreal game.
    build-world:
        deps: ['~:build-editor']
        command: >-
            uv run --project $workspaceRoot/packages/python/kbve
            kbve-unreal-world-map
            --project $workspaceRoot/apps/rareicon/unreal-rareicon/RareIcon.uproject
            --config $workspaceRoot/apps/rareicon/unreal-rareicon/scripts/config/world.json
        options:
            runFromWorkspaceRoot: true
            cache: false
    build-input:
        deps: ['~:build-editor']
        command: >-
            uv run --project $workspaceRoot/packages/python/kbve
            kbve-unreal-input-assets
            --project $workspaceRoot/apps/rareicon/unreal-rareicon/RareIcon.uproject
            --config $workspaceRoot/apps/rareicon/unreal-rareicon/scripts/config/input.json
        options:
            runFromWorkspaceRoot: true
            cache: false
    regen-project-files:
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/GenerateProjectFiles.sh" -project="$PWD/RareIcon.uproject" -game -engine'
        options:
            cache: false
    # Launch only. Assumes the module is already built -- the script says so
    # rather than letting the editor crash on a missing dylib.
    launch-editor:
        script: './apps/rareicon/unreal-rareicon/scripts/launch-editor.sh'
        options:
            runFromWorkspaceRoot: true
            cache: false
            persistent: true
    quit-editor:
        script: './apps/rareicon/unreal-rareicon/scripts/quit-editor.sh'
        options:
            runFromWorkspaceRoot: true
            cache: false
    # The one to use day to day: quit, compile the C++, launch what was built.
    #
    # Deliberately not `deps: ['~:build-editor']`. Moon would run the build
    # first, with the editor still holding its modules open, and UBT would write
    # hot-reload copies rather than the dylibs the next launch loads -- so the
    # editor would come up silently running the previous build.
    dev:
        script: './apps/rareicon/unreal-rareicon/scripts/dev.sh'
        options:
            runFromWorkspaceRoot: true
            cache: false
            persistent: true
    open:
        script: 'open apps/rareicon/unreal-rareicon/RareIcon.uproject'
        options:
            runFromWorkspaceRoot: true
            cache: false
    clean:
        script: 'rm -rf Binaries Build DerivedDataCache Intermediate Saved'
    clangd-db:
        script: 'cd ../../../packages/python/kbve && uv run kbve-unreal-clangd'

env:
    # The engine configuration this project builds with, in the shape the
    # build workflows already take.
    #
    # Mac only, and that is a constraint rather than a preference: the game
    # module links KBVEUnr, and `libunr.a` is cross-compiled per platform with
    # only the host target wired up so far. Declaring Win64/Linux here would
    # hand CI a build that fails in Build.cs on a missing library. Widen this
    # and KBVEUnr's UE_SUPPORTED_PLATFORMS together, never separately.
    ENGINE_CONFIG: '{"version":"5.8.0","project_path":"apps/rareicon/unreal-rareicon","build_targets":["Mac"],"maps":["/Game/Map/L_RareIconWorld"]}'
    # The monorepo shell ci-unreal-build.yml reads build.toml from.
    UE_SHELL_PATH: 'apps/rareicon/unreal-rareicon'
    # Not the default two-core hosted runner: an Unreal compile.
    CI_RUNNER: 'arc-runner-ue'
