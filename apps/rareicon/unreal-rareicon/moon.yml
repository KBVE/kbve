$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
tags: ['unreal-game', 'ue5-server']

# The game module links KBVEUnr, whose staticlib is built from crates/unr
# rather than committed. Declaring it means a fresh clone builds instead of
# hitting the Build.cs "missing libunr.a" guard.
dependsOn:
    - 'KBVEUnr'
    - 'KBVEWorld'
    - 'KBVEMover'
    # build-world and build-input run the editor scripts shipped there.
    # 'kbve' is the Rust crate; the python package is 'kbve-py'.
    - 'kbve-py'

tasks:
    lfs-push:
        script: './kbve.sh -lfs rareicon push'
        options:
            runFromWorkspaceRoot: true
    lfs-pull:
        script: './kbve.sh -lfs rareicon pull'
        options:
            runFromWorkspaceRoot: true
    lfs-fetch:
        script: './kbve.sh -lfs rareicon fetch --all'
        options:
            runFromWorkspaceRoot: true
    lfs-register:
        script: './kbve.sh -lfs rareicon register'
        options:
            runFromWorkspaceRoot: true
    # The game module links KBVEUnr, whose staticlib is built rather than
    # committed, so every target has to wait on it. Deps merge with the
    # inherited task rather than replacing it.
    build-editor:
        deps: ['KBVEUnr:sync-unr']
    build-game:
        deps: ['KBVEUnr:sync-unr']
    build-server:
        deps: ['KBVEUnr:sync-unr']
    regen-project-files:
        script: '"${UE_ROOT:-/Users/Shared/Epic Games/UE_5.8}/Engine/Build/BatchFiles/Mac/GenerateProjectFiles.sh" -project="$PWD/RareIcon.uproject" -game -engine'
        options:
            cache: false
    open:
        script: 'open apps/rareicon/unreal-rareicon/RareIcon.uproject'
        options:
            runFromWorkspaceRoot: true
            cache: false
    clean:
        script: 'rm -rf Binaries Build DerivedDataCache Intermediate Saved'

env:
    # The engine configuration this project builds with, in the shape the
    # build workflows already take.
    #
    # Mac only, and that is a constraint rather than a preference: the game
    # module links KBVEUnr, and `libunr.a` is cross-compiled per platform with
    # only the host target wired up so far. Declaring Win64/Linux here would
    # hand CI a build that fails in Build.cs on a missing library. Widen this
    # and KBVEUnr's UE_SUPPORTED_PLATFORMS together, never separately.
    ENGINE_CONFIG: '{"version":"5.8.0","project_path":"apps/rareicon/unreal-rareicon","build_targets":["Mac"],"maps":["/Game/Map/L_RareIconWorld"]}'
    # The monorepo shell ci-unreal-build.yml reads build.toml from.
    UE_SHELL_PATH: 'apps/rareicon/unreal-rareicon'
    # What .moon/tasks/unreal.yml needs to drive this project. Everything else
    # about the editor workflow is inherited from that file.
    UE_PROJECT: 'apps/rareicon/unreal-rareicon/RareIcon.uproject'
    UE_TARGET: 'RareIconEditor'
    UE_GAME_TARGET: 'RareIcon'
    UE_SERVER_TARGET: 'RareIconServer'
    UE_MODULE: 'RareIcon'
    UE_LOG_PREFIX: 'rareicon'
    UE_WORLD_CONFIG: 'apps/rareicon/unreal-rareicon/scripts/config/world.json'
    UE_INPUT_CONFIG: 'apps/rareicon/unreal-rareicon/scripts/config/input.json'
    UE_TEXTURE_CONFIG: 'apps/rareicon/unreal-rareicon/scripts/config/textures.json'
    # Not the default two-core hosted runner: an Unreal compile.
    CI_RUNNER: 'arc-runner-ue'
