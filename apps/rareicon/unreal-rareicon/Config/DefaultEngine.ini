[SystemSettings]
; Iris, on by default rather than waiting for multiplayer to need it.
;
; BaseEngine.ini already permits it for the GameNetDriver and forbids it for the
; DemoNetDriver; what it does not do is switch it on, because net.Iris.
; UseIrisReplication defaults to 0. This is that switch, and it is the whole
; change -- adding another +IrisNetDriverConfigs entry here would do nothing,
; since the engine takes the first match for a driver and its own entry is
; already in the array ahead of ours.
;
; Early because this game has no multiplayer yet. Nothing here can regress, and
; every replicated thing added from now is written against the system it will
; ship on rather than ported to it afterwards.
net.Iris.UseIrisReplication=1

