[Core.Log]
; LogMetal logs a Display line PER FRAME when the drawable and viewport differ
; by a pixel or two, which retina scaling makes routine -- 19.5k lines in one
; short editor session, burying everything else in the Output Log. Warning
; keeps the Metal messages that mean something and drops the running commentary.
LogMetal=Warning

[OnlineSubsystem]
; Steam is the platform the game ships on, so it is the platform the editor
; talks to as well -- an online subsystem that is only configured in packaged
; builds is one that is only tested there.
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
; The demo app. Steam hands a packaged build its own AppID through the
; environment when it launches one, so this is what the editor and a
; directly-launched executable use, alongside the steam_appid.txt beside the
; .uproject that the Steamworks SDK reads at init.
SteamDevAppId=3791950
bInitServerOnClient=true
; The old UDP-relay networking layer, off because SteamSockets below replaces
; it. Leaving both enabled gives two transports racing for the same session.
bUseSteamNetworking=false

[/Script/Engine.GameEngine]
; Steam's own transport for the game connection, with the IP driver behind it.
;
; The fallback is what makes this safe to set unconditionally: an editor
; session, a headless automation run and a build launched without Steam all
; fail to init the Steam driver and take the IP one instead, which is the
; behaviour those had before. Without it, PIE would need Steam running.
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[/Script/SteamSockets.SteamSocketsNetDriver]
NetConnectionClassName="/Script/SteamSockets.SteamSocketsNetConnection"
