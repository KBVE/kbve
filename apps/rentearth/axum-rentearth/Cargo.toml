[package]
name = "axum-rentearth"
authors = ["kbve", "h0lybyte"]
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
jedi = { path = "../../../packages/rust/jedi", features = ["itch"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["compression-full", "cors", "trace", "fs", "set-header"] }
axum = { version = "0.8.4", features = ["macros"] }
tokio = { workspace = true, features = ["default", "full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
