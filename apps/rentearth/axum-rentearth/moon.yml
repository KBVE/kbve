$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    web-build:
        script: 'cd web && npm run build'
        outputs: ['web/dist']
    web-dev:
        script: 'cd web && npm run dev'
        options:
            cache: false
    serve-static:
        script: 'STATIC_DIR=apps/rentearth/axum-rentearth/web/dist cargo run -p axum-rentearth'
        options:
            runFromWorkspaceRoot: true
            cache: false
    container:
        script: 'docker buildx build --platform linux/amd64 -f apps/rentearth/axum-rentearth/Dockerfile -t kbve/axum-rentearth:latest --load .'
        options:
            runFromWorkspaceRoot: true

    # The registry build of `container`. Separate rather than a flag because
    # moon has no configurations: under Nx this was `--configuration=production`
    # on the same target. It differs only in pushing the layer cache to the
    # registry and carrying runInCI, so a local `container` stays a local build.
    container-publish:
        script: 'docker buildx build --platform linux/amd64 --cache-from=type=gha --cache-from=type=registry,ref=ghcr.io/kbve/axum-rentearth:buildcache --cache-to=type=registry,ref=ghcr.io/kbve/axum-rentearth:buildcache,mode=max -f apps/rentearth/axum-rentearth/Dockerfile -t kbve/axum-rentearth:latest --load .'
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true
