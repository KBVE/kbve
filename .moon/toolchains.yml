$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# moon 2 splits the old monolithic node toolchain into discrete plugins:
# runtime (node), package manager (pnpm), ecosystem (javascript), type layer
# (typescript). Each must be registered here to be active.
#
# rust and python are deliberately absent. They land after the node side is
# proven; until then @monodon/rust and @nxlv/python keep owning those targets.

node:
    version: '24.10.0'

pnpm:
    version: '11.15.0'

javascript:
    packageManager: 'pnpm'
    dedupeOnLockfileChange: true
    inferTasksFromScripts: false
    # pnpm-workspace.yaml declares no `packages:` -- kbve installs every
    # dependency into one root node_modules and projects do not resolve each
    # other through the store. Syncing per-project workspace dependencies would
    # write `workspace:*` entries pnpm has no workspace to satisfy.
    syncProjectWorkspaceDependencies: false

typescript:
    # Project references are off on purpose. moon writes them from the dependsOn
    # graph, and TypeScript then requires composite: true on every referenced
    # project -- declaration emit, which a noEmit Astro project cannot provide.
    syncProjectReferences: false
    createMissingConfig: false
    includeSharedTypes: false

rust:
    version: '1.98.0'
    # Both of these rewrite Cargo.toml on sync: the writer reformats the file,
    # drops the comments, and adds a member entry for every project it sees --
    # including the ones with no Cargo.toml, which breaks the workspace.
    # rust-toolchain.toml is pinned by hand instead, and kept equal to the
    # version above.
    syncToolchainConfig: false
    addMsrvConstraint: false
    components:
        - 'clippy'
        - 'rustfmt'
    # hardware/esp32c6-display cross-compiles to the ESP32-C6, and its
    # .cargo/config.toml sets that target for every cargo invocation in the
    # directory. Without the target installed its clippy fails at "can't find
    # crate for `core`" -- which reads as a broken crate rather than a missing
    # rustup component, and would have failed `moon ci` on a fresh runner.
    targets:
        - 'riscv32imac-unknown-none-elf'
