$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Project graph.
#
# Every project is named explicitly rather than globbed. moon registers a
# matched directory as a project whether or not it holds a moon.yml, which
# rules globs out here twice over:
#
#   Collisions. kbve nests unevenly -- apps/mc, apps/kbve/astro-kbve,
#   apps/agones/arpg/server, packages/rust/bevy/bevy_items -- so covering it
#   takes globs two to four segments deep, and those match four directory
#   basenames that repeat: kbve, relay, server, web. 'apps/*/*/*' alone fails
#   the graph outright on apps/agones/{arpg,cryptothrone}/server.
#
#   Coexistence. Nx still owns every project that has not been ported. A glob
#   would pull all 149 into moon's graph as empty, task-less projects and put
#   them in `moon check --all` before anything can run them.
#
# So this map is the migration checklist: a project enters the graph on the
# commit that gives it a moon.yml, and Nx keeps it until then.
projects:
    sources:
        # Sites
        astro-chuckrpg: 'apps/chuckrpg/astro-chuckrpg'
        astro-cryptothrone: 'apps/cryptothrone/astro-cryptothrone'
        astro-discordsh: 'apps/discordsh/astro-discordsh'
        astro-herbmail: 'apps/herbmail/astro-herbmail'
        astro-irc: 'apps/irc/astro-irc'
        astro-memes: 'apps/memes/astro-memes'
        astro-rareicon: 'apps/rareicon/astro-rareicon'

        # Browser suites for those sites
        astro-cryptothrone-e2e: 'apps/cryptothrone/astro-cryptothrone-e2e'
        astro-rareicon-e2e: 'apps/rareicon/astro-rareicon-e2e'
        discordsh-e2e: 'apps/discordsh/discordsh-e2e'
        herbmail-e2e: 'apps/herbmail/herbmail-e2e'
        irc-e2e: 'apps/irc/irc-e2e'
        memes-e2e: 'apps/memes/memes-e2e'

        # A site and its own suite in one project
        astro-e2e: 'packages/npm/astro-e2e'

        # Writes the icon catalogue into astro-rareicon's content directory
        icons-codegen: 'apps/rareicon/icons-codegen'

vcs:
    defaultBranch: 'dev'
    provider: 'github'

hasher:
    optimization: 'accuracy'

pipeline:
    inheritColorsForPipedTasks: true

experiments:
    # Content-addressable store for task outputs. Required by the shared
    # worktree cache below -- that feature shares CAS blobs.
    casOutputsCache: true

cache:
    cas:
        maxSize: '4gb'

    # Share task outputs across git worktrees. Every branch here is developed in
    # a linked worktree (AGENTS.md), and a linked worktree otherwise gets its own
    # .moon/cache and starts cold. Only blobs and manifests are shared; hashes,
    # locks and run states stay per-worktree.
    #
    # Still prefixed unstable_ in moon 2.5.
    unstable_sharedWorktreeCache: true
