$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Inherited by every project tagged 'rust'.
#
# Attached by toolchain rather than by tag. The 30 crates that came from
# KBVE/workspace declare `toolchains: default: 'rust'` and nothing else, so the
# toolchain is what carries their tasks. It is registered in
# .moon/toolchains.yml with syncToolchainConfig off -- moon's rust toolchain
# rewrites Cargo.toml on sync, reformatting it and adding a member entry for
# every project it sees.
#
# Replaces @monodon/rust, whose build/test/lint/run executors all passed
# target-dir: dist/target/<project>. That is dropped deliberately. Per-project
# target directories exist so Nx can treat the output as a project artifact,
# and the cost is 56 separate copies of every shared dependency's build.
# Cargo's own shared target/ plus moon's content-addressable cache gets the
# same isolation from one tree.
#
# Debug, not --release. Every Nx rust build here is a debug build -- the
# run-commands ones say `cargo build -p <crate>` outright, and @monodon/rust's
# executor defaults to debug too -- so releasing from `build` would change what
# 51 crates produce and how long they take. The four projects that ship a
# release binary declare build-release themselves.
#
# No -p either. moon runs a task in its project directory, and cargo resolves
# the package from the Cargo.toml it finds there while still writing to the
# workspace target/. Naming the package explicitly would have worked for 58 of
# the 60 crates here and silently named the wrong one for the other two.
inheritedBy:
    toolchain: 'rust'

# build.rs is deliberately not in sources. Most crates here do not have one,
# and moon warns per task per run for an input that does not exist. A crate
# with a build script adds it to its own inputs.
fileGroups:
    sources:
        - 'src/**/*'
    tests:
        - 'tests/**/*'
        - 'benches/**/*'
    manifests:
        - 'Cargo.toml'
        - '/Cargo.lock'

# `^:build` on the three cargo tasks, because a crate here can depend on a
# project whose build writes source cargo then has to compile. kbve-proto is
# the one that does: it `include!`s packages/proto/gen/rust/mod.rs, which is
# gitignored and written by `protobuf:build`. Without the dependency nothing in
# the graph ever runs that task, so `cargo clippy` on any crate that reaches
# kbve-proto dies on "couldn't read .../gen/rust/mod.rs" -- which is every
# rust-affecting pull request. `dependsOn` alone does not order tasks.
#
# It costs nothing for the crates that only depend on other crates: cargo
# already builds those, and moon's `^:build` runs in the shared target/ the
# lint then reuses. A project dependency without a `build` task is skipped.
tasks:
    build:
        command: 'cargo build'
        deps: ['^:build']
        inputs: ['@group(sources)', '@group(manifests)']

    test:
        command: 'cargo test'
        deps: ['^:build']
        inputs: ['@group(sources)', '@group(tests)', '@group(manifests)']

    lint:
        command: 'cargo clippy --all-targets -- -D warnings'
        deps: ['^:build']
        inputs: ['@group(sources)', '@group(tests)', '@group(manifests)']

    format:
        command: 'cargo fmt --check'
        inputs: ['@group(sources)']

    run:
        command: 'cargo run'
        preset: 'server'
