$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'
tags: ['rust', 'docker']

tasks:
    container:
        args: ['-t', 'kbve/mail:latest']

    # The registry build, which is CI's. It loads rather than pushing -- the
    # workflow pushes afterwards -- but carries the buildcache and the ghcr tag.
    containerx-publish:
        deps: ['protobuf:build']
        script: >-
            docker buildx build --load
            --cache-from=type=registry,ref=ghcr.io/kbve/mail:buildcache
            --cache-to=type=registry,ref=ghcr.io/kbve/mail:buildcache,mode=max
            -f $projectSource/Dockerfile
            -t ghcr.io/kbve/mail:latest
            -t kbve/mail:latest
            .
        options:
            runFromWorkspaceRoot: true
            cache: false
            runInCI: true

    containerx:
        deps: ['protobuf:build']
        script: 'docker buildx build --load -f $projectSource/Dockerfile -t kbve/mail:latest .'
        options:
            runFromWorkspaceRoot: true
            cache: false

env:
    # The kube manifests whose image tag a release of this project pins.
    # Publishing an image does not change what the cluster runs; ArgoCD deploys
    # what the manifest says, so the tag has to be written into it.
    KUBE_DEPLOYMENT_YAMLS: '["apps/kube/mail/manifest/mail-deployment.yaml"]'
