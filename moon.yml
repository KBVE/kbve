$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace itself, for tasks that measure or operate on the whole tree
# rather than on any one project.
#
# The Nx root project also carried a `local-registry` verdaccio target. Nothing
# uses it: npm publishing goes through tools/npm/publish.sh, which dry-runs
# against the real registry by default, and a local registry proves less than
# that does.
layer: 'application'
language: 'bash'

tasks:
    # scc if it is installed, cloc otherwise. Neither is a repository
    # dependency, so the fallback is the point rather than a nicety.
    stats:
        script: >-
            scc . --exclude-dir=node_modules,dist,.nx,.moon,.git,target,coverage,pumpkin,ergo,postgres --no-cocomo
            || npx --yes cloc . --exclude-dir=node_modules,dist,.nx,.moon,.git,target,coverage,pumpkin,ergo,postgres
        options:
            runFromWorkspaceRoot: true

    stats-json:
        script: >-
            scc . --exclude-dir=node_modules,dist,.nx,.moon,.git,target,coverage,pumpkin,ergo,postgres --format json --no-cocomo
            || npx --yes cloc . --exclude-dir=node_modules,dist,.nx,.moon,.git,target,coverage,pumpkin,ergo,postgres --json
        options:
            runFromWorkspaceRoot: true

    # The workspace-level guards. Each was a pull_request workflow with a path
    # filter -- ci-cargo-stub-guard.yml, ci-kong-config-guard.yml,
    # ci-vector-config-guard.yml -- and a path filter is what a task's `inputs`
    # already is, except that moon also caches the result and the graph knows
    # about it. Three workflows and 178 lines of runner setup for three script
    # invocations.
    #
    # `lint` rather than three tasks with other names, because `moon ci` runs
    # tasks by id: anything not called lint or test would never run. This
    # replaces the `cargo clippy` that the rust toolchain gives every project,
    # which at the workspace root lints all 60 crates a second time -- each of
    # them already has its own lint task.
    lint:
        script: >-
            python3 scripts/sync-cargo-workspace-stubs.py --check
            && ./scripts/kong-config-hash.sh --check
            && python3 scripts/validate-vector-config.py
        inputs:
            - 'Cargo.toml'
            - 'apps/**/Cargo.workspace.toml'
            - 'scripts/sync-cargo-workspace-stubs.py'
            - 'scripts/kong-config-hash.sh'
            - 'scripts/validate-vector-config.py'
            - 'apps/kube/kong/manifests/kong-config.yaml'
            - 'apps/kube/kong/manifests/kong-deployment.yaml'
            - 'apps/kube/vector/manifests/vector-config.yaml'
            - 'apps/kube/vector/manifests/vector-daemonset.yaml'
        options:
            runFromWorkspaceRoot: true

    # The rust toolchain's `cargo test` at the workspace root runs every crate's
    # suite a second time; each crate has its own test task. There is nothing at
    # the root itself to test.
    test:
        script: 'echo "no workspace-level tests; each project has its own"'
        options:
            cache: false
